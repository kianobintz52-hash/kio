<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KianOSINT v4.0 - Dark Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');
    body {
      background: #000;
      color: #00ff41;
      font-family: 'VT323', monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas#matrix { position: fixed; top: 0; left: 0; z-index: -2; opacity: 0.15; }
    h1 {
      text-align: center;
      font-size: 54px;
      text-shadow: 0 0 30px #00ff41, 0 0 60px #ff00ff;
      animation: glitch 0.8s infinite;
      margin: 10px 0;
    }
    @keyframes glitch {
      0%,100% { text-shadow: 3px 3px #ff00ff, -3px -3px #00ff41; }
      50% { text-shadow: -3px 3px #ff00ff, 3px -3px #00ff41; }
    }
    .container { max-width: 1480px; margin: auto; padding: 15px; position: relative; z-index: 10; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; background: #111; padding: 10px; }
    .tab-btn {
      background: #1a1a1a;
      color: #00ff41;
      border: 2px solid #00ff41;
      padding: 12px 22px;
      cursor: pointer;
      font-size: 19px;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #00ff41;
      color: #000;
      box-shadow: 0 0 20px #00ff41;
    }
    .tab-content { display: none; background: rgba(10,10,10,0.95); padding: 20px; border: 1px solid #00ff41; }
    .tab-content.active { display: block; }
    input, textarea, select {
      background: #111;
      border: 2px solid #00ff41;
      color: #00ff41;
      padding: 12px;
      font-size: 17px;
      width: 75%;
      margin: 8px 0;
    }
    button {
      background: #00ff41;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #ff00ff; color: white; }
    .result {
      background: #000;
      border: 1px solid #00ff41;
      padding: 18px;
      margin-top: 15px;
      max-height: 620px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 16.5px;
    }
    .glitch { animation: glitch 0.4s linear infinite; }
    .success { color: #00ff41; }
    .danger { color: #ff4444; }
    .warning { color: #ffaa00; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="container">
    <h1><i class="fas fa-skull-crossbones"></i> KIANOSINT v4.0</h1>
    <p class="subtitle" style="text-align:center;color:#00cc33;font-size:24px;">ALL-IN-ONE • MATRIX • PDF EXPORT • MULTI-USER</p>

    <!-- Login -->
    <div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;">
      <h2>AGENT LOGIN</h2>
      <input type="text" id="username" placeholder="Username" value="kianolegend"><br>
      <button onclick="login()">ENTER SYSTEM</button>
    </div>

    <div id="mainUI" style="display:none;">
      <div class="tabs">
        <button class="tab-btn active" onclick="openTab(0)">Email</button>
        <button class="tab-btn" onclick="openTab(1)">Username</button>
        <button class="tab-btn" onclick="openTab(2)">IP & Phone</button>
        <button class="tab-btn" onclick="openTab(3)">Person</button>
        <button class="tab-btn" onclick="openTab(4)">Domain</button>
        <button class="tab-btn" onclick="openTab(5)">Image Search</button>
        <button class="tab-btn" onclick="openTab(6)">Dark Leak</button>
        <button class="tab-btn" onclick="openTab(7)">History</button>
      </div>

      <!-- Email -->
      <div class="tab-content active" id="tab0">
        <h2>Email Intelligence</h2>
        <input type="text" id="emailInput" placeholder="target@email.com">
        <button onclick="scanEmail()">SCAN</button>
        <div id="emailResult" class="result"></div>
      </div>

      <!-- Username -->
      <div class="tab-content" id="tab1">
        <h2>Username OSINT</h2>
        <input type="text" id="userInput" placeholder="kianolegend">
        <button onclick="scanUsername()">SCAN PLATFORMS</button>
        <div id="userResult" class="result"></div>
      </div>

      <!-- IP & Phone -->
      <div class="tab-content" id="tab2">
        <h2>IP & Phone</h2>
        <input type="text" id="ipInput" placeholder="8.8.8.8">
        <button onclick="scanIP()">IP + SHODAN</button><br>
        <input type="text" id="phoneInput" placeholder="+49123456789">
        <button onclick="scanPhone()">PHONE LOOKUP</button>
        <div id="ipPhoneResult" class="result"></div>
      </div>

      <!-- Person -->
      <div class="tab-content" id="tab3">
        <h2>Personensuche</h2>
        <input type="text" id="nameInput" placeholder="Max Mustermann">
        <input type="text" id="countryInput" placeholder="DE" value="DE">
        <button onclick="scanPerson()">SEARCH PERSON</button>
        <div id="personResult" class="result"></div>
      </div>

      <!-- Domain -->
      <div class="tab-content" id="tab4">
        <h2>Domain Intelligence</h2>
        <input type="text" id="domainInput" placeholder="example.com">
        <button onclick="scanDomain()">DOMAIN SCAN</button>
        <div id="domainResult" class="result"></div>
      </div>

      <!-- Reverse Image Search -->
      <div class="tab-content" id="tab5">
        <h2>Reverse Image Search (Fake Face Rec)</h2>
        <input type="file" id="imageUpload" accept="image/*">
        <button onclick="reverseImageSearch()">ANALYZE IMAGE</button>
        <div id="imageResult" class="result"></div>
      </div>

      <!-- Dark Leak -->
      <div class="tab-content" id="tab6">
        <h2>Dark Web Leak</h2>
        <input type="text" id="leakInput" placeholder="Email oder Username">
        <button onclick="darkLeakScan()">DEEP SCAN</button>
        <div id="leakResult" class="result"></div>
      </div>

      <!-- History -->
      <div class="tab-content" id="tab7">
        <h2>Operation History</h2>
        <div id="historyResult" class="result"></div>
        <button onclick="exportPDF()">EXPORT FULL REPORT (PDF)</button>
        <button onclick="clearHistory()">CLEAR HISTORY</button>
      </div>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    const chars = '01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&*';
    const fontSize = 14;
    let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px VT323`;
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);
    window.addEventListener('resize', () => { canvas.height = window.innerHeight; canvas.width = window.innerWidth; });

    // Login
    let currentUser = "";
    function login() {
      currentUser = document.getElementById("username").value || "Agent_Unknown";
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainUI").style.display = "block";
      loadHistory();
    }

    // History
    let history = JSON.parse(localStorage.getItem('kianHistory')) || [];
    function saveToHistory(query, type, data) {
      history.unshift({user: currentUser, query, type, time: new Date().toLocaleString('de-DE'), data});
      if (history.length > 50) history.pop();
      localStorage.setItem('kianHistory', JSON.stringify(history));
    }
    function loadHistory() {
      const el = document.getElementById("historyResult");
      el.innerHTML = history.map(h => `<strong>${h.time} | ${h.type}</strong> → ${h.query}`).join('<br><br>');
    }
    function clearHistory() {
      if (confirm("Wirklich alles löschen?")) {
        history = [];
        localStorage.removeItem('kianHistory');
        loadHistory();
      }
    }

    // PDF Export
    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("courier");
      doc.text("KianOSINT v4.0 - FULL REPORT", 20, 20);
      doc.text(`Agent: ${currentUser}`, 20, 35);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 50);
      
      history.forEach((entry, i) => {
        doc.text(`${i+1}. ${entry.type} → ${entry.query}`, 20, 70 + i*10);
      });
      doc.save(`KianOSINT_Report_${currentUser}.pdf`);
    }

    // Scans (Simulation + einige echte APIs)
    async function scanIP() {
      const ip = document.getElementById("ipInput").value || "8.8.8.8";
      const res = document.getElementById("ipPhoneResult");
      res.innerHTML = "[+] Connecting to Shodan + AbuseIPDB...";
      try {
        const data = await (await fetch(`https://ipapi.co/${ip}/json/`)).json();
        res.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        saveToHistory(ip, "IP", data);
      } catch(e) { res.innerHTML = "[-] Rate limit or offline"; }
    }

    async function scanEmail() {
      const email = document.getElementById("emailInput").value;
      const res = document.getElementById("emailResult");
      res.innerHTML = "[+] Hunter.io + HaveIBeenPwned + IntelX...";
      setTimeout(() => {
        res.innerHTML = `<span class="success">[+] FOUND in 4 breaches</span><br>Hunter.io: LinkedIn, Corporate Email<br>IntelX: Dark Web mentions`;
        saveToHistory(email, "Email", {breaches:4});
      }, 1400);
    }

    function scanUsername() {
      const user = document.getElementById("userInput").value;
      const res = document.getElementById("userResult");
      res.innerHTML = "[+] Maigret + Sherlock + Hunter.io...";
      setTimeout(() => {
        res.innerHTML = `Found on: GitHub, X, Roblox, Discord, Instagram, Steam, TikTok (23 platforms)`;
        saveToHistory(user, "Username", {platforms:23});
      }, 1300);
    }

    function scanPerson() {
      const name = document.getElementById("nameInput").value;
      const res = document.getElementById("personResult");
      res.innerHTML = "[+] Searching public records...";
      setTimeout(() => {
        res.innerHTML = `Possible matches for ${name}:<br>LinkedIn • Facebook • Xing • Whitepages • Local News`;
        saveToHistory(name, "Person", {});
      }, 1200);
    }

    function scanDomain() {
      const domain = document.getElementById("domainInput").value;
      const res = document.getElementById("domainResult");
      res.innerHTML = "[+] WHOIS + Shodan + Security Check...";
      setTimeout(() => {
        res.innerHTML = `Domain: ${domain}<br>Threat Score: Low<br>Subdomains: 7<br>Leaked Emails: 12`;
        saveToHistory(domain, "Domain", {});
      }, 1100);
    }

    function reverseImageSearch() {
      const file = document.getElementById("imageUpload").files[0];
      const res = document.getElementById("imageResult");
      if (!file) { res.innerHTML = "[-] No image selected"; return; }
      res.innerHTML = "[+] Face Recognition + Reverse Search running...";
      setTimeout(() => {
        res.innerHTML = `<span class="success">[+] MATCH FOUND</span><br>Person: Likely ${document.getElementById("nameInput").value || "Target"}<br>Platforms: Instagram, Facebook, News Article<br>Confidence: 87%`;
        saveToHistory("Image Upload", "Reverse Image", {});
      }, 1800);
    }

    function darkLeakScan() {
      const q = document.getElementById("leakInput").value;
      const res = document.getElementById("leakResult");
      res.innerHTML = "[+] Scanning 68 dark web dumps (2023-2026)...";
      setTimeout(() => {
        res.innerHTML = `<span class="danger">[+] COMPROMISED IN 6 LEAKS</span><br>2024 Discord Combo<br>2025 Steam + Roblox<br>2026 Fresh Dump<br>Password Hash: $2b$12$...`;
        saveToHistory(q, "DarkLeak", {leaks:6});
      }, 2200);
    }

    function scanPhone() {
      const phone = document.getElementById("phoneInput").value;
      const res = document.getElementById("ipPhoneResult");
      res.innerHTML = "[+] Numverify + PhoneInfoga...";
      setTimeout(() => {
        res.innerHTML = `Number: ${phone}<br>Carrier: Deutsche Telekom<br>Location: Germany<br>Leaked: Yes`;
      }, 1000);
    }

    function openTab(n) {
      document.querySelectorAll('.tab-content').forEach((el,i) => el.classList.toggle('active', i===n));
      document.querySelectorAll('.tab-btn').forEach((el,i) => el.classList.toggle('active', i===n));
    }

    // Init
    openTab(0);
  </script>
</body>
</html>
