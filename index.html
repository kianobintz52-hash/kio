<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiano</title>
    <style>
        /* --- GRUNDSTYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- LANDING PAGE --- */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .landing-title {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
            filter: blur(0.5px);
        }

        .landing-line {
            width: 60px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 3rem auto;
            box-shadow: 0 0 10px #ff0000;
        }

        .enter-btn {
            font-size: 0.8rem;
            color: #ff0000;
            letter-spacing: 0.15em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0.7;
            user-select: none;
        }

        .enter-btn:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- PROFIL PAGE --- */
        #profile-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Avatar Bild */
        .avatar-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            transition: filter 0.3s;
        }

        .avatar-container img:hover {
            filter: grayscale(0%) contrast(1);
        }

        /* Name */
        .username {
            font-size: 2rem;
            letter-spacing: 0.1em;
            color: #fff;
            margin-bottom: 10px;
            text-transform: lowercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Status / Linie */
        .status-line {
            width: 40px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 5px #ff0000;
        }

        /* Audio Player Styling */
        .audio-player {
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }

        audio {
            width: 100%;
            height: 35px;
            filter: invert(1) hue-rotate(180deg); /* Macht den Standard-Player dunkel */
            outline: none;
            border-radius: 20px;
        }

        /* Chrome/Safari Custom Player (optional, für besseren Look) */
        audio::-webkit-media-controls-panel {
            background-color: #1a1a1a;
        }
        
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
        }

        .song-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
            letter-spacing: 0.05em;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .avatar-container {
                width: 140px;
                height: 140px;
            }
            .username {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="landing-page">
        <h1 class="landing-title">barbarossa</h1>
        <div class="landing-line"></div>
        <div class="enter-btn" onclick="enterSite()">[ click to enter ]</div>
    </div>

    <!-- PROFIL PAGE -->
    <div id="profile-page">
        <div class="avatar-container">
            <!-- Bild wird per JS geladen -->
            <img id="user-avatar" src="" alt="kiano">
        </div>

        <h2 class="username">kiano</h2>
        <div class="status-line"></div>

        <!-- Audio Player -->
        <div class="audio-player">
            <audio controls id="music-player">
                <!-- Hier wird die MP3 geladen -->
                <source src="" type="audio/mpeg">
                Dein Browser unterstützt das Audio-Element nicht.
            </audio>
            <div class="song-info">Now Playing: Track.mp3</div>
        </div>
    </div>

    <script>
        // BILD EINBINDEN
        // Da ich das Bild aus dem Chat habe, konvertiere ich es zu Base64 oder nutze einen lokalen Pfad
        // Für dich am einfachsten: Speichere das Bild als "kiano.jpg" im selben Ordner
        
        // Option 1: Lokales Bild (EMPFOHLEN)
        document.getElementById('user-avatar').src = "kiano.jpg"; 
        
        // Option 2: Falls du das Bild online hast, ersetze den Link oben mit deinem Image-Host Link
        // document.getElementById('user-avatar').src = "https://i.imgur.com/dein_link.jpg";


        // AUDIO EINBINDEN
        // Du musst die MP3 Datei auch im selben Ordner speichern, z.B. "song.mp3"
        document.getElementById('music-player').src = "song.mp3";

        function enterSite() {
            const landingPage = document.getElementById('landing-page');
            const profilePage = document.getElementById('profile-page');
            const player = document.getElementById('music-player');

            landingPage.classList.add('hidden');
            
            setTimeout(() => {
                profilePage.style.opacity = '1';
                // Optional: Musik automatisch starten beim Betreten
                // player.play().catch(e => console.log("Autoplay blocked by browser"));
            }, 500);
        }
    </script>
</body>
</html>
