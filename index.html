<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@<span id="pageUsername"></span> - kiobio.lol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New', monospace; }
        body { background:#000; color:#fff; overflow:hidden; cursor:none; }
        
        .custom-cursor {
            position:fixed; width:40px; height:40px;
            background:url('https://i.imgur.com/2fZ3XzK.png') no-repeat center;
            background-size:contain; pointer-events:none; z-index:9999;
            transform:translate(-50%,-50%); display:none;
        }
        
        #background { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2; filter:brightness(0.7); }
        #banner { position:fixed; top:0; left:0; width:100%; height:280px; object-fit:cover; z-index:-1; }
        
        #profile-block {
            position:relative; margin:220px auto 0; width:90%; max-width:820px;
            background:rgba(0,0,0,0.85); border:2px solid #c026d3;
            padding:30px; border-radius:15px; backdrop-filter:blur(12px);
        }
        .profile-picture {
            width:160px; height:160px; border-radius:50%; border:4px solid #c026d3;
            margin-top:-100px; box-shadow:0 0 30px #c026d3;
        }
        #profile-name { font-size:42px; font-weight:bold; text-shadow:0 0 20px #c026d3; }
        
        .music-player {
            background:rgba(0,0,0,0.6); border:1px solid #c026d3; padding:12px; border-radius:12px; margin:20px 0;
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="customCursor"></div>
    <video id="background" autoplay loop muted playsinline></video>
    <img id="banner" src="" alt="Banner">

    <div id="profile-block" class="text-center">
        <img id="profilePic" class="profile-picture mx-auto" src="https://i.pravatar.cc/300">
        
        <h1 id="profile-name" class="mt-6 text-4xl">Loading...</h1>
        <p id="usernameTag" class="text-purple-400 text-xl"></p>
        <p id="profile-bio" class="mt-6 text-lg text-gray-300"></p>

        <!-- MUSIC PLAYER -->
        <div id="musicPlayer" class="music-player hidden">
            <div class="flex items-center gap-4">
                <button onclick="toggleMusic()" id="playBtn" class="text-2xl">▶️</button>
                <div class="flex-1">
                    <div id="songTitle" class="text-sm">No song loaded</div>
                    <input type="range" id="progress" class="w-full" value="0">
                </div>
            </div>
        </div>

        <!-- Badges -->
        <div id="badges" class="flex justify-center gap-4 my-8"></div>

        <!-- Social Links -->
        <div id="socialLinks" class="flex justify-center gap-8 mt-6"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD6NPF9FIJsDipQg3dvxSohtAJCGVF4NUc",
          authDomain: "kiobiool.firebaseapp.com",
          databaseURL: "https://kiobiool-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "kiobiool",
          storageBucket: "kiobiool.firebasestorage.app",
          appId: "1:1003434485509:web:872f257b0758051c80b96c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audio = new Audio();
        let isPlaying = false;

        async function loadProfile() {
            const username = window.location.pathname.replace('/@', '') || 
                           new URLSearchParams(window.location.search).get('user');
            
            document.getElementById('pageUsername').textContent = username;
            document.getElementById('usernameTag').textContent = `@${username}`;

            const snap = await db.ref('users').orderByChild('username').equalTo(username).limitToFirst(1).once('value');
            const user = Object.values(snap.val() || {})[0];

            if (!user) return alert("Profil nicht gefunden");

            // Profile Data
            document.getElementById('profile-name').textContent = user.displayName || username;
            document.getElementById('profile-bio').textContent = user.bio || "Keine Bio...";
            document.getElementById('profilePic').src = user.profilePic || "https://i.pravatar.cc/300";

            // Banner
            if (user.banner) document.getElementById('banner').src = user.banner;

            // Background
            if (user.backgroundVideo) {
                document.getElementById('background').src = user.backgroundVideo;
            } else if (user.backgroundImage) {
                document.getElementById('background').src = user.backgroundImage;
            }

            // Music
            if (user.musicUrl) {
                audio.src = user.musicUrl;
                document.getElementById('songTitle').textContent = user.musicTitle || "Custom Song";
                document.getElementById('musicPlayer').classList.remove('hidden');
            }

            // Badges & Socials (kannst du später erweitern)
        }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtn').textContent = '▶️';
            } else {
                audio.play();
                document.getElementById('playBtn').textContent = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
