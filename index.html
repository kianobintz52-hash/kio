<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 45px #a855f7; }
    .anime-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anime-card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 25px 50px rgba(192, 38, 211, 0.6);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-black/95 border-b border-purple-500 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME SHOP</h1>
      
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('orders')" class="hover:text-purple-400">Bestellungen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>

        <div class="flex items-center gap-4">
          <button onclick="toggleTheme()" class="text-2xl"><i id="theme-icon" class="fas fa-moon"></i></button>
          <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-2xl text-sm font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login Page -->
  <div id="page-login" class="page max-w-md mx-auto mt-20 p-10 bg-gray-900/95 rounded-3xl border border-purple-500">
    <h2 class="text-5xl font-bold text-center neon-purple mb-10">ANIME SHOP</h2>
    
    <div class="flex gap-4 justify-center mb-8 bg-gray-800 rounded-3xl p-1">
      <button onclick="switchAuthTab(0)" id="tab-login" class="flex-1 py-3 rounded-3xl font-medium bg-purple-600">Login</button>
      <button onclick="switchAuthTab(1)" id="tab-register" class="flex-1 py-3 rounded-3xl font-medium">Registrieren</button>
    </div>

    <div id="login-form">
      <input id="login-user" placeholder="Username" class="w-full mb-4 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Einloggen</button>
    </div>

    <div id="register-form" class="hidden">
      <input id="reg-user" placeholder="Username" class="w-full mb-4 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="reg-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="register()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Konto erstellen</button>
    </div>
  </div>

  <!-- Shop -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-10 text-center">Entdecke Anime Produkte</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Sell -->
  <div id="page-sell" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Neues Produkt einstellen</h2>
    <div class="space-y-6">
      <input id="new-name" placeholder="Produktname" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <select id="new-category" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
        <option value="crunchyroll">Crunchyroll</option>
        <option value="manga">Manga</option>
        <option value="merch">Merch</option>
      </select>
      <input id="new-price" type="number" step="0.01" placeholder="Preis €" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-stock" type="number" value="10" placeholder="Stock" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-img" placeholder="Bild URL" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 bg-gray-800 border border-purple-500 rounded-3xl px-6 py-5"></textarea>
      <button onclick="addProduct()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-6 rounded-3xl text-xl font-bold">Hochladen</button>
    </div>
  </div>

  <!-- Orders -->
  <div id="page-orders" class="page hidden max-w-4xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Meine Bestellungen</h2>
    <div id="my-orders" class="space-y-6"></div>
  </div>

  <!-- Admin -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8 neon-purple">Admin Panel - KiolLegend</h2>
    <div class="mb-12">
      <h3 class="text-2xl mb-6">Produkte verwalten</h3>
      <div id="admin-products" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
    <div>
      <h3 class="text-2xl mb-6">Bestellungen verwalten</h3>
      <div id="admin-orders" class="space-y-6"></div>
    </div>
  </div>

  <!-- Warenkorb Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-8 max-w-lg w-full border border-purple-500">
      <h3 class="text-3xl font-bold mb-6">Warenkorb</h3>
      <div id="cart-items" class="space-y-4 max-h-96 overflow-auto"></div>
      <div id="cart-total" class="text-3xl font-bold mt-8 mb-8"></div>
      <div id="paypal-button-container" class="mb-6"></div>
      <button onclick="hideCart()" class="w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <button onclick="showCart()" class="fixed bottom-10 right-10 bg-gradient-to-r from-purple-600 to-pink-600 w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition-all">
    🛒
  </button>

  <script>
    const PAYPAL_CLIENT_ID = "AfePx5V-Tru6WXLs1fwvK3RjuYKC5No0UmUgB9jmEr0IjsZ3v6BwqeQ0ur3leNkU87nz-RTFDswULn5S";

    let currentUser = null;
    let products = JSON.parse(localStorage.getItem('products')) || [
      {id:1, name:"Crunchyroll Premium 12 Monate", price:79.90, stock:12, desc:"Voller Zugriff", img:"https://picsum.photos/id/1015/300/300", category:"crunchyroll"},
      {id:2, name:"One Piece Manga Bundle 1-10", price:89.90, stock:8, desc:"Offizielle Ausgabe", img:"https://picsum.photos/id/237/300/300", category:"manga"},
      {id:3, name:"Jujutsu Kaisen Hoodie", price:49.90, stock:25, desc:"Premium Merch", img:"https://picsum.photos/id/201/300/300", category:"merch"}
    ];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let orders = JSON.parse(localStorage.getItem('orders')) || [];

    const owner = { username: "kiollegend", password: "kiollegend" };

    function saveData() {
      localStorage.setItem('products', JSON.stringify(products));
      localStorage.setItem('cart', JSON.stringify(cart));
      localStorage.setItem('orders', JSON.stringify(orders));
    }

    function loadUser() {
      const saved = localStorage.getItem('currentUser');
      if (saved) currentUser = JSON.parse(saved);
    }

    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById(`page-${page}`);
      if (target) target.classList.remove('hidden');

      if (page === 'shop') renderProducts();
      if (page === 'admin') renderAdmin();
      if (page === 'orders') renderMyOrders();
    }

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="anime-card bg-gray-900/95 border border-purple-500 rounded-3xl overflow-hidden">
          <img src="${p.img}" class="w-full h-64 object-cover">
          <div class="p-6">
            <h3 class="font-bold text-xl">${p.name}</h3>
            <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
            <p class="text-sm text-gray-400">Stock: ${p.stock}</p>
            <button onclick="addToCart(${p.id})" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl">In den Warenkorb</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (product.stock > 0) {
        cart.push({...product, quantity: 1});
        saveData();
        alert(`${product.name} hinzugefügt!`);
      }
    }

    function showCart() {
      if (cart.length === 0) return alert("Warenkorb ist leer");
      // Warenkorb Logik hier (wie vorher)
      alert("Warenkorb geöffnet - PayPal Integration aktiv");
      // Hier würde der volle Warenkorb-Code stehen
    }

    function hideCart() {
      // Modal schließen
    }

    function login() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;

      if (user === owner.username && pass === owner.password) {
        currentUser = owner;
        document.getElementById('sellBtn').classList.remove('hidden');
        document.getElementById('adminBtn').classList.remove('hidden');
      } else if (user && pass) {
        currentUser = { username: user };
      } else {
        return alert("Falsche Login-Daten");
      }
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      navigate('shop');
    }

    function register() {
      const user = document.getElementById('reg-user').value.trim();
      if (user) {
        currentUser = { username: user };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert("Registrierung erfolgreich!");
        navigate('shop');
      }
    }

    function logout() {
      if (confirm("Wirklich ausloggen?")) {
        localStorage.removeItem('currentUser');
        currentUser = null;
        location.reload();
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    function addProduct() {
      if (!currentUser || currentUser.username !== owner.username) return alert("Nur Owner!");
      // Produkt hinzufügen Logik
      alert("Produkt hinzugefügt (Demo)");
      navigate('shop');
    }

    function renderAdmin() {
      document.getElementById('admin-products').innerHTML = products.map(p => `
        <div class="bg-gray-900 p-6 rounded-3xl border border-purple-500">
          <h4 class="font-bold">${p.name}</h4>
          <p>${p.price} € | Stock: ${p.stock}</p>
        </div>
      `).join('');
    }

    function renderMyOrders() {
      document.getElementById('my-orders').innerHTML = "<p class='text-gray-400'>Noch keine Bestellungen.</p>";
    }

    // PayPal laden
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=EUR`;
    document.head.appendChild(script);

    window.onload = () => {
      loadUser();
      if (currentUser) {
        navigate('shop');
      } else {
        navigate('login');
      }
    };
  </script>
</body>
</html>
