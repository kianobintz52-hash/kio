<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 35px #c026d3, 0 0 70px #7e22ce; }
  </style>
</head>
<body>
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-2xl font-semibold">
        Anmelden
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl px-6 z-10">
      <h1 class="text-6xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">
        Kostenlos registrieren
      </button>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950 p-8">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-4xl font-bold mb-2">Willkommen zurück, <span id="dashName" class="text-purple-400"></span>!</h1>
      <p class="text-purple-300 mb-10">kiobio.lol/<span id="dashUsername"></span></p>
     
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-zinc-900 p-8 rounded-3xl">
          <h3 class="text-xl mb-6">Profil bearbeiten</h3>
          <button onclick="alert('Profil-Editor kommt bald')" class="bg-purple-600 w-full py-5 rounded-2xl">Jetzt anpassen</button>
        </div>
        <div class="bg-zinc-900 p-8 rounded-3xl">
          <h3 class="text-xl mb-6">Statistiken</h3>
          <p class="text-6xl font-bold text-purple-400">0</p>
          <p class="text-zinc-400">Profilaufrufe diese Woche</p>
        </div>
      </div>
     
      <button onclick="logout()" class="mt-12 text-red-500 hover:text-red-400">Abmelden</button>
    </div>
  </div>

  <script>
    emailjs.init("IuyLZ33ctDj1VxqXE");

    let currentUser = null;
    const VERIFICATION_CODE = "666";
    let currentEmail = "";
    let currentUsername = "";
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};

    function saveUser(email, username, password) {
      users[email] = { username, password };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
    }

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      if (input) {
        input.type = input.type === "password" ? "text" : "password";
      }
    }

    function showRegisterModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Registrieren";
      document.getElementById('modalContent').innerHTML = `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500">
        <input id="regUser" placeholder="Username" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
        
        <div class="relative">
          <input id="regPass" type="password" placeholder="Passwort (mind. 6 Zeichen)" 
                 class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
          <button onclick="togglePasswordVisibility('regPass')" 
                  class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xl">👁</button>
        </div>

        <button onclick="sendVerificationCode()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold transition">
          Verifizierungscode senden (666)
        </button>
      `;
    }

    async function sendVerificationCode() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!email || !username || !password) return alert("Bitte alle Felder ausfüllen");
      if (password.length < 6) return alert("Das Passwort muss mindestens 6 Zeichen lang sein!");

      currentEmail = email;
      currentUsername = username;

      try {
        await emailjs.send("service_zni05q6", "template_c2x5n7s", {
          to_email: email,
          verification_code: VERIFICATION_CODE,
          username: username
        });
        alert(`✅ Code (666) wurde an ${email} gesendet!`);
      } catch (e) {
        alert(`Demo-Modus\nDein Code ist immer: 666`);
      }
      showVerificationScreen(false);
    }

    function showLoginModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500">
        
        <div class="relative">
          <input id="loginPass" type="password" placeholder="Passwort" 
                 class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
          <button onclick="togglePasswordVisibility('loginPass')" 
                  class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xl">👁</button>
        </div>

        <button onclick="loginUser()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold transition">
          Anmelden
        </button>
        <p onclick="showForgotPassword()" class="text-center text-purple-400 hover:text-purple-300 mt-6 cursor-pointer text-sm">
          Passwort vergessen?
        </p>
      `;
    }

    function showForgotPassword() {
      document.getElementById('modalTitle').textContent = "Passwort zurücksetzen";
      document.getElementById('modalContent').innerHTML = `
        <input id="forgotEmail" type="email" placeholder="Deine E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500">
        <button onclick="sendResetCode()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold transition">
          Reset-Code senden (666)
        </button>
        <button onclick="showLoginModal()" class="w-full mt-3 text-zinc-400 hover:text-white">← Zurück</button>
      `;
    }

    function showVerificationScreen(isReset = false) {
      document.getElementById('modalTitle').textContent = isReset ? "Neues Passwort setzen" : "Code bestätigen";
      
      let html = `
        <p class="text-center text-purple-300">Gib den Code ein: <strong>666</strong></p>
        <input id="codeInput" maxlength="3" placeholder="666" 
               class="w-full p-6 bg-zinc-800 rounded-2xl text-4xl text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-green-500">
      `;

      if (isReset) {
        html += `
          <div class="relative">
            <input id="newPassword" type="password" placeholder="Neues Passwort (mind. 6 Zeichen)" 
                   class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button onclick="togglePasswordVisibility('newPassword')" 
                    class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xl">👁</button>
          </div>
          <button onclick="verifyResetCode()" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-6 rounded-3xl text-xl font-bold">Bestätigen & Passwort ändern</button>
        `;
      } else {
        html += `
          <button onclick="verifyCode()" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-6 rounded-3xl text-xl font-bold">Bestätigen</button>
        `;
      }

      html += `
        <button onclick="resendCode(${isReset})" class="w-full mt-3 text-purple-400 hover:text-purple-300">Code erneut senden</button>
        <button onclick="${isReset ? 'showForgotPassword()' : 'showRegisterModal()'}" class="w-full mt-2 text-zinc-400 hover:text-white text-sm">← Zurück</button>
      `;

      document.getElementById('modalContent').innerHTML = html;
    }

    function verifyCode() {
      const input = document.getElementById('codeInput').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (input !== VERIFICATION_CODE) return alert("❌ Falscher Code! Der Code ist 666");

      saveUser(currentEmail, currentUsername, password);
      currentUser = { username: currentUsername, email: currentEmail };
      document.getElementById('mainModal').classList.add('hidden');
      showDashboard();
      alert("✅ Registrierung erfolgreich!");
    }

    function verifyResetCode() {
      const input = document.getElementById('codeInput').value.trim();
      const newPass = document.getElementById('newPassword').value.trim();

      if (input !== VERIFICATION_CODE) return alert("❌ Falscher Code! Der Code ist 666");
      if (newPass.length < 6) return alert("Das neue Passwort muss mindestens 6 Zeichen lang sein!");

      if (users[currentEmail]) {
        users[currentEmail].password = newPass;
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        alert("✅ Passwort erfolgreich geändert!");
        showLoginModal();
      }
    }

    function sendResetCode() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) return alert("Bitte E-Mail eingeben");

      currentEmail = email;

      try {
        emailjs.send("service_zni05q6", "template_c2x5n7s", {
          to_email: email,
          verification_code: VERIFICATION_CODE,
          username: "User"
        });
      } catch (e) {}

      alert(`✅ Reset-Code (666) wurde an ${email} gesendet!`);
      showVerificationScreen(true);
    }

    function resendCode(isReset) {
      if (isReset) sendResetCode();
      else sendVerificationCode();
    }

    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben");

      const user = users[email];
      if (user && user.password === password) {
        currentUser = { username: user.username, email: email };
        document.getElementById('mainModal').classList.add('hidden');
        showDashboard();
      } else {
        alert("❌ Falsche E-Mail oder Passwort");
      }
    }

    function showDashboard() {
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('dashName').textContent = currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
