<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    .nav {
      background: rgba(15, 10, 35, 0.95);
      backdrop-filter: blur(16px);
    }
    video#bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.75;
      filter: brightness(0.85);
    }
    .glow-purple {
      text-shadow: 0 0 30px #c026d3, 0 0 60px #7e22ce;
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden">

  <!-- Hintergrund Video -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/754/754-small.mp4" type="video/mp4">
    <!-- Alternativer Cyberpunk Video (falls der erste nicht lädt) -->
    <!-- <source src="https://assets.mixkit.co/videos/preview/343/343-small.mp4" type="video/mp4"> -->
  </video>

  <!-- NAV BAR -->
  <nav class="nav fixed top-0 w-full z-50 border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      
      <div class="hidden md:flex items-center gap-10 text-lg">
        <a href="#" class="hover:text-purple-400 transition">Hilfecenter</a>
        <a href="#" class="hover:text-purple-400 transition">Discord</a>
        <a href="#" class="hover:text-purple-400 transition">Bestenliste</a>
        <a href="#" class="hover:text-purple-400 transition">Preise</a>
      </div>

      <button onclick="showAuthModal('login')" 
              class="bg-purple-600 hover:bg-purple-700 px-8 py-3.5 rounded-2xl font-semibold transition">
        Dashboard
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="min-h-screen flex items-center justify-center text-center pt-20 relative">
    <div class="max-w-4xl px-6 z-10">
      <h1 class="text-6xl md:text-7xl font-bold leading-tight glow-purple mb-8">
        Alles, was du willst,<br>genau hier.
      </h1>
      <p class="text-xl md:text-2xl text-purple-200 mb-12 max-w-2xl mx-auto">
        kiobio.lol ist deine Anlaufstelle für moderne, funktionsreiche Link-in-Bio-Seiten 
        und schnelles, sicheres Datei-Hosting.
      </p>

      <div class="flex flex-col sm:flex-row gap-5 justify-center">
        <button onclick="showAuthModal('register')" 
                class="bg-purple-600 hover:bg-purple-700 text-white px-12 py-6 rounded-3xl text-2xl font-semibold transition">
          Kostenlos registrieren
        </button>
        <button onclick="alert('Preise folgen bald...')" 
                class="border border-purple-400 hover:bg-white/10 px-12 py-6 rounded-3xl text-2xl font-semibold transition">
          Preise ansehen
        </button>
      </div>
    </div>
  </section>

  <!-- Auth Modal -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-12 rounded-3xl w-full max-w-md">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-10"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <script>
    function showAuthModal(type) {
      document.getElementById('authModal').classList.remove('hidden');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');
      
      if (type === 'register') {
        title.textContent = 'Profil claimen';
        content.innerHTML = `
          <input id="username" placeholder="Username (z.B. deinname)" class="w-full px-6 py-5 bg-zinc-800 rounded-2xl text-lg">
          <input id="email" type="email" placeholder="E-Mail" class="w-full px-6 py-5 bg-zinc-800 rounded-2xl text-lg mt-4">
          <button onclick="registerDemo()" class="w-full mt-8 bg-purple-600 py-6 rounded-3xl text-xl font-bold">Jetzt starten</button>
        `;
      } else {
        title.textContent = 'Anmelden';
        content.innerHTML = `
          <input id="loginInput" placeholder="Username oder Email" class="w-full px-6 py-5 bg-zinc-800 rounded-2xl text-lg">
          <button onclick="loginDemo()" class="w-full mt-8 bg-purple-600 py-6 rounded-3xl text-xl font-bold">Anmelden</button>
        `;
      }
    }

    function registerDemo() {
      const name = document.getElementById('username').value || "demo";
      alert(`✅ Profil "${name}.kiobio.lol" erfolgreich erstellt!`);
      document.getElementById('authModal').classList.add('hidden');
    }

    function loginDemo() {
      alert("✅ Erfolgreich eingeloggt (Demo)");
      document.getElementById('authModal').classList.add('hidden');
    }
  </script>
</body>
</html>
