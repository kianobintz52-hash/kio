<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>barbarossa</title>
    <style>
        /* Grundlegendes Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif; /* Oder eine serifenlose Schrift deiner Wahl */
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Der Haupttext "barbarossa" */
        h1 {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.2em; /* Viel Abstand zwischen den Buchstaben */
            color: #ffffff;
            margin-bottom: 2rem;
            text-transform: lowercase; /* Wie im Bild */
            
            /* Der weiche weiße Glow hinter dem Text */
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 
                         0 0 40px rgba(255, 255, 255, 0.1);
            
            /* Leichter Weichzeichner-Effekt, falls gewünscht */
            filter: blur(0.5px);
        }

        /* Die rote Linie unter dem Text */
        .line {
            width: 60px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 3rem auto;
            box-shadow: 0 0 10px #ff0000;
            opacity: 0.8;
        }

        /* Der "[ CLICK TO ENTER ]" Button */
        .enter-btn {
            font-size: 0.8rem;
            color: #ff0000;
            letter-spacing: 0.15em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0.7;
            user-select: none;
        }

        .enter-btn:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        /* Optional: Ein sehr subtiler Hintergrund-Grauschleier für Tiefe */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Lade-Effekt beim Klicken */
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container" id="main-content">
        <h1>barbarossa</h1>
        <div class="line"></div>
        <div class="enter-btn" onclick="enterSite()">[ click to enter ]</div>
    </div>

    <script>
        function enterSite() {
            const content = document.getElementById('main_content');
            // Füge die Animation hinzu
            content.classList.add('fade-out');
            
            // Nach der Animation (1 Sekunde) könnte man weiterleiten
            setTimeout(() => {
                // Hier würdest du normalerweise zur nächsten Seite weiterleiten
                // window.location.href = "dashboard.html"; 
                alert("Willkommen bei barbarossa."); // Nur als Demo
            }, 1000);
        }
    </script>
</body>
</html>
