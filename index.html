<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kioo.zeta Documentation</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-secondary: #111;
      --bg-tertiary: #181818;
      --text: #fff;
      --text-dim: #aaa;
      --accent: #ffffff;
      --border: #222;
      --code-bg: #1a1a1a;
      --card-bg: #151515;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    .layout {
      display: flex;
      min-height: 100vh;
    }
    
    /* Sidebar */
    #sidebar {
      width: 250px;
      background: var(--bg-secondary);
      padding: 20px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      position: fixed;
      height: 100vh;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    
    .sidebar-logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sidebar-group {
      margin-bottom: 30px;
    }
    
    .sidebar-group-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .sidebar-item:hover {
      background: var(--bg-tertiary);
    }
    
    .sidebar-item.active {
      background: var(--bg-tertiary);
      color: var(--accent);
    }
    
    .si-icon {
      font-size: 18px;
    }
    
    /* Main Content */
    .main {
      flex: 1;
      margin-left: 250px;
      padding: 40px;
      max-width: 900px;
    }
    
    .content {
      margin-bottom: 60px;
    }
    
    .page {
      display: none;
    }
    
    .page.active {
      display: block;
    }
    
    .page-eyebrow {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    h1 {
      font-size: 48px;
      margin: 0 0 20px 0;
      font-weight: 700;
    }
    
    h2 {
      font-size: 28px;
      margin: 40px 0 20px 0;
    }
    
    h3 {
      font-size: 22px;
      margin: 30px 0 15px 0;
    }
    
    p {
      margin-bottom: 20px;
      color: var(--text-dim);
    }
    
    .page-desc {
      font-size: 18px;
      color: var(--text-dim);
      margin-bottom: 40px;
      max-width: 700px;
    }
    
    a {
      color: var(--accent);
      text-decoration: none;
    }
    
    a:hover {
      text-decoration: underline;
    }
    
    /* Cards */
    .card-grid {
      display: grid;
      gap: 20px;
      margin: 30px 0;
    }
    
    .cols-2 {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    
    .card-icon {
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--bg-tertiary);
      border-radius: 10px;
    }
    
    .card-title {
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text);
    }
    
    .card-desc {
      color: var(--text-dim);
      font-size: 14px;
    }
    
    /* Callouts */
    .callout {
      padding: 16px 20px;
      border-radius: 8px;
      margin: 30px 0;
      display: flex;
      gap: 12px;
    }
    
    .callout-note {
      background: rgba(59, 130, 246, 0.1);
      border-left: 4px solid #3b82f6;
    }
    
    .callout-tip {
      background: rgba(16, 185, 129, 0.1);
      border-left: 4px solid #10b981;
    }
    
    .callout-warning {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
    }
    
    .callout-icon {
      font-size: 20px;
    }
    
    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    
    th {
      background: var(--bg-secondary);
      font-weight: 600;
    }
    
    /* Steps */
    .steps {
      margin: 30px 0;
    }
    
    .step {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }
    
    .step-title {
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    /* Accordion */
    .accordion-group {
      margin: 20px 0;
    }
    
    .accordion {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    
    .accordion.open .accordion-body {
      display: block;
    }
    
    .accordion-header {
      padding: 16px 20px;
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .accordion-body {
      padding: 0 20px 16px;
      display: none;
    }
    
    .accordion-arrow {
      transition: transform 0.2s;
    }
    
    .accordion.open .accordion-arrow {
      transform: rotate(180deg);
    }
    
    /* Page Navigation */
    .page-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
    }
    
    .page-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text-dim);
    }
    
    .page-nav-btn.next {
      flex-direction: row-reverse;
    }
    
    .nav-label {
      font-size: 12px;
      text-transform: uppercase;
    }
    
    .nav-title {
      font-weight: 600;
    }
    
    /* Pricing */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin: 30px 0;
    }
