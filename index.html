<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-white">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col items-center justify-center p-4">

    <!-- Header / Navigation -->
    <nav class="absolute top-0 w-full p-6 flex justify-between items-center">
        <div class="font-bold text-xl">OathNet</div>
        <div class="space-x-6 text-sm opacity-80">
            <span>Home</span><span>Pricing</span><span>API</span>
        </div>
        <div class="space-x-3">
            <button class="px-4 py-2 text-sm border border-white/20 rounded-full">Sign Up</button>
            <button class="px-4 py-2 text-sm bg-violet-600 rounded-full">Login</button>
        </div>
    </nav>

    <!-- Zentrum: Logo/Icon -->
    <div class="mb-12">
        <div class="w-24 h-24 border border-white/20 rounded-full flex items-center justify-center bg-white/5">
            <span class="text-3xl">🛡️</span>
        </div>
    </div>

    <!-- Suchfeld Bereich aus image_64cea6.jpg -->
    <div class="w-full max-w-2xl bg-white/5 p-2 rounded-2xl border border-white/10 shadow-2xl">
        <div class="flex items-center px-4 py-3">
            <input type="text" placeholder="e.g. username: winterfox" 
                   class="bg-transparent w-full outline-none text-white placeholder-white/30">
            <button class="bg-violet-600 px-6 py-2 rounded-xl text-sm font-medium">Search →</button>
        </div>
        
        <!-- Untere Optionen -->
        <div class="flex justify-between items-center px-4 py-3 border-t border-white/10 text-xs opacity-70">
            <div class="bg-black/40 rounded-full px-3 py-1">Automated / Manual</div>
            <div class="flex space-x-4">
                <span>⊞ Bulk Search</span>
                <span>🛡 Secure Search</span>
                <span>🗄 15+ Sources</span>
            </div>
        </div>
    </div>

</body>
</html>
