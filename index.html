<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiobio.lol - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <style>
        body { background: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif; }
        .sidebar { background: #111113; }
        .card { background: #1a1a1e; border: 1px solid #3b0764; }
        .purple-accent { color: #c026d3; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div class="w-72 sidebar h-screen fixed p-6">
        <div class="flex items-center gap-3 mb-10">
            <span class="text-4xl">🔫</span>
            <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
        </div>

        <div class="space-y-8">
            <div class="text-purple-400 font-semibold flex items-center gap-3">
                <span>👤</span> Konto
            </div>
            
            <nav class="space-y-2 text-zinc-400">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-purple-900/30 text-white">Übersicht</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Statistiken</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Badges</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Anpassen</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Links</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Image Host</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">Premium</a>
            </nav>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 ml-72 p-10">
        <h1 class="text-4xl font-bold mb-8">Kontoübersicht</h1>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">Benutzername</div>
                <div class="text-2xl font-bold mt-2" id="username">deinname</div>
            </div>
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">Profilaufrufe</div>
                <div class="text-2xl font-bold mt-2 purple-accent" id="views">0</div>
            </div>
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">UID</div>
                <div class="text-2xl font-bold mt-2" id="uid">123456</div>
            </div>
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">Erstellt</div>
                <div class="text-2xl font-bold mt-2" id="joined">vor 2 Tagen</div>
            </div>
        </div>

        <!-- Weitere Abschnitte wie bei guns.lol -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card rounded-3xl p-8">
                <h2 class="text-xl font-semibold mb-6">Profil-Vervollständigung</h2>
                <div class="bg-yellow-900/30 border border-yellow-600 rounded-2xl p-6">
                    <p class="text-yellow-400">Dein Profil ist noch nicht vollständig!</p>
                </div>
            </div>

            <div class="card rounded-3xl p-8">
                <h2 class="text-xl font-semibold mb-6">Schnellaktionen</h2>
                <button onclick="openProfileEditor()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl mb-4">Profil bearbeiten</button>
                <button onclick="goToProfile()" class="w-full border border-purple-500 py-4 rounded-2xl">Meine Seite ansehen</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase (kurz)
        const firebaseConfig = { /* deine Config */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Dummy Daten für jetzt
        document.getElementById('username').textContent = "deinname";
        document.getElementById('views').textContent = "1337";
    </script>
</body>
</html>
