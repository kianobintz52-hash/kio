<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einfacher Browser-Proxy</title>
</head>
<body>
    <h2>Web-Inhalt abrufen</h2>
    <input type="text" id="url" placeholder="https://beispiel.de" style="width: 300px;">
    <button onclick="fetchContent()">Laden</button>
    
    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;">
        Hier erscheint der Inhalt...
    </div>

    <script>
        async function fetchContent() {
            const url = document.getElementById('url').value;
            const output = document.getElementById('output');
            // Hinweis: cors-anywhere ist nur für Demos geeignet
            const proxy = 'https://cors-anywhere.herokuapp.com/'; 
            
            output.innerHTML = "Lade...";
            
            try {
                const response = await fetch(proxy + url);
                const data = await response.text();
                output.innerText = data; // Zeigt den rohen Quelltext an
            } catch (error) {
                output.innerText = "Fehler: " + error.message;
            }
        }
    </script>
</body>
</html>
