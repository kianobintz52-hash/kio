<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 35px #c026d3, 0 0 70px #7e22ce; }
    .card { background-color: #1a1428; }
    .sidebar-active { background-color: #6b21a8; color: white; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleTheme()" class="text-2xl" id="themeBtn">🌙</button>
        <button onclick="logout()" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-2xl font-semibold" id="navBtn">
          Anmelden
        </button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl px-6 z-10">
      <h1 class="text-6xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">
        Kostenlos registrieren
      </button>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex h-screen pt-16">
      <!-- SIDEBAR -->
      <div class="w-72 bg-[#0f0a23] border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        
        <div class="space-y-1">
          <a href="#" onclick="fakeNavClick(this)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="fakeNavClick(this)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">📊 Statistiken</a>
          <a href="#" onclick="fakeNavClick(this)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🏅 Badges</a>
          <a href="#" onclick="fakeNavClick(this)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links</a>
          <a href="#" onclick="fakeNavClick(this)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">⚙️ Einstellungen</a>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-10 overflow-y-auto">
        <div class="max-w-6xl mx-auto">
          <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-6">
              <img id="profilePicBig" src="https://i.pravatar.cc/128" 
                   class="w-28 h-28 rounded-3xl object-cover border-4 border-purple-500 cursor-pointer" 
                   onclick="document.getElementById('picUpload').click()">
              <input type="file" id="picUpload" accept="image/*" class="hidden" onchange="uploadProfilePic(event)">
              <div>
                <h1 id="dashNameTop" class="text-4xl font-bold"></h1>
                <p id="dashUsername" class="text-purple-400"></p>
              </div>
            </div>
            <button onclick="logout()" class="text-red-400 hover:text-red-500">Abmelden</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="card p-6 rounded-3xl">
              <p class="text-zinc-400">UID</p>
              <p id="dashUID" class="text-3xl font-bold text-purple-400">#1</p>
            </div>
            <div class="card p-6 rounded-3xl">
              <p class="text-zinc-400">Alias</p>
              <p id="dashAlias" class="text-3xl font-bold text-purple-400">Keine</p>
            </div>
            <div class="card p-6 rounded-3xl">
              <p class="text-zinc-400">Profilaufrufe</p>
              <p id="dashViews" class="text-3xl font-bold text-purple-400">0</p>
              <button onclick="incrementViews()" class="text-xs mt-2 text-purple-400 hover:text-purple-300">+1 simulieren</button>
            </div>
            <div class="card p-6 rounded-3xl">
              <p class="text-zinc-400">Beigetreten</p>
              <p class="text-3xl font-bold text-purple-400">Gerade eben</p>
            </div>
          </div>

          <!-- Bio -->
          <div class="card p-8 rounded-3xl mb-10">
            <h3 class="text-xl mb-4">Bio</h3>
            <textarea id="bioText" class="w-full h-32 bg-zinc-800 rounded-2xl p-5 resize-none" placeholder="Schreib etwas über dich..."></textarea>
            <button onclick="saveBio()" class="mt-4 bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-2xl">Bio speichern</button>
          </div>

          <!-- Profil Vervollständigung + Badges -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="card p-8 rounded-3xl">
              <h3 class="text-xl mb-6">Profil-Vervollständigung</h3>
              <div class="h-2 bg-zinc-800 rounded-full mb-6">
                <div class="h-2 bg-purple-600 w-2/3 rounded-full"></div>
              </div>
              <div class="space-y-3">
                <button onclick="alert('Avatar bereits hochgeladen!')" class="w-full text-left bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl">👤 Avatar</button>
                <button onclick="alert('Discord kommt bald')" class="w-full text-left bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl">Discord verbinden</button>
              </div>
            </div>

            <div class="card p-8 rounded-3xl">
              <h3 class="text-xl mb-6">Badges</h3>
              <div class="flex gap-4 flex-wrap">
                <div class="bg-zinc-800 px-6 py-3 rounded-2xl text-sm">🔥 Erster User</div>
                <div class="bg-zinc-800 px-6 py-3 rounded-2xl text-sm">🌟 Beta</div>
                <div class="bg-zinc-800 px-6 py-3 rounded-2xl text-sm">📈 Aktiv</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    emailjs.init("IuyLZ33ctDj1VxqXE");

    let currentUser = null;
    const VERIFICATION_CODE = "666";
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let nextUID = parseInt(localStorage.getItem('nextUID')) || 1;

    function saveUser(email, username, password) {
      users[email] = { 
        username, 
        password, 
        uid: nextUID++,
        views: 0,
        alias: "Keine",
        bio: "",
        profilePic: "https://i.pravatar.cc/128?u=" + Date.now()
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      localStorage.setItem('nextUID', nextUID);
    }

    function togglePassword(id) {
      const el = document.getElementById(id);
      if (el) el.type = el.type === "password" ? "text" : "password";
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light');
      const btn = document.getElementById('themeBtn');
      btn.textContent = document.documentElement.classList.contains('light') ? '☀️' : '🌙';
    }

    function uploadProfilePic(e) {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      
      const reader = new FileReader();
      reader.onload = function(ev) {
        currentUser.profilePic = ev.target.result;
        users[currentUser.email].profilePic = ev.target.result;
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        document.getElementById('profilePicBig').src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveBio() {
      if (!currentUser) return;
      const bio = document.getElementById('bioText').value;
      currentUser.bio = bio;
      users[currentUser.email].bio = bio;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      alert("✅ Bio gespeichert!");
    }

    function incrementViews() {
      if (!currentUser) return;
      currentUser.views++;
      users[currentUser.email].views = currentUser.views;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      document.getElementById('dashViews').textContent = currentUser.views;
    }

    function fakeNavClick(el) {
      document.querySelectorAll('.sidebar-active').forEach(e => e.classList.remove('sidebar-active'));
      el.classList.add('sidebar-active');
    }

    // Register / Login / Verify Funktionen (wie vorher)
    function showRegisterModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Registrieren";
      document.getElementById('modalContent').innerHTML = `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <input id="regUser" placeholder="Username" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        <div class="relative">
          <input id="regPass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
          <button onclick="togglePassword('regPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="sendVerificationCode()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Code senden (666)</button>
      `;
    }

    async function sendVerificationCode() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!email || !username || !password) return alert("Alle Felder ausfüllen!");
      if (password.length < 6) return alert("Passwort muss mindestens 6 Zeichen haben!");
      if (Object.values(users).some(u => u.username === username)) return alert("Username bereits vergeben!");

      try {
        await emailjs.send("service_zni05q6", "template_c2x5n7s", {
          to_email: email,
          verification_code: VERIFICATION_CODE,
          username: username
        });
      } catch(e) {}

      alert(`✅ Code 666 wurde an ${email} gesendet!`);
      window.tempUser = {email, username, password};
      showVerificationScreen();
    }

    function showVerificationScreen() {
      document.getElementById('modalTitle').textContent = "Code bestätigen";
      document.getElementById('modalContent').innerHTML = `
        <p class="text-center text-purple-300">Der Code ist: <strong>666</strong></p>
        <input id="codeInput" maxlength="3" placeholder="666" class="w-full p-6 bg-zinc-800 rounded-2xl text-4xl text-center tracking-widest">
        <button onclick="verifyCode()" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-6 rounded-3xl text-xl font-bold">Bestätigen</button>
      `;
    }

    function verifyCode() {
      if (document.getElementById('codeInput').value !== "666") return alert("Falscher Code! Es ist 666.");

      const {email, username, password} = window.tempUser;
      saveUser(email, username, password);
      currentUser = users[email];
      document.getElementById('mainModal').classList.add('hidden');
      showDashboard();
    }

    function showLoginModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <div class="relative">
          <input id="loginPass" type="password" placeholder="Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
          <button onclick="togglePassword('loginPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="loginUser()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Anmelden</button>
      `;
    }

    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = users[email];
      if (user && user.password === pass) {
        currentUser = user;
        document.getElementById('mainModal').classList.add('hidden');
        showDashboard();
      } else {
        alert("Falsche Zugangsdaten");
      }
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";

      document.getElementById('dashNameTop').textContent = currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
      document.getElementById('dashUID').textContent = `#${currentUser.uid}`;
      document.getElementById('dashViews').textContent = currentUser.views;
      document.getElementById('profilePicBig').src = currentUser.profilePic || "https://i.pravatar.cc/128";
      document.getElementById('bioText').value = currentUser.bio || "";
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
