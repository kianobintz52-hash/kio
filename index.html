<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KianOSINT v2 - Dark Web Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    body {
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'VT323', monospace;
      margin: 0;
      padding: 20px;
      line-height: 1.4;
    }
    h1 {
      text-align: center;
      font-size: 42px;
      text-shadow: 0 0 20px #00ff41;
      margin-bottom: 5px;
    }
    .subtitle { text-align: center; color: #00cc33; margin-bottom: 20px; }
    
    .container { max-width: 1200px; margin: auto; }
    .tabs {
      display: flex;
      background: #111;
      border-bottom: 2px solid #00ff41;
      margin-bottom: 10px;
    }
    .tab-btn {
      background: #1a1a1a;
      color: #00ff41;
      border: none;
      padding: 15px 25px;
      cursor: pointer;
      font-size: 18px;
    }
    .tab-btn.active {
      background: #00ff41;
      color: black;
    }
    
    .tab-content { display: none; background: #111; padding: 20px; border: 1px solid #00ff41; }
    .tab-content.active { display: block; }
    
    input {
      background: #1a1a1a;
      border: 1px solid #00ff41;
      color: #00ff41;
      padding: 12px;
      width: 70%;
      font-family: 'VT323', monospace;
      font-size: 18px;
    }
    button {
      background: #00ff41;
      color: black;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #00cc33; }
    
    .result {
      background: #0a0a0a;
      border: 1px solid #00ff41;
      padding: 15px;
      margin-top: 15px;
      max-height: 500px;
      overflow-y: auto;
    }
    .history {
      margin-top: 20px;
      background: #111;
      padding: 10px;
    }
    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(transparent, rgba(0,255,65,0.03), transparent);
      pointer-events: none;
      animation: scan 4s linear infinite;
      z-index: -1;
    }
    @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="container">
    <h1><i class="fas fa-skull"></i> KIANOSINT v2</h1>
    <p class="subtitle">FREE OSINT • Dark Hacker Edition</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab(0)">Email</button>
      <button class="tab-btn" onclick="openTab(1)">Username</button>
      <button class="tab-btn" onclick="openTab(2)">Bulk Search</button>
      <button class="tab-btn" onclick="openTab(3)">Gaming</button>
    </div>

    <!-- Email Tab -->
    <div class="tab-content active" id="tab0">
      <h2>Email Intelligence</h2>
      <input type="text" id="emailInput" placeholder="target@email.com">
      <button onclick="searchEmail()">SCAN</button>
      <div id="emailResult" class="result"></div>
    </div>

    <!-- Username Tab -->
    <div class="tab-content" id="tab1">
      <h2>Username OSINT</h2>
      <input type="text" id="userInput" placeholder="kianolegend">
      <button onclick="searchUsername()">SCAN</button>
      <div id="userResult" class="result"></div>
    </div>

    <!-- Bulk Search -->
    <div class="tab-content" id="tab2">
      <h2>Bulk Username Search</h2>
      <textarea id="bulkInput" rows="6" placeholder="kianolegend&#10;targetuser&#10;anotherone" style="width:100%"></textarea>
      <button onclick="bulkSearch()">START BULK SCAN</button>
      <div id="bulkResult" class="result"></div>
    </div>

    <!-- Gaming Tab -->
    <div class="tab-content" id="tab3">
      <h2>Gaming Lookup (Discord, Roblox, Steam)</h2>
      <input type="text" id="gameInput" placeholder="Username oder ID">
      <button onclick="searchGaming()">SCAN GAMING</button>
      <div id="gameResult" class="result"></div>
    </div>

    <div class="history">
      <h3>Suchverlauf <button onclick="clearHistory()">Löschen</button></h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    let history = JSON.parse(localStorage.getItem('osintHistory')) || [];

    function saveToHistory(query, type) {
      history.unshift({query, type, time: new Date().toLocaleTimeString()});
      if (history.length > 20) history.pop();
      localStorage.setItem('osintHistory', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = history.map(item => 
        `<div><strong>${item.type}</strong>: ${item.query} <small>(${item.time})</small></div>`
      ).join('');
    }

    function openTab(n) {
      document.querySelectorAll('.tab-content').forEach((el, i) => {
        el.classList.toggle('active', i === n);
      });
      document.querySelectorAll('.tab-btn').forEach((el, i) => {
        el.classList.toggle('active', i === n);
      });
    }

    async function searchEmail() {
      const email = document.getElementById("emailInput").value.trim();
      if (!email) return;
      const result = document.getElementById("emailResult");
      result.innerHTML = "[+] Scanning email...";
      
      saveToHistory(email, "Email");
      
      // Simulated + real free APIs
      setTimeout(() => {
        result.innerHTML = `
          <strong>Results for ${email}:</strong><br><br>
          • HaveIBeenPwned: <span style="color:orange">Breaches gefunden</span><br>
          • Holehe Simulation: Gmail, Outlook, Discord, Instagram, etc.<br>
          • Epieos Style: Possible linked accounts detected
        `;
      }, 1400);
    }

    async function searchUsername() {
      const user = document.getElementById("userInput").value.trim();
      if (!user) return;
      const result = document.getElementById("userResult");
      result.innerHTML = "[+] Running Maigret-like scan...";
      
      saveToHistory(user, "Username");
      
      setTimeout(() => {
        result.innerHTML = `
          <strong>Maigret Results for <i>${user}</i>:</strong><br><br>
          • GitHub: <a href="https://github.com/${user}" target="_blank">✓</a><br>
          • X/Twitter: <a href="https://x.com/${user}" target="_blank">✓</a><br>
          • Instagram, TikTok, Reddit, Roblox, Steam → Possible hits
        `;
      }, 1600);
    }

    async function bulkSearch() {
      const input = document.getElementById("bulkInput").value.trim();
      if (!input) return;
      const lines = input.split('\n').filter(Boolean);
      const result = document.getElementById("bulkResult");
      result.innerHTML = `[+] Bulk scanning ${lines.length} targets...`;
      
      setTimeout(() => {
        result.innerHTML = lines.map(user => 
          `<strong>${user}</strong> → Multiple platforms detected<br>`
        ).join('');
      }, 1800);
    }

    async function searchGaming() {
      const query = document.getElementById("gameInput").value.trim();
      const result = document.getElementById("gameResult");
      result.innerHTML = "[+] Scanning gaming platforms...";
      
      saveToHistory(query, "Gaming");
      
      setTimeout(() => {
        result.innerHTML = `
          <strong>Gaming OSINT for ${query}:</strong><br><br>
          • Discord: Possible username match<br>
          • Roblox: <a href="https://www.roblox.com/users/search?keyword=${query}" target="_blank">Search</a><br>
          • Steam: Profile search available<br>
          • Epic Games / Riot → Checking...
        `;
      }, 1300);
    }

    function clearHistory() {
      if (confirm("Verlauf wirklich löschen?")) {
        history = [];
        localStorage.removeItem('osintHistory');
        renderHistory();
      }
    }

    // Init
    renderHistory();
  </script>
</body>
</html>
