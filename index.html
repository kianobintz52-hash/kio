<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; }
    .glow { text-shadow: 0 0 40px #c026d3; }
    video#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.7; }
  </style>
</head>
<body class="bg-black text-white min-h-screen">

  <video id="bg" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="showLoginModal()" class="px-6 py-2.5 rounded-2xl border border-purple-500 hover:bg-purple-500/10" id="navLoginBtn">Anmelden</button>
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-2.5 rounded-2xl font-semibold">Registrieren</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl">
      <h1 class="text-6xl md:text-7xl font-bold glow mb-6">Dein Profil.<br>Deine Regeln.</h1>
      <p class="text-xl text-gray-300 mb-10">Guns.lol Style — aber besser.</p>
      <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 text-2xl px-12 py-6 rounded-3xl font-semibold">Kostenlos starten</button>
    </div>
  </section>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 class="text-3xl font-bold text-center mb-8">Anmelden</h2>
      <input id="loginEmail" type="email" value="u3271805041@gmail.com" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
      <input id="loginPassword" type="password" value="666666" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl mb-6">
      <button onclick="doLogin()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold">Anmelden</button>
      <p class="text-center text-sm mt-6 text-gray-400">Noch kein Account? <span onclick="switchToRegister()" class="text-purple-400 cursor-pointer">Registrieren</span></p>
    </div>
  </div>

  <!-- REGISTER MODAL -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 class="text-3xl font-bold text-center mb-8">Registrieren</h2>
      <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
      <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
      <input id="regPassword" type="password" placeholder="Passwort (min. 6 Zeichen)" class="w-full bg-zinc-800 p-4 rounded-2xl mb-6">
      <button onclick="registerUser()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold">Jetzt registrieren</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950 pt-24">
    <div class="max-w-4xl mx-auto px-6">
      <h1 class="text-5xl font-bold mb-4">Willkommen zurück, <span id="welcomeName" class="text-purple-400"></span>!</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-12">
        <button onclick="goToProfile()" class="bg-gradient-to-br from-purple-600 to-violet-600 p-8 rounded-3xl text-left hover:scale-105 transition">
          <span class="text-2xl">👤</span>
          <h3 class="text-3xl font-bold mt-6">Mein Profil ansehen</h3>
        </button>
        <button onclick="openProfileEditor()" class="bg-zinc-900 border border-purple-500/50 p-8 rounded-3xl text-left hover:scale-105 transition">
          <span class="text-2xl">✏️</span>
          <h3 class="text-3xl font-bold mt-6">Profil bearbeiten</h3>
        </button>
      </div>

      <button onclick="logout()" class="mt-8 text-red-500 hover:text-red-600">Abmelden</button>
    </div>
  </div>

  <script>
    // === Firebase Config ===
    const firebaseConfig = { /* Deine Config hier */ };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUser = null;

    // Login
    async function doLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        currentUser = cred.user;
        closeAllModals();
        showDashboard();
      } catch (e) { alert("Login fehlgeschlagen: " + e.message); }
    }

    // Register
    async function registerUser() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value.trim();

      if (password.length < 6 || !username) return alert("Bitte alle Felder ausfüllen");

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.ref('users/' + cred.user.uid).set({
          uid: cred.user.uid,
          email,
          username,
          displayName: username,
          bio: "Neuer bei kiobio.lol 🔥",
          profilePic: "https://i.pravatar.cc/300?u=" + Date.now(),
          badges: ["verified"],
          socials: {}
        });
        alert("✅ Registrierung erfolgreich!");
        closeAllModals();
        currentUser = cred.user;
        showDashboard();
      } catch (e) { alert(e.message); }
    }

    function showLoginModal() {
      closeAllModals();
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function showRegisterModal() {
      closeAllModals();
      document.getElementById('registerModal').classList.remove('hidden');
    }

    function closeAllModals() {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('registerModal').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('welcomeName').textContent = currentUser.displayName || "User";
      document.getElementById('navLoginBtn').textContent = "Dashboard";
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function goToProfile() {
      if (currentUser) {
        window.location.href = `/@${currentUser.username || 'deinusername'}`;
      }
    }

    // Auth State
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        showDashboard();
      }
    });

    // Editor + Profile Code (aus vorheriger Nachricht) hier einfügen...
  </script>
</body>
</html>
