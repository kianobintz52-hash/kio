<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KianOSINT v3.2 - Dark Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');
    
    body {
      background: #000;
      color: #00ff41;
      font-family: 'VT323', monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
    }
    canvas#matrix { position: fixed; top: 0; left: 0; z-index: -2; opacity: 0.18; }

    h1 {
      text-align: center;
      font-size: 52px;
      text-shadow: 0 0 30px #00ff41, 0 0 60px #ff00ff;
      animation: glitch 1.5s infinite;
      margin: 15px 0 5px;
    }
    @keyframes glitch {
      0% { text-shadow: 3px 3px #ff00ff, -3px -3px #00ff41; }
      20% { text-shadow: -3px 3px #ff00ff, 3px -3px #00ff41; }
      100% { text-shadow: 3px 3px #ff00ff, -3px -3px #00ff41; }
    }

    .subtitle { text-align: center; color: #00cc33; font-size: 24px; margin-bottom: 20px; }
    .container { max-width: 1480px; margin: auto; padding: 15px; position: relative; z-index: 2; }

    .tabs { display: flex; flex-wrap: wrap; gap: 5px; background: #111; padding: 10px; border-bottom: 3px solid #00ff41; }
    .tab-btn {
      background: #1a1a1a;
      color: #00ff41;
      border: 2px solid #00ff41;
      padding: 16px 32px;
      cursor: pointer;
      font-size: 21px;
      transition: all 0.3s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: #00ff41;
      color: #000;
      box-shadow: 0 0 25px #00ff41;
    }

    .tab-content { display: none; background: rgba(15,15,15,0.95); padding: 30px; border: 1px solid #00ff41; margin-top: -1px; }
    .tab-content.active { display: block; }

    input, textarea {
      background: #111;
      border: 2px solid #00ff41;
      color: #00ff41;
      padding: 15px;
      font-size: 18px;
      width: 75%;
      margin: 10px 0;
    }
    button {
      background: #00ff41;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      margin: 8px 5px;
      transition: all 0.2s;
    }
    button:hover {
      background: #ff00ff;
      color: white;
      box-shadow: 0 0 20px #ff00ff;
      transform: scale(1.05);
    }

    .result {
      background: #000;
      border: 1px solid #00ff41;
      padding: 22px;
      margin-top: 20px;
      max-height: 720px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 17.5px;
      line-height: 1.55;
      position: relative;
    }
    .result::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(transparent 0px, rgba(0,255,65,0.04) 2px, transparent 4px);
      pointer-events: none;
      animation: scanline 3.5s linear infinite;
    }

    .success { color: #00ff41; }
    .danger { color: #ff4444; }
    .warning { color: #ffaa00; }
    .info { color: #00ccff; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  
  <div class="container">
    <h1><i class="fas fa-skull-crossbones"></i> KIANOSINT v3.2</h1>
    <p class="subtitle">BACKEND CONNECTED • REAL APIS • MATRIX MODE</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab(0)">Email</button>
      <button class="tab-btn" onclick="openTab(1)">Username</button>
      <button class="tab-btn" onclick="openTab(2)">IP & Phone</button>
      <button class="tab-btn" onclick="openTab(3)">Dark Leak</button>
      <button class="tab-btn" onclick="openTab(4)">Socials</button>
      <button class="tab-btn" onclick="openTab(5)">Bulk</button>
    </div>

    <!-- Email -->
    <div class="tab-content active" id="tab0">
      <h2>Email Intelligence</h2>
      <input type="text" id="emailInput" placeholder="target@email.com" value="example@leak.com">
      <button onclick="searchEmail()">SCAN EMAIL</button>
      <div id="emailResult" class="result"></div>
    </div>

    <!-- IP & Phone -->
    <div class="tab-content" id="tab2">
      <h2>IP & Phone Lookup</h2>
      <input type="text" id="ipInput" placeholder="8.8.8.8" value="8.8.8.8">
      <button onclick="searchIP()">IP + ABUSEIPDB</button><br><br>
      <input type="text" id="phoneInput" placeholder="+49123456789">
      <button onclick="searchPhone()">PHONE SCAN</button>
      <div id="ipPhoneResult" class="result"></div>
    </div>

    <!-- Dark Leak -->
    <div class="tab-content" id="tab3">
      <h2>Dark Web Leak Scanner</h2>
      <input type="text" id="leakInput" placeholder="Email oder Username" value="target@email.com">
      <button onclick="darkLeakSim()">DEEP DARK WEB SCAN</button>
      <div id="leakResult" class="result"></div>
    </div>

    <!-- Weitere Tabs (Username, Socials, Bulk) kannst du selbst erweitern -->
  </div>

  <script>
    // ================= MATRIX RAIN =================
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&*█▓▒░';
    const fontSize = 14;
    let columns = Math.floor(width / fontSize);
    let drops = new Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px VT323`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    // ================= BACKEND URL =================
    const API_BASE = "http://localhost:8080/api";   // Ändere bei Bedarf

    // History
    let searchHistory = JSON.parse(localStorage.getItem('kianOsintHistory')) || [];

    function saveHistory(query, type, data) {
      searchHistory.unshift({ query, type, time: new Date().toLocaleString('de-DE'), data });
      if (searchHistory.length > 80) searchHistory.pop();
      localStorage.setItem('kianOsintHistory', JSON.stringify(searchHistory));
    }

    function openTab(n) {
      document.querySelectorAll('.tab-content').forEach((el, i) => el.classList.toggle('active', i === n));
      document.querySelectorAll('.tab-btn').forEach((el, i) => el.classList.toggle('active', i === n));
    }

    // ================= API CALLS =================
    async function searchIP() {
      const ip = document.getElementById("ipInput").value.trim();
      const result = document.getElementById("ipPhoneResult");
      result.innerHTML = `<span class="warning">[+] Querying Backend (ipapi + AbuseIPDB)...</span>`;

      try {
        const res = await fetch(`${API_BASE}/ip/${ip}`);
        const data = await res.json();
        result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        saveHistory(ip, "IP", data);
      } catch (e) {
        result.innerHTML = `<span class="danger">[-] Backend nicht erreichbar oder Rate Limit</span>`;
      }
    }

    async function searchEmail() {
      const email = document.getElementById("emailInput").value.trim();
      const result = document.getElementById("emailResult");
      result.innerHTML = `<span class="warning">[+] Sending to Backend (HIBP + LeakCheck)...</span>`;

      try {
        const res = await fetch(`${API_BASE}/email`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        saveHistory(email, "Email", data);
      } catch (e) {
        result.innerHTML = `<span class="danger">[-] Backend Error</span>`;
      }
    }

    async function darkLeakSim() {
      const query = document.getElementById("leakInput").value.trim();
      const result = document.getElementById("leakResult");
      result.innerHTML = `<span class="warning">[+] Deep Dark Web Scan via Backend...</span>`;

      try {
        const res = await fetch(`${API_BASE}/leak`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        saveHistory(query, "DarkLeak", data);
      } catch (e) {
        result.innerHTML = `<span class="danger">[-] Connection Error</span>`;
      }
    }

    // Placeholder für andere Tabs
    async function searchPhone() {
      document.getElementById("ipPhoneResult").innerHTML = `<span class="info">Phone Lookup wird noch implementiert.</span>`;
    }

    // Init
    openTab(0);
  </script>
</body>
</html>
