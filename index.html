<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME VAULT • Kawaii & Kult</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --accent: 168 85 247; }
    body {
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-image 0.8s ease;
    }
    .glass {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.25);
    }
    .neon-purple { text-shadow: 0 0 25px rgb(168 85 247), 0 0 50px rgb(236 72 153); }
    .sakura { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0.65; }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-24 relative">
  <!-- Sakura -->
  <canvas id="sakura" class="sakura"></canvas>

  <!-- Music Controls -->
  <div class="fixed top-4 right-24 z-50 flex items-center gap-3 glass rounded-2xl px-4 py-2">
    <button onclick="toggleMusic()" id="music-btn" class="text-2xl hover:scale-110 transition">🎵</button>
    <span id="music-title" class="text-sm text-purple-300">Lo-Fi Anime Chill</span>
  </div>

  <!-- Navbar (wie vorher) -->
  <nav class="glass sticky top-0 z-50 border-b border-purple-500/50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer flex items-center gap-3">
        <span class="text-5xl">🌸</span> ANIME VAULT
      </h1>
      <!-- Rest der Navbar bleibt gleich -->
      <div class="flex items-center gap-8 text-lg">
        <button onclick="navigate('shop')">Shop</button>
        <button onclick="navigate('wishlist')">❤️ Wishlist</button>
        <button onclick="navigate('orders')">Bestellungen</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hidden">Verkaufen</button>
        <button onclick="navigate('profile')">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hidden">Admin</button>
        <button onclick="toggleTheme()" class="text-3xl" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <button onclick="logout()" class="bg-red-600/90 hover:bg-red-700 px-6 py-3 rounded-2xl text-sm">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Audio Elements -->
  <audio id="bg-music" loop>
    <source src="https://assets.mixkit.co/music/preview/296/296-preview.mp3" type="audio/mpeg"> <!-- Lo-Fi Beispiel -->
  </audio>
  <audio id="click-sound" src="https://assets.mixkit.co/sfx/preview/2965/2965-preview.mp3"></audio>
  <audio id="heart-sound" src="https://assets.mixkit.co/sfx/preview/2962/2962-preview.mp3"></audio>
  <audio id="success-sound" src="https://assets.mixkit.co/sfx/preview/2970/2970-preview.mp3"></audio>

  <!-- Rest der Seiten (Login, Shop, Wishlist, Orders, Sell, Profile, Admin, Modals) wie in der vorherigen Version -->

  <script>
    // === AUDIO ===
    const bgMusic = document.getElementById('bg-music');
    const clickSound = document.getElementById('click-sound');
    const heartSound = document.getElementById('heart-sound');
    const successSound = document.getElementById('success-sound');

    function playSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play();
        document.getElementById('music-btn').textContent = '⏸️';
      } else {
        bgMusic.pause();
        document.getElementById('music-btn').textContent = '🎵';
      }
    }

    // Button Sounds aktivieren
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        playSound(clickSound);
      }
    });

    // Theme mit unterschiedlichen Hintergründen
    let isDark = true;
    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.classList.toggle('dark', isDark);

      if (isDark) {
        document.body.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)), url('https://picsum.photos/id/1015/1920/1080')";
        document.getElementById('theme-toggle').innerHTML = '<i class="fas fa-sun"></i>';
      } else {
        document.body.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1016/1920/1080')";
        document.getElementById('theme-toggle').innerHTML = '<i class="fas fa-moon"></i>';
      }
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Wishlist mit Sound
    function toggleWishlist(id) {
      playSound(heartSound);
      // ... restliche Logik
    }

    // Complete Purchase mit Sound
    function completePurchase(...) {
      playSound(successSound);
      // ... restliche Logik
    }

    // Sakura Canvas (wie vorher)
    function createSakura() { /* ... */ }

    // Navigation & Render-Funktionen (wie in vorheriger Version)

    window.onload = () => {
      createSakura();
      
      // Music auto-start (leise)
      bgMusic.volume = 0.25;
      // bgMusic.play(); // Uncomment wenn du Auto-Play willst (Browser erlauben es oft nicht)

      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') toggleTheme();

      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        // init UI
        navigate('shop');
      } else {
        navigate('login');
      }
    };
  </script>
</body>
</html>
