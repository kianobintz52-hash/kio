<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIOSHOP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Inter,sans-serif;background:#0a0a0a;color:#e8e4dc}
.hidden{display:none}

/* LOGIN */
.login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);z-index:1000
}
.login-box{
  width:320px;background:#111;padding:20px;border:1px solid #222
}
input{
  width:100%;margin:6px 0;padding:10px;background:#000;border:1px solid #333;color:#fff
}

/* LAYOUT */
nav{padding:16px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.products{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#111;border:1px solid #222;padding:12px;cursor:pointer}
button{background:#0051ff;color:#fff;border:none;padding:8px;cursor:pointer}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;z-index:999
}
.modal-box{
  width:420px;background:#111;padding:20px;border:1px solid #222
}
.small{font-size:.8rem;color:#aaa}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:.7rem;padding:4px 6px;border:1px solid #333;cursor:pointer}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="auth" class="login">
  <div class="login-box">
    <h3>KIOSHOP</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Passwort">
    <input id="username" placeholder="Username (nur Register)">

    <button onclick="signup()">Register</button>
    <button onclick="signin()">Login</button>

    <p id="authMsg" class="small"></p>
  </div>
</div>

<!-- NAV -->
<nav>
  <b>KIOSHOP</b>
  <button onclick="logout()">Logout</button>
</nav>

<!-- PRODUCTS -->
<div id="products" class="products"></div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="mTitle"></h3>
    <p id="mPrice"></p>

    <div class="row">
      <button onclick="likeProduct()">❤️ Like</button>
      <button onclick="saveProduct()">🔖 Save</button>
    </div>

    <div class="row">
      <input id="commentText" placeholder="Kommentar">
      <button onclick="addComment()">Send</button>
    </div>

    <div id="comments"></div>

    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
/* SUPABASE INIT */
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const sb = supabase.createClient(supabaseUrl, supabaseKey);

/* STATE */
let user = null;
let currentProduct = null;

/* AUTH */
async function signup(){
  const email = email.value;
  const password = password.value;
  const username = username.value;

  const { data, error } = await sb.auth.signUp({ email, password });

  if(data.user){
    await sb.from("profiles").insert({
      id: data.user.id,
      username
    });
    msg("Registered");
  }
}

async function signin(){
  const { data, error } = await sb.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if(data.user){
    user = data.user;
    document.getElementById("auth").classList.add("hidden");
    loadProducts();
  }
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* PRODUCTS */
async function loadProducts(){
  const { data } = await sb.from("products").select("*");
  const box = document.getElementById("products");

  box.innerHTML = data.map(p => `
    <div class="card" onclick='openProduct(${JSON.stringify(p)})'>
      <b>${p.title}</b>
      <p>€${p.price}</p>
    </div>
  `).join("");
}

/* MODAL */
function openProduct(p){
  currentProduct = p;

  mTitle.innerText = p.title;
  mPrice.innerText = "€" + p.price;

  modal.classList.remove("hidden");
  loadComments();
}

function closeModal(){
  modal.classList.add("hidden");
}

/* LIKE */
async function likeProduct(){
  await sb.from("likes").insert({
    user_id: user.id,
    product_id: currentProduct.id
  });
}

/* SAVE */
async function saveProduct(){
  await sb.from("wishlist").insert({
    user_id: user.id,
    product_id: currentProduct.id
  });
}

/* COMMENTS */
async function addComment(){
  await sb.from("comments").insert({
    user_id: user.id,
    product_id: currentProduct.id,
    text: commentText.value
  });

  commentText.value = "";
  loadComments();
}

async function loadComments(){
  const { data } = await sb
    .from("comments")
    .select("*")
    .eq("product_id", currentProduct.id);

  comments.innerHTML = data.map(c => `
    <p class="small">💬 ${c.text}</p>
  `).join("");
}

/* INIT */
sb.auth.getUser().then(res=>{
  if(res.data.user){
    user = res.data.user;
    document.getElementById("auth").classList.add("hidden");
    loadProducts();
  }
});
</script>

</body>
</html>
