<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Bio-Link</title>
    <style>
        /* Basis-Styling (Dunkler Look) */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Intro-Bildschirm (Click to Enter) */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.5s ease;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Haupt-Profilkarte */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 90%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        /* Profilbild */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
        }

        .bio {
            color: #b3b3b3;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Social Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .link-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro" onclick="startPage()">[ click to enter ]</div>

    <!-- Hintergrundmusik (Optional: Setze deine eigene URL ein) -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Hauptinhalt -->
    <div class="profile-card" id="profile">
        <!-- Ersetze den Platzhalter mit deinem Bild -->
        <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
        
        <h1>Dein Name</h1>
        <p class="bio">Hier steht deine kurze Beschreibung oder dein Spruch.</p>

        <div class="links">
            <a href="https://discord.com" target="_blank" class="link-btn">Discord</a>
            <a href="https://instagram.com" target="_blank" class="link-btn">Instagram</a>
            <a href="https://github.com" target="_blank" class="link-btn">GitHub</a>
        </div>
    </div>

    <script>
        function startPage() {
            // Intro ausblenden
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => intro.style.display = 'none', 500);

            // Musik abspielen
            const music = document.getElementById('bg-music');
            music.play().catch(error => console.log("Audio-Autoplay wurde blockiert: ", error));

            // Profilkarte anzeigen
            const profile = document.getElementById('profile');
            profile.style.opacity = '1';
            profile.style.transform = 'translateY(0)';
        }
    </script>
</body>
</html>
