<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deinname.lol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a0a0a, #1a0033);
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 20px;
      text-align: center;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #ff00ff;
      margin: 0 auto 20px;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
    }

    h1 {
      font-size: 2.8rem;
      margin: 10px 0;
      background: linear-gradient(to right, #ff00ff, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio {
      font-size: 1.1rem;
      opacity: 0.9;
      margin: 15px 0 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .link:hover {
      background: rgba(255, 0, 255, 0.2);
      border-color: #ff00ff;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(255, 0, 255, 0.3);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Dein Avatar (ändere die URL) -->
    <img src="https://i.imgur.com/deinbild.jpg" alt="Avatar" class="avatar">

    <h1>DeinName</h1>
    <p class="bio">irgendein cooler Spruch hier • 19 • Chaos Creator</p>

    <div class="links">
      <a href="https://discord.com" class="link" target="_blank">Discord</a>
      <a href="https://twitter.com" class="link" target="_blank">Twitter / X</a>
      <a href="https://instagram.com" class="link" target="_blank">Instagram</a>
      <a href="https://twitch.tv" class="link" target="_blank">Twitch</a>
      <a href="https://youtube.com" class="link" target="_blank">YouTube</a>
      <!-- Füge einfach mehr hinzu -->
    </div>

    <div class="footer">
      made with ❤️ on guns.lol style
    </div>
  </div>
</body>
</html>
