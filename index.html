<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KianOSINT - Free OSINT Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #0f0; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #0f0; text-shadow: 0 0 10px #0f0; }
    .container { max-width: 1100px; margin: auto; }
    .tab { overflow: hidden; background: #111; }
    .tab button { background: #222; color: #0f0; padding: 14px 20px; border: none; cursor: pointer; }
    .tab button:hover { background: #0f0; color: black; }
    .tabcontent { display: none; padding: 20px; background: #111; border: 1px solid #0f0; }
    input, button { padding: 12px; margin: 8px; font-size: 16px; }
    button { background: #0f0; color: black; border: none; cursor: pointer; }
    button:hover { background: #00cc00; }
    .result { background: #1a1a1a; padding: 15px; margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 KianOSINT - Free OSINT Tool</h1>
    <p style="text-align:center;">Ähnlich wie OathNet • Nur kostenlose APIs</p>

    <div class="tab">
      <button onclick="openTab(event, 'email')">Email Lookup</button>
      <button onclick="openTab(event, 'username')">Username Search</button>
      <button onclick="openTab(event, 'phone')">Phone Lookup</button>
      <button onclick="openTab(event, 'ip')">IP Lookup</button>
    </div>

    <!-- Email Tab -->
    <div id="email" class="tabcontent">
      <h2>Email OSINT</h2>
      <input type="text" id="emailInput" placeholder="beispiel@email.com" style="width:70%">
      <button onclick="searchEmail()">Suchen</button>
      <div id="emailResult" class="result"></div>
    </div>

    <!-- Username Tab -->
    <div id="username" class="tabcontent">
      <h2>Username OSINT</h2>
      <input type="text" id="userInput" placeholder="kianolegend" style="width:70%">
      <button onclick="searchUsername()">Suchen</button>
      <div id="userResult" class="result"></div>
    </div>

    <!-- Phone Tab -->
    <div id="phone" class="tabcontent">
      <h2>Phone Lookup</h2>
      <input type="text" id="phoneInput" placeholder="+49123456789" style="width:70%">
      <button onclick="searchPhone()">Suchen</button>
      <div id="phoneResult" class="result"></div>
    </div>

    <!-- IP Tab -->
    <div id="ip" class="tabcontent">
      <h2>IP Lookup</h2>
      <input type="text" id="ipInput" placeholder="8.8.8.8" style="width:70%">
      <button onclick="searchIP()">Suchen</button>
      <div id="ipResult" class="result"></div>
    </div>
  </div>

  <script>
    function openTab(evt, tabName) {
      document.querySelectorAll(".tabcontent").forEach(tab => tab.style.display = "none");
      document.getElementById(tabName).style.display = "block";
    }

    // Email Lookup (free APIs)
    async function searchEmail() {
      const email = document.getElementById("emailInput").value.trim();
      const result = document.getElementById("emailResult");
      result.innerHTML = "Suche läuft...";

      // Holebreach + Epieos Style
      try {
        // Beispiel: HaveIBeenPwned (public)
        const res = await fetch(`https://haveibeenpwned.com/api/v3/breachedaccount/${encodeURIComponent(email)}`, {
          headers: { "User-Agent": "KianOSINT" }
        });
        result.innerHTML = res.ok ? "✅ In bekannten Breaches gefunden!" : "Keine bekannten Breaches (oder Rate Limit).";
      } catch(e) {
        result.innerHTML = "Fehler bei der Suche (Rate Limit oder API down).";
      }
    }

    // Username Search (Sherlock Style - simple version)
    async function searchUsername() {
      const username = document.getElementById("userInput").value.trim();
      const result = document.getElementById("userResult");
      result.innerHTML = "Suche auf mehreren Plattformen... (Simulation)";

      setTimeout(() => {
        result.innerHTML = `
          <strong>Ergebnisse für <i>${username}</i>:</strong><br><br>
          • GitHub: <a href="https://github.com/${username}" target="_blank">Link</a><br>
          • Twitter/X: <a href="https://x.com/${username}" target="_blank">Link</a><br>
          • Instagram, TikTok, Discord etc. (manuell prüfen)
        `;
      }, 1200);
    }

    // Phone Lookup
    async function searchPhone() {
      const phone = document.getElementById("phoneInput").value.trim();
      const result = document.getElementById("phoneResult");
      result.innerHTML = "Phone Lookup wird vorbereitet...";
      
      // Hier könntest du z.B. numverify oder andere free APIs nutzen
      result.innerHTML = `Suche für ${phone} (kostenlose APIs limitiert).<br>Empfehlung: numverify.com oder truecaller (manuell).`;
    }

    // IP Lookup (free)
    async function searchIP() {
      const ip = document.getElementById("ipInput").value.trim() || "8.8.8.8";
      const result = document.getElementById("ipResult");
      
      try {
        const res = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await res.json();
        result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch(e) {
        result.innerHTML = "IP-API Fehler.";
      }
    }

    // Erstes Tab öffnen
    document.getElementById("email").style.display = "block";
  </script>
</body>
</html>
