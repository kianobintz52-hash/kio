<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>linkforge — eigene Bio-Link Seite</title>
<style>
:root{
  --bg-0:#0a0b10;
  --bg-1:#11131c;
  --panel:#161924;
  --panel-2:#1d2130;
  --line:#2a2f42;
  --text:#eef0fa;
  --text-dim:#9aa0bd;
  --accent:#7c5cff;
  --accent-2:#34e2c4;
  --danger:#ff5c7a;
  --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-0);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

#app{min-height:100vh;position:relative;}

/* ---------- top nav ---------- */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;border-bottom:1px solid var(--line);
  background:rgba(10,11,16,0.7);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50;
}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent);}
.nav-right{display:flex;gap:10px;align-items:center;}
.btn{
  padding:9px 18px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:14px;font-weight:500;
  transition:.15s;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#5a3fd6);
  border:none;color:#fff;font-weight:600;
}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;border:1px solid transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}

/* ---------- landing ---------- */
.landing-hero{
  max-width:920px;margin:0 auto;padding:110px 24px 60px;text-align:center;
  position:relative;
}
.landing-hero::before{
  content:'';position:absolute;top:-100px;left:50%;transform:translateX(-50%);
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle, rgba(124,92,255,0.18), transparent 70%);
  pointer-events:none;z-index:-1;
}
.eyebrow{
  font-family:var(--font-mono);font-size:12px;color:var(--accent-2);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px;
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;background:var(--panel);
}
.landing-hero h1{
  font-family:var(--font-display);font-size:clamp(34px,6vw,62px);
  font-weight:700;line-height:1.05;letter-spacing:-0.03em;margin:0 0 18px;
}
.landing-hero h1 span{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.landing-hero p{color:var(--text-dim);font-size:17px;max-width:560px;margin:0 auto 34px;line-height:1.6;}
.landing-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.landing-cta .btn{padding:13px 26px;font-size:15px;}

.feature-grid{
  max-width:1000px;margin:70px auto;padding:0 24px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;
}
.feature-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:22px;text-align:left;
}
.feature-card .icon{font-size:22px;margin-bottom:10px;}
.feature-card h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px;}
.feature-card p{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0;}

/* ---------- auth ---------- */
.auth-wrap{max-width:380px;margin:90px auto;padding:0 20px;}
.auth-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;
}
.auth-card h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;}
.auth-card .sub{color:var(--text-dim);font-size:13px;margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input{
  width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-1);color:var(--text);font-size:14px;outline:none;transition:.15s;
}
.field input:focus{border-color:var(--accent);}
.field-hint{font-size:11px;color:var(--text-dim);margin-top:5px;}
.auth-err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:0;}
.auth-switch{margin-top:18px;text-align:center;font-size:13px;color:var(--text-dim);}
.auth-switch a{color:var(--accent-2);font-weight:600;}

/* ---------- dashboard ---------- */
.dash{max-width:1100px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:340px 1fr;gap:24px;}
@media(max-width:860px){.dash{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;}
.panel h3{font-family:var(--font-display);font-size:15px;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
.panel h3 .tag{font-size:10px;background:var(--panel-2);color:var(--text-dim);padding:2px 8px;border-radius:6px;font-weight:500;font-family:var(--font-mono);}

.editor-col .field textarea{
  width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-1);color:var(--text);font-size:14px;resize:vertical;min-height:70px;outline:none;
}
.editor-col .field textarea:focus{border-color:var(--accent);}

.color-row{display:flex;gap:10px;align-items:center;}
.color-row input[type=color]{width:42px;height:38px;border-radius:8px;border:1px solid var(--line);background:none;padding:0;cursor:pointer;}
.color-row span{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}

.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;}
.swatch.active{border-color:#fff;}

.theme-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
.preset-btn{
  border-radius:10px;border:1px solid var(--line);padding:10px 6px;text-align:center;font-size:11px;
  color:var(--text-dim);background:var(--bg-1);
}
.preset-btn.active{border-color:var(--accent);color:var(--text);}
.preset-swatch{width:100%;height:24px;border-radius:6px;margin-bottom:6px;}

.links-list{display:flex;flex-direction:column;gap:10px;}
.link-row{
  display:flex;gap:8px;align-items:center;background:var(--bg-1);border:1px solid var(--line);
  border-radius:10px;padding:10px;
}
.link-row select, .link-row input{
  background:transparent;border:none;color:var(--text);font-size:13px;outline:none;
}
.link-row select{flex-shrink:0;width:110px;}
.link-row input{flex:1;min-width:0;}
.link-row .rm{color:var(--danger);background:none;border:none;font-size:16px;padding:2px 6px;flex-shrink:0;}
.add-link-btn{
  margin-top:10px;width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);
  background:transparent;color:var(--text-dim);font-size:13px;
}
.add-link-btn:hover{border-color:var(--accent);color:var(--text);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .label{font-size:13px;}
.toggle-row .label .d{display:block;font-size:11px;color:var(--text-dim);margin-top:2px;}
.switch{width:40px;height:22px;border-radius:99px;background:var(--bg-1);border:1px solid var(--line);position:relative;flex-shrink:0;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;}
.switch.on::after{left:20px;}

.save-bar{
  position:sticky;bottom:18px;display:flex;justify-content:space-between;align-items:center;
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;
}
.save-msg{font-size:12px;color:var(--accent-2);}

/* live preview phone */
.preview-col{position:sticky;top:90px;align-self:start;}
.phone{
  width:100%;max-width:300px;margin:0 auto;border-radius:28px;border:6px solid #000;
  background:#000;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,0.5);
}
.phone-inner{height:560px;overflow:hidden;position:relative;}
.preview-link{display:block;text-align:center;font-size:11px;color:var(--text-dim);margin-top:10px;}
.preview-link b{color:var(--accent-2);}

/* ---------- public profile ---------- */
.profile-page{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;padding:40px 16px;overflow:hidden;}
.profile-bg-layer{position:absolute;inset:0;z-index:0;}
.profile-card{
  position:relative;z-index:2;width:100%;max-width:380px;
  background:rgba(20,22,32,0.72);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);border-radius:22px;
  padding:34px 26px;text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
}
.p-avatar{
  width:92px;height:92px;border-radius:50%;margin:0 auto 14px;object-fit:cover;
  border:3px solid var(--p-accent,var(--accent));box-shadow:0 0 30px var(--p-accent,var(--accent));
  background:var(--panel-2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:30px;font-weight:700;
}
.p-name{font-family:var(--font-display);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
.p-badge{font-size:13px;}
.p-username{font-size:13px;color:var(--text-dim);margin-top:2px;font-family:var(--font-mono);}
.p-bio{font-size:13.5px;color:#d6d8ea;line-height:1.6;margin:14px 0 18px;white-space:pre-wrap;}
.p-links{display:flex;flex-direction:column;gap:10px;}
.p-link{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  font-size:13.5px;font-weight:500;transition:.15s;justify-content:center;
}
.p-link:hover{background:var(--p-accent,var(--accent));border-color:var(--p-accent,var(--accent));color:#fff;transform:translateY(-2px);}
.p-stats{margin-top:20px;display:flex;justify-content:center;gap:16px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
.p-music{
  margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:var(--text-dim);font-family:var(--font-mono);
}
.p-music .bars{display:flex;gap:2px;align-items:flex-end;height:12px;}
.p-music .bars span{width:2px;background:var(--p-accent,var(--accent));animation:eq 1s infinite ease-in-out;}
.p-music .bars span:nth-child(2){animation-delay:.2s;}
.p-music .bars span:nth-child(3){animation-delay:.4s;}
@keyframes eq{0%,100%{height:3px;}50%{height:12px;}}
.notfound{text-align:center;color:var(--text-dim);}
.claim-strip{
  margin-top:18px;text-align:center;font-size:11px;color:var(--text-dim);
  position:relative;z-index:2;
}
.claim-strip a{color:var(--accent-2);font-weight:600;}

/* particle bg canvas */
canvas.bgcanvas{position:absolute;inset:0;width:100%;height:100%;}

/* custom cursor */
.cursor-dot{position:fixed;width:18px;height:18px;border-radius:50%;border:2px solid var(--p-accent,var(--accent));pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s;mix-blend-mode:difference;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--accent);color:var(--text);
  padding:11px 20px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.muted-link{color:var(--text-dim);font-size:12px;}

/* ---------- splash / enter screen ---------- */
.splash{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:#05050a;cursor:pointer;flex-direction:column;gap:18px;
  animation:splashIn .4s ease;
}
@keyframes splashIn{from{opacity:0;}to{opacity:1;}}
.splash.hide{animation:splashOut .5s ease forwards;pointer-events:none;}
@keyframes splashOut{to{opacity:0;}}
.splash-ring{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--p-accent,var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  animation:pulseRing 1.8s infinite ease-in-out;box-shadow:0 0 30px var(--p-accent,var(--accent));
}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.08);opacity:.7;}}
.splash-text{font-family:var(--font-mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);}

/* ---------- password gate ---------- */
.gate-card{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;
  max-width:320px;width:100%;text-align:center;position:relative;z-index:2;
}
.gate-card h3{font-family:var(--font-display);margin:10px 0 4px;}
.gate-card p{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.gate-card input{
  width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-1);color:var(--text);font-size:14px;outline:none;margin-bottom:10px;text-align:center;
}
.gate-err{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:6px;}

/* ---------- avatar border styles ---------- */
.p-avatar.style-glow{box-shadow:0 0 40px var(--p-accent,var(--accent)),0 0 10px var(--p-accent,var(--accent));}
.p-avatar.style-square{border-radius:18px;}
.p-avatar.style-rotating{position:relative;}
.avatar-wrap{position:relative;width:92px;height:92px;margin:0 auto 14px;}
.avatar-ring-spin{
  position:absolute;inset:-6px;border-radius:50%;
  border:2px dashed var(--p-accent,var(--accent));
  animation:spin 6s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* ---------- badges row ---------- */
.p-badges-row{display:flex;gap:5px;justify-content:center;margin-top:4px;}
.p-badges-row .b{
  width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:12px;
}

/* ---------- typewriter ---------- */
.p-bio.typewriter{white-space:pre-wrap;border-right:2px solid var(--p-accent,var(--accent));display:inline-block;overflow:hidden;}

/* ---------- music player controls ---------- */
.p-music-bar{
  margin-top:16px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:9px 12px;
}
.p-music-bar .play-btn{
  width:28px;height:28px;border-radius:50%;background:var(--p-accent,var(--accent));border:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0;
}
.p-music-bar .meta{flex:1;text-align:left;min-width:0;}
.p-music-bar .meta .t{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-music-bar .bars{display:flex;gap:2px;align-items:flex-end;height:12px;flex-shrink:0;}
.p-music-bar .bars span{width:2px;background:var(--p-accent,var(--accent));animation:eq 1s infinite ease-in-out;}
.p-music-bar .bars.paused span{animation-play-state:paused;height:3px;}
.p-music-bar .bars span:nth-child(2){animation-delay:.2s;}
.p-music-bar .bars span:nth-child(3){animation-delay:.4s;}

/* ---------- cursor trail ---------- */
.trail-dot{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:9998;}

/* ---------- settings panel extra ---------- */
.layout-toggle{display:flex;gap:8px;}
.layout-opt{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg-1);
  text-align:center;font-size:11px;color:var(--text-dim);
}
.layout-opt.active{border-color:var(--accent);color:var(--text);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============== STORAGE HELPERS ============== */
async function sget(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sset(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
  catch(e){ console.error(e); return false; }
}
async function slist(prefix){
  try{ const r = await window.storage.list(prefix, true); return r ? r.keys : []; }
  catch(e){ return []; }
}

const USERS_KEY = "lf:users"; // { username: {passHash, createdAt} }
const PROFILE_PREFIX = "lf:profile:"; // lf:profile:username -> profile object
const SESSION_KEY = "lf_session"; // sessionStorage style but we use in-memory + a storage personal key fallback

let currentUser = null; // username currently logged in (client-side only, not persisted across reload by design choice -> we DO persist via personal storage)

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return 'h'+Math.abs(h)+str.length;
}

const THEME_PRESETS = [
  {name:"Violet", accent:"#7c5cff", bg:"#0a0b10", bg2:"#1d1230"},
  {name:"Mint", accent:"#34e2c4", bg:"#06120f", bg2:"#0d2a22"},
  {name:"Crimson", accent:"#ff5c7a", bg:"#150508", bg2:"#2a0a12"},
  {name:"Amber", accent:"#ffb648", bg:"#140d04", bg2:"#2a1a06"},
  {name:"Sky", accent:"#4fb6ff", bg:"#04111c", bg2:"#0a2436"},
  {name:"Mono", accent:"#e6e6e6", bg:"#0a0a0a", bg2:"#1a1a1a"},
];

const LINK_TYPES = [
  {k:"custom", label:"Custom", icon:"🔗"},
  {k:"discord", label:"Discord", icon:"🎮"},
  {k:"instagram", label:"Instagram", icon:"📸"},
  {k:"twitter", label:"X / Twitter", icon:"𝕏"},
  {k:"youtube", label:"YouTube", icon:"▶️"},
  {k:"tiktok", label:"TikTok", icon:"🎵"},
  {k:"twitch", label:"Twitch", icon:"🟣"},
  {k:"github", label:"GitHub", icon:"💻"},
  {k:"spotify", label:"Spotify", icon:"🎧"},
  {k:"telegram", label:"Telegram", icon:"✈️"},
  {k:"email", label:"E-Mail", icon:"✉️"},
  {k:"website", label:"Website", icon:"🌐"},
];

function defaultProfile(username){
  return {
    username,
    displayName: username,
    bio: "Willkommen auf meiner Seite ✦",
    avatarUrl: "",
    avatarEmoji: username.slice(0,1).toUpperCase(),
    avatarStyle: "glow", // glow | square | rotating | plain
    accent: "#7c5cff",
    bg: "#0a0b10",
    bg2: "#1d1230",
    font: "Space Grotesk",
    effect: "particles", // particles | grid | none
    cursor: true,
    cursorTrail: false,
    musicUrl: "",
    musicLabel: "",
    badges: ["✦"],
    typewriter: false,
    splash: false,
    pageTitle: "",
    seoDescription: "",
    profilePassword: "",
    links: [
      {type:"website", label:"Meine Seite", url:"https://example.com"}
    ],
    views: 0,
    uniqueVisitors: 0,
    createdAt: Date.now()
  };
}

/* ============== ROUTER ============== */
function getRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return {page:"landing"};
  if(h.startsWith("u/")) return {page:"profile", username: decodeURIComponent(h.slice(2))};
  if(h === "login") return {page:"login"};
  if(h === "register") return {page:"register"};
  if(h === "dashboard") return {page:"dashboard"};
  return {page:"landing"};
}
window.addEventListener("hashchange", render);

/* ============== APP STATE ============== */
let state = {
  loading:true,
  errorMsg:"",
  toast:null,
};

function showToast(msg){
  state.toast = msg;
  renderToastOnly();
  setTimeout(()=>{ state.toast=null; renderToastOnly(); }, 2400);
}
function renderToastOnly(){
  let el = document.getElementById("toast-el");
  if(el) el.remove();
  if(state.toast){
    const t = document.createElement("div");
    t.id="toast-el"; t.className="toast"; t.textContent=state.toast;
    document.body.appendChild(t);
  }
}

/* session: try to remember logged-in user via personal (non-shared) storage */
async function loadSession(){
  try{
    const r = await window.storage.get("lf_session_user", false);
    if(r) currentUser = JSON.parse(r.value);
  }catch(e){ currentUser = null; }
}
async function saveSession(username){
  currentUser = username;
  try{ await window.storage.set("lf_session_user", JSON.stringify(username), false); }catch(e){}
}
async function clearSession(){
  currentUser = null;
  try{ await window.storage.delete("lf_session_user", false); }catch(e){}
}

/* ============== AUTH ============== */
async function registerUser(username, password){
  username = username.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return {ok:false, msg:"Nutzername: 3-20 Zeichen, nur a-z 0-9 _"};
  if(password.length < 4) return {ok:false, msg:"Passwort braucht mind. 4 Zeichen"};
  let users = await sget(USERS_KEY) || {};
  if(users[username]) return {ok:false, msg:"Nutzername bereits vergeben"};
  users[username] = {passHash: simpleHash(password), createdAt: Date.now()};
  const ok = await sset(USERS_KEY, users);
  if(!ok) return {ok:false, msg:"Speichern fehlgeschlagen, versuch's nochmal"};
  await sset(PROFILE_PREFIX+username, defaultProfile(username));
  await saveSession(username);
  return {ok:true};
}
async function loginUser(username, password){
  username = username.trim().toLowerCase();
  let users = await sget(USERS_KEY) || {};
  const u = users[username];
  if(!u || u.passHash !== simpleHash(password)) return {ok:false, msg:"Login falsch"};
  await saveSession(username);
  return {ok:true};
}

/* ============== RENDER ROOT ============== */
async function render(){
  const root = document.getElementById("app");
  const route = getRoute();

  if(route.page === "landing") return renderLanding(root);
  if(route.page === "login") return renderAuth(root, "login");
  if(route.page === "register") return renderAuth(root, "register");
  if(route.page === "dashboard"){
    if(!currentUser){ location.hash = "#/login"; return; }
    return renderDashboard(root);
  }
  if(route.page === "profile") return renderProfile(root, route.username);
}

/* ---------- PUBLIC PROFILE ---------- */
async function renderProfile(root, username){
  username = (username||"").trim().toLowerCase();
  root.innerHTML = `<div class="profile-page"><div class="notfound">Lade...</div></div>`;
  const profile = await sget(PROFILE_PREFIX + username);
  if(!profile){
    root.innerHTML = `
      <div class="profile-page">
        <div class="notfound">
          <h2 style="font-family:var(--font-display);">Seite nicht gefunden</h2>
          <p>@${esc(username)} existiert nicht.</p>
          <a class="btn btn-primary" href="#/">Zur Startseite</a>
        </div>
      </div>`;
    return;
  }

  document.title = profile.pageTitle || (profile.displayName + " — linkforge");
  let metaDesc = document.querySelector('meta[name="description"]');
  if(!metaDesc){ metaDesc = document.createElement("meta"); metaDesc.name="description"; document.head.appendChild(metaDesc); }
  metaDesc.content = profile.seoDescription || profile.bio || "";

  // password gate
  if(profile.profilePassword){
    root.innerHTML = `
      <div class="profile-page" style="background:radial-gradient(circle at 30% 20%, ${profile.bg2}, ${profile.bg} 60%)">
        <div class="gate-card" style="--p-accent:${profile.accent}">
          <div style="font-size:26px;">🔒</div>
          <h3>Geschützte Seite</h3>
          <p>@${esc(username)} hat diese Seite mit einem Passwort geschützt.</p>
          <input id="gate-pw" type="password" placeholder="Passwort eingeben">
          <div class="gate-err" id="gate-err"></div>
          <button class="btn btn-primary" id="gate-submit" style="width:100%;padding:11px;">Seite betreten</button>
        </div>
      </div>`;
    document.getElementById("gate-submit").onclick = ()=>{
      const val = document.getElementById("gate-pw").value;
      if(val === profile.profilePassword){ showProfileContent(root, profile, username); }
      else document.getElementById("gate-err").textContent = "Falsches Passwort";
    };
    document.getElementById("gate-pw").onkeydown = (e)=>{ if(e.key==="Enter") document.getElementById("gate-submit").click(); };
    return;
  }

  showProfileContent(root, profile, username);
}

function showProfileContent(root, profile, username){
  profile.views = (profile.views||0) + 1;
  sset(PROFILE_PREFIX + username, profile); // fire and forget view count

  const buildPage = ()=>{
    root.innerHTML = `
      <div class="profile-page" id="profile-page-root">
        <div class="profile-bg-layer" id="bg-layer"></div>
        <div style="position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;">
          <div class="profile-card">${profileInnerHtml(profile,false)}</div>
          <div class="claim-strip">erstellt mit <a href="#/">linkforge</a></div>
        </div>
      </div>
    `;
    const pageRoot = document.getElementById("profile-page-root");
    mountProfileEffects(pageRoot, profile, false, document.getElementById("bg-layer"));
    mountTypewriter(pageRoot, profile);
    mountMusicPlayer(pageRoot);
    if(profile.cursorTrail) mountCursorTrail(profile.accent);
  };

  if(profile.splash){
    root.innerHTML = `
      <div class="splash" id="splash-el" style="--p-accent:${profile.accent}">
        <div class="splash-ring">✦</div>
        <div class="splash-text">klicken zum betreten</div>
      </div>
    `;
    document.getElementById("splash-el").onclick = ()=>{
      const s = document.getElementById("splash-el");
      s.classList.add("hide");
      setTimeout(buildPage, 350);
    };
  } else {
    buildPage();
  }
}

function mountCursorTrail(color){
  let last = 0;
  const move = (e)=>{
    const now = Date.now();
    if(now - last < 35) return;
    last = now;
    const dot = document.createElement("div");
    dot.className = "trail-dot";
    dot.style.background = color;
    dot.style.left = e.clientX + "px";
    dot.style.top = e.clientY + "px";
    document.body.appendChild(dot);
    let op = 0.8, sz = 6;
    const fade = setInterval(()=>{
      op -= 0.08; sz += 0.6;
      dot.style.opacity = op;
      dot.style.width = sz+"px"; dot.style.height = sz+"px";
      if(op <= 0){ clearInterval(fade); dot.remove(); }
    }, 30);
  };
  document.addEventListener("mousemove", move);
}

function profileInnerHtml(p, isPreview){
  const style = p.avatarStyle || "glow";
  let avatarInner = p.avatarUrl
    ? `<img class="p-avatar style-${style==='rotating'?'plain':style}" src="${esc(p.avatarUrl)}" style="--p-accent:${p.accent};width:100%;height:100%;" onerror="this.style.display='none'">`
    : `<div class="p-avatar style-${style==='rotating'?'plain':style}" style="--p-accent:${p.accent};width:100%;height:100%;">${esc(p.avatarEmoji||p.username.slice(0,1).toUpperCase())}</div>`;
  const avatarHtml = style === "rotating"
    ? `<div class="avatar-wrap"><div class="avatar-ring-spin" style="--p-accent:${p.accent}"></div>${avatarInner}</div>`
    : `<div class="avatar-wrap">${avatarInner}</div>`;

  const linksHtml = (p.links||[]).map(lk=>{
    const t = LINK_TYPES.find(t=>t.k===lk.type) || LINK_TYPES[0];
    return `<a class="p-link" style="--p-accent:${p.accent}" href="${esc(lk.url||'#')}" target="${isPreview?'_self':'_blank'}" rel="noopener">${t.icon} ${esc(lk.label||t.label)}</a>`;
  }).join("");

  const badgesHtml = (p.badges && p.badges.length)
    ? `<div class="p-badges-row">${p.badges.slice(0,5).map(b=>`<span class="b">${esc(b)}</span>`).join("")}</div>` : "";

  const bioId = "bio-" + Math.random().toString(36).slice(2,8);
  const bioHtml = `<div class="p-bio ${p.typewriter?'typewriter':''}" id="${bioId}" data-full="${esc(p.bio||'')}">${p.typewriter ? '' : esc(p.bio||'')}</div>`;

  const musicHtml = p.musicUrl ? `
    <div class="p-music-bar" style="--p-accent:${p.accent}">
      <button class="play-btn" id="music-toggle-btn">▶</button>
      <div class="meta"><div class="t">${esc(p.musicLabel || "Hintergrundmusik")}</div></div>
      <div class="bars paused" id="music-bars"><span></span><span></span><span></span></div>
    </div>
    <audio id="bg-audio" loop style="display:none">
      <source src="${esc(p.musicUrl)}">
    </audio>
  ` : "";

  return `
    <div style="font-family:'${p.font||'Space Grotesk'}', sans-serif;">
      ${avatarHtml}
      <div class="p-name">${esc(p.displayName||p.username)}</div>
      ${badgesHtml}
      <div class="p-username">@${esc(p.username)}</div>
      ${bioHtml}
      <div class="p-links">${linksHtml}</div>
      <div class="p-stats"><span>👁 ${p.views||0} aufrufe</span><span>· seit ${new Date(p.createdAt||Date.now()).getFullYear()}</span></div>
      ${musicHtml}
    </div>
  `;
}

function mountTypewriter(containerEl, p){
  if(!p.typewriter) return;
  const el = containerEl.querySelector(".p-bio.typewriter");
  if(!el) return;
  const full = el.dataset.full || "";
  let i = 0;
  el.textContent = "";
  clearInterval(el._twTimer);
  el._twTimer = setInterval(()=>{
    i++;
    el.textContent = full.slice(0,i);
    if(i >= full.length) clearInterval(el._twTimer);
  }, 35);
}

function mountMusicPlayer(containerEl){
  const audio = containerEl.querySelector("#bg-audio");
  const btn = containerEl.querySelector("#music-toggle-btn");
  const bars = containerEl.querySelector("#music-bars");
  if(!audio || !btn) return;
  let playing = false;
  btn.onclick = ()=>{
    if(playing){ audio.pause(); btn.textContent="▶"; bars.classList.add("paused"); }
    else { audio.play().catch(()=>{}); btn.textContent="❚❚"; bars.classList.remove("paused"); }
    playing = !playing;
  };
}

function mountProfileEffects(containerEl, p, isPreview, bgLayerEl){
  // set CSS background gradient on the page/preview container
  const target = isPreview ? containerEl : containerEl;
  target.style.background = `radial-gradient(circle at 30% 20%, ${p.bg2}, ${p.bg} 60%)`;

  // particles / grid canvas
  const layer = bgLayerEl || (()=>{
    let l = containerEl.querySelector(".profile-bg-layer");
    if(!l){ l = document.createElement("div"); l.className="profile-bg-layer"; containerEl.prepend(l); }
    return l;
  })();
  layer.innerHTML = "";
  if(p.effect === "particles"){
    mountParticles(layer, p.accent, isPreview);
  } else if(p.effect === "grid"){
    mountGrid(layer, p.accent);
  }

  // custom cursor (skip in small preview to avoid weirdness)
  if(!isPreview && p.cursor){
    let dot = document.getElementById("custom-cursor-dot");
    if(!dot){ dot = document.createElement("div"); dot.id="custom-cursor-dot"; dot.className="cursor-dot"; document.body.appendChild(dot); }
    dot.style.setProperty("--p-accent", p.accent);
    dot.style.borderColor = p.accent;
    const move = (e)=>{ dot.style.left = e.clientX+"px"; dot.style.top = e.clientY+"px"; };
    document.addEventListener("mousemove", move);
    containerEl._cursorCleanup = ()=> document.removeEventListener("mousemove", move);
  } else {
    const existing = document.getElementById("custom-cursor-dot");
    if(existing) existing.remove();
  }
}

function mountParticles(layer, color, isPreview){
  const canvas = document.createElement("canvas");
  canvas.className = "bgcanvas";
  layer.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = layer.clientWidth; canvas.height = layer.clientHeight; }
  resize();
  window.addEventListener("resize", resize);
  const count = isPreview ? 24 : 55;
  const pts = Array.from({length:count}, ()=>({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, r: Math.random()*1.8+0.6
  }));
  let raf;
  function tick(){
    if(!layer.isConnected){ cancelAnimationFrame(raf); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = color;
    pts.forEach(pt=>{
      pt.x+=pt.vx; pt.y+=pt.vy;
      if(pt.x<0||pt.x>canvas.width) pt.vx*=-1;
      if(pt.y<0||pt.y>canvas.height) pt.vy*=-1;
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill();
    });
    raf = requestAnimationFrame(tick);
  }
  tick();
}
function mountGrid(layer, color){
  const canvas = document.createElement("canvas");
  canvas.className = "bgcanvas";
  layer.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = layer.clientWidth; canvas.height = layer.clientHeight; }
  resize();
  window.addEventListener("resize", resize);
  let offset = 0, raf;
  function tick(){
    if(!layer.isConnected){ cancelAnimationFrame(raf); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = color; ctx.globalAlpha = 0.18; ctx.lineWidth = 1;
    const gap = 36;
    offset = (offset+0.15) % gap;
    for(let x = -gap+offset; x<canvas.width; x+=gap){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    for(let y = -gap+offset; y<canvas.height; y+=gap){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }
    raf = requestAnimationFrame(tick);
  }
  tick();
}

function esc(s){
  return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============== INIT ============== */
(async function init(){
  await loadSession();
  await render();
})();

})();
</script>
