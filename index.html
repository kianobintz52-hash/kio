<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt Marketplace Bot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #36393f; color: #dcddde; }
        .container { max-width: 800px; margin: auto; }
        input, button, select { padding: 10px; margin: 5px; background: #40444b; color: white; border: none; border-radius: 4px; }
        button { background: #7289da; cursor: pointer; }
        button:hover { background: #5b6bbe; }
        .product { background: #2f3136; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .owner-controls { background: #f04747; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Produkt Marketplace Bot - Verbesserte Version</h1>
        
        <h2>Produkt hinzufügen / Verwalten (als Owner)</h2>
        <input type="text" id="name" placeholder="Produktname">
        <input type="text" id="price" placeholder="Preis">
        <input type="text" id="description" placeholder="Beschreibung">
        <input type="text" id="image" placeholder="Bild-URL (optional)">
        <button onclick="addProduct()">Produkt hinzufügen</button>

        <h2>Meine Produkte / Alle Produkte (Owner sieht alles)</h2>
        <div id="products"></div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let isOwner = true; // Im Bot später über User ID prüfen
        let currentUser = "DeinDiscordName#1234"; // Im Bot: message.author.tag

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
            renderProducts();
        }

        function addProduct() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const description = document.getElementById('description').value;
            const image = document.getElementById('image').value;

            if (!name || !price) return alert("Name und Preis erforderlich!");

            products.push({
                id: Date.now(),
                name,
                price,
                description,
                image: image || null,
                seller: currentUser,
                sold: false
            });

            saveProducts();
            clearInputs();
        }

        function deleteProduct(id) {
            if (!isOwner) {
                const product = products.find(p => p.id === id);
                if (product.seller !== currentUser) {
                    return alert("Du darfst nur deine eigenen Produkte löschen!");
                }
            }
            products = products.filter(p => p.id !== id);
            saveProducts();
        }

        function markAsSold(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.sold = true;
                // Bei Verkauf: Bild-URL entfernen und nur Discord-Name anzeigen
                product.image = null;
                saveProducts();
                alert(`Produkt "${product.name}" als verkauft markiert. Kontakt: ${product.seller}`);
            }
        }

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '';

            products.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <h3>${product.name} - ${product.price}€</h3>
                    <p>${product.description || 'Keine Beschreibung'}</p>
                    ${product.image ? `<img src="${product.image}" width="150" style="border-radius:4px;">` : ''}
                    <p><strong>Verkäufer:</strong> ${product.seller}</p>
                    ${product.sold ? '<span style="color:#43b581;">✓ Verkauft</span>' : ''}
                    <br>
                    <button onclick="markAsSold(${product.id})">Als verkauft markieren</button>
                    <button onclick="deleteProduct(${product.id})" style="background:#f04747;">Löschen</button>
                `;
                container.appendChild(div);
            });
        }

        function clearInputs() {
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('description').value = '';
            document.getElementById('image').value = '';
        }

        // Initial render
        renderProducts();
    </script>
</body>
</html>
