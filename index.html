<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Discord Webhook Sender</title>
</head>
<body>

    <h3>Discord Webhook Nachricht senden</h3>
    <input type="text" id="webhookUrl" placeholder="Webhook URL einfügen" style="width: 300px;"><br>
    <textarea id="messageContent" placeholder="Deine Nachricht..."></textarea><br>
    <button onclick="sendWebhook()">Nachricht senden</button>

    <script>
        async function sendWebhook() {
            const url = document.getElementById('webhookUrl').value;
            const content = document.getElementById('messageContent').value;

            const payload = {
                content: content,
                username: "Mein Webhook Tool"
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Nachricht erfolgreich gesendet!");
                } else {
                    alert("Fehler: Konnte Nachricht nicht senden.");
                }
            } catch (error) {
                console.error("Fehler:", error);
            }
        }
    </script>
</body>
</html>
