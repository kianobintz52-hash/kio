<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepcallen Discord Clone</title>
    <style>
        /* DISCORD FARBEN & BASICS */
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-user: #232428;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --blurple: #5865f2;
            --green: #23a559;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        body { display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-chat); color: var(--text-main); }

        /* SERVER LISTE (GANZ LINKS) */
        .server-list {
            width: 72px;
            background-color: var(--bg-darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-chat);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: var(--green);
        }

        .server-icon:hover {
            border-radius: 15px;
            background-color: var(--blurple);
            color: white;
        }

        .divider {
            width: 32px;
            height: 2px;
            background-color: #35363c;
            margin: 4px 0;
        }

        /* CHANNELS SIDEBAR */
        .channels {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            color: white;
        }

        .channel-list {
            flex: 1;
            padding: 16px 8px;
            overflow-y: auto;
        }

        .channel-category {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 8px;
        }

        .channel-item {
            padding: 6px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .channel-item:hover {
            background-color: #35373c;
            color: var(--text-main);
        }

        .channel-item span { margin-left: 6px; font-size: 15px; }

        /* USER PROFILE BAR */
        .user-bar {
            height: 52px;
            background-color: var(--bg-user);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: var(--blurple);
            border-radius: 50%;
        }

        .user-info { flex: 1; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-tag { font-size: 11px; color: var(--text-muted); }

        /* CHAT BEREICH */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; gap: 16px; }
        .msg-avatar { width: 40px; height: 40px; background-color: #444; border-radius: 50%; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-user { font-weight: bold; color: white; font-size: 15px; margin-right: 8px; }
        .msg-time { font-size: 11px; color: var(--text-muted); }
        .msg-text { margin-top: 4px; line-height: 1.4; }

        /* INPUT AREA */
        .chat-input-area { padding: 0 16px 24px 16px; }
        .chat-input-wrapper {
            background-color: #383a40;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
        }

        .chat-input-wrapper input {
            background: none;
            border: none;
            color: var(--text-main);
            width: 100%;
            outline: none;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR 1: SERVERS -->
    <div class="server-list">
        <div class="server-icon" style="background-color: var(--blurple); color: white; border-radius: 15px;">SC</div>
        <div class="divider"></div>
        <div class="server-icon">A</div>
        <div class="server-icon">B</div>
        <div class="server-icon">+</div>
    </div>

    <!-- SIDEBAR 2: CHANNELS -->
    <div class="channels">
        <div class="server-header">Sleepcallen Server</div>
        
        <div class="channel-list">
            <div class="channel-category">Text-Kanäle</div>
            <div class="channel-item"># <span>allgemein</span></div>
            <div class="channel-item" style="background-color: #35373c; color: white;"># <span>og-hunter</span></div>
            <div class="channel-item"># <span>pc-optimizer</span></div>
            
            <div class="channel-category" style="margin-top: 20px;">Sprach-Kanäle</div>
            <div class="channel-item">🔊 <span>Lounge</span></div>
            <div class="channel-item">🔊 <span>Gaming</span></div>
        </div>

        <div class="user-bar">
            <div class="avatar"></div>
            <div class="user-info">
                <div class="user-name">Sleepcallen</div>
                <div class="user-tag">#0001</div>
            </div>
            <div style="font-size: 18px; cursor: pointer; color: var(--text-muted);">⚙️</div>
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-container">
        <div class="chat-header"># og-hunter</div>
        
        <div class="chat-messages" id="chatLines">
            <div class="message">
                <div class="msg-avatar" style="background-color: #ff4500;"></div>
                <div class="msg-content">
                    <div><span class="msg-user">System</span><span class="msg-time">Heute um 14:00</span></div>
                    <div class="msg-text">Willkommen in der Void-Edition. Nutze den Generator um 3L Namen zu finden.</div>
                </div>
            </div>
            <!-- Hier kommen neue Nachrichten rein -->
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Nachricht an #og-hunter">
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('chatInput');
        const chatLines = document.getElementById('chatLines');

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && input.value !== "") {
                const newMsg = `
                    <div class="message">
                        <div class="msg-avatar" style="background-color: #5865f2;"></div>
                        <div class="msg-content">
                            <div><span class="msg-user">Sleepcallen</span><span class="msg-time">Gerade eben</span></div>
                            <div class="msg-text">${input.value}</div>
                        </div>
                    </div>
                `;
                chatLines.innerHTML += newMsg;
                input.value = "";
                chatLines.scrollTop = chatLines.scrollHeight;
            }
        });
    </script>
</body>
</html>
