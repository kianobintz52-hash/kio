<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .sidebar-active { background-color: #6b21a8; color: white; }
    .accent { color: var(--accent-color, #c026d3); }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navBtn">Anmelden</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 md:p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex flex-col md:flex-row h-screen pt-16">
      <!-- SIDEBAR -->
      <div class="w-full md:w-72 bg-[#0f0a23] border-b md:border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(0)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="switchTab(1)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">✏️ Profil bearbeiten</a>
          <a href="#" onclick="switchTab(2)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links</a>
          <a href="#" onclick="showMyPublicProfile()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-8 overflow-y-auto">
        <div id="mainContent">

          <!-- TAB 0 Konto -->
          <div id="tab0">
            <h1 class="text-4xl font-bold">Mein Konto</h1>
            <div class="mt-8 flex gap-8 items-center">
              <img id="profilePicBig" class="w-32 h-32 rounded-3xl object-cover border-4 border-purple-500">
              <div>
                <h2 id="dashName" class="text-4xl font-bold"></h2>
                <p id="dashUsername" class="text-purple-400 text-2xl"></p>
              </div>
            </div>
          </div>

          <!-- TAB 1 PROFIL BEARBEITEN -->
          <div id="tab1" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Profil bearbeiten</h2>
            <div class="max-w-2xl space-y-8">
              <div>
                <label class="block text-sm mb-2">Anzeigename</label>
                <input id="editName" class="w-full bg-zinc-800 p-4 rounded-2xl">
              </div>
              <div>
                <label class="block text-sm mb-2">Bio</label>
                <textarea id="editBio" rows="4" class="w-full bg-zinc-800 p-4 rounded-2xl"></textarea>
              </div>
              <div>
                <label class="block text-sm mb-2">Akzentfarbe</label>
                <input type="color" id="editAccent" value="#c026d3" class="w-20 h-12">
              </div>
              <div>
                <label class="block text-sm mb-2">Profilbild</label>
                <input type="file" id="picUpload" accept="image/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadProfilePic(event)">
              </div>
              <div>
                <label class="block text-sm mb-2">Banner (Bild oder Video)</label>
                <input type="file" id="bannerUpload" accept="image/*,video/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadBanner(event)">
              </div>
              <div>
                <label class="block text-sm mb-2">Hintergrund (Bild oder Video)</label>
                <input type="file" id="bgUpload" accept="image/*,video/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadBackground(event)">
              </div>
              <div>
                <label class="block text-sm mb-2">Musik (MP3)</label>
                <input type="file" id="musicUpload" accept="audio/mp3,audio/mpeg" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadMusic(event)">
              </div>
              <button onclick="saveProfileChanges()" class="w-full bg-purple-600 hover:bg-purple-700 py-5 rounded-3xl font-semibold text-lg">
                Alles speichern
              </button>
            </div>
          </div>

          <!-- TAB 2 Links -->
          <div id="tab2" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Links verwalten</h2>
            <div class="bg-zinc-900 p-6 rounded-3xl">
              <input id="newLinkTitle" placeholder="Titel" class="w-full bg-zinc-800 p-4 rounded-2xl mb-3">
              <input id="newLinkUrl" placeholder="https://" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
              <button onclick="addLink()" class="bg-purple-600 hover:bg-purple-700 px-8 py-4 rounded-2xl">+ Link hinzufügen</button>
            </div>
            <div id="linksList" class="mt-8 space-y-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PUBLIC PROFILE -->
  <div id="publicProfilePage" class="hidden min-h-screen bg-zinc-950">
    <div id="publicBackground" class="fixed inset-0 z-[-2] bg-cover bg-center"></div>
    <div class="max-w-4xl mx-auto bg-zinc-900/90 backdrop-blur-md rounded-3xl overflow-hidden mt-8 border border-purple-500/30">
      <div class="relative h-64" id="publicBannerContainer"></div>
      <div class="flex justify-center -mt-20 relative z-10">
        <img id="publicProfilePic" class="w-44 h-44 rounded-3xl object-cover border-4 border-zinc-900">
      </div>
      <div class="text-center px-8 pt-6 pb-12">
        <h1 id="publicName" class="text-5xl font-bold accent"></h1>
        <p id="publicUsername" class="text-purple-400 text-2xl"></p>
        <p id="publicBio" class="mt-8 text-zinc-300 max-w-2xl mx-auto"></p>
        <div id="publicLinks" class="mt-12 space-y-4 max-w-2xl mx-auto"></div>
        <audio id="publicMusic" controls class="mt-12 w-full max-w-md mx-auto"></audio>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};

    // Owner Account
    if (!users["u3271805041@gmail.com"]) {
      users["u3271805041@gmail.com"] = {
        email: "u3271805041@gmail.com",
        username: "k",
        displayName: "k",
        password: "666666",
        bio: "Owner von kiobio.lol 🔥",
        accentColor: "#c026d3",
        profilePic: "https://i.pravatar.cc/300",
        banner: "https://picsum.photos/id/1015/1200/400",
        bannerType: "image",
        background: "",
        backgroundType: "",
        music: "",
        links: []
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
    }

    const CODE = "666";

    function showModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    function showRegisterModal() {
      showModal("Registrieren", `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="startRegister()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Weiter</button>
      `);
    }

    function startRegister() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !username || !password) return alert("Alle Felder ausfüllen!");
      if (Object.values(users).some(u => u.email === email || u.username === username)) return alert("E-Mail oder Username bereits vergeben!");

      showModal("Verifizierung", `
        <p class="text-center">Demo-Code: <strong>666</strong></p>
        <input id="vcode" maxlength="3" class="w-full bg-zinc-800 p-6 rounded-2xl text-4xl text-center" placeholder="666">
        <button onclick="finishRegister()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Bestätigen</button>
      `);
    }

    function finishRegister() {
      if (document.getElementById('vcode').value === CODE) {
        alert("✅ Registrierung erfolgreich! Bitte melde dich jetzt an.");
        closeModal();
      }
    }

    function showLoginModal() {
      showModal("Anmelden", `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="loginPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="doLogin()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Anmelden</button>
      `);
    }

    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const user = users[email];

      if (user && user.password === pass) {
        currentUser = user;
        localStorage.setItem('currentUserEmail', email);
        closeModal();
        showDashboard();
      } else {
        alert("❌ Falsche E-Mail oder Passwort!");
      }
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";
      document.getElementById('navBtn').onclick = logout;
      switchTab(1);
    }

    function logout() {
      localStorage.removeItem('currentUserEmail');
      location.reload();
    }

    function switchTab(n) {
      document.querySelectorAll('#mainContent > div').forEach(d => d.classList.add('hidden'));
      document.getElementById('tab' + n).classList.remove('hidden');
    }

    // Upload Funktionen
    function uploadProfilePic(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { currentUser.profilePic = ev.target.result; };
      reader.readAsDataURL(file);
    }

    function uploadBanner(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentUser.banner = ev.target.result;
        currentUser.bannerType = file.type.startsWith('video') ? "video" : "image";
      };
      reader.readAsDataURL(file);
    }

    function uploadBackground(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentUser.background = ev.target.result;
        currentUser.backgroundType = file.type.startsWith('video') ? "video" : "image";
      };
      reader.readAsDataURL(file);
    }

    function uploadMusic(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentUser.music = ev.target.result;
        alert("✅ Musik hochgeladen!");
      };
      reader.readAsDataURL(file);
    }

    function saveProfileChanges() {
      currentUser.displayName = document.getElementById('editName').value || currentUser.username;
      currentUser.bio = document.getElementById('editBio').value;
      currentUser.accentColor = document.getElementById('editAccent').value;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      alert("✅ Alle Änderungen gespeichert!");
    }

    function showMyPublicProfile() {
      if (currentUser) window.location.href = `/@${currentUser.username}`;
    }

    function showPublicProfileFor(user) {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('publicProfilePage').classList.remove('hidden');

      document.getElementById('publicName').textContent = user.displayName || user.username;
      document.getElementById('publicUsername').textContent = '@' + user.username;
      document.getElementById('publicBio').textContent = user.bio || "Keine Bio...";
      document.getElementById('publicProfilePic').src = user.profilePic;

      // Banner
      const bannerContainer = document.getElementById('publicBannerContainer');
      bannerContainer.innerHTML = user.bannerType === "video" 
        ? `<video autoplay loop muted class="w-full h-full object-cover"><source src="${user.banner}"></video>`
        : `<img src="${user.banner}" class="w-full h-full object-cover">`;

      // Musik
      const audio = document.getElementById('publicMusic');
      if (user.music) audio.src = user.music;
    }

    window.onload = () => {
      const savedEmail = localStorage.getItem('currentUserEmail');
      if (savedEmail && users[savedEmail]) {
        currentUser = users[savedEmail];
        showDashboard();
      }

      // Public Profile Routing
      const match = window.location.pathname.match(/@(.+)/);
      if (match) {
        const username = match[1];
        const user = Object.values(users).find(u => u.username === username);
        if (user) showPublicProfileFor(user);
      }
    };
  </script>
</body>
</html>
