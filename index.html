<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1f2937; }
    .nav-active { background-color: #6b46c1; color: white; }
    .modal { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 bg-black border-r border-zinc-800 flex flex-col">
      <div class="p-5 flex items-center gap-3 border-b border-zinc-800">
        <div class="w-9 h-9 bg-violet-600 rounded-xl flex items-center justify-center text-2xl">🔫</div>
        <span class="font-bold text-3xl">kiobio.lol</span>
      </div>

      <nav class="flex-1 px-3 pt-6 space-y-1">
        <a onclick="switchTab(0)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-user"></i> Konto
        </a>
        <a onclick="switchTab(1)" class="nav-active flex items-center gap-3 px-5 py-3 rounded-2xl cursor-pointer" id="nav-1">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Anpassen
        </a>
        <a onclick="switchTab(2)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-link"></i> Links
        </a>
        <a onclick="switchTab(3)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-gem"></i> Premium
        </a>
        <a onclick="switchTab(4)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-layer-group"></i> Vorlagen
        </a>
      </nav>
    </div>

    <!-- Hauptbereich -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-black border-b border-zinc-800 p-5">
        <h1 class="text-2xl font-bold" id="page-title">Anpassen</h1>
      </div>
      <div class="flex-1 overflow-auto p-8" id="content"></div>
    </div>
  </div>

  <!-- Profil Vorschau Modal (wie andere es sehen) -->
  <div id="profileModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="modal bg-zinc-900 w-full max-w-md mx-4 rounded-3xl overflow-hidden border border-violet-500/30">
      <div class="p-4 border-b border-zinc-700 flex justify-between items-center">
        <h3 class="font-semibold">So sehen andere dein Profil</h3>
        <button onclick="closeModal()" class="text-3xl text-zinc-400 hover:text-white">×</button>
      </div>

      <!-- Fancy Profile Preview -->
      <div class="relative h-64 bg-gradient-to-br from-violet-900 to-black">
        <div class="absolute -bottom-12 left-1/2 -translate-x-1/2 w-28 h-28 border-4 border-zinc-900 rounded-2xl overflow-hidden">
          <img src="https://picsum.photos/id/64/300/300" class="w-full h-full object-cover">
        </div>
      </div>

      <div class="pt-16 pb-8 px-8 text-center">
        <h2 class="text-4xl font-bold text-white">alo</h2>
        <p class="text-violet-400">kiobio.lol/alo</p>
        
        <div class="mt-6 text-zinc-300 text-left">
          das ist meine Beschreibung<br>
          Kreativer Mensch • Anime & Gaming Fan
        </div>

        <div class="mt-8 flex gap-4">
          <button onclick="alert('Link kopiert: https://kiobio.lol/alo')" 
                  class="flex-1 bg-violet-600 hover:bg-violet-700 py-4 rounded-2xl font-medium">
            🔗 Link teilen
          </button>
          <button onclick="closeModal()" class="flex-1 border border-zinc-600 hover:bg-zinc-800 py-4 rounded-2xl">
            Schließen
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('nav a').forEach((el, i) => {
        el.classList.toggle('nav-active', i === tab);
      });

      const content = document.getElementById('content');
      const title = document.getElementById('page-title');

      if (tab === 0) { // Konto
        title.textContent = 'Kontoübersicht';
        content.innerHTML = `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="card p-6 rounded-3xl"><p class="text-zinc-400">Benutzername</p><p class="text-3xl font-bold">alo</p></div>
            <div class="card p-6 rounded-3xl"><p class="text-zinc-400">Alias</p><p class="text-xl font-bold">0 verwendet</p></div>
            <div class="card p-6 rounded-3xl"><p class="text-zinc-400">UID</p><p class="text-3xl font-bold">805,159</p></div>
            <div class="card p-6 rounded-3xl"><p class="text-zinc-400">Aufrufe</p><p class="text-3xl font-bold">377</p></div>
          </div>
        `;
      } else if (tab === 1) { // Anpassen
        title.textContent = 'Anpassen';
        content.innerHTML = `
          <h2 class="text-xl font-semibold mb-6">Medien-Upload</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="card p-8 rounded-3xl text-center">Profil Banner</div>
            <div class="card p-8 rounded-3xl text-center">Audio</div>
            <div class="card p-8 rounded-3xl text-center">Avatar</div>
            <div class="card p-8 rounded-3xl text-center">Cursor</div>
          </div>
          <h2 class="text-xl font-semibold mt-10 mb-6">Schriftart & Farben</h2>
          <div class="card p-8 rounded-3xl">
            <select class="w-full bg-zinc-800 p-4 rounded-2xl mb-6">
              <option>Inter (Standard)</option>
              <option>Poppins</option>
              <option>Space Grotesk</option>
            </select>
          </div>
        `;
      } else if (tab === 4) { // Vorlagen
        title.textContent = 'Vorlagen';
        content.innerHTML = `
          <div class="max-w-lg mx-auto text-center py-20">
            <div class="text-7xl mb-6">👁️</div>
            <h2 class="text-3xl font-bold mb-4">Mein Profil anschauen</h2>
            <p class="text-zinc-400 mb-10">So sieht dein Profil aus, wenn andere den Link erhalten.</p>
            <button onclick="showProfilePreview()" 
                    class="bg-violet-600 hover:bg-violet-700 px-12 py-5 rounded-3xl text-xl font-semibold">
              Profil jetzt ansehen
            </button>
          </div>
        `;
      } else {
        title.textContent = 'kiobio.lol';
        content.innerHTML = `<p class="text-center py-20 text-zinc-400">Dieser Tab wird noch erweitert.</p>`;
      }
    }

    function showProfilePreview() {
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('profileModal').classList.add('hidden');
    }

    // Start
    window.onload = () => switchTab(1);
  </script>
</body>
</html>
