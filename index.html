<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 35px #c026d3, 0 0 70px #7e22ce; }
    .card { background-color: #1a1428; }
  </style>
</head>
<body>
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="logout()" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-2xl font-semibold" id="navLoginBtn">
        Anmelden
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl px-6 z-10">
      <h1 class="text-6xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">
        Kostenlos registrieren
      </button>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD (guns.lol Style) -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950 pt-20">
    <div class="max-w-7xl mx-auto px-8 py-10">
      <div class="flex justify-between items-center mb-10">
        <div>
          <h1 class="text-4xl font-bold">Kontoübersicht</h1>
          <p class="text-zinc-400">Willkommen zurück, <span id="dashNameTop" class="text-purple-400"></span></p>
        </div>
        <button onclick="logout()" class="text-red-400 hover:text-red-500">Abmelden</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
        <div class="card p-6 rounded-3xl">
          <p class="text-zinc-400 text-sm">Benutzername</p>
          <p id="dashUsername" class="text-3xl font-bold text-purple-400"></p>
        </div>
        <div class="card p-6 rounded-3xl">
          <p class="text-zinc-400 text-sm">UID</p>
          <p id="dashUID" class="text-3xl font-bold text-purple-400">#1</p>
        </div>
        <div class="card p-6 rounded-3xl">
          <p class="text-zinc-400 text-sm">Profilaufrufe</p>
          <p id="dashViews" class="text-3xl font-bold text-purple-400">0</p>
          <p class="text-sm text-zinc-500">+2 diese Woche</p>
        </div>
        <div class="card p-6 rounded-3xl">
          <p class="text-zinc-400 text-sm">Beigetreten</p>
          <p class="text-3xl font-bold text-purple-400">Gerade eben</p>
        </div>
      </div>

      <!-- Profil Vervollständigung -->
      <div class="card p-8 rounded-3xl mb-10">
        <h3 class="text-xl mb-4">Profil-Vervollständigung</h3>
        <div class="h-3 bg-zinc-800 rounded-full overflow-hidden mb-6">
          <div class="h-3 bg-purple-600 w-1/3 rounded-full"></div>
        </div>
        <p class="text-yellow-400 flex items-center gap-2 mb-6">
          <span>⚠️</span> Dein Profil ist noch nicht vollständig!
        </p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <button onclick="alert('Avatar hochladen kommt bald')" class="bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl text-left">
            👤 Avatar hochladen
          </button>
          <button onclick="alert('Beschreibung kommt bald')" class="bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl text-left">
            ✍️ Beschreibung hinzufügen
          </button>
          <button onclick="alert('Discord verbinden kommt bald')" class="bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl text-left">
            Discord-Konto verbinden
          </button>
        </div>
      </div>

      <div class="flex flex-col lg:flex-row gap-8">
        <!-- Linke Spalte -->
        <div class="flex-1 space-y-6">
          <div class="card p-8 rounded-3xl">
            <h3 class="text-xl mb-6">Schnellaktionen</h3>
            <div class="space-y-3">
              <button onclick="alert('Profil bearbeiten')" class="w-full text-left bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl flex items-center gap-4">
                ✏️ Profil anpassen
              </button>
              <button onclick="alert('Link hinzufügen')" class="w-full text-left bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl flex items-center gap-4">
                🔗 Links hinzufügen
              </button>
            </div>
          </div>
        </div>

        <!-- Rechte Spalte -->
        <div class="flex-1 space-y-6">
          <div class="card p-8 rounded-3xl">
            <h3 class="text-xl mb-6">Statistiken</h3>
            <div class="space-y-6">
              <div>
                <p class="text-purple-400 text-5xl font-bold" id="viewsBig">42</p>
                <p class="text-zinc-400">Profilaufrufe insgesamt</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    emailjs.init("IuyLZ33ctDj1VxqXE");

    let currentUser = null;
    const VERIFICATION_CODE = "666";
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let nextUID = parseInt(localStorage.getItem('nextUID')) || 1;

    function saveUser(email, username, password) {
      users[email] = { 
        username, 
        password, 
        uid: nextUID++,
        views: Math.floor(Math.random() * 50) + 10,
        profilePic: "https://i.pravatar.cc/128?u=" + email
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      localStorage.setItem('nextUID', nextUID);
    }

    function togglePassword(id) {
      const el = document.getElementById(id);
      if (el) el.type = el.type === "password" ? "text" : "password";
    }

    // Register, Login, Forgot... (gleich wie vorher)
    function showRegisterModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Registrieren";
      document.getElementById('modalContent').innerHTML = `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500">
        <input id="regUser" placeholder="Username" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <div class="relative">
          <input id="regPass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
          <button onclick="togglePassword('regPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="sendVerificationCode()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Verifizierungscode senden (666)</button>
      `;
    }

    async function sendVerificationCode() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!email || !username || !password) return alert("Bitte alle Felder ausfüllen");
      if (password.length < 6) return alert("Passwort muss mindestens 6 Zeichen haben!");

      // Prüfen ob Username schon existiert
      if (Object.values(users).some(u => u.username === username)) {
        return alert("Dieser Username ist bereits vergeben!");
      }

      try {
        await emailjs.send("service_zni05q6", "template_c2x5n7s", { to_email: email, verification_code: VERIFICATION_CODE, username });
      } catch(e) {}

      alert(`✅ Code 666 wurde an ${email} gesendet!`);
      currentEmail = email;
      currentUsername = username;
      currentPassword = password; // temporär speichern
      showVerificationScreen(false);
    }

    let currentPassword = "";

    function showVerificationScreen(isReset) {
      document.getElementById('modalTitle').textContent = isReset ? "Neues Passwort" : "Code bestätigen";
      document.getElementById('modalContent').innerHTML = `
        <p class="text-center text-purple-300">Der Code lautet: <strong>666</strong></p>
        <input id="codeInput" maxlength="3" placeholder="666" class="w-full p-6 bg-zinc-800 rounded-2xl text-4xl text-center tracking-widest">
        ${isReset ? `
          <input id="newPass" type="password" placeholder="Neues Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        ` : ''}
        <button onclick="${isReset ? 'verifyResetCode()' : 'verifyCode()'}" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-6 rounded-3xl text-xl font-bold">Bestätigen</button>
      `;
    }

    function verifyCode() {
      if (document.getElementById('codeInput').value.trim() !== "666") return alert("Falscher Code! Es ist 666");

      saveUser(currentEmail, currentUsername, currentPassword);
      currentUser = users[currentEmail];
      document.getElementById('mainModal').classList.add('hidden');
      showDashboard();
    }

    function showLoginModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <div class="relative">
          <input id="loginPass" type="password" placeholder="Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
          <button onclick="togglePassword('loginPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="loginUser()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Anmelden</button>
        <p onclick="showForgotPassword()" class="text-center text-purple-400 mt-6 cursor-pointer">Passwort vergessen?</p>
      `;
    }

    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = users[email];

      if (user && user.password === pass) {
        currentUser = user;
        document.getElementById('mainModal').classList.add('hidden');
        showDashboard();
      } else {
        alert("Falsche Zugangsdaten");
      }
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navLoginBtn').textContent = "Abmelden";

      document.getElementById('dashNameTop').textContent = currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
      document.getElementById('dashUID').textContent = `#${currentUser.uid}`;
      document.getElementById('dashViews').textContent = currentUser.views;
      document.getElementById('viewsBig').textContent = currentUser.views + 142;
    }

    function logout() {
      location.reload();
    }

    // Passwort vergessen (kurz)
    function showForgotPassword() {
      alert("Passwort zurücksetzen → Code 666 (Demo)");
      showVerificationScreen(true);
    }
  </script>
</body>
</html>
