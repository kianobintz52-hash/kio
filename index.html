<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui; color: white; overflow: hidden; }
    video#bgVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.85;
    }
    .glow-purple { text-shadow: 0 0 35px #c026d3, 0 0 70px #7e22ce; }
  </style>
</head>
<body>

  <!-- Video -->
  <video id="bgVideo" loop playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- Sound Button (groß und deutlich) -->
  <button onclick="toggleVideo()" 
          class="fixed bottom-8 right-8 z-50 bg-purple-600 hover:bg-purple-700 px-6 py-4 rounded-2xl text-lg font-bold flex items-center gap-3 shadow-2xl">
    <span id="soundBtn">▶️ Video + Sound starten</span>
  </button>

  <!-- Rest der Seite -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold">kiobio.lol</span>
      </div>
      <button onclick="showAuthModal()" class="bg-purple-600 px-8 py-3 rounded-2xl">Dashboard</button>
    </div>
  </nav>

  <section class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl px-6">
      <h1 class="text-6xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <button onclick="showAuthModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl mt-8">
        Kostenlos registrieren
      </button>
    </div>
  </section>

  <script>
    const video = document.getElementById('bgVideo');

    function toggleVideo() {
      if (video.paused) {
        video.muted = false;     // Sound aktivieren
        video.play();
        document.getElementById('soundBtn').innerHTML = '🔊 Sound läuft';
      } else {
        video.muted = true;
        document.getElementById('soundBtn').innerHTML = '▶️ Sound wieder an';
      }
    }

    function showAuthModal() {
      const name = prompt("Username für dein Profil:", "demo");
      if (name) alert(`✅ ${name}.kiobio.lol wurde erstellt!`);
    }

    // Versuch automatisch zu starten (ohne Sound)
    video.play().catch(() => {
      console.log("Autoplay blockiert - Button benutzen");
    });
  </script>
</body>
</html>
