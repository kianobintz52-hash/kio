<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Wistful-Seite</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            color: #ffffff;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #b0b0b0;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #444;
            padding-bottom: 0.2rem;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #ff6b6b;
            border-bottom-color: #ff6b6b;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WISTFUL</h1>
        <p>Ein Ort für Gedanken, Träume und leise Momente.</p>
        
        <div class="links">
            <a href="#">Über mich</a>
            <a href="#">Projekte</a>
            <a href="#">Kontakt</a>
            <a href="#">Blog</a>
        </div>

        <div class="footer">
            &copy; 2024 | Inspired by minimalism
        </div>
    </div>
</body>
</html>
