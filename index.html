<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>kio.lol</title>
<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{
display:flex;
}

input,button{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
}

button{
background:#6b21a8;
color:white;
cursor:pointer;
}

.profile{
text-align:center;
padding-top:80px;
}

.card{
background:#111;
padding:20px;
border-radius:15px;
width:300px;
}

a{
color:#6b21a8;
display:block;
margin:5px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen active">
<h1>Login</h1>
<input id="user" placeholder="Username">
<button onclick="login()">Enter</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="screen">
<h1>Dashboard</h1>
<input id="bio" placeholder="Bio">
<button onclick="save()">Save</button>
<button onclick="goProfile()">My Profile</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen profile">
<div class="card">
<h1 id="pname"></h1>
<p id="pbio"></p>

<a href="#">Discord</a>
<a href="#">Instagram</a>

<button onclick="back()">Back</button>
</div>
</div>

<script>
let currentUser = "";

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function login(){
currentUser = document.getElementById("user").value;
if(!currentUser) return;
show("dash");
}

function save(){
localStorage.setItem(currentUser+"_bio", document.getElementById("bio").value);
alert("saved (local only)");
}

function goProfile(){
document.getElementById("pname").innerText = currentUser;
document.getElementById("pbio").innerText =
localStorage.getItem(currentUser+"_bio") || "";
show("profile");
}

function back(){
show("dash");
}
</script>

</body>
</html>
