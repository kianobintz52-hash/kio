<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME VAULT • Kawaii & Kult</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --accent: 168 85 247; }
    body {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)), 
                  url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .neon-purple { 
      text-shadow: 0 0 25px rgb(168 85 247), 0 0 50px rgb(236 72 153); 
    }
    .anime-card {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anime-card:hover {
      transform: translateY(-20px) scale(1.06) rotate(1deg);
      box-shadow: 0 35px 70px rgba(168, 85, 247, 0.6);
    }
    .star { transition: transform 0.2s; }
    .star:hover { transform: scale(1.3); }
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-24">
  <!-- Navbar -->
  <nav class="glass sticky top-0 z-50 border-b border-purple-500/50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer flex items-center gap-3">
        <span class="text-5xl">🌸</span> ANIME VAULT
      </h1>
      
      <div class="flex items-center gap-8 text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400 transition">Shop</button>
        <button onclick="navigate('wishlist')" class="hover:text-purple-400 transition">❤️ Wishlist</button>
        <button onclick="navigate('orders')" class="hover:text-purple-400 transition">Bestellungen</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400 transition">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>

        <button onclick="toggleTheme()" class="text-3xl transition hover:scale-110" id="theme-toggle">
          <i class="fas fa-moon"></i>
        </button>
        <button onclick="logout()" class="bg-red-600/90 hover:bg-red-700 px-6 py-3 rounded-2xl text-sm font-medium transition">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login Page -->
  <div id="page-login" class="page max-w-md mx-auto mt-20 px-6">
    <div class="glass rounded-3xl p-10 shadow-2xl">
      <h2 class="text-5xl font-bold text-center neon-purple mb-10">Willkommen zurück, Otaku!</h2>
      <div class="flex bg-gray-900/70 rounded-3xl p-1 mb-8">
        <button onclick="switchAuthTab(0)" id="tab-login" class="flex-1 py-4 rounded-3xl font-semibold tab-active">Login</button>
        <button onclick="switchAuthTab(1)" id="tab-register" class="flex-1 py-4 rounded-3xl font-semibold">Registrieren</button>
      </div>

      <div id="login-form">
        <input id="login-user" placeholder="Username" class="w-full mb-5 glass border border-purple-400/50 rounded-2xl px-6 py-5 focus:outline-none focus:border-pink-500">
        <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-8 glass border border-purple-400/50 rounded-2xl px-6 py-5">
        <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold hover:brightness-110 transition">Einloggen</button>
      </div>

      <div id="register-form" class="hidden">
        <input id="reg-user" placeholder="Username" class="w-full mb-5 glass border border-purple-400/50 rounded-2xl px-6 py-5">
        <input id="reg-pass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full mb-8 glass border border-purple-400/50 rounded-2xl px-6 py-5">
        <button onclick="register()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Konto erstellen</button>
      </div>
    </div>
  </div>

  <!-- Shop Page -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <div class="flex flex-col md:flex-row gap-4 mb-10">
      <input id="search-input" onkeyup="debounceSearch()" placeholder="🔍 Anime Figuren, Manga, Merch..." 
             class="flex-1 glass border border-purple-400/50 rounded-2xl px-6 py-5 focus:outline-none">
      <select id="category-filter" onchange="renderProducts()" class="glass border border-purple-400/50 rounded-2xl px-6 py-5">
        <option value="">Alle Kategorien</option>
        <option value="figure">Figuren</option>
        <option value="manga">Manga</option>
        <option value="poster">Poster</option>
        <option value="merch">Merch</option>
      </select>
    </div>

    <h2 class="text-5xl font-bold neon-purple mb-12 text-center">Unsere Anime Schätze</h2>
    <div id="products" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Wishlist -->
  <div id="page-wishlist" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-10">❤️ Meine Wishlist</h2>
    <div id="wishlist-items" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Weitere Seiten (Orders, Profile, Sell, Admin) bleiben ähnlich, aber mit Glass-Style -->

  <!-- Product Modal -->
  <div id="product-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="glass max-w-2xl w-full mx-4 rounded-3xl p-8">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Floating Cart -->
  <button onclick="showCart()" 
          class="fixed bottom-8 right-8 w-20 h-20 bg-gradient-to-br from-purple-600 to-pink-600 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition-all z-50 floating">
    🛒
    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center">0</span>
  </button>

  <script>
    // ==================== BACKEND-READY STRUCTURE ====================
    let currentUser = null;
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let users = JSON.parse(localStorage.getItem('users')) || [];

    const admins = [
      { username: "kiollegend", password: "kiollegend" },
      { username: "ZayTox", password: "ZayTox!!!" }
    ];

    // API Simulation (später einfach durch fetch ersetzen)
    async function apiCall(endpoint, method = "GET", body = null) {
      // TODO: Replace with real backend
      console.log(`API Call: ${method} ${endpoint}`, body);
      return new Promise(resolve => setTimeout(() => resolve({ success: true }), 300));
    }

    function saveData() {
      localStorage.setItem('products', JSON.stringify(products));
      localStorage.setItem('cart', JSON.stringify(cart));
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      localStorage.setItem('orders', JSON.stringify(orders));
      localStorage.setItem('users', JSON.stringify(users));
    }

    function isAdmin(user) {
      return admins.some(a => a.username === user?.username);
    }

    // Navigation
    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${page}`).classList.remove('hidden');

      if (page === 'shop') renderProducts();
      if (page === 'wishlist') renderWishlist();
      if (page === 'orders') renderOrders();
      if (page === 'profile') renderProfile();
      if (page === 'admin' && isAdmin(currentUser)) renderAdmin();
    }

    // Debounced Search
    let searchTimeout;
    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(renderProducts, 300);
    }

    // Render Products
    function renderProducts() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const category = document.getElementById('category-filter').value;

      const filtered = products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
        const matchesCategory = !category || p.category === category;
        return matchesSearch && matchesCategory;
      });

      const container = document.getElementById('products');
      container.innerHTML = filtered.map(p => `
        <div class="anime-card glass rounded-3xl overflow-hidden group cursor-pointer" onclick="showProductDetail(${p.id})">
          <div class="relative">
            <img src="${p.img}" class="w-full h-64 object-cover group-hover:scale-105 transition" alt="${p.name}">
            <button onclick="toggleWishlist(${p.id}); event.stopImmediatePropagation()" 
                    class="absolute top-4 right-4 text-3xl transition ${wishlist.includes(p.id) ? 'text-red-500' : 'text-gray-400 hover:text-red-500'}">
              ❤️
            </button>
          </div>
          <div class="p-6">
            <h3 class="font-bold text-xl">${p.name}</h3>
            <p class="text-3xl font-bold text-purple-400 mt-1">${p.price.toFixed(2)} €</p>
            <div class="flex mt-2 text-yellow-400">${renderStars(p.rating || 4.5)}</div>
            <button onclick="addToCart(${p.id}); event.stopImmediatePropagation()" 
                    class="mt-5 w-full bg-gradient-to-r from-purple-600 to-pink-600 py-3.5 rounded-2xl font-medium">In den Warenkorb</button>
          </div>
        </div>
      `).join('');
    }

    function renderStars(rating) {
      return Array(5).fill(0).map((_, i) => 
        `<span class="star text-xl">${i < Math.floor(rating) ? '★' : '☆'}</span>`
      ).join('');
    }

    function toggleWishlist(id) {
      if (wishlist.includes(id)) {
        wishlist = wishlist.filter(w => w !== id);
      } else {
        wishlist.push(id);
      }
      saveData();
      renderProducts();
      if (!document.getElementById('page-wishlist').classList.contains('hidden')) renderWishlist();
    }

    function showProductDetail(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('modal-content').innerHTML = `
        <div class="flex flex-col md:flex-row gap-8">
          <img src="${p.img}" class="w-full md:w-1/2 rounded-2xl">
          <div class="flex-1">
            <h2 class="text-3xl font-bold">${p.name}</h2>
            <p class="text-5xl font-bold text-purple-400 mt-3">${p.price.toFixed(2)} €</p>
            <div class="flex gap-1 my-4">${renderStars(p.rating || 4.8)}</div>
            <p class="text-gray-300">${p.desc}</p>
            <div class="mt-8 space-x-4">
              <button onclick="addToCart(${p.id});hideProductModal()" class="px-8 py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-2xl">🛒 In den Warenkorb</button>
              <button onclick="toggleWishlist(${p.id});" class="px-8 py-4 border border-purple-400 rounded-2xl">❤️ Wishlist</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function hideProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    // Theme Toggle mit Anime Style
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-toggle');
      icon.innerHTML = document.documentElement.classList.contains('dark') 
        ? '<i class="fas fa-sun"></i>' 
        : '<i class="fas fa-moon"></i>';
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // Login / Register (verbessert)
    function login() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;

      const admin = admins.find(a => a.username === username && a.password === password);
      if (admin) {
        currentUser = admin;
      } else if (username && password) {
        const foundUser = users.find(u => u.username.toLowerCase() === username.toLowerCase());
        if (foundUser) {
          currentUser = { username: foundUser.username };
        } else {
          return alert("Benutzer nicht gefunden.");
        }
      } else return alert("Bitte Username und Passwort eingeben.");

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      initUserUI();
      navigate('shop');
    }

    function register() {
      const username = document.getElementById('reg-user').value.trim();
      const password = document.getElementById('reg-pass').value;

      if (username.length < 3) return alert("Username zu kurz!");
      if (password.length < 6) return alert("Passwort muss mindestens 6 Zeichen haben!");

      if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        return alert("Username bereits vergeben!");
      }

      currentUser = { username };
      users.push({ username, date: new Date().toLocaleDateString('de-DE') });
      saveData();
      localStorage.setItem('currentUser', JSON.stringify(currentUser));

      alert("✅ Registrierung erfolgreich! Willkommen!");
      initUserUI();
      navigate('shop');
    }

    function initUserUI() {
      document.getElementById('sellBtn').classList.toggle('hidden', !isAdmin(currentUser));
      document.getElementById('adminBtn').classList.toggle('hidden', !isAdmin(currentUser));
    }

    function logout() {
      if (confirm("Wirklich ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    // Initial Load
    window.onload = () => {
      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initUserUI();
        navigate('shop');
      } else {
        navigate('login');
      }

      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
    };
  </script>
</body>
</html>
