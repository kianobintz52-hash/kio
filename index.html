<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .neon-purple { text-shadow: 0 0 20px #c026d3, 0 0 40px #a855f7; }
    .anime-card {
      transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .anime-card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 20px 40px rgba(192, 38, 211, 0.5);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-black/90 border-b border-purple-500 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME SHOP</h1>
      
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('orders')" class="hover:text-purple-400">Bestellungen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>

        <div class="flex items-center gap-4">
          <input id="searchInput" type="text" placeholder="Suche" 
                 class="bg-gray-900 border border-purple-500 rounded-full px-5 py-3 w-80 focus:outline-none focus:border-pink-500 placeholder-gray-500">
          <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-full text-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Shop -->
  <div id="page-shop" class="page max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold text-center mb-12 neon-purple">Anime Shop</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Login / Register -->
  <div id="page-login" class="page hidden max-w-lg mx-auto mt-20 p-12 bg-gray-900/95 rounded-3xl border border-purple-500">
    <h2 class="text-4xl font-bold text-center mb-10 neon-purple">ANIME SHOP</h2>
    <div class="flex gap-4 justify-center mb-8">
      <button onclick="switchAuthTab(0)" id="tab-login" class="active px-8 py-3 rounded-2xl">Login</button>
      <button onclick="switchAuthTab(1)" id="tab-register" class="px-8 py-3 rounded-2xl">Registrieren</button>
    </div>

    <div id="login-form">
      <input id="login-user" placeholder="Username" class="w-full mb-4 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Einloggen</button>
    </div>

    <div id="register-form" class="hidden">
      <input id="reg-user" placeholder="Username" class="w-full mb-4 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="reg-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="register()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Konto erstellen</button>
    </div>
  </div>

  <!-- Sell -->
  <div id="page-sell" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Neues Produkt einstellen</h2>
    <div class="space-y-6">
      <input id="new-name" placeholder="Produktname" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-price" type="number" step="0.01" placeholder="Preis €" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-stock" type="number" value="10" placeholder="Verfügbare Menge" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 bg-gray-800 border border-purple-500 rounded-3xl px-6 py-5"></textarea>
      <button onclick="addProduct()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-6 rounded-3xl text-xl font-bold">Produkt hochladen</button>
    </div>
  </div>

  <!-- Profile -->
  <div id="page-profile" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Mein Profil</h2>
    <div class="bg-gray-900 rounded-3xl p-10 border border-purple-500">
      <p class="text-xl"><strong>Username:</strong> <span id="profile-username"></span></p>
    </div>
  </div>

  <!-- Orders -->
  <div id="page-orders" class="page hidden max-w-4xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Meine Bestellungen</h2>
    <div id="my-orders" class="space-y-6"></div>
  </div>

  <!-- Admin -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Admin Panel - KiolLegend</h2>
    <div class="mb-12">
      <h3 class="text-2xl mb-6">Produkte verwalten</h3>
      <div id="admin-products" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
    <div>
      <h3 class="text-2xl mb-6">Alle Bestellungen</h3>
      <div id="admin-orders" class="space-y-6"></div>
    </div>
  </div>

  <!-- Warenkorb Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-10 max-w-lg w-full border border-purple-500">
      <h3 class="text-3xl font-bold mb-6">Warenkorb</h3>
      <div id="cart-items" class="space-y-4 max-h-96 overflow-auto"></div>
      <div id="cart-total" class="text-3xl font-bold mt-8 mb-8"></div>
      
      <div id="paypal-button-container" class="mb-6"></div>
      
      <button onclick="hideCart()" class="w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <!-- Ticket Modal -->
  <div id="ticket-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-10 max-w-md w-full border border-purple-500 text-center">
      <h2 class="text-3xl font-bold neon-purple mb-2">✅ Bestellung erfolgreich!</h2>
      <div id="ticket-content" class="bg-black/50 p-6 rounded-2xl text-left my-8"></div>
      <button onclick="hideTicket()" class="w-full bg-purple-600 py-4 rounded-2xl font-bold">Schließen</button>
    </div>
  </div>

  <button onclick="showCart()" class="fixed bottom-10 right-10 bg-gradient-to-r from-purple-600 to-pink-600 w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition-all">
    🛒
  </button>

  <script>
    const PAYPAL_CLIENT_ID = "AfePx5V-Tru6WXLs1fwvK3RjuYKC5No0UmUgB9jmEr0IjsZ3v6BwqeQ0ur3leNkU87nz-RTFDswULn5S";

    let currentUser = null;
    let products = JSON.parse(localStorage.getItem('products')) || [
      {id:1, name:"Crunchyroll Premium 12 Monate", price:79.90, stock:8, desc:"Voller Zugriff auf alle Animes", img:"https://picsum.photos/id/1015/300/300"},
      {id:2, name:"One Piece Manga Bundle 1-10", price:89.90, stock:15, desc:"Offizielle Ausgabe", img:"https://picsum.photos/id/237/300/300"},
      {id:3, name:"Jujutsu Kaisen Merch Set", price:29.90, stock:25, desc:"Keychains + Sticker", img:"https://picsum.photos/id/201/300/300"}
    ];

    let cart = [];
    let orders = JSON.parse(localStorage.getItem('orders')) || [];

    const owner = { username: "kiollegend", password: "kiollegend" };

    function saveData() {
      localStorage.setItem('products', JSON.stringify(products));
      localStorage.setItem('orders', JSON.stringify(orders));
    }

    function loadUser() {
      const saved = localStorage.getItem('currentUser');
      if (saved) currentUser = JSON.parse(saved);
    }

    function navigate(page) {
      if (!currentUser && page !== 'login') return navigate('login');
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${page}`).classList.remove('hidden');

      if (page === 'shop') renderProducts();
      if (page === 'admin') renderAdmin();
      if (page === 'orders') renderMyOrders();
      if (page === 'profile') document.getElementById('profile-username').textContent = currentUser.username;
    }

    function renderProducts(filtered = products) {
      const container = document.getElementById('products');
      container.innerHTML = filtered.map(p => `
        <div class="anime-card bg-gray-900/95 border border-purple-500 rounded-3xl overflow-hidden">
          <img src="${p.img}" class="w-full h-64 object-cover">
          <div class="p-6">
            <h3 class="font-bold text-xl">${p.name}</h3>
            <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
            <p class="text-sm text-gray-400">Noch ${p.stock} verfügbar</p>
            <p class="text-gray-400 text-sm mt-2">${p.desc}</p>
            <button onclick="addToCart(${p.id})" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl">In den Warenkorb</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (product?.stock > 0) {
        cart.push({...product});
        alert(`${product.name} hinzugefügt!`);
      } else {
        alert("Nicht mehr auf Lager!");
      }
    }

    function showCart() {
      if (cart.length === 0) return alert("Warenkorb ist leer.");
      
      const itemsDiv = document.getElementById('cart-items');
      itemsDiv.innerHTML = cart.map(item => `
        <div class="flex justify-between bg-gray-800 p-4 rounded-2xl">
          <span>${item.name}</span>
          <span>${item.price} €</span>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerHTML = `Gesamt: <span class="text-purple-400">${total.toFixed(2)} €</span>`;

      document.getElementById('cart-modal').classList.remove('hidden');
      renderPayPalButtons(total);
    }

    function renderPayPalButtons(total) {
      document.getElementById('paypal-button-container').innerHTML = '';
      paypal.Buttons({
        style: { layout: 'vertical', color: 'blue', shape: 'rect', label: 'paypal' },
        createOrder: (data, actions) => {
          return actions.order.create({
            purchase_units: [{ amount: { value: total.toFixed(2), currency_code: 'EUR' } }]
          });
        },
        onApprove: (data, actions) => {
          return actions.order.capture().then(details => {
            completeOrder(details);
          });
        }
      }).render('#paypal-button-container');
    }

    function completeOrder(details) {
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const order = {
        id: Date.now(),
        user: currentUser.username,
        items: cart.map(c => c.name),
        total: total,
        date: new Date().toLocaleDateString('de-DE'),
        ticketNr: "T-" + String(Date.now()).slice(-8),
        paypalId: details.id
      };

      orders.push(order);
      
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) prod.stock = Math.max(0, prod.stock - 1);
      });

      saveData();
      hideCart();
      showTicket(order);
      cart = [];
    }

    function hideCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function showTicket(order) {
      const content = document.getElementById('ticket-content');
      content.innerHTML = `
        <p><strong>Ticket Nr:</strong> ${order.ticketNr}</p>
        <p><strong>Datum:</strong> ${order.date}</p>
        <p><strong>PayPal ID:</strong> ${order.paypalId}</p>
        <hr class="my-4 border-purple-500">
        ${order.items.map(item => `<p>• ${item}</p>`).join('')}
        <p class="text-2xl font-bold text-purple-400 mt-6">Gesamt: ${order.total.toFixed(2)} €</p>
      `;
      document.getElementById('ticket-modal').classList.remove('hidden');
    }

    function hideTicket() {
      document.getElementById('ticket-modal').classList.add('hidden');
      navigate('orders');
    }

    function login() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;

      if (user === owner.username && pass === owner.password) {
        currentUser = owner;
        document.getElementById('sellBtn').classList.remove('hidden');
        document.getElementById('adminBtn').classList.remove('hidden');
      } else if (user && pass) {
        currentUser = { username: user };
      } else {
        return alert("Falsche Daten");
      }

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      navigate('shop');
    }

    function register() {
      const user = document.getElementById('reg-user').value.trim();
      if (user) {
        currentUser = { username: user };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert("Registrierung erfolgreich!");
        navigate('shop');
      }
    }

    function logout() {
      if (confirm("Ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    function addProduct() {
      if (currentUser?.username !== owner.username) return alert("Nur der Owner darf Produkte einstellen");
      
      const name = document.getElementById('new-name').value;
      const price = parseFloat(document.getElementById('new-price').value);
      const stock = parseInt(document.getElementById('new-stock').value) || 10;
      const desc = document.getElementById('new-desc').value || "";

      if (name && price) {
        products.push({
          id: Date.now(),
          name,
          price,
          stock,
          desc,
          img: `https://picsum.photos/id/${Math.floor(Math.random()*900)}/300/300`
        });
        saveData();
        alert("Produkt hochgeladen!");
        navigate('shop');
      }
    }

    function deleteProduct(id) {
      if (!confirm("Produkt wirklich löschen?")) return;
      products = products.filter(p => p.id !== id);
      saveData();
      renderAdmin();
      renderProducts();
    }

    function renderAdmin() {
      document.getElementById('admin-products').innerHTML = products.map(p => `
        <div class="bg-gray-900 p-6 rounded-3xl border border-purple-500">
          <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl mb-4">
          <h4 class="font-bold">${p.name}</h4>
          <p>${p.price} € | Stock: ${p.stock}</p>
          <button onclick="deleteProduct(${p.id})" class="mt-4 w-full bg-red-600 py-3 rounded-2xl">Löschen</button>
        </div>
      `).join('');

      document.getElementById('admin-orders').innerHTML = orders.map(o => `
        <div class="bg-gray-900 p-6 rounded-3xl border border-purple-500">
          <p><strong>Ticket:</strong> ${o.ticketNr}</p>
          <p><strong>Kunde:</strong> ${o.user} | ${o.date}</p>
          <p><strong>Gesamt:</strong> ${o.total} €</p>
        </div>
      `).join('');
    }

    function renderMyOrders() {
      const myOrders = orders.filter(o => o.user === currentUser.username);
      document.getElementById('my-orders').innerHTML = myOrders.length ? myOrders.map(o => `
        <div class="bg-gray-900 p-6 rounded-3xl border border-purple-500">
          <p><strong>Ticket:</strong> ${o.ticketNr}</p>
          <p><strong>${o.date}</strong> — ${o.total.toFixed(2)} €</p>
          <p class="text-sm text-gray-400">${o.items.join(' • ')}</p>
        </div>
      `).join('') : "<p class='text-gray-400'>Noch keine Bestellungen.</p>";
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    // PayPal SDK laden
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=EUR`;
    document.head.appendChild(script);

    window.onload = () => {
      loadUser();
      document.getElementById('searchInput').addEventListener('input', () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(term));
        renderProducts(filtered);
      });
      if (currentUser) navigate('shop');
      else navigate('login');
    };
  </script>
</body>
</html>
