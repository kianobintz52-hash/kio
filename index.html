<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiobio.lol - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <style>
        body { background: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif; }
        .sidebar { background: #111113; }
        .card { background: #1a1a1e; border: 1px solid #22d3ee; }
        .accent { color: #22d3ee; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div class="w-72 sidebar h-screen fixed p-6">
        <div class="flex items-center gap-3 mb-10">
            <span class="text-4xl">🔫</span>
            <span class="text-3xl font-bold">kiobio.lol</span>
        </div>
        
        <nav class="space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-sky-900/40 text-sky-400">👤 Übersicht</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">📊 Statistiken</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800">🏆 Badges</a>
        </nav>
    </div>

    <!-- MAIN -->
    <div class="flex-1 ml-72 p-10">
        <h1 class="text-4xl font-bold mb-2">Kontoübersicht</h1>
        <p id="welcome" class="text-zinc-400"></p>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mt-10">
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">Benutzername</div>
                <div id="username" class="text-2xl font-bold accent">@k</div>
            </div>
            <div class="card rounded-3xl p-6">
                <div class="text-sm text-zinc-400">Profilaufrufe</div>
                <div id="views" class="text-3xl font-bold accent">1337</div>
            </div>
        </div>

        <!-- Owner Only Badge Manager -->
        <div id="ownerPanel" class="hidden mt-12 card rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                👑 Owner Badge Manager
            </h2>
            <input id="targetUser" placeholder="Username des Nutzers" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
            
            <select id="badgeType" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
                <option value="owner">👑 Owner</option>
                <option value="premium">⭐ Premium</option>
                <option value="vip">💎 VIP</option>
                <option value="legend">🔥 Legend</option>
                <option value="verified">✅ Verified</option>
            </select>

            <button onclick="giveBadge()" 
                    class="w-full bg-sky-600 hover:bg-sky-500 py-5 rounded-2xl font-bold">
                Badge vergeben
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD6NPF9FIJsDipQg3dvxSohtAJCGVF4NUc",
          authDomain: "kiobiool.firebaseapp.com",
          databaseURL: "https://kiobiool-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "kiobiool",
          storageBucket: "kiobiool.firebasestorage.app",
          appId: "1:1003434485509:web:872f257b0758051c80b96c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;

        // Owner Check (nur dein Account)
        const ownerEmails = ["u3271805041@gmail.com"];
        const ownerUsernames = ["k"];

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('welcome').textContent = `Willkommen zurück, ${user.email}`;

                // Prüfen ob Owner
                const userSnap = await db.ref('users/' + user.uid).once('value');
                const userData = userSnap.val() || {};
                
                if (ownerEmails.includes(user.email) || ownerUsernames.includes(userData.username)) {
                    document.getElementById('ownerPanel').classList.remove('hidden');
                }
            }
        });

        async function giveBadge() {
            const targetUsername = document.getElementById('targetUser').value.trim().toLowerCase();
            const badgeId = document.getElementById('badgeType').value;

            if (!targetUsername) return alert("Bitte einen Benutzernamen eingeben");

            const snap = await db.ref('users').orderByChild('username').equalTo(targetUsername).limitToFirst(1).once('value');
            const users = snap.val();

            if (!users) return alert("User nicht gefunden");

            const uid = Object.keys(users)[0];
            const userRef = db.ref('users/' + uid + '/badges');

            const currentBadges = (await userRef.once('value')).val() || [];
            if (!currentBadges.includes(badgeId)) {
                currentBadges.push(badgeId);
                await userRef.set(currentBadges);
                alert(`✅ Badge "${badgeId}" an @${targetUsername} vergeben!`);
            } else {
                alert("Der User hat diesen Badge bereits.");
            }
        }

        function goToProfile() {
            window.open('profile.html', '_blank');
        }
    </script>
</body>
</html>
