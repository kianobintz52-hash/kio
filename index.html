<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kioo.zeta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #7289DA;
            --secondary: #99AAB5;
            --accent: #5865F2;
            --background: #36393F;
            --card: #2F3136;
            --text: #DCDDDE;
            --text-muted: #B9BBBE;
            --border: #202225;
            --success: #43B581;
            --warning: #FAA61A;
            --error: #F04747;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            font-size: 28px;
        }
        
        nav {
            display: flex;
            gap: 20px;
        }
        
        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: var(--primary);
        }
        
        /* Pages */
        .page {
            display: none;
            min-height: calc(100vh - 70px);
            padding: 30px 0;
        }
        
        .page.active {
            display: block;
        }
        
        /* Home Page */
        .hero {
            text-align: center;
            padding: 60px 0;
        }
        
        .hero h1 {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            color: var(--text-muted);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(114, 137, 218, 0.3);
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        
        .feature {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .feature i {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .feature h3 {
            font-size: 24px;
            margin-bottom: 15px;
            color: var(--text);
        }
        
        .feature p {
            color: var(--text-muted);
        }
        
        /* Profile Page */
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .profile-card {
            background-color: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .profile-header {
            height: 150px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            position: relative;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--card);
            border: 5px solid var(--card);
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-info {
            padding: 70px 30px 30px;
            text-align: center;
        }
        
        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .profile-bio {
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        
        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            padding: 20px;
            background-color: var(--background);
            border-radius: 12px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .profile-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .profile-link {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--background);
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: background-color 0.3s;
        }
        
        .profile-link:hover {
            background-color: var(--border);
        }
        
        .profile-link i {
            font-size: 20px;
            color: var(--primary);
        }
        
        /* Create Page */
        .create-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .create-card {
            background-color: var(--card);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .create-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background-color: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .link-item {
            display: flex;
            gap: 10px;
        }
        
        .link-input {
            flex: 1;
        }
