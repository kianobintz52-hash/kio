<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>barbarossa | Profile</title>
    <style>
        /* --- GRUNDLEGENDE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505; /* Sehr dunkles Grau/Schwarz */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; /* Kein horizontaler Scrollbalken für die ganze Seite */
        }

        /* --- STARTSEITE (LANDING PAGE) --- */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .landing-title {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
            filter: blur(0.5px);
        }

        .landing-line {
            width: 60px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 3rem auto;
            box-shadow: 0 0 10px #ff0000;
        }

        .enter-btn {
            font-size: 0.8rem;
            color: #ff0000;
            letter-spacing: 0.15em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0.7;
            user-select: none;
        }

        .enter-btn:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        /* Klasse zum Ausblenden der Landingpage */
        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- PROFIL SEITE --- */
        #profile-page {
            padding: 40px 20px;
            min-height: 100vh;
            opacity: 0; /* Anfangs unsichtbar, erscheint nach Enter */
            transition: opacity 1.5s ease 0.5s; /* Verzögerung für sanften Übergang */
        }

        .profile-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .profile-header h2 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
        }

        .profile-header p {
            color: #888;
            font-size: 0.9rem;
        }

        /* Container für die Avatar-Karten */
        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto; /* Horizontales Scrollen erlauben */
            padding: 20px 0;
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #333 #0a0a0a;
        }

        /* Scrollbar Styling (Chrome/Safari/Edge) */
        .cards-container::-webkit-scrollbar {
            height: 8px;
        }
        .cards-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 4px;
        }

        /* Einzelne Karte */
        .card {
            min-width: 140px; /* Breite der Karte */
            background: linear-gradient(145deg, #111111, #0a0a0a);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #444;
        }

        /* Avatar Bild Platzhalter */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            background-color: #222;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 10px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Discord Icon Styling */
        .discord-icon {
            width: 24px;
            height: 24px;
            fill: #5865F2; /* Discord Blau */
            filter: drop-shadow(0 0 5px rgba(88, 101, 242, 0.4));
            cursor: pointer;
            transition: transform 0.2s;
        }

        .discord-icon:hover {
            transform: scale(1.2);
        }

        /* Responsive Anpassung */
        @media (max-width: 600px) {
            .cards-container {
                gap: 15px;
            }
            .card {
                min-width: 120px;
            }
            .avatar {
                width: 60px;
                height: 60px;
            }
            .landing-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
