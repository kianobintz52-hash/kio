<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kioo.zeta</title>
<meta name="description" content="kioo.zeta — your bio, your vibe."/>
<meta property="og:title" content="kioo.zeta"/>
<meta property="og:description" content="your bio, your vibe."/>
<meta property="og:type" content="website"/>
<meta name="theme-color" content="#a855f7"/>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E"/>
<style>
  :root{
    --bg:#070708;--bg2:#0d0d10;--panel:#131318;--panel2:#1a1a20;
    --border:#26262e;--text:#fff;--muted:#8b8b95;
    --primary:#a855f7;--primary2:#7c3aed;
    --green:#22c55e;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  html,body{background:var(--bg);color:var(--text);min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{cursor:pointer;border:none;font-family:inherit;color:inherit;background:none}
  input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;width:100%;outline:none;font-size:14px}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)}
  textarea{resize:vertical;min-height:80px}
  .hidden{display:none!important}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  small{color:var(--muted);font-size:12px}
  /* AUTH */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(168,85,247,.18),transparent 60%),var(--bg)}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(168,85,247,.25)}
  .brand{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800;color:var(--primary);margin-bottom:24px;justify-content:center;letter-spacing:-.02em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 14px var(--primary)}
  .auth-card h1{font-size:22px;margin-bottom:6px;text-align:center;font-weight:600}
  .auth-card p.sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .btn{background:var(--primary);color:#fff;padding:12px;border-radius:10px;width:100%;font-weight:600;font-size:14px;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:hover{background:var(--primary2);transform:translateY(-1px)}
  .btn-ghost{background:var(--panel2);border:1px solid var(--border);color:#ddd}
  .btn-ghost:hover{background:#23232a}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:8px}
  .switch-link{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}
  .switch-link a{color:var(--primary);cursor:pointer}
  .err{color:var(--red);font-size:13px;margin-top:8px;text-align:center;min-height:18px}
  /* APP LAYOUT */
  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;transition:.15s}
  .nav-item:hover{background:var(--panel);color:#fff}
  .nav-item.active{background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(168,85,247,.05));color:#fff}
  .nav-item .ic{width:18px;text-align:center}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .user-chip{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border-radius:12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .user-chip .meta{font-size:13px;min-width:0;flex:1}
  .user-chip .meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-chip .meta .uid{color:var(--muted);font-size:11px}
  .main{flex:1;padding:30px;overflow-x:hidden;max-width:100%}
  .page-title{font-size:24px;font-weight:600;margin-bottom:6px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  /* CARDS */
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .stat-card{background:linear-gradient(135deg,rgba(168,85,247,.10),rgba(168,85,247,.02));border:1px solid rgba(168,85,247,.18);padding:18px;border-radius:var(--radius)}
  .stat-card.dark{background:var(--panel);border:1px solid var(--border)}
  .stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .stat-val{font-size:22px;font-weight:700;margin-bottom:2px}
  .stat-sub{font-size:12px;color:var(--muted)}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-top:18px}
  .section h2{font-size:16px;margin-bottom:14px;font-weight:600}
  .section h3{font-size:14px;margin:14px 0 8px;font-weight:600;color:#ccc}
  .progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--primary),#ec4899);transition:.3s}
  .task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:14px}
  .task{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel2);border-radius:10px;font-size:13px}
  .task.done{color:var(--green)}
  .task .dot{width:18px;height:18px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex-shrink:0;font-size:11px}
  .task.done .dot{background:rgba(34,197,94,.2);color:var(--green)}
  /* manage */
  .manage-list{display:flex;flex-direction:column;gap:8px}
  .manage-btn{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:11px 14px;border-radius:10px;font-size:14px;text-align:left;width:100%;color:#ddd}
  .manage-btn:hover{background:#23232a}
  /* badges */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .badge-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
  .badge-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .badge-info{flex:1;min-width:0}
  .badge-info .t{font-weight:600;font-size:14px}
  .badge-info .d{color:var(--muted);font-size:12px;margin-top:2px}
  .badge-card .own{font-size:11px;color:var(--green);padding:3px 8px;background:rgba(34,197,94,.15);border-radius:99px}
  /* socials */
  .social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
  .social-icon{height:60px;background:var(--panel2);border-radius:12px;display:grid;place-items:center;font-size:22px;cursor:pointer;transition:.15s;border:1px solid var(--border)}
  .social-icon:hover{transform:translateY(-2px);background:#23232a;border-color:var(--primary)}
  .link-item{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:10px;border-radius:10px;margin-top:8px}
  .link-item .icon{width:30px;height:30px;border-radius:6px;background:var(--primary);display:grid;place-items:center;font-size:14px;flex-shrink:0}
  .link-item .info{flex:1;min-width:0}
  .link-item .info .name{font-weight:600;font-size:14px}
  .link-item .info .url{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-item button{color:var(--red);padding:6px;font-size:16px}
  /* enter screen */
  .enter-screen{position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:1000;cursor:pointer;text-align:center}
  .enter-screen .es-inner{animation:pulse 2s ease-in-out infinite}
  .enter-screen h2{font-size:28px;font-weight:300;letter-spacing:.1em}
  .enter-screen p{color:#888;margin-top:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  /* profile */
  .profile-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
  .profile-bg{position:fixed;inset:0;z-index:-2;background:#000}
  .profile-bg img,.profile-bg video{width:100%;height:100%;object-fit:cover}
  .profile-bg.blurred img,.profile-bg.blurred video{filter:blur(var(--bg-blur,8px))}
  .profile-card{background:rgba(20,20,22,var(--card-opacity,.72));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:var(--border-w,1px) solid var(--border-c,#26262e);border-radius:var(--border-r,20px);padding:36px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 var(--border-glow,0) var(--border-c,transparent);position:relative;z-index:2}
  .profile-card.frost{background:rgba(255,255,255,.06)}
  .profile-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,var(--accent,#a855f7),#ec4899);display:grid;place-items:center;font-size:42px;font-weight:700;overflow:hidden;border:3px solid var(--accent,#a855f7)}
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-name{font-size:28px;font-weight:700;margin-bottom:4px;color:var(--accent,#fff)}
  .profile-uid{color:var(--muted);font-size:13px;margin-bottom:12px}
  .profile-badges{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .pb{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
  .profile-bio{color:#d6d6dc;margin-bottom:18px;font-size:14px;min-height:1.2em}
  .profile-views{color:var(--muted);font-size:12px;margin-top:18px}
  .profile-socials{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
  .profile-socials a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;transition:.15s}
  .profile-socials a:hover{transform:translateY(-3px) scale(1.08)}
  /* username effects */
  .fx-glow{text-shadow:0 0 10px var(--accent,#a855f7),0 0 22px var(--accent,#a855f7)}
  .fx-rainbow{background:linear-gradient(90deg,#ff0000,#ff8c00,#ffd700,#22c55e,#3b82f6,#a855f7,#ec4899);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 4s linear infinite}
  @keyframes rainbow{to{background-position:200% center}}
  .fx-gradient{background:linear-gradient(135deg,var(--accent,#a855f7),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fx-sparkle{position:relative}
  .fx-sparkle::after{content:'✨';position:absolute;right:-22px;top:-6px;animation:spark 1.5s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(180deg);opacity:1}}
  .fx-animated{animation:nameBounce 2s ease-in-out infinite}
  @keyframes nameBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* music player */
  .music-player{position:fixed;bottom:20px;left:20px;background:rgba(20,20,24,.85);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:50;min-width:220px}
  .music-player button{font-size:18px;width:32px;height:32px;border-radius:50%;background:var(--primary);display:grid;place-items:center}
  .music-player .mp-vol{width:70px}
  /* visualizer */
  .visualizer{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;align-items:end;gap:3px;justify-content:center;pointer-events:none;z-index:1}
  .visualizer span{width:5px;background:linear-gradient(to top,var(--accent,#a855f7),#ec4899);border-radius:2px;transition:height .08s}
  /* effects layer */
  .fx-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  /* spotify widget */
  .spotify-now{display:inline-flex;align-items:center;gap:8px;background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);color:#1db954;padding:6px 12px;border-radius:99px;font-size:12px;margin-top:8px}
  .spotify-now .eq{display:inline-flex;gap:2px}
  .spotify-now .eq i{width:2px;height:10px;background:#1db954;display:inline-block;animation:eq 1s ease-in-out infinite}
  .spotify-now .eq i:nth-child(2){animation-delay:.2s}
  .spotify-now .eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:4px}50%{height:12px}}
  /* discord status */
  .ds-status{display:inline-flex;align-items:center;gap:8px;background:rgba(88,101,242,.12);border:1px solid rgba(88,101,242,.3);padding:6px 12px;border-radius:99px;font-size:12px;margin-top:8px;color:#cfd2ff}
  .ds-status .indot{width:8px;height:8px;border-radius:50%;background:#43b581;box-shadow:0 0 8px #43b581}
  /* admin */
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td .row-btns{display:flex;gap:6px;flex-wrap:wrap}
  td button{padding:5px 10px;background:var(--panel2);border-radius:6px;font-size:12px;color:#ddd}
  td button:hover{background:#23232a}
  td button.danger{color:var(--red)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:200;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
  .modal h3{margin-bottom:16px;font-size:18px}
  .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
  /* toast */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--border);padding:12px 18px;border-radius:10px;z-index:300;animation:slideIn .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .premium-tag{display:inline-block;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px;vertical-align:middle}
  .free-tag{display:inline-block;background:linear-gradient(135deg,#22c55e,#10b981);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px}
  /* effect particles */
  .particle{position:absolute;pointer-events:none;will-change:transform,opacity}
  .matrix-col{position:absolute;top:-100px;color:#22c55e;font-family:monospace;font-size:18px;writing-mode:vertical-rl;text-shadow:0 0 5px #22c55e;opacity:.8}
  @media(max-width:768px){
    .sidebar{width:62px;padding:10px}
    .sidebar .nav-item span:not(.ic),.sidebar .brand .brand-text,.user-chip .meta,.sidebar-bottom .full{display:none}
    .main{padding:18px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =====================================================
   kioo.zeta — single-file bio link app
   Storage: localStorage. Admin: k / k@gmail.com / Hallopelo112
   Premium is FREE for everyone.
===================================================== */
const DB_KEY='kioo_db_v2';
const SESSION_KEY='kioo_session_v2';
const ALL_BADGES=[
  {id:'staff',name:'Staff',desc:'Teil des Staff-Teams.',icon:'🛠️',color:'#3b82f6'},
  {id:'helper',name:'Helper',desc:'Aktiver Helfer.',icon:'💡',color:'#fbbf24'},
  {id:'premium',name:'Premium',desc:'Premium aktiv.',icon:'💎',color:'#a855f7'},
  {id:'verified',name:'Verified',desc:'Bekannter Creator.',icon:'✓',color:'#3b82f6'},
  {id:'donor',name:'Donor',desc:'Spender.',icon:'💰',color:'#22c55e'},
  {id:'gifter',name:'Gifter',desc:'Hat etwas verschenkt.',icon:'🎁',color:'#fbbf24'},
  {id:'imagehost',name:'Image Host',desc:'Image-Host User.',icon:'🖼️',color:'#22c55e'},
  {id:'domainlegend',name:'Domain Legend',desc:'Custom Domain.',icon:'🚀',color:'#ec4899'},
  {id:'og',name:'OG',desc:'Früher Unterstützer.',icon:'⭐',color:'#fbbf24'},
  {id:'booster',name:'Booster',desc:'Discord-Booster.',icon:'🔥',color:'#f97316'},
  {id:'bughunter',name:'Bug Hunter',desc:'Bug gemeldet.',icon:'🐛',color:'#22c55e'},
  {id:'owner',name:'Owner',desc:'Owner von kioo.zeta.',icon:'👑',color:'#fbbf24'},
  {id:'admin',name:'Admin',desc:'Administrator.',icon:'🛡️',color:'#ef4444'},
  {id:'million',name:'The Million',desc:'1 Mio. Nutzer Event.',icon:'🎉',color:'#06b6d4'},
  {id:'winner',name:'Winner',desc:'Event-Gewinner.',icon:'🏆',color:'#fbbf24'},
  {id:'og_name',name:'OG Username',desc:'3L/4L/OG Username.',icon:'🅾️',color:'#ec4899'},
];
const SOCIALS=[
  {id:'youtube',name:'YouTube',icon:'▶',color:'#ff0000'},
  {id:'discord',name:'Discord',icon:'🎮',color:'#5865f2'},
  {id:'spotify',name:'Spotify',icon:'🎵',color:'#1db954'},
  {id:'instagram',name:'Instagram',icon:'📷',color:'#e4405f'},
  {id:'x',name:'X',icon:'𝕏',color:'#000'},
  {id:'tiktok',name:'TikTok',icon:'♪',color:'#000'},
  {id:'twitch',name:'Twitch',icon:'📺',color:'#9146ff'},
  {id:'github',name:'GitHub',icon:'⌨',color:'#333'},
  {id:'steam',name:'Steam',icon:'🎮',color:'#1b2838'},
  {id:'reddit',name:'Reddit',icon:'👽',color:'#ff4500'},
  {id:'snapchat',name:'Snapchat',icon:'👻',color:'#fcd34d'},
  {id:'telegram',name:'Telegram',icon:'✈',color:'#0088cc'},
  {id:'facebook',name:'Facebook',icon:'f',color:'#1877f2'},
  {id:'email',name:'Email',icon:'✉',color:'#888'},
  {id:'website',name:'Website',icon:'🌐',color:'#666'},
];
const EFFECTS=['none','snow','rain','stars','hearts','confetti','sparks','matrix','smoke'];
const NAME_FX=['none','glow','rainbow','gradient','sparkle','animated'];
/* ---------- DB ---------- */
function defaultProfile(){
  return {
    bgUrl:'', bgType:'image', // image|video|gif
    musicUrl:'', musicAutoplay:true, musicVolume:.5,
    enterScreen:true, enterText:'click anywhere to enter',
    cursorUrl:'', // image or emoji
    effect:'none',
    nameEffect:'glow',
    typewriter:true,
    cardOpacity:.72, bgBlur:8, frosted:false,
    borderWidth:1, borderColor:'#26262e', borderRadius:20, borderGlow:0, borderAnimated:false,
    accent:'#a855f7',
    discord:{enabled:false, id:''}, // Lanyard id
    spotify:{enabled:false, track:'Lo-Fi Beats', artist:'Chillhop'},
    visualizer:true,
    titleAnim:['hi','there','welcome to kioo.zeta'],
    favicon:'', // dataurl or emoji
    seo:{title:'',desc:'',color:'#a855f7',image:''},
  };
}
function loadDB(){
  let raw=localStorage.getItem(DB_KEY);
  if(!raw){
    const db={users:[], nextUid:1};
    db.users.push({
      uid:1, username:'k', email:'k@gmail.com', password:'Hallopelo112',
      displayName:'k', bio:'Owner von kioo.zeta', avatar:'',
      views:0, badges:['owner','admin','staff','premium','verified','og_name'],
      customBadges:[], socials:[], premium:true, role:'admin',
      aliases:[], usernameChanges:0, createdAt:Date.now(),
      profile:defaultProfile()
    });
    db.nextUid=2;
    localStorage.setItem(DB_KEY,JSON.stringify(db));
    return db;
  }
  const db=JSON.parse(raw);
  // migrate
  db.users.forEach(u=>{
    if(!u.profile) u.profile=defaultProfile();
    else { const d=defaultProfile(); for(const k in d) if(u.profile[k]===undefined) u.profile[k]=d[k]; }
  });
  return db;
}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function getSession(){const s=localStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}
function setSession(uid){localStorage.setItem(SESSION_KEY,JSON.stringify({uid}));}
function clearSession(){localStorage.removeItem(SESSION_KEY);}
function currentUser(){const s=getSession();if(!s)return null;const db=loadDB();return db.users.find(u=>u.uid===s.uid)||null;}
function updateUser(uid,patch){const db=loadDB();const u=db.users.find(x=>x.uid===uid);if(u){Object.assign(u,patch);saveDB(db);}}
function updateProfile(uid,patch){const db=loadDB();const u=db.users.find(x=>x.uid===uid);if(u){Object.assign(u.profile,patch);saveDB(db);}}
/* ---------- UI helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
function modal(title,html,onOk,okText='Speichern'){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><div>${html}</div><div class="modal-actions"><button class="btn btn-ghost btn-sm" id="mcancel">Abbrechen</button><button class="btn btn-sm" id="mok">${esc(okText)}</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mcancel').onclick=()=>bg.remove();
  bg.querySelector('#mok').onclick=()=>{if(onOk(bg)!==false)bg.remove();};
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  return bg;
}
function readFile(input,cb){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>cb(e.target.result,f);r.readAsDataURL(f);}
/* ---------- ROUTER ---------- */
let currentPage='overview';
let pageTitleTimer=null;
function clearPageTitleAnim(){if(pageTitleTimer){clearInterval(pageTitleTimer);pageTitleTimer=null;}document.title='kioo.zeta';}
function render(){
  // cleanup
  clearPageTitleAnim();
  document.body.style.cursor='';
  const hash=location.hash.slice(1);
  if(hash.startsWith('/u/')){renderProfilePage(decodeURIComponent(hash.slice(3)));return;}
  const user=currentUser();
  if(!user){renderAuth();return;}
  renderApp(user);
}
window.addEventListener('hashchange',render);
/* ---------- AUTH ---------- */
let authMode='login';
function renderAuth(){
  $('root').innerHTML=`
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="dot"></span><span class="brand-text">kioo.zeta</span></div>
      <h1>${authMode==='login'?'Willkommen zurück':'Konto erstellen'}</h1>
      <p class="sub">${authMode==='login'?'Melde dich an':'Sichere dir deinen Username'} <span class="free-tag">PREMIUM GRATIS</span></p>
      ${authMode==='register'?`<div class="field"><label>Benutzername</label><input id="a-user" placeholder="dein_name"/></div>`:''}
      <div class="field"><label>${authMode==='login'?'Email oder Benutzername':'Email'}</label><input id="a-email" placeholder="you@example.com"/></div>
      <div class="field"><label>Passwort</label><input id="a-pw" type="password" placeholder="••••••••"/></div>
      <button class="btn" id="a-submit">${authMode==='login'?'Anmelden':'Registrieren'}</button>
      <div class="err" id="a-err"></div>
      <div class="switch-link">${authMode==='login'?'Noch kein Konto?':'Bereits ein Konto?'} <a id="a-switch">${authMode==='login'?'Registrieren':'Anmelden'}</a></div>
    </div>
  </div>`;
  $('a-switch').onclick=()=>{authMode=authMode==='login'?'register':'login';renderAuth();};
  $('a-submit').onclick=doAuth;
  ['a-email','a-pw'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();}));
}
function doAuth(){
  const db=loadDB();const err=$('a-err');err.textContent='';
  if(authMode==='login'){
    const id=$('a-email').value.trim();const pw=$('a-pw').value;
    const u=db.users.find(x=>(x.email.toLowerCase()===id.toLowerCase()||x.username.toLowerCase()===id.toLowerCase())&&x.password===pw);
    if(!u){err.textContent='Falsche Anmeldedaten';return;}
    setSession(u.uid);render();
  } else {
    const user=$('a-user').value.trim();const email=$('a-email').value.trim();const pw=$('a-pw').value;
    if(!user||!email||!pw){err.textContent='Alle Felder ausfüllen';return;}
    if(!/^[a-zA-Z0-9_]{1,20}$/.test(user)){err.textContent='1-20 Zeichen, a-z 0-9 _';return;}
    if(pw.length<6){err.textContent='Passwort min. 6 Zeichen';return;}
    if(db.users.some(x=>x.username.toLowerCase()===user.toLowerCase())){err.textContent='Benutzername vergeben';return;}
    if(db.users.some(x=>x.email.toLowerCase()===email.toLowerCase())){err.textContent='Email schon registriert';return;}
    const uid=db.nextUid++;
    const badges=['premium']; // premium gratis
    if(user.length<=4) badges.push('og_name'); // 3L/4L/OG
    db.users.push({uid,username:user,email,password:pw,displayName:user,bio:'',avatar:'',views:0,badges,customBadges:[],socials:[],premium:true,role:'user',aliases:[],usernameChanges:0,createdAt:Date.now(),profile:defaultProfile()});
    saveDB(db);setSession(uid);render();
  }
}
/* ---------- APP SHELL ---------- */
function navItem(p,icon,label,extra=''){
  return `<div class="nav-item ${currentPage===p?'active':''}" data-p="${p}"><span class="ic">${icon}</span><span>${label}</span>${extra}</div>`;
}
function renderApp(user){
  const isAdmin=user.role==='admin';
  $('root').innerHTML=`
  <div class="app">
    <aside class="sidebar">
      <div class="brand" style="justify-content:flex-start;margin-bottom:18px;font-size:20px"><span class="dot"></span><span class="brand-text">kioo.zeta</span></div>
      ${navItem('overview','📊','Übersicht')}
      ${navItem('customize','🎨','Anpassen')}
      ${navItem('effects','✨','Profil-Effekte')}
      ${navItem('media','🎵','Media & BG')}
      ${navItem('integrations','🔌','Integrationen')}
      ${navItem('seo','🌐','SEO / Embed')}
      ${navItem('links','🔗','Links')}
      ${navItem('badges','🏅','Badges')}
      ${navItem('premium','💎','Premium','<span class="free-tag">FREE</span>')}
      ${navItem('settings','⚙️','Einstellungen')}
      ${isAdmin?navItem('admin','🛡️','Admin'):''}
      <div class="sidebar-bottom">
        <a href="#/u/${esc(user.username)}" class="btn btn-ghost btn-sm full">👁 Meine Seite</a>
        <div class="user-chip">
          <div class="avatar">${user.avatar?`<img src="${esc(user.avatar)}"/>`:esc(user.username[0].toUpperCase())}</div>
          <div class="meta"><div class="name">${esc(user.displayName||user.username)}</div><div class="uid">UID ${user.uid}</div></div>
        </div>
        <button class="btn btn-ghost btn-sm full" id="logout">Abmelden</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>`;
  document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{currentPage=el.dataset.p;render();});
  $('logout').onclick=()=>{clearSession();currentPage='overview';render();};
  renderPage(user);
}
function renderPage(user){
  const m=$('main');
  switch(currentPage){
    case 'overview':return renderOverview(user,m);
    case 'customize':return renderCustomize(user,m);
    case 'effects':return renderEffectsPage(user,m);
    case 'media':return renderMediaPage(user,m);
    case 'integrations':return renderIntegrations(user,m);
    case 'seo':return renderSEO(user,m);
    case 'links':return renderLinks(user,m);
    case 'badges':return renderBadges(user,m);
    case 'premium':return renderPremium(user,m);
    case 'settings':return renderSettings(user,m);
    case 'admin':return renderAdmin(user,m);
  }
}

    <p class="page-sub">Willkommen zurück, ${esc(user.displayName||user.username)}.</p>
    <div class="grid-4">
      <div class="stat-card"><div class="stat-head">Benutzername<span>✏️</span></div><div class="stat-val">${esc(user.username)}</div><div class="stat-sub">${user.usernameChanges} Änderungen</div></div>
      <div class="stat-card"><div class="stat-head">Aliase<span>👤</span></div><div class="stat-val">${user.aliases.length}</div><div class="stat-sub">unbegrenzt (Premium)</div></div>
      <div class="stat-card"><div class="stat-head">UID<span>#</span></div><div class="stat-val">${user.uid}</div><div class="stat-sub">${new Date(user.createdAt).toLocaleDateString()}</div></div>
      <div class="stat-card"><div class="stat-head">Profilaufrufe<span>👁</span></div><div class="stat-val">${user.views.toLocaleString()}</div><div class="stat-sub">insgesamt</div></div>
    </div>
    <div class="grid-2">
      <div class="section"><h2>Profil-Vervollständigung</h2><p style="color:var(--muted);font-size:13px;margin-bottom:10px">${c.percent}% abgeschlossen</p><div class="progress"><div style="width:${c.percent}%"></div></div><div class="task-grid">${c.tasks.map(t=>`<div class="task ${t.done?'done':''}"><span class="dot">${t.done?'✓':'!'}</span><span>${esc(t.label)}</span></div>`).join('')}</div></div>
      <div class="section"><h2>Schnellzugriff</h2><div class="manage-list">
        <button class="manage-btn" onclick="changeUsername()">✏️ Benutzernamen ändern</button>
        <button class="manage-btn" onclick="changeDisplayName()">💬 Anzeigenamen ändern</button>
        <button class="manage-btn" onclick="manageAliases()">👤 Aliase verwalten</button>
        <button class="manage-btn" onclick="currentPage='customize';render()">🎨 Anpassen</button>
        <button class="manage-btn" onclick="currentPage='effects';render()">✨ Effekte</button>
      </div></div>
    </div>`;
}
function computeCompletion(u){
  const t=[
    {label:'Avatar hochladen',done:!!u.avatar},
    {label:'Bio hinzufügen',done:!!u.bio},
    {label:'Mind. 1 Social',done:u.socials.length>0},
    {label:'Hintergrund setzen',done:!!u.profile.bgUrl},
    {label:'Akzentfarbe gesetzt',done:u.profile.accent!=='#a855f7'},
    {label:'Effekt aktiv',done:u.profile.effect!=='none'},
  ];
  const done=t.filter(x=>x.done).length;
  return {percent:Math.round(done/t.length*100),tasks:t};
}
window.changeUsername=()=>{
  const u=currentUser();
  modal('Benutzernamen ändern',`<div class="field"><label>Neuer Benutzername</label><input id="nu" value="${esc(u.username)}"/><div class="err" id="nue"></div></div>`,bg=>{
    const v=bg.querySelector('#nu').value.trim();const err=bg.querySelector('#nue');
    if(!/^[a-zA-Z0-9_]{1,20}$/.test(v)){err.textContent='Ungültig';return false;}
    const db=loadDB();
    if(db.users.some(x=>x.uid!==u.uid&&x.username.toLowerCase()===v.toLowerCase())){err.textContent='Vergeben';return false;}
    const badges=[...u.badges];if(v.length<=4&&!badges.includes('og_name'))badges.push('og_name');
    updateUser(u.uid,{username:v,usernameChanges:u.usernameChanges+1,badges});
    toast('Benutzername geändert');render();
  });
};
window.changeDisplayName=()=>{const u=currentUser();modal('Anzeigename ändern',`<input id="nd" value="${esc(u.displayName||'')}"/>`,bg=>{updateUser(u.uid,{displayName:bg.querySelector('#nd').value.trim()});toast('Geändert');render();});};
window.manageAliases=()=>{
  const u=currentUser();
  modal('Aliase',`<p style="color:var(--muted);margin-bottom:10px">Aktuell: ${esc(u.aliases.join(', ')||'keine')}</p><input id="al" placeholder="Neuer Alias"/>`,bg=>{const v=bg.querySelector('#al').value.trim();if(!v)return false;updateUser(u.uid,{aliases:[...u.aliases,v]});toast('Hinzugefügt');render();},'Hinzufügen');
};

    <p class="page-sub">Verknüpfe deine Social-Media-Profile.</p>
    <div class="section"><div class="social-grid">${SOCIALS.map(s=>`<button class="social-icon" data-s="${s.id}" title="${s.name}" style="color:${s.color}">${s.icon}</button>`).join('')}</div></div>
    <div class="section"><h2>Deine Links (${user.socials.length})</h2>${user.socials.length===0?`<small>Noch keine Links</small>`:user.socials.map((l,i)=>{const s=SOCIALS.find(x=>x.id===l.type)||{name:l.type,icon:'🔗',color:'#666'};return `<div class="link-item"><div class="icon" style="background:${s.color}">${s.icon}</div><div class="info"><div class="name">${esc(s.name)}</div><div class="url">${esc(l.url)}</div></div><button onclick="deleteLink(${i})">🗑</button></div>`;}).join('')}</div>`;
  document.querySelectorAll('.social-icon').forEach(b=>b.onclick=()=>addLink(b.dataset.s));
}
window.addLink=type=>{const u=currentUser();const s=SOCIALS.find(x=>x.id===type);modal(`${s.name} hinzufügen`,`<input id="lu" placeholder="URL oder Handle"/>`,bg=>{const v=bg.querySelector('#lu').value.trim();if(!v)return false;updateUser(u.uid,{socials:[...u.socials,{type,url:v}]});toast('Hinzugefügt');render();},'Hinzufügen');};
window.deleteLink=i=>{const u=currentUser();const s=[...u.socials];s.splice(i,1);updateUser(u.uid,{socials:s});render();};
/* ---------- BADGES ---------- */
function renderBadges(user,m){
  const all=[...ALL_BADGES,...user.customBadges.map(c=>({...c,custom:true}))];
  m.innerHTML=`
    <h1 class="page-title">Badges 🏅</h1>
    <div class="badge-grid">${all.map(b=>{const owned=user.badges.includes(b.id);return `<div class="badge-card"><div class="badge-icon" style="background:${b.color}22;color:${b.color}">${b.icon}</div><div class="badge-info"><div class="t">${esc(b.name)}${b.custom?' <span class="premium-tag">CUSTOM</span>':''}</div><div class="d">${esc(b.desc)}</div></div>${owned?'<span class="own">✓</span>':''}</div>`;}).join('')}</div>
    <div class="section"><h2>Custom Badges <span class="free-tag">FREE</span></h2><p style="color:var(--muted);font-size:13px;margin-bottom:10px">Erstelle eigene Badges.</p><button class="btn btn-sm" onclick="addCustomBadge()">+ Erstellen</button>${user.customBadges.length?`<div class="badge-grid" style="margin-top:14px">${user.customBadges.map((b,i)=>`<div class="badge-card"><div class="badge-icon" style="background:${b.color}22;color:${b.color}">${b.icon}</div><div class="badge-info"><div class="t">${esc(b.name)}</div><div class="d">${esc(b.desc)}</div></div><button onclick="deleteCustomBadge(${i})" style="color:var(--red)">🗑</button></div>`).join('')}</div>`:''}</div>`;
}
window.addCustomBadge=()=>{const u=currentUser();modal('Custom Badge',`<div class="field"><label>Name</label><input id="cn"/></div><div class="field"><label>Icon (Emoji)</label><input id="ci" value="✨"/></div><div class="field"><label>Beschreibung</label><input id="cd"/></div><div class="field"><label>Farbe</label><input type="color" id="cc" value="#a855f7"/></div>`,bg=>{const b={id:'custom_'+Date.now(),name:bg.querySelector('#cn').value.trim()||'Badge',icon:bg.querySelector('#ci').value||'✨',desc:bg.querySelector('#cd').value.trim()||'Custom',color:bg.querySelector('#cc').value};updateUser(u.uid,{customBadges:[...u.customBadges,b],badges:[...u.badges,b.id]});toast('Erstellt');render();},'Erstellen');};
window.deleteCustomBadge=i=>{const u=currentUser();const cb=[...u.customBadges];const r=cb.splice(i,1)[0];updateUser(u.uid,{customBadges:cb,badges:u.badges.filter(x=>x!==r.id)});render();};
/* ---------- PREMIUM ---------- */
function renderPremium(user,m){
  m.innerHTML=`
    <h1 class="page-title">Premium 💎</h1>
    <div class="section" style="text-align:center;background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(236,72,153,.1));border-color:rgba(168,85,247,.3)">
      <h2 style="font-size:30px;margin-bottom:6px">Premium <span class="free-tag" style="font-size:14px;padding:4px 14px">100% GRATIS</span></h2>
      <p style="color:var(--muted);margin-bottom:18px">Alle Features für alle. Für immer.</p>
      <div style="text-align:left;max-width:340px;margin:0 auto 20px">
        ${['Custom Badges','Eigene Schriftarten','Typewriter','Alle Profil-Effekte','Audio-Visualizer','Custom Cursor','Background Video/GIF','Discord & Spotify','Unbegrenzte Aliase','SEO/OG Embed','3L/4L/OG Username Schutz'].map(f=>`<div style="padding:6px 0;color:#ccc">✓ ${f}</div>`).join('')}
      </div>
      ${user.premium?'<span class="own" style="font-size:14px;padding:8px 16px">✓ Premium aktiv</span>':`<button class="btn" style="max-width:240px;margin:0 auto" onclick="claimPremium()">Premium aktivieren</button>`}

window.claimPremium=()=>{const u=currentUser();updateUser(u.uid,{premium:true,badges:[...new Set([...u.badges,'premium'])]});toast('Premium aktiviert! 🎉');render();};
/* ---------- SETTINGS ---------- */
function renderSettings(user,m){
  m.innerHTML=`
    <h1 class="page-title">Einstellungen ⚙️</h1>
    <div class="section">
      <h2>Konto</h2>
      <div class="field"><label>Email</label><input id="se" value="${esc(user.email)}"/></div>

window.deleteAccount=()=>{if(!confirm('Wirklich löschen?'))return;const u=currentUser();const db=loadDB();db.users=db.users.filter(x=>x.uid!==u.uid);saveDB(db);clearSession();render();};
/* ---------- ADMIN ---------- */
function renderAdmin(user,m){
  if(user.role!=='admin'){m.innerHTML='<p>Kein Zugriff</p>';return;}
  const db=loadDB();
  m.innerHTML=`
    <h1 class="page-title">Admin 🛡️</h1>
    <div class="section"><h2>Nutzer (${db.users.length})</h2>
      <table><thead><tr><th>UID</th><th>User</th><th>Email</th><th>Views</th><th>Badges</th><th>Premium</th><th>Aktionen</th></tr></thead>
      <tbody>${db.users.map(u=>`<tr><td>${u.uid}</td><td>${esc(u.username)}<br><small>${esc(u.displayName||'')}</small></td><td>${esc(u.email)}</td><td>${u.views}</td><td>${u.badges.length}</td><td>${u.premium?'✓':'✗'}</td><td><div class="row-btns"><button onclick="adminAddViews(${u.uid})">+Views</button><button onclick="adminManageBadges(${u.uid})">Badges</button><button onclick="adminTogglePremium(${u.uid})">${u.premium?'-':'+'} Prem</button><button onclick="adminSetRole(${u.uid})">Rolle</button>${u.uid!==user.uid?`<button class="danger" onclick="adminDelete(${u.uid})">Del</button>`:''}</div></td></tr>`).join('')}</tbody></table>
    </div>`;
}
window.adminAddViews=uid=>{const v=prompt('+/- Views','100');if(!v)return;const n=parseInt(v);if(isNaN(n))return;const db=loadDB();const u=db.users.find(x=>x.uid===uid);u.views=Math.max(0,u.views+n);saveDB(db);render();};
window.adminTogglePremium=uid=>{const db=loadDB();const u=db.users.find(x=>x.uid===uid);u.premium=!u.premium;if(u.premium)u.badges=[...new Set([...u.badges,'premium'])];else u.badges=u.badges.filter(b=>b!=='premium');saveDB(db);render();};
window.adminSetRole=uid=>{const r=prompt('user / admin / staff','user');if(!r)return;const db=loadDB();const u=db.users.find(x=>x.uid===uid);u.role=r;if(r==='admin')u.badges=[...new Set([...u.badges,'admin'])];if(r==='staff')u.badges=[...new Set([...u.badges,'staff'])];saveDB(db);render();};
window.adminDelete=uid=>{if(!confirm('Löschen?'))return;const db=loadDB();db.users=db.users.filter(x=>x.uid!==uid);saveDB(db);render();};
window.adminManageBadges=uid=>{const db=loadDB();const u=db.users.find(x=>x.uid===uid);const html=ALL_BADGES.map(b=>`<label style="display:block;padding:6px"><input type="checkbox" data-b="${b.id}" ${u.badges.includes(b.id)?'checked':''}/> ${b.icon} ${b.name}</label>`).join('');modal('Badges für '+u.username,html,bg=>{const checked=[...bg.querySelectorAll('input[data-b]')].filter(c=>c.checked).map(c=>c.dataset.b);const custom=u.badges.filter(b=>b.startsWith('custom_'));updateUser(uid,{badges:[...checked,...custom]});toast('OK');render();});};
/* ============================================================
   PUBLIC PROFILE — alle Effekte hier
============================================================ */
let _audioCtx=null,_analyser=null,_audioEl=null,_visTimer=null,_fxTimer=null,_lanyardTimer=null;
function cleanupProfileFx(){
  if(_visTimer){cancelAnimationFrame(_visTimer);_visTimer=null;}
  if(_fxTimer){clearInterval(_fxTimer);_fxTimer=null;}
  if(_lanyardTimer){clearInterval(_lanyardTimer);_lanyardTimer=null;}
  if(_audioEl){try{_audioEl.pause();}catch(e){}_audioEl=null;}
  _audioCtx=null;_analyser=null;
}
function renderProfilePage(username){
  cleanupProfileFx();
  const db=loadDB();
  const u=db.users.find(x=>x.username.toLowerCase()===username.toLowerCase()||x.aliases.some(a=>a.toLowerCase()===username.toLowerCase()));
  if(!u){$('root').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><h1 style="font-size:60px">404</h1><p>Profil nicht gefunden</p><a href="#" class="btn btn-sm" style="margin-top:16px;display:inline-block">Zurück</a></div></div>`;return;}
  const viewer=currentUser();
  if(!viewer||viewer.uid!==u.uid){u.views++;saveDB(db);}
  const p=u.profile;
  // SEO + favicon
  const seoTitle=p.seo.title||u.displayName||u.username;
  document.title=seoTitle+' · kioo.zeta';
  setFavicon(p.favicon||'✨');
  setMeta('description',p.seo.desc||u.bio||'kioo.zeta profile');
  setMeta('og:title',seoTitle,true);
  setMeta('og:description',p.seo.desc||u.bio||'',true);
  setMeta('og:image',p.seo.image||u.avatar||'',true);
  setMeta('theme-color',p.seo.color||p.accent);
  // build badges/socials
  const badges=u.badges.map(bid=>{const b=ALL_BADGES.find(x=>x.id===bid)||u.customBadges.find(x=>x.id===bid);return b?`<span class="pb" style="color:${b.color}">${b.icon} ${esc(b.name)}</span>`:'';}).join('');
  const socials=u.socials.map(l=>{const s=SOCIALS.find(x=>x.id===l.type)||{icon:'🔗',color:'#666',name:l.type};const href=l.url.startsWith('http')?l.url:`https://${l.url}`;return `<a href="${esc(href)}" target="_blank" rel="noopener" style="background:${s.color}22;color:${s.color}" title="${s.name}">${s.icon}</a>`;}).join('');
  const cardStyle=`--card-opacity:${p.cardOpacity};--bg-blur:${p.bgBlur}px;--border-w:${p.borderWidth}px;--border-c:${p.borderColor};--border-r:${p.borderRadius}px;--border-glow:${p.borderGlow}px;--accent:${p.accent}`;
  const nameClass=p.nameEffect&&p.nameEffect!=='none'?`fx-${p.nameEffect}`:'';
  const bgHtml=p.bgUrl?(p.bgType==='video'?`<video src="${esc(p.bgUrl)}" autoplay muted loop playsinline></video>`:`<img src="${esc(p.bgUrl)}" alt=""/>`):'';
  const ds=p.discord.enabled?`<div class="ds-status" id="ds-status"><span class="indot"></span><span>Discord lädt…</span></div>`:'';
  const sp=p.spotify.enabled?`<div class="spotify-now"><span class="eq"><i></i><i></i><i></i></span><span>${esc(p.spotify.track)} — ${esc(p.spotify.artist)}</span></div>`:'';
  $('root').innerHTML=`
    ${p.enterScreen?`<div class="enter-screen" id="enterScreen"><div class="es-inner"><h2>${esc(p.enterText||'click anywhere to enter')}</h2><p>kioo.zeta</p></div></div>`:''}
    <div class="profile-bg ${p.bgBlur>0?'blurred':''}">${bgHtml}</div>
    <div class="fx-layer" id="fxLayer"></div>
    <div class="profile-page">
      <div class="profile-card ${p.frosted?'frost':''}" style="${cardStyle}">
        <div class="profile-avatar">${u.avatar?`<img src="${esc(u.avatar)}"/>`:esc(u.username[0].toUpperCase())}</div>
        <h1 class="profile-name ${nameClass}">${esc(u.displayName||u.username)}</h1>
        <div class="profile-uid">@${esc(u.username)} · UID ${u.uid}</div>
        ${badges?`<div class="profile-badges">${badges}</div>`:''}
        <div class="profile-bio" id="bioOut"></div>
        ${ds}${sp}
        ${socials?`<div class="profile-socials">${socials}</div>`:''}
        <div class="profile-views">👁 ${u.views.toLocaleString()} Aufrufe</div>
        ${viewer?`<div style="margin-top:14px"><a href="#" class="btn btn-ghost btn-sm" style="display:inline-block;width:auto;padding:6px 14px">← Dashboard</a></div>`:''}
      </div>
      ${p.visualizer&&p.musicUrl?`<div class="visualizer" id="vis">${Array(48).fill('<span style="height:4px"></span>').join('')}</div>`:''}
    </div>
    ${p.musicUrl?`<div class="music-player" id="mp"><button id="mpToggle">▶</button><div style="font-size:12px;flex:1"><div style="font-weight:600">Background Music</div><div style="color:var(--muted)">${esc(u.username)}</div></div><input type="range" class="mp-vol" id="mpVol" min="0" max="100" value="${p.musicVolume*100}"/></div>`:''}
  `;
  // border animated
  if(p.borderAnimated){
    const card=document.querySelector('.profile-card');
    if(card)card.style.animation='nameBounce 3s infinite';
  }
  // border glow continuous
  if(p.borderGlow>0){const card=document.querySelector('.profile-card');if(card)card.style.boxShadow=`0 0 ${p.borderGlow}px ${p.borderColor}`;}
  // cursor
  if(p.cursorUrl){
    if(p.cursorUrl.startsWith('http')||p.cursorUrl.startsWith('data:')){document.body.style.cursor=`url("${p.cursorUrl}") 16 16, auto`;}
    else {
      const svg=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E${encodeURIComponent(p.cursorUrl)}%3C/text%3E%3C/svg%3E`;
      document.body.style.cursor=`url("${svg}") 16 16, auto`;
    }
  }
  // typewriter
  const bioOut=$('bioOut');
  if(bioOut){
    const text=u.bio||'';
    if(p.typewriter&&text){
      let i=0;const t=setInterval(()=>{bioOut.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(t);},40);
    } else bioOut.textContent=text;
  }
  // music + visualizer
  if(p.musicUrl){
    const audio=new Audio(p.musicUrl);audio.loop=true;audio.volume=p.musicVolume;_audioEl=audio;
    const btn=$('mpToggle');
    const tryPlay=()=>{audio.play().then(()=>btn.textContent='⏸').catch(()=>{btn.textContent='▶';});};
    btn.onclick=()=>{if(audio.paused)tryPlay();else{audio.pause();btn.textContent='▶';}};
    $('mpVol').oninput=e=>{audio.volume=e.target.value/100;};
    if(p.musicAutoplay)setTimeout(tryPlay,300);
    if(p.visualizer&&$('vis')){
      try{
        _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        const src=_audioCtx.createMediaElementSource(audio);
        _analyser=_audioCtx.createAnalyser();_analyser.fftSize=128;
        src.connect(_analyser);_analyser.connect(_audioCtx.destination);
        const bars=[...$('vis').children];
        const data=new Uint8Array(_analyser.frequencyBinCount);
        const tick=()=>{
          _analyser.getByteFrequencyData(data);
          for(let i=0;i<bars.length;i++){const v=data[i%data.length]||0;bars[i].style.height=(4+v/4)+'px';}
          _visTimer=requestAnimationFrame(tick);
        };
        tick();
      }catch(e){console.warn('viz fail',e);}
    }
  }
  // page title animation
  if(p.titleAnim&&p.titleAnim.length>1){
    let i=0;pageTitleTimer=setInterval(()=>{document.title=p.titleAnim[i%p.titleAnim.length]+' · kioo.zeta';i++;},1500);
  }
  // effects
  startEffect(p.effect);
  // enter screen
  const es=$('enterScreen');
  if(es){es.onclick=()=>{es.style.transition='opacity .5s';es.style.opacity=0;setTimeout(()=>es.remove(),500);if(_audioEl&&_audioEl.paused)_audioEl.play().catch(()=>{});if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();};}
  // discord lanyard
  if(p.discord.enabled&&p.discord.id){loadLanyard(p.discord.id);_lanyardTimer=setInterval(()=>loadLanyard(p.discord.id),20000);}
}
function setMeta(name,content,prop=false){
  const sel=prop?`meta[property="${name}"]`:`meta[name="${name}"]`;
  let el=document.querySelector(sel);
  if(!el){el=document.createElement('meta');if(prop)el.setAttribute('property',name);else el.setAttribute('name',name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function setFavicon(v){
  let href=v;
  if(!v.startsWith('http')&&!v.startsWith('data:')){
    href=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E${encodeURIComponent(v)}%3C/text%3E%3C/svg%3E`;
  }
  let link=document.getElementById('favicon');
  if(!link){link=document.createElement('link');link.id='favicon';link.rel='icon';document.head.appendChild(link);}
  link.href=href;
}
async function loadLanyard(id){
  try{
    const r=await fetch(`https://api.lanyard.rest/v1/users/${id}`);
    const j=await r.json();
    if(!j.success)return;
    const d=j.data;
    const el=$('ds-status');if(!el)return;
    const status=d.discord_status;
    const colors={online:'#43b581',idle:'#faa61a',dnd:'#f04747',offline:'#747f8d'};
    let txt=`${d.discord_user.username} — ${status}`;
    const game=d.activities&&d.activities.find(a=>a.type===0);
    if(game)txt+=` · spielt ${game.name}`;
    el.innerHTML=`<span class="indot" style="background:${colors[status]||'#888'};box-shadow:0 0 8px ${colors[status]||'#888'}"></span><span>${esc(txt)}</span>`;
  }catch(e){}
}
/* ----- EFFECTS ENGINE ----- */
function startEffect(name){
  const layer=$('fxLayer');if(!layer||name==='none')return;
  layer.innerHTML='';
  const W=window.innerWidth,H=window.innerHeight;
  if(name==='matrix'){
    const cols=Math.floor(W/20);
    for(let i=0;i<cols;i++){const c=document.createElement('div');c.className='matrix-col';c.style.left=(i*20)+'px';c.style.animation=`matrixFall ${4+Math.random()*6}s linear ${Math.random()*5}s infinite`;c.textContent=Array(20).fill(0).map(()=>String.fromCharCode(0x30A0+Math.random()*96|0)).join('');layer.appendChild(c);}
    if(!document.getElementById('mxKf')){const s=document.createElement('style');s.id='mxKf';s.textContent='@keyframes matrixFall{to{transform:translateY(120vh)}}';document.head.appendChild(s);}
    return;
  }
  const spawn=()=>{
    const p=document.createElement('div');p.className='particle';
    const x=Math.random()*W;
    let content='',size=14,duration=4000+Math.random()*4000;
    let style=`left:${x}px;top:-30px;font-size:${size}px;`;
    switch(name){
      case 'snow':content='❄';size=10+Math.random()*16;duration=6000+Math.random()*5000;style=`left:${x}px;top:-30px;font-size:${size}px;color:#fff;opacity:${.5+Math.random()*.5}`;break;
      case 'rain':content='|';size=14;duration=900+Math.random()*600;style=`left:${x}px;top:-30px;font-size:${size}px;color:#7dd3fc;opacity:.6`;break;
      case 'stars':content='✦';size=8+Math.random()*8;duration=3000+Math.random()*3000;style=`left:${x}px;top:${Math.random()*H}px;font-size:${size}px;color:#fef3c7`;p.style.animation=`twinkle ${1+Math.random()*2}s infinite`;break;
      case 'hearts':content='❤';size=12+Math.random()*14;duration=4000+Math.random()*3000;style=`left:${x}px;top:${H+30}px;font-size:${size}px;color:#ec4899`;break;
      case 'confetti':content='■';size=6+Math.random()*8;duration=3000+Math.random()*2000;style=`left:${x}px;top:-30px;font-size:${size}px;color:hsl(${Math.random()*360},90%,60%);transform:rotate(${Math.random()*360}deg)`;break;
      case 'sparks':content='✦';size=4+Math.random()*8;duration=1500+Math.random()*1000;style=`left:${x}px;top:${H/2+Math.random()*100-50}px;font-size:${size}px;color:#fbbf24`;break;
      case 'smoke':content='●';size=30+Math.random()*40;duration=5000+Math.random()*3000;style=`left:${x}px;top:${H+30}px;font-size:${size}px;color:rgba(200,200,200,.2);filter:blur(8px)`;break;
    }
    p.style.cssText='position:absolute;pointer-events:none;'+style;
    p.textContent=content;
    layer.appendChild(p);
    const goUp=name==='hearts'||name==='smoke'||name==='sparks';
    const ty=goUp?-H-50:H+50;
    p.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*100}px,${ty}px) rotate(${Math.random()*720}deg)`}],{duration,easing:name==='rain'?'linear':'ease-in'});
    setTimeout(()=>p.remove(),duration);
  };
  if(!document.getElementById('twKf')){const s=document.createElement('style');s.id='twKf';s.textContent='@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}';document.head.appendChild(s);}
  if(name==='stars'){for(let i=0;i<60;i++)spawn();return;}
  const rate={snow:200,rain:80,hearts:400,confetti:120,sparks:60,smoke:600}[name]||200;
  _fxTimer=setInterval(spawn,rate);
}
render();
</script>
