<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME VAULT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)),
                  url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: system-ui;
    }
    .glass { background: rgba(30,30,40,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(168,85,247,0.4); }
    .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 50px #a855f7; }
    .anime-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .anime-card:hover { transform: translateY(-15px) scale(1.05); box-shadow: 0 30px 60px rgba(192,38,211,0.6); }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-20">

  <nav class="glass sticky top-0 z-50 border-b border-purple-500 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME VAULT</h1>
        <span class="text-sm text-pink-400 font-medium">Owner & Kiano</span>
      </div>
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400">Verkaufen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">👑 Owner</button>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-2xl">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login Page -->
  <div id="page-login" class="page max-w-md mx-auto mt-20 p-8">
    <div class="glass rounded-3xl p-10">
      <h2 class="text-4xl font-bold neon-purple text-center mb-8">Willkommen</h2>
      <div class="flex mb-6 border-b border-purple-500">
        <button onclick="switchAuthTab(0)" class="flex-1 py-3 font-medium border-b-4 border-purple-500" id="login-tab">Login</button>
        <button onclick="switchAuthTab(1)" class="flex-1 py-3 font-medium" id="reg-tab">Registrieren</button>
      </div>

      <div id="login-form">
        <input id="login-user" type="text" placeholder="Username" class="w-full mb-4 p-4 glass rounded-2xl">
        <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Einloggen</button>
      </div>

      <div id="register-form" class="hidden">
        <input id="reg-user" type="text" placeholder="Username" class="w-full mb-4 p-4 glass rounded-2xl">
        <button onclick="register()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Registrieren</button>
      </div>
    </div>
  </div>

  <!-- Shop Page -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">🛒 Shop</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </div>

  <!-- Sell Page -->
  <div id="page-sell" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">📦 Produkt einstellen</h2>
    <div class="glass p-8 rounded-3xl max-w-2xl mx-auto">
      <input id="new-name" type="text" placeholder="Produktname" class="w-full mb-4 p-4 glass rounded-2xl">
      <input id="new-price" type="number" placeholder="Preis in €" class="w-full mb-4 p-4 glass rounded-2xl">
      <input id="new-stock" type="number" placeholder="Stock" value="10" class="w-full mb-4 p-4 glass rounded-2xl">
      <input id="new-img" type="text" placeholder="Bild URL (optional)" class="w-full mb-4 p-4 glass rounded-2xl">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 p-4 glass rounded-2xl"></textarea>
      <button onclick="addProduct()" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Produkt hochladen</button>
    </div>
  </div>

  <!-- Profile Page -->
  <div id="page-profile" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">👤 Mein Profil</h2>
    <div class="glass p-8 rounded-3xl" id="profile-content"></div>
  </div>

  <!-- Owner Panel -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-10">👑 Owner Panel</h2>
    <div class="glass p-8 rounded-3xl">
      <div class="flex border-b border-purple-500 mb-8">
        <button onclick="switchAdminTab(0)" class="admin-tab px-8 py-4 border-b-4 border-purple-500 font-medium" id="tab-0">Statistiken</button>
        <button onclick="switchAdminTab(1)" class="admin-tab px-8 py-4 font-medium" id="tab-1">Produkte</button>
        <button onclick="switchAdminTab(2)" class="admin-tab px-8 py-4 font-medium" id="tab-2">User verwalten</button>
        <button onclick="switchAdminTab(3)" class="admin-tab px-8 py-4 font-medium" id="tab-3">Mitteilungen</button>
      </div>

      <!-- Tab 0: Statistiken -->
      <div id="admin-tab-0" class="admin-tab-content">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="stats"></div>
      </div>

      <!-- Tab 1: Produkte -->
      <div id="admin-tab-1" class="admin-tab-content hidden">
        <div id="products-admin"></div>
      </div>

      <!-- Tab 2: User verwalten -->
      <div id="admin-tab-2" class="admin-tab-content hidden">
        <div id="users-admin"></div>
      </div>

      <!-- Tab 3: Mitteilungen -->
      <div id="admin-tab-3" class="admin-tab-content hidden">
        <textarea id="announcement-text" class="w-full h-40 glass rounded-3xl p-6 text-lg" placeholder="Schreibe eine Mitteilung an alle User..."></textarea>
        <button onclick="sendAnnouncement()" class="mt-6 bg-purple-600 hover:bg-purple-700 px-12 py-4 rounded-2xl text-lg">An alle User senden</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbz1N77hZDksKP9-yZdiW4GR8JtIcHvbQ",
      authDomain: "anime-vault-e439b.firebaseapp.com",
      databaseURL: "https://anime-vault-e439b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "anime-vault-e439b",
      storageBucket: "anime-vault-e439b.firebasestorage.app",
      messagingSenderId: "406742408925",
      appId: "1:406742408925:web:ba161f393b7e3503164534"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let cart = [];
    const admins = ["kiollegend", "ZayTox"];

    function isAdmin(user) {
      return admins.includes(user?.username);
    }

    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const pageEl = document.getElementById(`page-${page}`);
      if (pageEl) pageEl.classList.remove('hidden');

      if (page === 'shop') loadProducts();
      if (page === 'profile') loadProfile();
      if (page === 'admin' && isAdmin(currentUser)) loadAdminPanel();
    }

    function switchAdminTab(n) {
      document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`admin-tab-${n}`).classList.remove('hidden');
    }

    // ==================== SHOP ====================
    function loadProducts() {
      db.ref('products').on('value', (snap) => {
        const prods = snap.val() || {};
        let html = '';
        Object.keys(prods).forEach(key => {
          const p = prods[key];
          html += `
            <div class="anime-card glass p-6 rounded-3xl cursor-pointer" onclick="addToCart('${key}')">
              ${p.img ? `<img src="${p.img}" class="w-full h-48 object-cover rounded-2xl mb-4">` : ''}
              <h3 class="font-bold text-xl mb-2">${p.name}</h3>
              <p class="text-purple-400 text-3xl">${p.price} €</p>
              <p class="text-sm text-gray-400 mt-1">Stock: ${p.stock || 0} • ${p.seller}</p>
            </div>`;
        });
        document.getElementById('products').innerHTML = html || '<p class="text-gray-400 text-xl col-span-full text-center py-20">Noch keine Produkte verfügbar.</p>';
      });
    }

    // ==================== PROFILE ====================
    function loadProfile() {
      if (!currentUser) return;
      document.getElementById('profile-content').innerHTML = `
        <div class="text-center py-12">
          <h3 class="text-5xl mb-6">Willkommen, <span class="neon-purple">${currentUser.username}</span>!</h3>
          <button onclick="navigate('sell')" class="bg-purple-600 hover:bg-purple-700 px-12 py-5 rounded-2xl text-2xl font-medium">
            Neues Produkt einstellen
          </button>
        </div>
      `;
    }

    // ==================== SELL ====================
    function addProduct() {
      if (!currentUser) return alert("Bitte einloggen!");
      const product = {
        name: document.getElementById('new-name').value.trim(),
        price: parseFloat(document.getElementById('new-price').value),
        stock: parseInt(document.getElementById('new-stock').value) || 10,
        img: document.getElementById('new-img').value.trim(),
        desc: document.getElementById('new-desc').value.trim(),
        seller: currentUser.username,
        timestamp: Date.now()
      };

      if (!product.name || !product.price) return alert("Name und Preis müssen ausgefüllt werden!");

      db.ref('products').push(product).then(() => {
        alert("✅ Produkt erfolgreich hochgeladen!");
        document.getElementById('new-name').value = '';
        document.getElementById('new-price').value = '';
        document.getElementById('new-desc').value = '';
        navigate('shop');
      });
    }

    // ==================== ADMIN ====================
    function loadAdminPanel() {
      switchAdminTab(0);
      loadStats();
      loadProductsAdmin();
      loadUsersAdmin();
    }

    function loadStats() {
      db.ref('products').once('value', (snap) => {
        const prods = snap.val() || {};
        let value = 0;
        Object.values(prods).forEach(p => value += (p.price || 0) * (p.stock || 0));

        document.getElementById('stats').innerHTML = `
          <div class="glass p-8 rounded-3xl text-center">
            <p class="text-5xl font-bold text-purple-400">${Object.keys(prods).length}</p>
            <p>Produkte</p>
          </div>
          <div class="glass p-8 rounded-3xl text-center">
            <p class="text-5xl font-bold text-pink-400" id="user-stat">0</p>
            <p>Registrierte User</p>
          </div>
          <div class="glass p-8 rounded-3xl text-center">
            <p class="text-5xl font-bold text-green-400">${value.toFixed(0)} €</p>
            <p>Gesamtwert</p>
          </div>
        `;
      });
    }

    function loadProductsAdmin() {
      db.ref('products').on('value', (snap) => {
        const prods = snap.val() || {};
        let html = '<h3 class="text-2xl mb-6">Alle Produkte</h3>';
        Object.keys(prods).forEach(key => {
          const p = prods[key];
          html += `
            <div class="glass p-6 rounded-3xl mb-6 flex justify-between items-center">
              <div>
                <h3 class="font-bold">${p.name}</h3>
                <p>${p.price} € • Stock: ${p.stock} • Von: ${p.seller}</p>
              </div>
              <button onclick="editProduct('${key}')" class="bg-blue-600 px-6 py-2 rounded-2xl">Preis ändern</button>
            </div>`;
        });
        document.getElementById('products-admin').innerHTML = html;
      });
    }

    function editProduct(key) {
      const newPrice = prompt("Neuer Preis eingeben:");
      if (newPrice !== null) db.ref('products/' + key + '/price').set(parseFloat(newPrice));
    }

    function loadUsersAdmin() {
      db.ref('users').once('value', (snap) => {
        const users = snap.val() || {};
        let html = '<h3 class="text-2xl mb-6">Registrierte User</h3>';
        Object.keys(users).forEach(u => {
          html += `
            <div class="glass p-5 rounded-3xl mb-4 flex justify-between items-center">
              <span class="font-medium">${u}</span>
              <button onclick="deleteUser('${u}')" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-2xl text-sm">Löschen / Sperren</button>
            </div>`;
        });
        document.getElementById('users-admin').innerHTML = html || "<p class='text-gray-400'>Noch keine User registriert.</p>";
      });
    }

    function deleteUser(username) {
      if (confirm(`User "${username}" wirklich löschen / sperren?`)) {
        db.ref('users/' + username).remove();
      }
    }

    function sendAnnouncement() {
      const text = document.getElementById('announcement-text').value.trim();
      if (!text) return alert("Bitte eine Mitteilung schreiben!");
      db.ref('announcements').push({
        message: text,
        from: currentUser.username,
        time: Date.now()
      }).then(() => {
        alert("Mitteilung erfolgreich gesendet!");
        document.getElementById('announcement-text').value = '';
      });
    }

    // ==================== AUTH & CART ====================
    function addToCart(id) {
      db.ref('products/' + id).once('value', (snap) => {
        const prod = snap.val();
        if (!prod) return;
        const existing = cart.find(item => item.id === id);
        if (existing) existing.quantity++;
        else cart.push({...prod, id, quantity: 1});
        alert(`${prod.name} in den Warenkorb gelegt!`);
      });
    }

    function login() {
      const username = document.getElementById('login-user').value.trim();
      if (!username) return alert("Bitte Username eingeben");
      currentUser = { username };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      if (isAdmin(currentUser)) document.getElementById('adminBtn').classList.remove('hidden');
      navigate('shop');
    }

    function register() {
      const username = document.getElementById('reg-user').value.trim();
      if (username.length < 3) return alert("Username zu kurz!");
      currentUser = { username };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      db.ref('users/' + username).set({ registered: Date.now() });
      alert("Registrierung erfolgreich!");
      navigate('shop');
    }

    function logout() {
      if (confirm("Wirklich ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    window.onload = () => {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        if (isAdmin(currentUser)) document.getElementById('adminBtn').classList.remove('hidden');
        navigate('shop');
      } else {
        navigate('login');
      }
    };
  </script>
</body>
</html>
