<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME VAULT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)),
                  url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: system-ui;
    }
    .glass { background: rgba(30,30,40,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(168,85,247,0.4); }
    .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 50px #a855f7; }
    .anime-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .anime-card:hover { transform: translateY(-15px) scale(1.05); box-shadow: 0 30px 60px rgba(192,38,211,0.6); }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-20">

  <nav class="glass sticky top-0 z-50 border-b border-purple-500 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME VAULT</h1>
        <span class="text-sm text-pink-400 font-medium">Owner & Kiano</span>
      </div>
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" class="hover:text-purple-400">Verkaufen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">👑 Owner</button>
        <button onclick="showCart()" class="relative hover:text-purple-400">
          <i class="fas fa-shopping-cart text-2xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full px-1.5">0</span>
        </button>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-2xl">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login Page -->
  <div id="page-login" class="page max-w-md mx-auto mt-20 p-8">
    <div class="glass rounded-3xl p-10">
      <h2 class="text-4xl font-bold neon-purple text-center mb-8">ANIME VAULT</h2>
      
      <div class="flex mb-6 border-b border-purple-500">
        <button onclick="switchAuthTab(0)" class="flex-1 py-3 font-medium border-b-4 border-purple-500" id="login-tab">Login</button>
        <button onclick="switchAuthTab(1)" class="flex-1 py-3 font-medium" id="reg-tab">Registrieren</button>
      </div>

      <div id="login-form">
        <input id="login-user" type="text" placeholder="Username" class="w-full mb-4 p-4 glass rounded-2xl">
        <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-6 p-4 glass rounded-2xl">
        <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Einloggen</button>
      </div>

      <div id="register-form" class="hidden">
        <input id="reg-user" type="text" placeholder="Username" class="w-full mb-4 p-4 glass rounded-2xl">
        <input id="reg-pass" type="password" placeholder="Passwort" class="w-full mb-6 p-4 glass rounded-2xl">
        <button onclick="register()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Registrieren</button>
      </div>
    </div>
  </div>

  <!-- Shop Page -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">🛒 Shop</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </div>

  <!-- Sell Page -->
  <div id="page-sell" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">📦 Produkt einstellen</h2>
    <div class="glass p-8 rounded-3xl max-w-2xl mx-auto">
      <input id="new-name" type="text" placeholder="Produktname" class="w-full mb-4 p-4 glass rounded-2xl">
      <input id="new-price" type="number" placeholder="Preis in €" class="w-full mb-4 p-4 glass rounded-2xl">
      <input id="new-stock" type="number" placeholder="Stock" value="10" class="w-full mb-4 p-4 glass rounded-2xl">
      
      <div class="mb-4">
        <label class="block text-sm mb-2">Bild hochladen (Custom Bild)</label>
        <input id="new-image-file" type="file" accept="image/*" class="w-full p-4 glass rounded-2xl">
      </div>
      
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 p-4 glass rounded-2xl"></textarea>
      <button onclick="addProduct()" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl text-xl">Produkt hochladen</button>
    </div>
  </div>

  <!-- Profile Page -->
  <div id="page-profile" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">👤 Mein Profil</h2>
    <div class="glass p-8 rounded-3xl" id="profile-content"></div>
  </div>

  <!-- Warenkorb Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="glass rounded-3xl p-8 max-w-lg w-full mx-4">
      <h3 class="text-3xl font-bold mb-6">🛍️ Warenkorb</h3>
      <div id="cart-items" class="max-h-96 overflow-auto"></div>
      <div class="border-t border-purple-500 pt-6 mt-6">
        <p class="text-2xl font-bold text-right" id="cart-total">Gesamt: 0 €</p>
      </div>
      <button onclick="checkout()" class="mt-6 w-full bg-green-600 hover:bg-green-700 py-5 rounded-2xl text-xl font-medium">
        Zur Kasse (Discord erforderlich)
      </button>
      <button onclick="hideCart()" class="mt-3 w-full py-4 text-gray-400 hover:text-white">Schließen</button>
    </div>
  </div>

  <!-- Owner Panel (unverändert) -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <!-- ... (dein bisheriger Admin-Bereich bleibt gleich) ... -->
    <h2 class="text-5xl font-bold neon-purple mb-10">👑 Owner Panel</h2>
    <div class="glass p-8 rounded-3xl">
      <div class="flex border-b border-purple-500 mb-8">
        <button onclick="switchAdminTab(0)" class="admin-tab px-8 py-4 border-b-4 border-purple-500 font-medium">Statistiken</button>
        <button onclick="switchAdminTab(1)" class="admin-tab px-8 py-4 font-medium">Produkte</button>
        <button onclick="switchAdminTab(2)" class="admin-tab px-8 py-4 font-medium">User verwalten</button>
      </div>
      <div id="admin-tab-0" class="admin-tab-content">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="stats"></div>
      </div>
      <!-- Weitere Tabs wie vorher -->
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbz1N77hZDksKP9-yZdiW4GR8JtIcHvbQ",
      authDomain: "anime-vault-e439b.firebaseapp.com",
      databaseURL: "https://anime-vault-e439b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "anime-vault-e439b",
      storageBucket: "anime-vault-e439b.firebasestorage.app",
      messagingSenderId: "406742408925",
      appId: "1:406742408925:web:ba161f393b7e3503164534"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    let currentUser = null;
    let cart = [];

    const admins = ["kiollegend", "ZayTox"];
    const discordLink = "https://discord.gg/drU8egcx3W";

    function isAdmin(user) {
      return admins.includes(user?.username);
    }

    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${page}`).classList.remove('hidden');

      if (page === 'shop') loadProducts();
      if (page === 'profile') loadProfile();
      if (page === 'admin' && isAdmin(currentUser)) loadAdminPanel();
    }

    // ==================== AUTH (mit Passwort) ====================
    async function register() {
      const username = document.getElementById('reg-user').value.trim();
      const password = document.getElementById('reg-pass').value.trim();
      
      if (username.length < 3 || password.length < 4) return alert("Username mind. 3 Zeichen, Passwort mind. 4 Zeichen!");

      const userRef = db.ref('users/' + username);
      const snap = await userRef.once('value');
      
      if (snap.exists()) return alert("Dieser Username existiert bereits!");

      await userRef.set({
        username: username,
        password: password,   // Hinweis: In echtem Projekt muss das gehasht werden!
        registered: Date.now()
      });

      alert("Registrierung erfolgreich!");
      loginAfterRegister(username, password);
    }

    function login() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value.trim();

      db.ref('users/' + username).once('value', (snap) => {
        const user = snap.val();
        if (!user || user.password !== password) {
          return alert("Falscher Username oder Passwort!");
        }
        currentUser = { username };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        if (isAdmin(currentUser)) document.getElementById('adminBtn').classList.remove('hidden');
        navigate('shop');
      });
    }

    function loginAfterRegister(username, password) {
      currentUser = { username };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      navigate('shop');
    }

    // ==================== PRODUKT MIT BILD UPLOAD ====================
    async function addProduct() {
      if (!currentUser) return alert("Bitte einloggen!");

      const name = document.getElementById('new-name').value.trim();
      const price = parseFloat(document.getElementById('new-price').value);
      const stock = parseInt(document.getElementById('new-stock').value) || 10;
      const desc = document.getElementById('new-desc').value.trim();
      const fileInput = document.getElementById('new-image-file');

      if (!name || !price) return alert("Name und Preis ausfüllen!");

      let imageUrl = '';

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const storageRef = storage.ref('product-images/' + Date.now() + '-' + file.name);
        await storageRef.put(file);
        imageUrl = await storageRef.getDownloadURL();
      }

      const product = {
        name, price, stock, desc,
        img: imageUrl,
        seller: currentUser.username,
        timestamp: Date.now()
      };

      await db.ref('products').push(product);
      alert("✅ Produkt mit Bild hochgeladen!");
      
      // Felder leeren
      document.getElementById('new-name').value = '';
      document.getElementById('new-price').value = '';
      document.getElementById('new-desc').value = '';
      document.getElementById('new-image-file').value = '';
      
      navigate('shop');
    }

    // ==================== SHOP & PRODUKTE ====================
    function loadProducts() {
      db.ref('products').on('value', (snap) => {
        const prods = snap.val() || {};
        let html = '';
        Object.keys(prods).forEach(key => {
          const p = prods[key];
          html += `
            <div class="anime-card glass p-6 rounded-3xl cursor-pointer" onclick="addToCart('${key}')">
              ${p.img ? `<img src="${p.img}" class="w-full h-48 object-cover rounded-2xl mb-4">` : ''}
              <h3 class="font-bold text-xl mb-2">${p.name}</h3>
              <p class="text-purple-400 text-3xl">${p.price} €</p>
              <p class="text-sm text-gray-400">Stock: ${p.stock} • ${p.seller}</p>
            </div>`;
        });
        document.getElementById('products').innerHTML = html || '<p class="col-span-full text-center py-20 text-gray-400">Noch keine Produkte</p>';
      });
    }

    function addToCart(id) {
      db.ref('products/' + id).once('value', (snap) => {
        const prod = snap.val();
        if (!prod) return;
        const existing = cart.find(i => i.id === id);
        if (existing) existing.quantity++;
        else cart.push({ ...prod, id, quantity: 1 });
        updateCartCount();
        alert(`${prod.name} wurde in den Warenkorb gelegt!`);
      });
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = count;
    }

    function showCart() {
      if (cart.length === 0) return alert("Warenkorb ist leer");
      
      let html = '';
      let total = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div class="flex justify-between items-center bg-gray-800/50 p-4 rounded-2xl mb-3">
            <div>
              <div class="font-medium">${item.name}</div>
              <div class="text-sm text-gray-400">${item.quantity}x • ${item.price} €</div>
            </div>
            <div class="text-right">
              <div>${itemTotal.toFixed(2)} €</div>
            </div>
          </div>`;
      });

      document.getElementById('cart-items').innerHTML = html;
      document.getElementById('cart-total').innerHTML = `Gesamt: <span class="text-green-400">${total.toFixed(2)} €</span>`;
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function hideCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function checkout() {
      hideCart();
      alert("✅ Um den Kauf abzuschließen, musst du unserem Discord-Server beitreten!\n\nKlicke OK und trete bei:");
      window.open(discordLink, "_blank");
    }

    // ==================== PROFILE ====================
    function loadProfile() {
      document.getElementById('profile-content').innerHTML = `
        <div class="text-center py-12">
          <h3 class="text-5xl mb-6">Willkommen, <span class="neon-purple">${currentUser.username}</span>!</h3>
          <button onclick="navigate('sell')" class="bg-purple-600 hover:bg-purple-700 px-12 py-5 rounded-2xl text-2xl">Neues Produkt einstellen</button>
        </div>
      `;
    }

    // ==================== ADMIN (echte Statistiken) ====================
    function loadAdminPanel() {
      switchAdminTab(0);
      loadRealStats();
    }

    function loadRealStats() {
      // Produkte + User echt laden
      db.ref('products').once('value', (prodSnap) => {
        db.ref('users').once('value', (userSnap) => {
          const prods = prodSnap.val() || {};
          const users = userSnap.val() || {};
          let value = 0;
          Object.values(prods).forEach(p => value += (p.price || 0) * (p.stock || 0));

          document.getElementById('stats').innerHTML = `
            <div class="glass p-8 rounded-3xl text-center">
              <p class="text-5xl font-bold text-purple-400">${Object.keys(prods).length}</p>
              <p>Produkte</p>
            </div>
            <div class="glass p-8 rounded-3xl text-center">
              <p class="text-5xl font-bold text-pink-400">${Object.keys(users).length}</p>
              <p>Registrierte User</p>
            </div>
            <div class="glass p-8 rounded-3xl text-center">
              <p class="text-5xl font-bold text-green-400">${value.toFixed(0)} €</p>
              <p>Gesamtwert Lager</p>
            </div>
          `;
        });
      });
    }

    function logout() {
      if (confirm("Wirklich ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    // Admin-Tab Funktion (kurz)
    function switchAdminTab(n) {
      document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`admin-tab-${n}`).classList.remove('hidden');
    }

    window.onload = () => {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        if (isAdmin(currentUser)) document.getElementById('adminBtn').classList.remove('hidden');
        navigate('shop');
      } else {
        navigate('login');
      }
    };
  </script>
</body>
</html>
