<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIOSHOP Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Inter,sans-serif;background:#0a0a0a;color:#e8e4dc}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:14px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#0a0a0a;
}

button{cursor:pointer}

/* LOGIN */
#auth{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.9);
  z-index:999;
}
.box{
  width:320px;
  background:#111;
  padding:20px;
  border:1px solid #222;
}
input{
  width:100%;
  padding:10px;
  margin:6px 0;
  background:#000;
  border:1px solid #333;
  color:#fff;
}

/* LAYOUT */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  padding:20px;
}
.card{
  background:#111;
  border:1px solid #222;
  padding:10px;
}

/* PROFILE */
.profile{
  padding:20px;
}

/* NOTIF */
.bell{
  position:relative;
  background:transparent;
  border:1px solid #333;
  color:#fff;
  padding:6px 10px;
}
#notifCount{
  position:absolute;
  top:-6px;right:-6px;
  background:red;
  font-size:10px;
  padding:2px 5px;
  border-radius:10px;
}

/* DROPDOWN */
.dropdown{
  position:absolute;
  right:10px;
  top:50px;
  background:#111;
  border:1px solid #333;
  width:240px;
  display:none;
}
.dropdown div{
  padding:8px;
  border-bottom:1px solid #222;
  font-size:12px;
}
.hidden{display:none}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <div class="box">
    <h3>KIOSHOP</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Passwort">
    <input id="username" placeholder="Username (nur Register)">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- NAV -->
<nav>
  <b onclick="goHome()" style="cursor:pointer">KIOSHOP</b>

  <div style="position:relative">
    <button class="bell" onclick="toggleNotif()">🔔 <span id="notifCount"></span></button>

    <div id="notifBox" class="dropdown"></div>
  </div>

  <button onclick="logout()">Logout</button>
</nav>

<!-- APP -->
<div id="app">

  <div id="feed" class="products"></div>

  <div id="profile" class="profile hidden"></div>

  <div id="admin" class="profile hidden"></div>

</div>

<script>
/* SUPABASE */
const sb = supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

/* STATE */
let user = null;
let routeUser = null;

/* ROUTER */
function getRoute(){
  const url = new URL(location.href);
  return url.searchParams.get("user");
}

/* INIT */
async function init(){

  routeUser = getRoute();

  const { data } = await sb.auth.getUser();

  if(data.user){
    user = data.user;
    document.getElementById("auth").style.display="none";
    loadFeed();
    loadNotifications();
  }

  if(routeUser){
    loadProfile(routeUser);
  }
}

init();

/* REGISTER */
async function register(){
  const { data } = await sb.auth.signUp({
    email: email.value,
    password: password.value
  });

  if(data.user){
    await sb.from("profiles").insert({
      id:data.user.id,
      username:username.value
    });
  }
}

/* LOGIN */
async function login(){
  const { data } = await sb.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });

  if(data.user){
    location.reload();
  }
}

/* LOGOUT */
async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* FEED */
async function loadFeed(){

  const { data } = await sb.from("products").select("*");

  document.getElementById("feed").innerHTML =
    data.map(p=>`
      <div class="card">
        <b>${p.title}</b>
        <p>€${p.price}</p>

        <button onclick="like('${p.id}')">❤️</button>
        <button onclick="save('${p.id}')">🔖</button>
        <button onclick="comment('${p.id}')">💬</button>

        <button onclick="openProfile('${p.creator_id}')">Creator</button>
      </div>
    `).join("");
}

/* PROFILE */
async function loadProfile(id){

  document.getElementById("feed").classList.add("hidden");
  document.getElementById("profile").classList.remove("hidden");

  const { data: profile } = await sb.from("profiles").select("*").eq("id",id).single();
  const { data: products } = await sb.from("products").select("*").eq("creator_id",id);
  const { data: followers } = await sb.from("follows").select("*").eq("following_id",id);

  document.getElementById("profile").innerHTML = `
    <h2>${profile.username}</h2>
    <p>Followers: ${followers.length}</p>

    <button onclick="follow('${id}')">Follow</button>

    <h3>Produkte</h3>
    ${products.map(p=>`<div class="card">${p.title}</div>`).join("")}
  `;
}

/* FOLLOW */
async function follow(id){
  await sb.from("follows").insert({
    follower_id:user.id,
    following_id:id
  });

  notify(id,"follow");
}

/* LIKE */
async function like(pid){
  await sb.from("likes").insert({
    user_id:user.id,
    product_id:pid
  });

  notify(null,"like",pid);
}

/* SAVE */
async function save(pid){
  await sb.from("wishlist").insert({
    user_id:user.id,
    product_id:pid
  });
}

/* COMMENT */
async function comment(pid){
  const text = prompt("Kommentar:");
  if(!text)return;

  await sb.from("comments").insert({
    user_id:user.id,
    product_id:pid,
    text
  });

  notify(null,"comment",pid);
}

/* NOTIFICATIONS */
async function notify(to,type,pid=null){

  await sb.from("notifications").insert({
    user_id:to || user.id,
    from_user:user.id,
    type,
    product_id:pid,
    read:false
  });

  loadNotifications();
}

/* LOAD NOTIFS */
async function loadNotifications(){

  const { data } = await sb
    .from("notifications")
    .select("*")
    .eq("user_id",user.id)
    .eq("read",false);

  notifCount.innerText = data.length || "";

  document.getElementById("notifBox").innerHTML =
    data.map(n=>`
      <div>${n.type} event</div>
    `).join("");
}

/* TOGGLE NOTIF */
function toggleNotif(){
  const box = document.getElementById("notifBox");
  box.style.display = box.style.display==="block"?"none":"block";
}

/* PROFILE LINK */
function openProfile(id){
  location.href = "/?user="+id;
}

/* HOME */
function goHome(){
  location.href = "/";
}
</script>

</body>
</html>
