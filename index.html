<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navBtn">Anmelden</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="max-w-2xl mx-auto text-center pt-32">
      <h1 class="text-5xl font-bold mb-4">Willkommen zurück, <span id="welcomeName"></span>!</h1>
      <button onclick="showMyPublicProfile()" class="bg-purple-600 hover:bg-purple-700 px-10 py-4 rounded-2xl text-lg mt-8">Mein Profil ansehen</button>
      <button onclick="logout()" class="ml-4 bg-red-600 hover:bg-red-700 px-10 py-4 rounded-2xl text-lg">Abmelden</button>
    </div>
  </div>

  <script>
    // ==================== DEINE FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyD6NPF9FIJsDipQg3dvxSohtAJCGVF4NUc",
      authDomain: "kiobiool.firebaseapp.com",
      databaseURL: "https://kiobiool-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kiobiool",
      storageBucket: "kiobiool.firebasestorage.app",
      messagingSenderId: "1003434485509",
      appId: "1:1003434485509:web:872f257b0758051c80b96c",
      measurementId: "G-DRW31WCCN5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    // ==================== REGISTRIERUNG ====================
    function showRegisterModal() {
      document.getElementById('modalTitle').textContent = "Registrieren";
      document.getElementById('modalContent').innerHTML = `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regPassword" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="registerUser()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Registrieren</button>
      `;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    async function registerUser() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !username || password.length < 6) {
        alert("Bitte alle Felder richtig ausfüllen (Passwort mindestens 6 Zeichen)");
        return;
      }

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Nutzerdaten in Database speichern
        await db.ref('users/' + user.uid).set({
          email: email,
          username: username,
          displayName: username,
          bio: "",
          profilePic: "https://i.pravatar.cc/300?u=" + Date.now()
        });

        alert("✅ Registrierung erfolgreich!");
        closeModal();
        currentUser = user;
        showDashboard();
      } catch (error) {
        alert("Fehler: " + error.message);
      }
    }

    // ==================== LOGIN ====================
    function showLoginModal() {
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl" value="u3271805041@gmail.com">
        <input id="loginPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl" value="666666">
        <button onclick="doLogin()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Anmelden</button>
      `;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        closeModal();
        showDashboard();
      } catch (error) {
        alert("Login fehlgeschlagen: " + error.message);
      }
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";
      document.getElementById('navBtn').onclick = logout;
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function showMyPublicProfile() {
      if (currentUser) window.location.href = `/@k`;   // Vorläufig für Owner
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          showDashboard();
        }
      });
    };
  </script>
</body>
</html>
