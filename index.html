<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@deinname</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-2/cur116.cur'), auto;
        }

        /* Animated background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0a0a0a 100%);
        }

        .background::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(109, 76, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #6d4aff;
            box-shadow: 0 0 30px rgba(109, 76, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(109, 76, 255, 0.5); }
            50% { box-shadow: 0 0 50px rgba(109, 76, 255, 0.8); }
        }

        .username {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #6d4aff;
            text-shadow: 0 0 10px rgba(109, 76, 255, 0.5);
        }

        .bio {
            font-size: 0.9rem;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(109, 76, 255, 0.1);
            border: 1px solid rgba(109, 76, 255, 0.3);
            border-radius: 10px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .link-item:hover {
            background: rgba(109, 76, 255, 0.2);
            border-color: #6d4aff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(109, 76, 255, 0.3);
        }

        .link-item i {
            font-size: 1.5rem;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .link-text {
            flex: 1;
            text-align: left;
            font-weight: 500;
        }

        .tagline {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
        }

        .audio-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(109, 76, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(109, 76, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .audio-player i {
            color: #6d4aff;
        }

        .typing-effect {
            display: inline-block;
            border-right: 2px solid #6d4aff;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: transparent; }
            51%, 100% { border-right: 2px solid #6d4aff; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <!-- Avatar Bild -->
        <img src="https://via.placeholder.com/150/6d4aff/ffffff?text=L" alt="Avatar" class="avatar">
        
        <!-- Username -->
        <div class="username">@deinname</div>
        
        <!-- Bio -->
        <div class="bio">
            <span class="typing-effect">Developer | Gamer | Creator</span>
        </div>
        
        <!-- Links -->
        <div class="links">
            <a href="https://discord.com" class="link-item" target="_blank">
                <i class="fab fa-discord"></i>
                <span class="link-text">Discord</span>
            </a>
            
            <a href="https://instagram.com" class="link-item" target="_blank">
                <i class="fab fa-instagram"></i>
                <span class="link-text">Instagram</span>
            </a>
            
            <a href="https://twitter.com" class="link-item" target="_blank">
                <i class="fab fa-twitter"></i>
                <span class="link-text">Twitter/X</span>
            </a>
            
            <a href="https://youtube.com" class="link-item" target="_blank">
                <i class="fab fa-youtube"></i>
                <span class="link-text">YouTube</span>
            </a>
            
            <a href="https://github.com" class="link-item" target="_blank">
                <i class="fab fa-github"></i>
                <span class="link-text">GitHub</span>
            </a>
            
            <a href="https://twitch.tv" class="link-item" target="_blank">
                <i class="fab fa-twitch"></i>
                <span class="link-text">Twitch</span>
            </a>
        </div>
        
        <div class="tagline">
            Powered by Lumo ✨
        </div>
    </div>

    <!-- Optional: Audio Player (kommentiert aus) -->
    <!--
    <div class="audio-player">
        <i class="fas fa-music"></i>
        <span id="song-name">Song Titel</span>
    </div>
    -->

    <script>
        // Typing Effect für die Bio
        const bioElement = document.querySelector('.typing-effect');
        const texts = ['Developer | Gamer | Creator', 'Content Creator', 'Tech Enthusiast'];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeEffect() {
            const currentText = texts[textIndex];
            
            if (isDeleting) {
                bioElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                bioElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            if (!isDeleting && charIndex === currentText.length) {
                setTimeout(() => isDeleting = true, 2000);
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
            }

            const speed = isDeleting ? 50 : 100;
            setTimeout(typeEffect, speed);
        }

        document.addEventListener('DOMContentLoaded', typeEffect);

        // Click Sound Effekt (optional)
        document.querySelectorAll('.link-item').forEach(link => {
            link.addEventListener('click', () => {
                const audio = new Audio();
                // Du kannst hier einen eigenen Sound hinzufügen
                console.log('Link geklickt!');
            });
        });
    </script>
</body>
</html>
