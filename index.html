<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol - alo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .sidebar-active { background-color: #6b46c1; color: white; }
    .card { background-color: #1f2937; }
    .preview { background: linear-gradient(135deg, #1a1a2e, #16213e); }
    .template-card { transition: all 0.2s; }
    .template-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-72 bg-black border-r border-zinc-800 flex flex-col">
      <div class="p-5 flex items-center gap-3 border-b border-zinc-800">
        <div class="w-9 h-9 bg-violet-600 rounded-xl flex items-center justify-center text-xl">🔫</div>
        <span class="font-bold text-3xl tracking-tight">guns.lol</span>
      </div>

      <div class="p-4">
        <input type="text" placeholder="Funktionen suchen..." 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
      </div>

      <nav class="flex-1 px-3 space-y-1 overflow-auto">
        <a onclick="switchTab(0)" class="flex items-center gap-3 px-5 py-3.5 rounded-2xl cursor-pointer" id="nav-0">
          <i class="fa-solid fa-user w-5"></i> Konto
        </a>
        <a onclick="switchTab(1)" class="flex items-center gap-3 px-5 py-3.5 hover:bg-zinc-900 rounded-2xl cursor-pointer" id="nav-1">
          <i class="fa-solid fa-wand-magic-sparkles w-5"></i> Anpassen
        </a>
        <a onclick="switchTab(2)" class="flex items-center gap-3 px-5 py-3.5 hover:bg-zinc-900 rounded-2xl cursor-pointer" id="nav-2">
          <i class="fa-solid fa-link w-5"></i> Links
        </a>
        <a onclick="switchTab(3)" class="sidebar-active flex items-center gap-3 px-5 py-3.5 rounded-2xl cursor-pointer" id="nav-3">
          <i class="fa-solid fa-gem w-5"></i> Premium
        </a>
        <a onclick="switchTab(4)" class="flex items-center gap-3 px-5 py-3.5 hover:bg-zinc-900 rounded-2xl cursor-pointer" id="nav-4">
          <i class="fa-solid fa-layer-group w-5"></i> Vorlagen
        </a>
      </nav>

      <div class="p-4 border-t border-zinc-800">
        <div class="flex items-center gap-3 bg-zinc-900 rounded-2xl p-3">
          <img src="https://picsum.photos/id/64/64/64" class="w-12 h-12 rounded-full" alt="alo">
          <div>
            <p class="font-bold">alo</p>
            <p class="text-xs text-zinc-500">UID 805,159</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-black border-b border-zinc-800 p-5 flex items-center justify-between">
        <h1 class="text-2xl font-bold" id="page-title">Premium</h1>
      </div>

      <div class="flex-1 overflow-auto p-6" id="content">
        <!-- Premium Inhalt -->
      </div>
    </div>

    <!-- Profil Vorschau -->
    <div class="w-96 bg-zinc-900 border-l border-zinc-800 hidden lg:flex flex-col">
      <div class="p-4 border-b border-zinc-800 text-center">
        <p class="text-sm text-zinc-400">Profil-Vorschau</p>
      </div>
      <div class="preview flex-1 p-6 overflow-auto" id="preview">
        <div class="max-w-md mx-auto bg-black/70 rounded-3xl overflow-hidden border border-zinc-700">
          <div class="h-48 bg-gradient-to-br from-purple-900 to-black relative flex items-center justify-center text-6xl">🌌</div>
          <div class="pt-8 pb-6 px-6 text-center">
            <h2 class="text-3xl font-bold">alo</h2>
            <p class="text-zinc-400 text-sm mt-1">Kreativer Mensch • Anime Fan</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('nav a').forEach((el, i) => {
        el.classList.toggle('sidebar-active', i === tab);
      });

      const content = document.getElementById('content');
      const title = document.getElementById('page-title');

      if (tab === 3) { // Premium
        title.textContent = 'Premium';
        content.innerHTML = `
          <div class="max-w-2xl mx-auto">
            <div class="card rounded-3xl p-10 text-center">
              <div class="inline-flex items-center gap-3 bg-violet-950 text-violet-300 px-5 py-2 rounded-2xl mb-6">
                <i class="fa-solid fa-gem"></i>
                <span class="font-semibold">PREMIUM</span>
              </div>
              
              <h2 class="text-6xl font-bold">7,99€</h2>
              <p class="text-2xl text-emerald-400 font-medium">/ Lebenslang</p>
              <p class="text-zinc-400 mt-1">Einmal zahlen. Für immer behalten.</p>

              <div class="my-10 border-t border-b border-zinc-700 py-8 text-left">
                <ul class="space-y-4">
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Exklusives Badge</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Profil-Layouts</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Eigene Schriftarten</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Typewriter-Animation</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Besondere Profil-Effekte</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Erweiterte Anpassungen</li>
                  <li class="flex items-center gap-4 text-lg"><span class="text-emerald-400 text-2xl">✓</span> Metadaten- & SEO-Anpassung</li>
                </ul>
              </div>

              <button onclick="alert('Vielen Dank! Du hast Premium Lifetime für 7,99€ aktiviert (Demo)')" 
                      class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 py-5 rounded-2xl text-xl font-bold flex items-center justify-center gap-3">
                Jetzt kaufen 
                <span class="text-2xl">🎁</span>
              </button>

              <p class="text-xs text-zinc-500 mt-6">
                Mehr erfahren auf <a href="#" class="text-violet-400 hover:underline">https://guns.lol/pricing</a>
              </p>
            </div>
          </div>
        `;
      } else if (tab === 4) {
        // Vorlagen (wie zuvor)
        title.textContent = 'Vorlagen';
        content.innerHTML = `... (Vorlagen bleiben gleich wie letzte Version) ...`;
      } else {
        title.textContent = ['Kontoübersicht', 'Anpassen', 'Links', 'Premium', 'Vorlagen'][tab];
        content.innerHTML = `<p class="text-center text-zinc-400 py-20">Tab bereit.</p>`;
      }
    }

    // Direkt zum Premium-Tab starten
    window.onload = () => switchTab(3);
  </script>
</body>
</html>
