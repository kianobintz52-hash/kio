<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiano</title>
    <style>
        /* --- GRUNDSTYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- LANDING PAGE --- */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .landing-title {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
            filter: blur(0.5px);
        }

        .landing-line {
            width: 60px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 3rem auto;
            box-shadow: 0 0 10px #ff0000;
        }

        .enter-btn {
            font-size: 0.8rem;
            color: #ff0000;
            letter-spacing: 0.15em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0.7;
            user-select: none;
        }

        .enter-btn:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- PROFIL PAGE (NUR DEIN PROFIL) --- */
        #profile-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Avatar Bild */
        .avatar-container {
            width: 180px;
            height: 180px;
            border-radius: 50%; /* Rund */
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2); /* Schwarz-Weiß Effekt wie auf deinem Bild */
            transition: filter 0.3s;
        }

        .avatar-container img:hover {
            filter: grayscale(0%) contrast(1);
        }

        /* Name */
        .username {
            font-size: 2rem;
            letter-spacing: 0.1em;
            color: #fff;
            margin-bottom: 10px;
            text-transform: lowercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Status / Linie */
        .status-line {
            width: 40px;
            height: 1px;
            background-color: #ff0000;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 5px #ff0000;
        }

        /* Spotify Button */
        .spotify-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #1DB954; /* Spotify Grün */
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .spotify-btn:hover {
            background-color: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
        }

        .spotify-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .avatar-container {
                width: 140px;
                height: 140px;
            }
            .username {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="landing-page">
        <h1 class="landing-title">barbarossa</h1>
        <div class="landing-line"></div>
        <div class="enter-btn" onclick="enterSite()">[ click to enter ]</div>
    </div>

    <!-- PROFIL PAGE (DEIN PROFIL) -->
    <div id="profile-page">
        <div class="avatar-container">
            <!-- Dein Bild wird hier geladen -->
            <img src="https://i.imgur.com/placeholder.jpg" alt="kiano" id="user-avatar">
            <!-- Hinweis: Da ich das Bild nicht hosten kann, habe ich einen Platzhalter. 
                 Du musst unten im Script den echten Link einfügen oder das Bild lokal speichern. -->
        </div>

        <h2 class="username">kiano</h2>
        <div class="status-line"></div>

        <a href="https://open.spotify.com/intl-de/track/44qGB5mcKyEIZCcBjI6ecn?si=b133160e630b4e1c" target="_blank" class="spotify-btn">
            <svg class="spotify-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Now Playing
        </a>
    </div>

    <script>
        // Hier füge ich dein Bild ein, da ich es direkt aus dem Chat laden kann
        // Du kannst diesen Teil auch löschen und stattdessen ein lokales Bild verwenden
        document.getElementById('user-avatar').src = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD..."; // HIER MÜSSTE DER ECHTE BASE64 CODE DEINES BILDES STEHEN
        
        // Da ich den Base64 Code nicht generieren kann, nutze ich einen Workaround:
        // Speichere dein Bild als "kiano.jpg" im selben Ordner wie diese HTML Datei
        // und ändere die Zeile oben zu:
        // document.getElementById('user-avatar').src = "kiano.jpg";
        
        // Für jetzt nutze ich den Platzhalter, aber du kannst das Bild einfach per Rechtsklick -> "Bild speichern als"
        // herunterladen und dann im Code referenzieren.

        function enterSite() {
            const landingPage = document.getElementById('landing-page');
            const profilePage = document.getElementById('profile-page');

            landingPage.classList.add('hidden');
            
            setTimeout(() => {
                profilePage.style.opacity = '1';
            }, 500);
        }
    </script>
</body>
</html>
