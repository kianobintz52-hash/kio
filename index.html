<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME VAULT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=AfePx5V-Tru6WXLs1fwvK3RjuYKC5No0UmUgB9jmEr0IjsZ3v6BwqeQ0ur3leNkU87nz-RTFDswULn5S&currency=EUR"></script>

  <style>
    body { background: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1015/1920/1080') center/cover fixed; font-family: system-ui; }
    .glass { background: rgba(30,30,40,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(168,85,247,0.4); }
    .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 50px #a855f7; }
    .anime-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .anime-card:hover { transform: translateY(-15px) scale(1.05); box-shadow: 0 30px 60px rgba(192,38,211,0.6); }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-20">

  <nav class="glass sticky top-0 z-50 border-b border-purple-500 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME VAULT</h1>
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-2xl">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login -->
  <div id="page-login" class="page max-w-md mx-auto mt-24 p-12 glass rounded-3xl">
    <h2 class="text-5xl font-bold text-center neon-purple mb-10">ANIME VAULT</h2>
    <div class="flex gap-4 bg-gray-900 rounded-3xl p-1 mb-8">
      <button onclick="switchAuthTab(0)" id="tab-login" class="flex-1 py-4 rounded-3xl font-semibold">Login</button>
      <button onclick="switchAuthTab(1)" id="tab-register" class="flex-1 py-4 rounded-3xl font-semibold">Registrieren</button>
    </div>
    <div id="login-form">
      <input id="login-user" placeholder="Username" class="w-full mb-5 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Einloggen</button>
    </div>
    <div id="register-form" class="hidden">
      <input id="reg-user" placeholder="Username" class="w-full mb-5 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="reg-pass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="register()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Konto erstellen</button>
    </div>
  </div>

  <!-- Shop -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-12 text-center">Unsere Produkte</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Sell -->
  <div id="page-sell" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Neues Produkt einstellen</h2>
    <div class="glass p-8 rounded-3xl space-y-6">
      <input id="new-name" placeholder="Produktname" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-price" type="number" step="0.01" placeholder="Preis €" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-stock" type="number" value="10" placeholder="Menge" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-img" placeholder="Bild URL" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 bg-gray-800 border border-purple-500 rounded-3xl px-6 py-5"></textarea>
      <button onclick="addProduct()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-6 rounded-3xl text-xl font-bold">Produkt hochladen</button>
    </div>
  </div>

  <!-- Warenkorb Button -->
  <button onclick="showCart()" class="fixed bottom-10 right-10 bg-gradient-to-r from-purple-600 to-pink-600 w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110">
    🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-xs w-6 h-6 rounded-full flex items-center justify-center">0</span>
  </button>

  <!-- Cart Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="glass rounded-3xl p-8 max-w-lg w-full max-h-[90vh] overflow-auto">
      <h3 class="text-3xl font-bold mb-6">Warenkorb</h3>
      <div id="cart-items" class="space-y-4"></div>
      <div id="cart-total" class="text-3xl font-bold mt-8 mb-8"></div>
      <div id="paypal-button-container" class="my-6"></div>
      <button onclick="hideCart()" class="w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "DEINE_API_KEY_HIER_EINFÜGEN",
      authDomain: "dein-projekt.firebaseapp.com",
      databaseURL: "https://dein-projekt-default-rtdb.firebaseio.com",
      projectId: "dein-projekt",
      storageBucket: "dein-projekt.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==================== VARIABLEN ====================
    let currentUser = null;
    let cart = [];

    const admins = [
      { username: "kiollegend", password: "kiollegend" },
      { username: "ZayTox", password: "ZayTox!!!" }
    ];

    function isAdmin(user) {
      return admins.some(a => a.username === user?.username);
    }

    // ==================== NAVIGATION ====================
    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${page}`).classList.remove('hidden');
      if (page === 'shop') loadProducts();
    }

    // ==================== PRODUKTE LADEN (Echtzeit) ====================
    function loadProducts() {
      db.ref('products').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const productsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        document.getElementById('products').innerHTML = productsArray.map(p => `
          <div class="anime-card glass rounded-3xl overflow-hidden">
            <img src="${p.img || `https://picsum.photos/id/${Math.floor(Math.random()*900)+100}/300/300`}" class="w-full h-64 object-cover">
            <div class="p-6">
              <h3 class="font-bold text-xl">${p.name}</h3>
              <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
              <p class="text-sm text-gray-400">Noch ${p.stock} verfügbar</p>
              <button onclick="addToCart('${p.id}')" class="mt-6 w-full bg-purple-600 py-4 rounded-2xl">In den Warenkorb</button>
            </div>
          </div>
        `).join('');
      });
    }

    // ==================== PRODUKT HINZUFÜGEN ====================
    function addProduct() {
      if (!isAdmin(currentUser)) return alert("Nur Admins dürfen Produkte einstellen!");

      const product = {
        name: document.getElementById('new-name').value,
        price: parseFloat(document.getElementById('new-price').value),
        stock: parseInt(document.getElementById('new-stock').value) || 10,
        desc: document.getElementById('new-desc').value,
        img: document.getElementById('new-img').value,
        seller: currentUser.username,
        timestamp: Date.now()
      };

      if (!product.name || !product.price) return alert("Name und Preis erforderlich!");

      db.ref('products').push(product).then(() => {
        alert("Produkt hochgeladen! Jeder sieht es jetzt.");
        navigate('shop');
      });
    }

    function addToCart(productId) {
      // Für Warenkorb (lokal pro User)
      alert("Produkt zum Warenkorb hinzugefügt (Demo)");
      // Hier könntest du später einen eigenen Warenkorb in Firebase speichern
    }

    function showCart() {
      alert("Warenkorb-Funktion wird gerade erweitert. PayPal Demo aktiv.");
      // PayPal Logik wie vorher
    }

    function hideCart() { document.getElementById('cart-modal').classList.add('hidden'); }

    // ==================== AUTH ====================
    function login() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;

      const admin = admins.find(a => a.username === username && a.password === password);
      if (admin) {
        currentUser = admin;
      } else if (username) {
        currentUser = { username };
      } else {
        return alert("Bitte Username eingeben");
      }

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      if (isAdmin(currentUser)) {
        document.getElementById('sellBtn').classList.remove('hidden');
        document.getElementById('adminBtn').classList.remove('hidden');
      }
      navigate('shop');
    }

    function register() {
      const username = document.getElementById('reg-user').value.trim();
      if (username.length < 3) return alert("Username zu kurz!");
      currentUser = { username };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      alert("Registrierung erfolgreich!");
      navigate('shop');
    }

    function logout() {
      if (confirm("Ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    // Init
    window.onload = () => {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        if (isAdmin(currentUser)) {
          document.getElementById('sellBtn').classList.remove('hidden');
          document.getElementById('adminBtn').classList.remove('hidden');
        }
        navigate('shop');
      } else {
        navigate('login');
      }
    };
  </script>
</body>
</html>
