<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OathNet • Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #020407 0%, #0a0f1c 100%); 
            font-family: 'Courier New', monospace; 
        }
        .tab-active { 
            border-bottom: 4px solid #ef4444; 
            color: #fff; 
            font-weight: bold; 
        }
        .log-entry { 
            background: #111827; 
            border-left: 5px solid #ef4444; 
        }
        .password { 
            font-family: monospace; 
            color: #f87171; 
            user-select: all;
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="max-w-6xl mx-auto p-8">
        <div class="flex items-center gap-5 mb-12">
            <div class="text-7xl">☠️</div>
            <h1 class="text-6xl font-bold tracking-tighter text-red-500">OATHNET REAL</h1>
            <div class="ml-auto text-xs text-red-500/70">v2.2 • 18.06.2026 • 157.942 Logs</div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-700 mb-10 text-lg overflow-x-auto">
            <button onclick="switchTab(0)" class="tab-active px-8 py-4" id="tab0">Allgemein</button>
            <button onclick="switchTab(1)" class="px-8 py-4 text-gray-400 hover:text-white" id="tab1">Discord</button>
            <button onclick="switchTab(2)" class="px-8 py-4 text-gray-400 hover:text-white" id="tab2">Victims</button>
            <button onclick="switchTab(3)" class="px-8 py-4 text-gray-400 hover:text-white" id="tab3">Stealer Logs</button>
            <button onclick="switchTab(4)" class="px-8 py-4 text-gray-400 hover:text-white" id="tab4">OSINT</button>
        </div>

        <div class="max-w-3xl mx-auto">
            <input id="query" type="text"
                   placeholder="Discord ID, E-Mail oder Username..."
                   class="w-full bg-zinc-900 border border-red-900 rounded-3xl px-8 py-7 text-xl focus:border-red-500 focus:outline-none">
           
            <button onclick="performSearch()"
                    class="mt-6 w-full bg-red-600 hover:bg-red-700 py-7 rounded-3xl text-xl font-bold">
                <i class="fas fa-search mr-3"></i> SUCHEN
            </button>
        </div>

        <div id="results" class="hidden mt-12 bg-zinc-900 border border-red-900 rounded-3xl p-10"></div>
    </div>

    <script>
        let currentTab = 0;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="tab"]').forEach((btn, i) => {
                btn.classList.toggle('tab-active', i === tab);
                btn.classList.toggle('text-gray-400', i !== tab);
            });
        }

        // Stark verbesserte Passwort-Generierung
        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^*";
            let pass = "";
            for (let i = 0; i < 14; i++) {
                pass += chars[Math.floor(Math.random() * chars.length)];
            }
            return pass;
        }

        // Realistische E-Mails
        function generateRealisticEmail(base) {
            const domains = ["gmail.com", "outlook.com", "hotmail.com", "yahoo.com", "proton.me", "tutanota.com"];
            const baseClean = base.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (base.includes('@')) return base;
            return `${baseClean}${Math.floor(Math.random()*999)}${['', '.', '_'][Math.floor(Math.random()*3)]}${domains[Math.floor(Math.random()*domains.length)]}`;
        }

        // Echte Discord Usernames bei ID-Suche
        const realisticDiscordUsers = [
            "ShadowNovaX", "NeoPhantom", "BlazeRogue", "CyberFrost", "VortexKing",
            "LunaEclipse", "RogueByte", "AstralVoid", "ThunderPulse", "GlitchReaper",
            "NightmareZ", "PixelSlayer", "FrostByteX", "DarkNova", "EchoPhantom"
        ];

        function performSearch() {
            const query = document.getElementById('query').value.trim();
            if (!query) return alert("Bitte etwas eingeben!");

            const resultsDiv = document.getElementById('results');
            resultsDiv.classList.remove('hidden');
            resultsDiv.innerHTML = `
                <div class="text-center py-24">
                    <i class="fas fa-spinner fa-spin text-7xl text-red-500"></i>
                    <p class="mt-10 text-2xl">Durchsuche 157.942 echte Stealer Logs...</p>
                </div>`;

            setTimeout(() => {
                let html = `<h2 class="text-3xl font-bold mb-10 text-red-400">ERGEBNISSE FÜR: <span class="text-white">${query}</span></h2>`;

                if (currentTab === 3 || query.length > 15) { 
                    // === STEALER LOGS ===
                    html += `<h3 class="text-xl text-red-400 mb-6 flex items-center gap-2"><i class="fas fa-key"></i> STEALER LOGS (${Math.floor(Math.random()*12)+7} Treffer)</h3>`;
                    html += `<div class="space-y-6">`;

                    const services = ["Gmail", "Outlook", "TikTok", "Instagram", "Snapchat", "X (Twitter)", 
                                    "OnlyFans", "PayPal", "Steam", "Epic Games", "Amazon", "Netflix", 
                                    "Spotify", "Roblox", "Discord", "Facebook", "Twitch"];

                    services.forEach(service => {
                        const email = generateRealisticEmail(query);
                        const pass = generatePassword();
                        html += `
                            <div class="log-entry p-7 rounded-2xl">
                                <div class="flex justify-between items-center">
                                    <strong class="text-amber-400 text-xl">${service}</strong>
                                    <span class="text-xs text-gray-500">RedLine • 2026-06-${Math.floor(Math.random()*15)+1}</span>
                                </div>
                                <p class="mt-3"><strong>Email:</strong> <span class="text-emerald-400">${email}</span></p>
                                <p><strong>Password:</strong> <span class="password">${pass}</span></p>
                            </div>`;
                    });
                } 
                else if (/^\d{17,19}$/.test(query) || currentTab === 1) {
                    // === DISCORD ID ===
                    const username = realisticDiscordUsers[Math.floor(Math.random() * realisticDiscordUsers.length)];
                    html += `
                        <div class="flex gap-10 items-center bg-black p-10 rounded-3xl mb-10 border border-red-900">
                            <img src="https://i.pravatar.cc/300?u=${query}" class="w-40 h-40 rounded-2xl border-4 border-red-500">
                            <div>
                                <h3 class="text-5xl font-bold">${username}</h3>
                                <p class="text-emerald-400 text-2xl">#${Math.floor(1000 + Math.random()*9000)}</p>
                                <p class="text-gray-400">Discord ID: ${query}</p>
                            </div>
                        </div>`;
                    
                    // Dann Stealer Logs
                    html += `<h3 class="text-xl text-red-400 mb-6">GESTOHLENE ACCOUNTS</h3>`;
                    // ... (kann erweitert werden)
                }

                resultsDiv.innerHTML = html;
            }, 950);
        }

        document.getElementById('query').addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
