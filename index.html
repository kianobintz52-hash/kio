<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .neon-purple { text-shadow: 0 0 20px #c026d3, 0 0 40px #a855f7; }
    .anime-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anime-card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 25px 50px rgba(192, 38, 211, 0.6);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-black/90 border-b border-purple-500 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME SHOP</h1>
      
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('orders')" class="hover:text-purple-400">Bestellungen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>

        <div class="flex items-center gap-4">
          <input id="searchInput" type="text" placeholder="Suche" 
                 class="bg-gray-900 border border-purple-500 rounded-full px-5 py-3 w-80 focus:outline-none focus:border-pink-500">
          <button onclick="toggleTheme()" class="text-2xl"><i id="theme-icon" class="fas fa-moon"></i></button>
          <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-full text-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Shop Page -->
  <div id="page-shop" class="page max-w-7xl mx-auto p-8">
    <div class="flex justify-between mb-8">
      <h2 class="text-5xl font-bold neon-purple">Anime Shop</h2>
      <div class="flex gap-4">
        <select id="sortSelect" onchange="renderProducts()" class="bg-gray-900 border border-purple-500 rounded-2xl px-5 py-3">
          <option value="new">Neueste</option>
          <option value="price-low">Preis ↑</option>
          <option value="price-high">Preis ↓</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
    </div>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Produkt Detail Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-gray-900 rounded-3xl max-w-2xl w-full m-4 p-8 overflow-auto max-h-[90vh]">
      <div id="detail-content"></div>
      <button onclick="closeDetail()" class="mt-8 w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <!-- Warenkorb Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-8 max-w-lg w-full border border-purple-500">
      <h3 class="text-3xl font-bold mb-6">Warenkorb</h3>
      <div id="cart-items" class="space-y-4 max-h-96 overflow-auto"></div>
      
      <div class="mt-6">
        <input id="coupon-input" placeholder="Gutscheincode" class="bg-gray-800 border border-purple-500 rounded-2xl px-5 py-3 w-full">
        <button onclick="applyCoupon()" class="mt-3 w-full bg-purple-600 py-3 rounded-2xl">Code einlösen</button>
      </div>

      <div id="cart-total" class="text-3xl font-bold mt-8 mb-8"></div>
      <div id="paypal-button-container" class="mb-6"></div>
      <button onclick="hideCart()" class="w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <!-- Ticket Modal -->
  <div id="ticket-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-10 max-w-md w-full border border-purple-500 text-center">
      <h2 class="text-3xl font-bold neon-purple mb-2">✅ Bestellung erfolgreich!</h2>
      <div id="ticket-content" class="bg-black/50 p-6 rounded-2xl text-left my-8"></div>
      <button onclick="hideTicket()" class="w-full bg-purple-600 py-4 rounded-2xl font-bold">Schließen</button>
    </div>
  </div>

  <!-- Sell Page -->
  <div id="page-sell" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Neues Produkt einstellen</h2>
    <div class="space-y-6">
      <input id="new-name" placeholder="Produktname" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-price" type="number" step="0.01" placeholder="Preis €" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-stock" type="number" value="10" placeholder="Stock" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-img" placeholder="Bild URL (optional)" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 bg-gray-800 border border-purple-500 rounded-3xl px-6 py-5"></textarea>
      <button onclick="addProduct()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-6 rounded-3xl text-xl font-bold">Produkt hochladen</button>
    </div>
  </div>

  <!-- Orders Page -->
  <div id="page-orders" class="page hidden max-w-4xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Meine Bestellungen</h2>
    <div id="my-orders" class="space-y-6"></div>
  </div>

  <!-- Admin Page -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Admin Panel</h2>
    <div id="admin-products" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-black/80 border-t border-purple-500 py-12 mt-20">
    <div class="max-w-7xl mx-auto px-8 text-center text-gray-400">
      <p class="text-xl font-bold neon-purple mb-4">ANIME SHOP</p>
      <p>© 2026 KiolLegend • Alle Rechte vorbehalten</p>
      <div class="flex justify-center gap-8 mt-6 text-sm">
        <a href="#" class="hover:text-purple-400">Impressum</a>
        <a href="#" class="hover:text-purple-400">AGB</a>
        <a href="#" class="hover:text-purple-400">Datenschutz</a>
        <a href="#" class="hover:text-purple-400">Kontakt</a>
      </div>
    </div>
  </footer>

  <button onclick="showCart()" class="fixed bottom-10 right-10 bg-gradient-to-r from-purple-600 to-pink-600 w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition-all">
    🛒
  </button>

  <script>
    const PAYPAL_CLIENT_ID = "AfePx5V-Tru6WXLs1fwvK3RjuYKC5No0UmUgB9jmEr0IjsZ3v6BwqeQ0ur3leNkU87nz-RTFDswULn5S";
    let currentUser = null;
    let products = JSON.parse(localStorage.getItem('products')) || [
      {id:1, name:"Crunchyroll Premium 12 Monate", price:79.90, stock:8, desc:"Voller Zugriff auf alle Animes", img:"https://picsum.photos/id/1015/300/300"},
      {id:2, name:"One Piece Manga Bundle 1-10", price:89.90, stock:15, desc:"Offizielle deutsche Ausgabe", img:"https://picsum.photos/id/237/300/300"},
      {id:3, name:"Jujutsu Kaisen Merch Set", price:29.90, stock:25, desc:"Keychains + Sticker", img:"https://picsum.photos/id/201/300/300"}
    ];
    let cart = [];
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let appliedDiscount = 0;

    const owner = { username: "kiollegend", password: "kiollegend" };
    const DISCOUNT_CODE = "kianolegend";

    function saveData() {
      localStorage.setItem('products', JSON.stringify(products));
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      localStorage.setItem('orders', JSON.stringify(orders));
    }

    function loadUser() {
      const saved = localStorage.getItem('currentUser');
      if (saved) currentUser = JSON.parse(saved);
    }

    function navigate(page) {
      if (!currentUser && page !== 'login') return navigate('login');
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById(`page-${page}`);
      if (target) target.classList.remove('hidden');

      if (page === 'shop') renderProducts();
      if (page === 'orders') renderMyOrders();
      if (page === 'admin') renderAdmin();
    }

    function renderProducts() {
      const sort = document.getElementById('sortSelect').value;
      let filtered = [...products];

      if (sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
      if (sort === 'price-high') filtered.sort((a,b) => b.price - a.price);
      if (sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));

      const container = document.getElementById('products');
      container.innerHTML = filtered.map(p => `
        <div class="anime-card bg-gray-900/95 border border-purple-500 rounded-3xl overflow-hidden relative">
          ${currentUser?.username === owner.username ? `
            <div class="absolute top-3 right-3 flex gap-2 z-10">
              <button onclick="editProduct(${p.id});event.stopImmediatePropagation()" class="bg-black/70 text-white p-2 rounded-full"><i class="fas fa-edit"></i></button>
              <button onclick="deleteProduct(${p.id});event.stopImmediatePropagation()" class="bg-black/70 text-red-500 p-2 rounded-full"><i class="fas fa-trash"></i></button>
            </div>` : ''}
          <img onclick="showDetail(${p.id})" src="${p.img}" class="w-full h-64 object-cover cursor-pointer">
          <div class="p-6">
            <div class="flex justify-between items-start">
              <h3 onclick="showDetail(${p.id})" class="font-bold text-xl cursor-pointer">${p.name}</h3>
              <button onclick="toggleWishlist(${p.id});event.stopImmediatePropagation()" class="text-2xl ${wishlist.includes(p.id) ? 'text-red-500' : 'text-gray-400'}">❤️</button>
            </div>
            <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
            <p class="text-sm text-gray-400">Noch ${p.stock} verfügbar</p>
            <button onclick="addToCart(${p.id});event.stopImmediatePropagation()" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl">In den Warenkorb</button>
          </div>
        </div>
      `).join('');
    }

    function showDetail(id) {
      const p = products.find(x => x.id === id);
      document.getElementById('detail-content').innerHTML = `
        <img src="${p.img}" class="w-full h-96 object-cover rounded-3xl mb-6">
        <h2 class="text-3xl font-bold">${p.name}</h2>
        <p class="text-4xl font-bold text-purple-400 mt-2">${p.price} €</p>
        <p class="text-gray-400 mt-6">${p.desc}</p>
        <p class="mt-4 text-sm">Noch ${p.stock} verfügbar</p>
        <button onclick="addToCart(${p.id});closeDetail()" class="mt-10 w-full bg-purple-600 py-5 rounded-2xl text-xl font-bold">In den Warenkorb</button>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetail() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product || product.stock <= 0) return alert("Nicht mehr auf Lager!");
      
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity = (existing.quantity || 1) + 1;
      else cart.push({...product, quantity: 1});
      
      alert(`${product.name} hinzugefügt!`);
    }

    function showCart() {
      if (cart.length === 0) return alert("Warenkorb ist leer");
      
      let html = '';
      let total = 0;
      
      cart.forEach((item, index) => {
        const itemTotal = item.price * (item.quantity || 1);
        total += itemTotal;
        html += `
          <div class="flex justify-between items-center bg-gray-800 p-4 rounded-2xl">
            <div>
              <p>${item.name}</p>
              <p class="text-sm text-gray-400">${item.price} € × ${item.quantity || 1}</p>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="changeQuantity(${index}, -1)" class="px-3 py-1 bg-gray-700 rounded">-</button>
              <span>${item.quantity || 1}</span>
              <button onclick="changeQuantity(${index}, 1)" class="px-3 py-1 bg-gray-700 rounded">+</button>
              <span class="font-bold">${itemTotal.toFixed(2)} €</span>
            </div>
          </div>`;
      });

      document.getElementById('cart-items').innerHTML = html;
      document.getElementById('cart-total').innerHTML = `Gesamt: <span class="text-purple-400">${(total * (1 - appliedDiscount)).toFixed(2)} €</span>`;
      document.getElementById('cart-modal').classList.remove('hidden');
      
      renderPayPalButtons(total * (1 - appliedDiscount));
    }

    function changeQuantity(index, change) {
      cart[index].quantity = Math.max(1, (cart[index].quantity || 1) + change);
      showCart();
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-input').value.trim();
      if (code.toLowerCase() === DISCOUNT_CODE) {
        appliedDiscount = 0.1;
        alert("✅ 10% Rabatt aktiviert!");
        showCart();
      } else {
        alert("Ungültiger Code");
      }
    }

    function renderPayPalButtons(total) {
      document.getElementById('paypal-button-container').innerHTML = '';
      paypal.Buttons({
        style: { layout: 'vertical', color: 'blue' },
        createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: total.toFixed(2), currency_code: 'EUR' }}]}),
        onApprove: (data, actions) => actions.order.capture().then(details => completeOrder(details))
      }).render('#paypal-button-container');
    }

    function completeOrder(details) {
      const total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
      const order = {
        id: Date.now(),
        user: currentUser.username,
        items: cart.map(i => `${i.name} (${i.quantity || 1}x)`),
        total: total * (1 - appliedDiscount),
        date: new Date().toLocaleDateString('de-DE'),
        ticketNr: "T-" + String(Date.now()).slice(-8),
        status: "Offen",
        paypalId: details.id
      };

      orders.push(order);
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) prod.stock -= (item.quantity || 1);
      });

      saveData();
      hideCart();
      appliedDiscount = 0;
      showTicket(order);
      cart = [];
    }

    function showTicket(order) {
      document.getElementById('ticket-content').innerHTML = `
        <p><strong>Ticket Nr:</strong> ${order.ticketNr}</p>
        <p><strong>Datum:</strong> ${order.date}</p>
        <p><strong>Status:</strong> ${order.status}</p>
        <hr class="my-4 border-purple-500">
        ${order.items.map(i => `<p>• ${i}</p>`).join('')}
        <p class="text-2xl font-bold text-purple-400 mt-6">Gesamt: ${order.total.toFixed(2)} €</p>
      `;
      document.getElementById('ticket-modal').classList.remove('hidden');
    }

    function hideTicket() { document.getElementById('ticket-modal').classList.add('hidden'); navigate('orders'); }
    function hideCart() { document.getElementById('cart-modal').classList.add('hidden'); }

    function toggleWishlist(id) {
      if (wishlist.includes(id)) wishlist = wishlist.filter(x => x !== id);
      else wishlist.push(id);
      saveData();
      renderProducts();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    }

    // Weitere Funktionen (login, addProduct, editProduct, deleteProduct, renderAdmin etc.)
    function login() { /* ... wie vorher */ }
    function register() { /* ... */ }
    function logout() { /* ... */ }
    function addProduct() { /* ... */ }
    function editProduct(id) { /* ... */ }
    function deleteProduct(id) { /* ... */ }
    function renderAdmin() { /* ... */ }
    function renderMyOrders() { /* ... */ }
    function switchAuthTab(n) { /* ... */ }

    // PayPal SDK
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=EUR`;
    document.head.appendChild(script);

    window.onload = () => {
      loadUser();
      document.getElementById('searchInput').addEventListener('input', renderProducts);
      if (currentUser) navigate('shop');
      else navigate('login');
    };
  </script>
</body>
</html>
