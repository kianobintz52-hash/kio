<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui; background: #0a0a0a; color: white; }
    .glow { text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; }
  </style>
</head>
<body class="bg-black text-white">

  <!-- Hero Section - genau wie guns.lol -->
  <div class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(#ff00ff_0.5px,transparent_1px)] [background-size:50px_50px] opacity-10"></div>
    
    <h1 class="text-7xl font-bold glow mb-4"># guns . lol</h1>
    <p class="text-3xl mb-8">Everything you want, right here.</p>
    
    <div class="text-2xl mb-12">
      Über <span class="text-pink-500 font-bold">1.910.000+</span> Nutzer
    </div>

    <button onclick="showRegisterModal()" 
            class="bg-white text-black px-12 py-6 rounded-2xl text-2xl font-bold hover:scale-105 transition-all">
      Claim your profile — Kostenlos
    </button>

    <p class="mt-8 text-gray-400">guns.lol/deinname</p>
  </div>

  <!-- Login / Register Modals -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md">
      <h2 id="modalTitle" class="text-3xl font-bold mb-8 text-center">Willkommen bei guns.lol</h2>
      
      <div id="loginForm">
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-xl mb-4">
        <input id="loginPass" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-xl mb-6">
        <button onclick="login()" class="w-full bg-pink-600 py-4 rounded-xl text-lg font-bold">Anmelden</button>
        <p class="text-center mt-6 text-gray-400">Noch kein Account? 
          <span onclick="switchToRegister()" class="text-pink-500 cursor-pointer">Registrieren</span>
        </p>
      </div>

      <div id="registerForm" class="hidden">
        <input id="regUsername" type="text" placeholder="Username (z.B. deinname)" class="w-full bg-zinc-800 p-4 rounded-xl mb-4">
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-xl mb-4">
        <input id="regPass" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-xl mb-6">
        <button onclick="register()" class="w-full bg-pink-600 py-4 rounded-xl text-lg font-bold">Account erstellen</button>
        <p class="text-center mt-6 text-gray-400">Schon registriert? 
          <span onclick="switchToLogin()" class="text-pink-500 cursor-pointer">Anmelden</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    function showRegisterModal() {
      document.getElementById('authModal').classList.remove('hidden');
      switchToRegister();
    }
    function switchToRegister() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Profil claimen";
    }
    function switchToLogin() {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Anmelden";
    }

    // Dummy Funktionen (werden später mit Backend verbunden)
    function register() {
      const username = document.getElementById('regUsername').value;
      if (username) {
        alert(`✅ Account erstellt! Dein Profil: ${username}.deine-domain.lol`);
        // Hier später echte API-Anfrage
      }
    }
    function login() {
      alert("✅ Erfolgreich eingeloggt! (Demo)");
    }
  </script>
</body>
</html>
