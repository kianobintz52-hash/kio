<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.96)), url('https://picsum.photos/id/1015/1920/1080') center/cover fixed;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 45px #a855f7; }
    .anime-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anime-card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 25px 50px rgba(192, 38, 211, 0.6);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-black/95 border-b border-purple-500 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 onclick="navigate('shop')" class="text-4xl font-bold neon-purple cursor-pointer">ANIME SHOP</h1>
      
      <div class="flex gap-8 items-center text-lg">
        <button onclick="navigate('shop')" class="hover:text-purple-400">Shop</button>
        <button onclick="navigate('sell')" id="sellBtn" class="hover:text-purple-400 hidden">Verkaufen</button>
        <button onclick="navigate('profile')" class="hover:text-purple-400">Profil</button>
        <button onclick="navigate('admin')" id="adminBtn" class="hover:text-purple-400 hidden">Admin</button>

        <div class="flex items-center gap-4">
          <button onclick="toggleTheme()" class="text-2xl"><i id="theme-icon" class="fas fa-moon"></i></button>
          <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-2xl text-sm font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login -->
  <div id="page-login" class="page max-w-md mx-auto mt-24 p-12 bg-gray-900/95 rounded-3xl border border-purple-500">
    <h2 class="text-5xl font-bold text-center neon-purple mb-10">ANIME SHOP</h2>
    <div class="flex gap-4 justify-center mb-8 bg-gray-800 rounded-3xl p-1">
      <button onclick="switchAuthTab(0)" id="tab-login" class="flex-1 py-4 rounded-3xl font-semibold">Login</button>
      <button onclick="switchAuthTab(1)" id="tab-register" class="flex-1 py-4 rounded-3xl font-semibold">Registrieren</button>
    </div>

    <div id="login-form">
      <input id="login-user" placeholder="Username" class="w-full mb-5 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="login-pass" type="password" placeholder="Passwort" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Einloggen</button>
    </div>

    <div id="register-form" class="hidden">
      <input id="reg-user" placeholder="Username" class="w-full mb-5 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="reg-pass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full mb-8 bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <button onclick="register()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-5 rounded-2xl text-xl font-bold">Konto erstellen</button>
    </div>
  </div>

  <!-- Shop -->
  <div id="page-shop" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-12 text-center">Unsere Produkte</h2>
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Sell -->
  <div id="page-sell" class="page hidden max-w-2xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8">Neues Produkt einstellen</h2>
    <div class="space-y-6">
      <input id="new-name" placeholder="Produktname" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-price" type="number" step="0.01" placeholder="Preis €" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-stock" type="number" value="10" placeholder="Verfügbare Menge" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <input id="new-img" placeholder="Bild URL (optional)" class="w-full bg-gray-800 border border-purple-500 rounded-2xl px-6 py-5">
      <textarea id="new-desc" placeholder="Beschreibung" class="w-full h-32 bg-gray-800 border border-purple-500 rounded-3xl px-6 py-5"></textarea>
      <button onclick="addProduct()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-6 rounded-3xl text-xl font-bold">Produkt hochladen</button>
    </div>
  </div>

  <!-- Profile -->
  <div id="page-profile" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-5xl font-bold neon-purple mb-8">Profil von <span id="profile-name" class="text-purple-400"></span></h2>
    <h3 class="text-2xl mb-6">Alle Produkte</h3>
    <div id="profile-products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Admin -->
  <div id="page-admin" class="page hidden max-w-7xl mx-auto p-8">
    <h2 class="text-4xl font-bold mb-8 neon-purple">Admin Panel</h2>
    <div id="admin-content"></div>
  </div>

  <!-- Warenkorb -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-8 max-w-lg w-full border border-purple-500">
      <h3 class="text-3xl font-bold mb-6">Warenkorb</h3>
      <div id="cart-items" class="space-y-4 max-h-96 overflow-auto"></div>
      <div id="cart-total" class="text-3xl font-bold mt-8 mb-8"></div>
      <div id="paypal-button-container" class="mb-6"></div>
      <button onclick="hideCart()" class="w-full py-4 border border-gray-600 rounded-2xl">Schließen</button>
    </div>
  </div>

  <button onclick="showCart()" class="fixed bottom-10 right-10 bg-gradient-to-r from-purple-600 to-pink-600 w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition-all">
    🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-xs w-6 h-6 rounded-full flex items-center justify-center">0</span>
  </button>

  <script>
    const PAYPAL_CLIENT_ID = "AfePx5V-Tru6WXLs1fwvK3RjuYKC5No0UmUgB9jmEr0IjsZ3v6BwqeQ0ur3leNkU87nz-RTFDswULn5S";

    let currentUser = null;
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let users = JSON.parse(localStorage.getItem('users')) || [];

    // Mehrere Admins
    const admins = [
      { username: "kiollegend", password: "kiollegend" },
      { username: "ZayTox", password: "ZayTox!!!" }
    ];

    function isAdmin(user) {
      return admins.some(a => a.username === user.username);
    }

    function saveData() {
      localStorage.setItem('products', JSON.stringify(products));
      localStorage.setItem('cart', JSON.stringify(cart));
      localStorage.setItem('orders', JSON.stringify(orders));
      localStorage.setItem('users', JSON.stringify(users));
    }

    function loadUser() {
      const saved = localStorage.getItem('currentUser');
      if (saved) currentUser = JSON.parse(saved);
    }

    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${page}`).classList.remove('hidden');
      if (page === 'shop') renderProducts();
      if (page === 'profile') renderProfile();
      if (page === 'admin' && isAdmin(currentUser)) renderAdmin();
    }

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="anime-card bg-gray-900/95 border border-purple-500 rounded-3xl overflow-hidden relative">
          ${isAdmin(currentUser) ? `<button onclick="deleteProduct(${p.id});event.stopImmediatePropagation()" class="absolute top-3 right-3 bg-red-600 text-white p-2 rounded-full z-10"><i class="fas fa-trash"></i></button>` : ''}
          <img src="${p.img || `https://picsum.photos/id/${p.id % 900 + 100}/300/300`}" class="w-full h-64 object-cover">
          <div class="p-6">
            <h3 class="font-bold text-xl">${p.name}</h3>
            <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
            <p class="text-sm text-gray-400">Noch ${p.stock} verfügbar</p>
            <p class="text-gray-400 text-sm mt-2">${p.desc}</p>
            <button onclick="addToCart(${p.id})" class="mt-6 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl">In den Warenkorb</button>
          </div>
        </div>
      `).join('');
    }

    function renderProfile() {
      document.getElementById('profile-name').textContent = currentUser.username;
      document.getElementById('profile-products').innerHTML = products.map(p => `
        <div class="anime-card bg-gray-900/95 border border-purple-500 rounded-3xl overflow-hidden">
          <img src="${p.img || `https://picsum.photos/id/${p.id % 900 + 100}/300/300`}" class="w-full h-64 object-cover">
          <div class="p-6">
            <h3 class="font-bold">${p.name}</h3>
            <p class="text-3xl font-bold text-purple-400">${p.price} €</p>
          </div>
        </div>
      `).join('') || "<p class='text-gray-400'>Noch keine Produkte.</p>";
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (product && product.stock > 0) {
        const existing = cart.find(item => item.id === id);
        if (existing) existing.quantity++;
        else cart.push({...product, quantity: 1});
        saveData();
        updateCartCount();
        alert(`${product.name} hinzugefügt!`);
      }
    }

    function updateCartCount() {
      document.getElementById('cart-count').textContent = cart.length;
    }

    function showCart() {
      if (cart.length === 0) return alert("Warenkorb ist leer");
      let html = '';
      let total = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div class="flex justify-between items-center bg-gray-800 p-4 rounded-2xl">
            <div>
              <p>${item.name}</p>
              <p class="text-sm">${item.price} €</p>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="changeQuantity(${index}, -1)" class="px-3 py-1 bg-gray-700 rounded">-</button>
              <span>${item.quantity}</span>
              <button onclick="changeQuantity(${index}, 1)" class="px-3 py-1 bg-gray-700 rounded">+</button>
              <button onclick="removeFromCart(${index})" class="ml-4 text-red-500"><i class="fas fa-trash"></i></button>
              <span class="font-bold ml-4">${itemTotal.toFixed(2)} €</span>
            </div>
          </div>`;
      });
      document.getElementById('cart-items').innerHTML = html;
      document.getElementById('cart-total').innerHTML = `Gesamt: <span class="text-purple-400">${total.toFixed(2)} €</span>`;
      document.getElementById('cart-modal').classList.remove('hidden');
      renderPayPalButtons(total);
    }

    function changeQuantity(index, delta) {
      cart[index].quantity = Math.max(1, cart[index].quantity + delta);
      saveData();
      showCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      saveData();
      showCart();
      updateCartCount();
    }

    function hideCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function renderPayPalButtons(total) {
      document.getElementById('paypal-button-container').innerHTML = '';
      paypal.Buttons({
        style: { layout: 'vertical', color: 'blue', shape: 'rect', label: 'pay' },
        createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: total.toFixed(2), currency_code: 'EUR' }}]}),
        onApprove: (data, actions) => actions.order.capture().then(details => completePurchase(details, total))
      }).render('#paypal-button-container');
    }

    function completePurchase(details, total) {
      const order = {
        id: Date.now(),
        user: currentUser.username,
        items: cart.map(i => `${i.name} (${i.quantity}x)`),
        total: total,
        date: new Date().toLocaleDateString('de-DE'),
        ticketNr: "T-" + String(Date.now()).slice(-8)
      };
      orders.push(order);
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) prod.stock -= item.quantity;
      });
      saveData();
      hideCart();
      cart = [];
      updateCartCount();
      alert(`✅ Bezahlung erfolgreich!\nTicket: ${order.ticketNr}\nVielen Dank!`);
      navigate('orders');
    }

    function login() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;

      const admin = admins.find(a => a.username === user && a.password === pass);
      if (admin) {
        currentUser = admin;
        document.getElementById('sellBtn').classList.remove('hidden');
        document.getElementById('adminBtn').classList.remove('hidden');
      } else if (user && pass) {
        if (users.find(u => u.username.toLowerCase() === user.toLowerCase())) {
          return alert("Dieser Username existiert bereits!");
        }
        currentUser = { username: user };
        users.push({ username: user, date: new Date().toLocaleDateString('de-DE') });
        saveData();
      } else {
        return alert("Falsche Daten");
      }
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      navigate('shop');
    }

    function register() {
      const user = document.getElementById('reg-user').value.trim();
      const pass = document.getElementById('reg-pass').value;

      if (user.length < 3) return alert("Username muss mindestens 3 Zeichen lang sein!");
      if (pass.length < 6) return alert("Passwort muss mindestens 6 Zeichen lang sein!");

      if (users.find(u => u.username.toLowerCase() === user.toLowerCase())) {
        return alert("Dieser Username ist bereits vergeben!");
      }

      currentUser = { username: user };
      users.push({ username: user, date: new Date().toLocaleDateString('de-DE') });
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      saveData();
      alert("Registrierung erfolgreich!");
      navigate('shop');
    }

    function logout() {
      if (confirm("Wirklich ausloggen?")) {
        localStorage.removeItem('currentUser');
        location.reload();
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function switchAuthTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n !== 0);
      document.getElementById('register-form').classList.toggle('hidden', n !== 1);
    }

    function addProduct() {
      if (!isAdmin(currentUser)) return alert("Nur Admins dürfen Produkte einstellen!");
      const name = document.getElementById('new-name').value;
      const price = parseFloat(document.getElementById('new-price').value);
      const stock = parseInt(document.getElementById('new-stock').value) || 10;
      const desc = document.getElementById('new-desc').value;
      const img = document.getElementById('new-img').value || `https://picsum.photos/id/${Date.now() % 900 + 100}/300/300`;

      if (name && price) {
        products.push({ id: Date.now(), name, price, stock, desc: desc || "Anime Produkt", img });
        saveData();
        alert("Produkt erfolgreich hochgeladen!");
        navigate('shop');
      }
    }

    function deleteProduct(id) {
      if (confirm("Produkt wirklich löschen?")) {
        products = products.filter(p => p.id !== id);
        saveData();
        renderProducts();
        renderAdmin();
      }
    }

    function renderAdmin() {
      document.getElementById('admin-content').innerHTML = `
        <div class="mb-12">
          <h3 class="text-2xl mb-6">Produkte verwalten</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            ${products.map(p => `
              <div class="bg-gray-900 p-6 rounded-3xl border border-purple-500">
                <img src="${p.img}" class="w-full h-48 object-cover rounded-2xl mb-4">
                <h4 class="font-bold">${p.name}</h4>
                <p>${p.price} € | Stock: ${p.stock}</p>
                <button onclick="deleteProduct(${p.id})" class="mt-4 w-full bg-red-600 py-3 rounded-2xl">Löschen</button>
              </div>
            `).join('')}
          </div>
        </div>
        <div>
          <h3 class="text-2xl mb-6">Registrierte User (${users.length})</h3>
          <div class="space-y-3">
            ${users.map(u => `<div class="bg-gray-800 p-4 rounded-2xl">${u.username} <span class="text-gray-400">(${u.date})</span></div>`).join('')}
          </div>
        </div>
      `;
    }

    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=EUR`;
    document.head.appendChild(script);

    window.onload = () => {
      loadUser();
      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      if (currentUser) navigate('shop');
      else navigate('login');
    };
  </script>
</body>
</html>
