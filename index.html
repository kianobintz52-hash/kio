<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .sidebar-active { background-color: #6b21a8; color: white; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navBtn">Anmelden</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 md:p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex flex-col md:flex-row h-screen pt-16">
      <!-- SIDEBAR -->
      <div class="w-full md:w-72 bg-[#0f0a23] border-b md:border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(0)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="switchTab(1)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">✏️ Profil bearbeiten</a>
          <a href="#" onclick="switchTab(2)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links verwalten</a>
          <a href="#" onclick="showMyPublicProfile()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-8 overflow-y-auto">
        <div id="mainContent">

          <!-- TAB 0 Konto -->
          <div id="tab0">
            <h1 class="text-4xl font-bold mb-8">Mein Konto</h1>
            <div class="flex items-center gap-6">
              <img id="profilePicBig" class="w-32 h-32 rounded-3xl object-cover border-4 border-purple-500">
              <div>
                <h2 id="dashName" class="text-3xl font-bold"></h2>
                <p id="dashUser" class="text-purple-400 text-xl"></p>
              </div>
            </div>
          </div>

          <!-- TAB 1 Profil bearbeiten -->
          <div id="tab1" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Profil bearbeiten</h2>
            <div class="max-w-xl space-y-6">
              <div>
                <label>Anzeigename</label>
                <input id="editName" class="w-full bg-zinc-800 p-4 rounded-2xl mt-2">
              </div>
              <div>
                <label>Bio</label>
                <textarea id="editBio" rows="4" class="w-full bg-zinc-800 p-4 rounded-2xl mt-2"></textarea>
              </div>
              <button onclick="saveProfile()" class="bg-purple-600 hover:bg-purple-700 px-8 py-4 rounded-2xl">Speichern</button>
            </div>
          </div>

          <!-- TAB 2 Links verwalten -->
          <div id="tab2" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Links verwalten</h2>
            <div class="bg-zinc-900 p-6 rounded-3xl">
              <input id="newTitle" placeholder="Titel" class="w-full bg-zinc-800 p-4 rounded-2xl mb-3">
              <input id="newUrl" placeholder="https://" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
              <button onclick="addLink()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl">+ Link hinzufügen</button>
            </div>
            <div id="linksList" class="mt-8 space-y-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PUBLIC PROFILE -->
  <div id="publicProfilePage" class="hidden min-h-screen bg-zinc-950 py-10">
    <div class="max-w-4xl mx-auto bg-zinc-900 rounded-3xl overflow-hidden">
      <div class="h-64 bg-zinc-800 relative">
        <img id="publicBanner" class="w-full h-full object-cover">
      </div>
      <div class="flex justify-center -mt-16">
        <img id="publicPic" class="w-40 h-40 rounded-3xl border-4 border-zinc-900 object-cover">
      </div>
      <div class="text-center px-8 pt-6">
        <h1 id="publicName" class="text-5xl font-bold"></h1>
        <p id="publicUsername" class="text-purple-400 text-2xl"></p>
        <p id="publicBio" class="mt-8 text-zinc-300 max-w-2xl mx-auto"></p>
        <div id="publicLinks" class="mt-12 space-y-4 max-w-2xl mx-auto"></div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let tempData = {};
    const CODE = "666";

    function showModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    function showRegisterModal() {
      showModal("Registrieren", `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="startRegister()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Weiter</button>
      `);
    }

    function startRegister() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !username || !password) return alert("Alle Felder ausfüllen!");
      if (Object.values(users).some(u => u.email === email || u.username === username)) return alert("Bereits vergeben!");

      tempData = {email, username, password};
      showModal("Verifizierung", `
        <p class="text-center mb-4">Demo-Code: <strong>666</strong></p>
        <input id="vcode" maxlength="3" class="w-full bg-zinc-800 p-6 rounded-2xl text-4xl text-center" placeholder="666">
        <button onclick="finishRegister()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Bestätigen</button>
      `);
    }

    function finishRegister() {
      if (document.getElementById('vcode').value === CODE) {
        const {email, username, password} = tempData;
        users[email] = {
          email, username, displayName: username, password,
          bio: "", profilePic: "https://i.pravatar.cc/128?u=" + Date.now()
        };
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        localStorage.setItem('currentUserEmail', email);

        currentUser = users[email];
        closeModal();
        showDashboard();
      } else {
        alert("Falscher Code! Demo: 666");
      }
    }

    function showLoginModal() {
      showModal("Anmelden", `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="loginPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="doLogin()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Anmelden</button>
      `);
    }

    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const user = users[email];

      if (user && user.password === pass) {
        currentUser = user;
        localStorage.setItem('currentUserEmail', email);
        closeModal();
        showDashboard();
      } else {
        alert("Falsche Zugangsdaten!");
      }
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";
      document.getElementById('navBtn').onclick = logout;

      document.getElementById('dashName').textContent = currentUser.displayName;
      document.getElementById('dashUser').textContent = '@' + currentUser.username;
      document.getElementById('profilePicBig').src = currentUser.profilePic;
      switchTab(0);
    }

    function logout() {
      localStorage.removeItem('currentUserEmail');
      location.reload();
    }

    function switchTab(n) {
      document.querySelectorAll('#mainContent > div').forEach(div => div.classList.add('hidden'));
      document.getElementById('tab' + n).classList.remove('hidden');
    }

    function saveProfile() {
      currentUser.displayName = document.getElementById('editName').value || currentUser.username;
      currentUser.bio = document.getElementById('editBio').value;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      alert("✅ Gespeichert!");
    }

    function addLink() {
      const title = document.getElementById('newTitle').value.trim();
      const url = document.getElementById('newUrl').value.trim();
      if (!title || !url) return alert("Titel und URL ausfüllen!");

      if (!currentUser.links) currentUser.links = [];
      currentUser.links.push({title, url});
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksList');
      if (!currentUser.links || currentUser.links.length === 0) {
        container.innerHTML = "<p class='text-zinc-400'>Noch keine Links</p>";
        return;
      }
      container.innerHTML = currentUser.links.map((l, i) => `
        <div class="bg-zinc-900 p-5 rounded-3xl flex justify-between items-center">
          <div>
            <strong>${l.title}</strong><br>
            <a href="${l.url}" target="_blank" class="text-purple-400">${l.url}</a>
          </div>
        </div>
      `).join('');
    }

    function showMyPublicProfile() {
      if (!currentUser) return;
      window.history.pushState({}, '', `/@${currentUser.username}`);
      showPublicProfile();
    }

    function showPublicProfile() {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('publicProfilePage').classList.remove('hidden');

      document.getElementById('publicName').textContent = currentUser.displayName;
      document.getElementById('publicUsername').textContent = '@' + currentUser.username;
      document.getElementById('publicBio').textContent = currentUser.bio || "Keine Bio...";
      document.getElementById('publicPic').src = currentUser.profilePic;

      const linksDiv = document.getElementById('publicLinks');
      linksDiv.innerHTML = (currentUser.links || []).map(l => `
        <a href="${l.url}" target="_blank" class="block bg-zinc-800 p-6 rounded-3xl hover:bg-zinc-700">${l.title}</a>
      `).join('');
    }

    // Auto Login
    window.onload = () => {
      const savedEmail = localStorage.getItem('currentUserEmail');
      if (savedEmail && users[savedEmail]) {
        currentUser = users[savedEmail];
        showDashboard();
      }
    };
  </script>
</body>
</html>
