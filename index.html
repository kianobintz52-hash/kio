<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>haunt.gg Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-neutral-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r p-6 flex flex-col justify-between">
        <nav class="space-y-3">
            <h1 class="font-bold text-xl mb-8">haunt.gg</h1>
            <button onclick="showTab('customize')" class="block text-sm font-semibold hover:text-pink-500">🪄 Anpassen</button>
            <button onclick="showTab('assets')" class="block text-sm font-semibold hover:text-pink-500">🖼️ Assets</button>
            <button onclick="showTab('links')" class="block text-sm font-semibold hover:text-pink-500">🔗 Links</button>
            <button onclick="showTab('security')" class="block text-sm font-semibold hover:text-pink-500">🛡️ Security & 2FA</button>
            <button onclick="showTab('premium')" class="block text-sm font-semibold hover:text-pink-500">👑 Premium</button>
            <button onclick="showTab('discord')" class="block text-sm font-semibold hover:text-pink-500">👾 Discord</button>
        </nav>
        <button onclick="logout()" class="text-red-500 text-sm font-bold">Logout</button>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        
        <div id="tab-customize" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Profil Anpassen</h2>
            <div class="bg-white p-6 rounded-2xl border shadow-sm">
                <input id="display_name" placeholder="Anzeigename" class="w-full p-2 border rounded-lg mb-4">
                <textarea id="bio" placeholder="Bio" class="w-full p-2 border rounded-lg mb-4"></textarea>
                <button onclick="saveProfile()" class="bg-pink-500 text-white px-6 py-2 rounded-lg">Speichern</button>
            </div>
        </div>

        <div id="tab-assets" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Assets verwalten</h2>
            <p class="text-sm text-neutral-600 mb-4">Unterstützt: PNG, JPG, GIF, WebP (max 10MB).</p>
            <input type="file" id="asset-upload" onchange="uploadAsset(event)" class="mb-4">
        </div>

        <div id="tab-security" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Security & 2FA</h2>
            <div class="bg-white p-6 rounded-2xl border">
                <p class="mb-4">Aktiviere 2FA, um deinen Account zu schützen.</p>
                <button onclick="alert('2FA Prozess gestartet')" class="bg-black text-white px-6 py-2 rounded-lg">Enable 2FA</button>
            </div>
        </div>

        <div id="tab-premium" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Premium Features</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="p-6 border rounded-2xl bg-white">👑 Lifetime Premium</div>
                <div class="p-6 border rounded-2xl bg-white">⚡ Alias Namen</div>
                <div class="p-6 border rounded-2xl bg-white">🎨 Custom Fonts</div>
            </div>
        </div>

        <div id="tab-discord" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Discord Verknüpfung</h2>
            <button onclick="alert('Discord Auth')" class="bg-indigo-600 text-white px-6 py-2 rounded-lg">Connect Discord</button>
        </div>

    </main>

    <script>
        const supabase = supabase.createClient('DEINE_URL', 'DEIN_KEY');

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
        }

        async function saveProfile() {
            const { data: { user } } = await supabase.auth.getUser();
            await supabase.from('profiles').upsert({
                id: user.id,
                display_name: document.getElementById('display_name').value,
                bio: document.getElementById('bio').value
            });
            alert("Profil gespeichert!");
        }

        async function uploadAsset(e) {
            const file = e.target.files[0];
            const { data: { user } } = await supabase.auth.getUser();
            await supabase.storage.from('assets').upload(`${user.id}/asset`, file, { upsert: true });
            alert("Asset erfolgreich hochgeladen!");
        }

        function logout() { supabase.auth.signOut(); location.reload(); }
        
        showTab('customize');
    </script>
</body>
</html>
