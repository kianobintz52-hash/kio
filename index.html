<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .card { background-color: #1a1428; border: 1px solid #4c1d95; }
    .sidebar-active { background-color: #6b21a8; color: white; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleTheme()" class="text-2xl" id="themeBtn">🌙</button>
        <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navLoginBtn">Anmelden</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex flex-col md:flex-row h-screen pt-16">
      <!-- SIDEBAR -->
      <div class="w-full md:w-72 bg-[#0f0a23] border-b md:border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(0)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="switchTab(1)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links</a>
          <a href="#" onclick="switchTab(2)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🎵 Musik</a>
          <a href="#" onclick="showMyPublicProfile()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-4 md:p-10 overflow-y-auto">
        <div class="max-w-5xl mx-auto" id="mainContent">
          <!-- TAB 0: Konto -->
          <div id="tab0">
            <!-- ... dein bisheriger Konto-Inhalt ... -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
              <div class="flex items-center gap-6">
                <img id="profilePicBig" src="https://i.pravatar.cc/128" class="w-24 h-24 md:w-28 md:h-28 rounded-3xl object-cover border-4 border-purple-500 cursor-pointer" onclick="document.getElementById('picUpload').click()">
                <input type="file" id="picUpload" accept="image/*" class="hidden" onchange="uploadProfilePic(event)">
                <div>
                  <h1 id="dashNameTop" class="text-3xl md:text-4xl font-bold"></h1>
                  <p id="dashUsername" class="text-purple-400"></p>
                </div>
              </div>
              <button onclick="logout()" class="text-red-400 hover:text-red-500">Abmelden</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ÖFFENTLICHES PROFIL (separate Seite) -->
  <div id="publicProfilePage" class="hidden min-h-screen bg-zinc-950">
    <div class="max-w-4xl mx-auto bg-zinc-900 rounded-3xl overflow-hidden border border-purple-500/30 shadow-2xl mt-8">
      <!-- Banner -->
      <div class="relative h-64 bg-black">
        <video id="bannerVideoPublic" autoplay loop muted class="w-full h-full object-cover hidden"></video>
        <img id="bannerImagePublic" class="w-full h-full object-cover" alt="Banner">
      </div>

      <!-- Profilbild -->
      <div class="flex justify-center -mt-16 relative z-10">
        <img id="publicProfilePic" src="https://i.pravatar.cc/128" class="w-36 h-36 rounded-3xl object-cover border-4 border-zinc-900">
      </div>

      <div class="text-center px-8 pt-4 pb-12">
        <h1 id="publicName" class="text-5xl font-bold"></h1>
        <p id="publicUsername" class="text-purple-400 text-2xl"></p>

        <!-- Custom Link -->
        <div class="my-6">
          <p class="text-zinc-400 text-sm mb-2">Dein Profil-Link:</p>
          <div class="flex items-center justify-center gap-3 bg-zinc-800 rounded-2xl p-3 max-w-md mx-auto">
            <code id="profileLink" class="text-purple-300 font-mono text-sm"></code>
            <button onclick="copyProfileLink()" class="text-xs bg-purple-600 hover:bg-purple-700 px-4 py-1 rounded-xl">Kopieren</button>
          </div>
        </div>

        <!-- Badges -->
        <div class="my-10">
          <h3 class="text-2xl mb-6">Badges</h3>
          <div id="badgesContainer" class="flex flex-wrap justify-center gap-4"></div>
        </div>

        <!-- Bio -->
        <div class="max-w-2xl mx-auto mb-12 text-left">
          <h3 class="text-2xl mb-4">Über mich</h3>
          <p id="publicBio" class="text-zinc-300 text-lg leading-relaxed"></p>
        </div>

        <!-- Links -->
        <div class="max-w-2xl mx-auto text-left">
          <h3 class="text-2xl mb-6">Links</h3>
          <div id="publicLinks" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    emailjs.init("IuyLZ33ctDj1VxqXE");
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let nextUID = parseInt(localStorage.getItem('nextUID')) || 1;

    // === URL-basierte Routing ===
    function handleRoute() {
      const path = window.location.pathname;
      const usernameMatch = path.match(/@([\w]+)/);

      if (usernameMatch) {
        const username = usernameMatch[1];
        const user = Object.values(users).find(u => u.username === username);
        if (user) {
          showPublicProfileFor(user);
          return;
        }
      }
      // Standard: Hero oder Dashboard
    }

    function showPublicProfileFor(user) {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('publicProfilePage').classList.remove('hidden');

      document.getElementById('publicProfilePic').src = user.profilePic;
      document.getElementById('publicName').textContent = user.username;
      document.getElementById('publicUsername').textContent = `@${user.username}`;
      document.getElementById('publicBio').textContent = user.bio || "Noch keine Bio...";
      document.getElementById('profileLink').textContent = `https://kiobio.lol/@${user.username}`;

      // Banner
      const bannerVideo = document.getElementById('bannerVideoPublic');
      const bannerImg = document.getElementById('bannerImagePublic');
      if (user.bannerType === "video") {
        bannerVideo.src = user.banner;
        bannerVideo.classList.remove('hidden');
        bannerImg.classList.add('hidden');
        bannerVideo.play();
      } else {
        bannerImg.src = user.banner;
        bannerImg.classList.remove('hidden');
        bannerVideo.classList.add('hidden');
      }

      // Badges
      const badgesContainer = document.getElementById('badgesContainer');
      badgesContainer.innerHTML = user.badges.map(b => `
        <div class="bg-gradient-to-r from-amber-400 to-yellow-500 text-black px-6 py-3 rounded-2xl font-bold shadow-lg">
          ${b}
        </div>
      `).join('');

      // Links
      const linksDiv = document.getElementById('publicLinks');
      linksDiv.innerHTML = user.links.map(l => `
        <a href="${l.url}" target="_blank" class="block bg-zinc-800 hover:bg-zinc-700 p-6 rounded-3xl text-lg transition">🔗 ${l.title}</a>
      `).join('');
    }

    function showMyPublicProfile() {
      if (!currentUser) return;
      // Simuliert Navigation zur eigenen Profil-Seite
      window.location.href = `/@${currentUser.username}`;
    }

    function copyProfileLink() {
      const link = document.getElementById('profileLink').textContent;
      navigator.clipboard.writeText(link).then(() => {
        alert("✅ Link kopiert!");
      });
    }

    // Deine bestehenden Funktionen (saveUser, uploadProfilePic, uploadBanner, etc.) bleiben gleich
    // ... (füge hier deine bisherigen Funktionen ein)

    // Initialisierung
    window.onload = () => {
      handleRoute();
      // Falls du weitere Init-Logik hast, hier hinzufügen
    };

    // Für Entwicklung: Testen mit verschiedenen Usern
  </script>
</body>
</html>
