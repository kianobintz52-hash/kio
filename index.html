<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@username - kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
    
    body {
      font-family: 'VT323', monospace;
      background: #000;
      color: #fff;
      overflow: hidden;
      cursor: none;
    }
    #bgVideo, #bgImage {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.85;
    }
    .profile-card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.4);
    }
    .glitch {
      animation: glitch 0.4s linear infinite alternate;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(3px, -3px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body class="home-theme">

  <!-- Background -->
  <video id="bgVideo" autoplay loop muted playsinline></video>
  <img id="bgImage" class="hidden" alt="background">

  <div class="min-h-screen flex items-center justify-center p-6 relative z-10">
    <div class="profile-card max-w-2xl w-full rounded-3xl p-10 text-center">
      
      <!-- Profile Picture -->
      <div class="relative mx-auto w-48 h-48 mb-6">
        <img id="profilePic" 
             class="w-48 h-48 rounded-full border-4 border-purple-500 object-cover glitch"
             src="https://i.pravatar.cc/300">
        <div class="absolute -inset-2 border border-purple-400 rounded-full animate-spin-slow"></div>
      </div>

      <h1 id="displayName" class="text-6xl font-bold mb-2 glitch">Username</h1>
      <p id="username" class="text-purple-400 text-xl mb-6">@username</p>
      
      <p id="bio" class="text-xl text-gray-300 mb-10 leading-relaxed">
        Loading bio...
      </p>

      <!-- Badges -->
      <div id="badges" class="flex justify-center gap-3 flex-wrap mb-10"></div>

      <!-- Social Links -->
      <div id="socialLinks" class="flex justify-center gap-6 mb-12"></div>

      <!-- Visitor Counter -->
      <div class="inline-flex items-center gap-3 bg-black/50 px-8 py-3 rounded-2xl border border-white/10">
        <span class="text-2xl">👁️</span>
        <span id="visitorCount" class="text-3xl font-bold">1337</span>
        <span class="text-gray-400">Views</span>
      </div>
    </div>
  </div>

  <!-- Theme Controls -->
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 flex gap-4 bg-black/70 backdrop-blur-md p-4 rounded-3xl border border-white/10 z-50">
    <button onclick="switchTheme(0)" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-2xl">Home</button>
    <button onclick="switchTheme(1)" class="px-6 py-3 hover:bg-white/10 rounded-2xl">Hacker</button>
    <button onclick="switchTheme(2)" class="px-6 py-3 hover:bg-white/10 rounded-2xl">Rain</button>
    <button onclick="switchTheme(3)" class="px-6 py-3 hover:bg-white/10 rounded-2xl">Anime</button>
  </div>

  <script>
    // Firebase Config (deine aktuelle)
    const firebaseConfig = { /* ... deine Config hier ... */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUserData = {};

    async function loadProfile(username) {
      try {
        // Beispiel: Suche User nach Username
        const snapshot = await db.ref('users').orderByChild('username').equalTo(username).once('value');
        const users = snapshot.val();
        
        if (!users) {
          document.body.innerHTML = "<h1 class='text-center text-4xl mt-40'>User not found :(</h1>";
          return;
        }

        const user = Object.values(users)[0];
        currentUserData = user;

        document.getElementById('displayName').textContent = user.displayName || username;
        document.getElementById('username').textContent = `@${user.username}`;
        document.getElementById('bio').textContent = user.bio || "No bio yet...";
        document.getElementById('profilePic').src = user.profilePic || "https://i.pravatar.cc/300";

        // Background
        if (user.backgroundVideo) {
          document.getElementById('bgVideo').src = user.backgroundVideo;
        } else if (user.backgroundImage) {
          document.getElementById('bgImage').src = user.backgroundImage;
          document.getElementById('bgImage').classList.remove('hidden');
          document.getElementById('bgVideo').classList.add('hidden');
        }

        // Visitor Count erhöhen
        incrementVisitorCount(username);
      } catch (e) {
        console.error(e);
      }
    }

    function incrementVisitorCount(username) {
      const ref = db.ref(`profileViews/${username}`);
      ref.transaction(count => (count || 0) + 1);
      // Dann aktuellen Wert anzeigen...
    }

    function switchTheme(theme) {
      document.body.className = '';
      if (theme === 1) document.body.classList.add('hacker-theme');
      // Hier mehr Themes + Hintergrund-/Musikwechsel möglich
      console.log("Theme switched to", theme);
    }

    // Beispiel: Profil von URL laden
    window.onload = () => {
      const path = window.location.pathname;
      if (path.startsWith('/@')) {
        const username = path.substring(2);
        loadProfile(username);
      }
    };
  </script>
</body>
</html>
