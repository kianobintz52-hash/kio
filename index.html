<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .sidebar-active { background-color: #6b21a8; color: white; }
    .accent { color: var(--accent-color, #c026d3); }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleTheme()" class="text-2xl" id="themeBtn">🌙</button>
        <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navLoginBtn">Anmelden</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 md:p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex flex-col md:flex-row h-screen pt-16">
      <div class="w-full md:w-72 bg-[#0f0a23] border-b md:border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(0)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="switchTab(1)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">✏️ Profil bearbeiten</a>
          <a href="#" onclick="switchTab(2)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links verwalten</a>
          <a href="#" onclick="showMyPublicProfile()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <div class="flex-1 p-4 md:p-10 overflow-y-auto">
        <div class="max-w-5xl mx-auto" id="mainContent">

          <!-- TAB 0: Konto -->
          <div id="tab0">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
              <div class="flex items-center gap-6">
                <img id="profilePicBig" class="w-24 h-24 md:w-28 md:h-28 rounded-3xl object-cover border-4 border-purple-500 cursor-pointer" onclick="document.getElementById('picUpload').click()">
                <input type="file" id="picUpload" accept="image/*" class="hidden" onchange="uploadProfilePic(event)">
                <div>
                  <h1 id="dashNameTop" class="text-3xl md:text-4xl font-bold"></h1>
                  <p id="dashUsername" class="text-purple-400"></p>
                </div>
              </div>
              <button onclick="logout()" class="text-red-400 hover:text-red-500">Abmelden</button>
            </div>
          </div>

          <!-- TAB 1: PROFIL BEARBEITEN (stark erweitert) -->
          <div id="tab1" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Profil bearbeiten</h2>
            <div class="max-w-2xl space-y-8">
              <div>
                <label class="block text-sm mb-2">Anzeigename</label>
                <input id="editName" class="w-full bg-zinc-800 p-4 rounded-2xl">
              </div>
              <div>
                <label class="block text-sm mb-2">Bio</label>
                <textarea id="editBio" rows="4" class="w-full bg-zinc-800 p-4 rounded-2xl"></textarea>
              </div>
              <div>
                <label class="block text-sm mb-2">Akzentfarbe</label>
                <input type="color" id="editAccent" value="#c026d3" class="w-20 h-12 bg-transparent border-0">
              </div>
              <div>
                <label class="block text-sm mb-2">Banner ändern</label>
                <input type="file" id="bannerUploadEdit" accept="image/*,video/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadBanner(event)">
              </div>
              <button onclick="saveProfileChanges()" class="bg-purple-600 hover:bg-purple-700 px-10 py-4 rounded-2xl font-semibold w-full">
                Alle Änderungen speichern
              </button>
            </div>
          </div>

          <!-- TAB 2: Links -->
          <div id="tab2" class="hidden">
            <h2 class="text-3xl font-bold mb-8">Links verwalten</h2>
            <div class="bg-zinc-900 p-8 rounded-3xl mb-10">
              <h3 class="text-xl mb-6">Neuen Link hinzufügen</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="newLinkTitle" placeholder="Titel" class="bg-zinc-800 p-4 rounded-2xl">
                <input id="newLinkUrl" placeholder="https://" class="bg-zinc-800 p-4 rounded-2xl">
              </div>
              <button onclick="addNewLink()" class="mt-6 bg-purple-600 hover:bg-purple-700 px-8 py-4 rounded-2xl font-semibold w-full">+ Hinzufügen</button>
            </div>
            <div id="currentLinksList" class="space-y-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PUBLIC PROFILE -->
  <div id="publicProfilePage" class="hidden min-h-screen bg-zinc-950 pb-20">
    <div class="max-w-4xl mx-auto bg-zinc-900 rounded-3xl overflow-hidden border border-purple-500/30 shadow-2xl mt-8">
      <div class="relative h-64 bg-black">
        <video id="bannerVideoPublic" autoplay loop muted class="w-full h-full object-cover hidden"></video>
        <img id="bannerImagePublic" class="w-full h-full object-cover" alt="Banner">
      </div>
      <div class="flex justify-center -mt-16 relative z-10">
        <img id="publicProfilePic" class="w-36 h-36 rounded-3xl object-cover border-4 border-zinc-900">
      </div>
      <div class="text-center px-8 pt-4 pb-12">
        <h1 id="publicName" class="text-5xl font-bold accent"></h1>
        <p id="publicUsername" class="text-purple-400 text-2xl"></p>
        
        <div class="my-8">
          <code id="profileLink" class="text-purple-300 font-mono text-sm"></code>
          <button onclick="copyProfileLink()" class="ml-3 text-xs bg-purple-600 px-4 py-2 rounded-xl">Kopieren</button>
        </div>

        <div id="publicBio" class="max-w-2xl mx-auto mb-12 text-left text-zinc-300 leading-relaxed"></div>
        <div id="publicLinks" class="max-w-2xl mx-auto space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let tempRegisterData = {};
    const VERIFICATION_CODE = "666";

    // Auto-Login bei Seitenaufruf
    function checkAutoLogin() {
      const savedEmail = localStorage.getItem('currentUserEmail');
      if (savedEmail && users[savedEmail]) {
        currentUser = users[savedEmail];
        showDashboard();
      }
    }

    function showModal(title, html) {
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    // Register & Login (wie vorher, aber mit Auto-Save)
    function showRegisterModal() { /* ... gleich wie letzte Version ... */ }
    function sendVerificationCode() { /* ... */ }
    function verifyCode() { 
      if (document.getElementById('verifyCode').value === VERIFICATION_CODE) {
        saveUser();
        closeModal();
      }
    }

    function saveUser() {
      const {email, username, password} = tempRegisterData;
      users[email] = {
        email, username, displayName: username, password,
        views: 0, bio: "", accentColor: "#c026d3",
        profilePic: "https://i.pravatar.cc/128?u=" + Date.now(),
        banner: "https://picsum.photos/id/1015/1200/400",
        bannerType: "image",
        links: []
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      loginAfterRegister(email);
    }

    function loginAfterRegister(email) {
      currentUser = users[email];
      localStorage.setItem('currentUserEmail', email); // Für Auto-Login
      showDashboard();
    }

    function showLoginModal() { /* ... */ }
    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const user = users[email];
      if (user && user.password === password) {
        currentUser = user;
        localStorage.setItem('currentUserEmail', email);
        closeModal();
        showDashboard();
      } else alert("Falsche Daten");
    }

    function logout() {
      localStorage.removeItem('currentUserEmail');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navLoginBtn').textContent = "Abmelden";
      document.getElementById('navLoginBtn').onclick = logout;

      document.getElementById('dashNameTop').textContent = currentUser.displayName || currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
      document.getElementById('profilePicBig').src = currentUser.profilePic;
      switchTab(0);
    }

    // Profil bearbeiten speichern
    function saveProfileChanges() {
      currentUser.displayName = document.getElementById('editName').value || currentUser.username;
      currentUser.bio = document.getElementById('editBio').value;
      currentUser.accentColor = document.getElementById('editAccent').value;

      users[currentUser.email] = currentUser;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      alert("✅ Gespeichert!");
      switchTab(0);
    }

    function uploadBanner(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentUser.banner = ev.target.result;
        currentUser.bannerType = file.type.startsWith('video/') ? "video" : "image";
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        alert("Banner gespeichert!");
      };
      reader.readAsDataURL(file);
    }

    // Restliche Funktionen (Link Manager, Public Profile, Routing)
    function switchTab(n) {
      document.querySelectorAll('#mainContent > div').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab' + n).classList.remove('hidden');
      if (n === 2) renderCurrentLinks();
    }

    function showMyPublicProfile() {
      if (currentUser) {
        window.history.pushState({}, '', `/@${currentUser.username}`);
        showPublicProfileFor(currentUser);
      }
    }

    function showPublicProfileFor(user) {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('publicProfilePage').classList.remove('hidden');

      document.getElementById('publicName').textContent = user.displayName || user.username;
      document.getElementById('publicUsername').textContent = `@${user.username}`;
      document.getElementById('publicBio').textContent = user.bio || "Keine Bio vorhanden.";
      document.getElementById('profileLink').textContent = `https://kiobio.lol/@${user.username}`;

      // Banner
      if (user.bannerType === "video") {
        document.getElementById('bannerVideoPublic').src = user.banner;
        document.getElementById('bannerVideoPublic').classList.remove('hidden');
      } else {
        document.getElementById('bannerImagePublic').src = user.banner;
      }

      // Links
      const linksDiv = document.getElementById('publicLinks');
      linksDiv.innerHTML = (user.links || []).map(l => `
        <a href="${l.url}" target="_blank" class="block bg-zinc-800 hover:bg-zinc-700 p-6 rounded-3xl text-lg">${l.title}</a>
      `).join('');
    }

    function handleRoute() {
      const match = window.location.pathname.match(/@(.+)/);
      if (match) {
        const username = match[1];
        const user = Object.values(users).find(u => u.username === username);
        if (user) showPublicProfileFor(user);
      }
    }

    window.onload = () => {
      checkAutoLogin();
      handleRoute();
    };
  </script>
</body>
</html>
