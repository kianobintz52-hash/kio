<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y3zd Profile</title>
    <style>
        /* CSS aus style.css */
        :root {
            --primary-color: #00CED1; 
            --secondary-color: #FF6B9E;
            --background-dark: #0A0A1A;
            --text-color: #E0E0FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--background-dark);
            color: var(--text-color);
            overflow-x: hidden;
            overflow-y: auto;
            perspective: 1000px;
            cursor: none;
        }

        .custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            background: url('assets/custom_cursor.png') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease-out;
            filter: hue-rotate(var(--cursor-hue, 0deg)); 
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Glitch Animation Keyframes */
        @keyframes glitch-anim {
            0% { clip: rect(35px, 9999px, 14px, 0); }
            10% { clip: rect(60px, 9999px, 50px, 0); }
            30% { clip: rect(28px, 9999px, 15px, 0); }
            100% { clip: rect(90px, 9999px, 55px, 0); }
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>

    <div class="container">
        <video id="background" autoplay loop muted playsinline>
            <source src="assets/background.mp4" type="video/mp4">
        </video>
        
        <main id="content">
            <h1>Willkommen auf meinem Profil</h1>
        </main>
    </div>

    <script>
        // JavaScript aus script.js
        document.addEventListener('DOMContentLoaded', () => {
            const cursor = document.getElementById('cursor');

            // Custom Cursor Logik
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });

            console.log("Seite geladen und Skripte initialisiert.");
            
            // Medien-Initialisierung
            const backgroundMusic = document.getElementById('background-music');
            if (backgroundMusic) {
                backgroundMusic.volume = 0.3;
            }
        });
    </script>
</body>
</html>
