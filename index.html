<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link</title>
    <style>
        /* CSS-Regeln aus deiner style.css */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, * { cursor: none !important; }
        body {
            font-family: 'Roboto Mono', monospace;
            overflow: auto;
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #custom-cursor {
            position: fixed; width: 40px; height: 40px; background-size: contain;
            background-repeat: no-repeat; background-position: center; pointer-events: none;
            z-index: 9999999; transition: transform 0.1s ease, opacity 0.3s ease;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8)); will-change: transform, left, top; opacity: 0;
        }
        .overlay #custom-cursor { opacity: 0 !important; }
        a, button, .ctrl, .link, .spotify-widget, .discord-presence { position: relative; z-index: 1; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; filter: brightness(0.4); }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0); z-index: -1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 1; cursor: pointer !important; }
        #overlay-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .overlay-blur { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(10px); background: rgba(0, 0, 0, 0.7); z-index: 2; }
        .overlay-content { text-align: center; color: #fff; position: relative; z-index: 3; }
        .overlay-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; letter-spacing: 4px; opacity: 0.8; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
        .c3d-container { perspective: 1000px; width: 780px; height: auto; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: translateY(10px); }
        .overlay-hidden .c3d-container { opacity: 1; transform: translateY(0); transition: opacity 0.8s ease-out 0.5s, transform 0.8s ease-out 0.5s; }
        .overlay-hidden .overlay { opacity: 0; visibility: hidden; }
        #c3d { display: flex; flex-direction: column; gap: 8px; opacity: 0.9; transform-style: preserve-3d; will-change: transform; transition: transform 0.1s ease-out; }
        .card { background: rgba(25, 25, 25, 1); padding: 30px 40px; border-radius: 5px; width: 700px; height: auto; min-height: 292px; max-height: 300px; border: 10px medium rgba(255, 255, 255); position: relative; transform-style: preserve-3d; will-change: transform; transition: all 0.3s ease-out; box-sizing: border-box; overflow: visible !important; backdrop-filter: blur(21px); transform: translateY(-100px); }
        /* Weitere notwendige responsive CSS-Klassen */
        @media (max-width: 800px) {
            .c3d-container { width: 95vw; height: 200px; perspective: 800px; transform: translateY(50px); }
            .card { width: 90vw; max-width: 700px; height: auto; min-height: 280px; padding: 30px 40px; }
            .player { width: 90vw; max-width: 700px; height: 85px; padding: 10px 25px; }
            .presence-container { flex-direction: row; gap: 15px; }
            .discord-presence, .spotify-widget { width: calc(50% - 8px); max-width: none; height: 80px; }
            .overlay-title { font-size: 64px; letter-spacing: 4px; }
            .name { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay">
        <div class="overlay-blur"></div>
        <div class="overlay-content">
            <div class="overlay-title">CLICK TO ENTER</div>
        </div>
    </div>

    <div class="c3d-container">
        <div id="c3d">
            <div class="card" id="mainCard">
                <div class="name" id="discord-username">Lade...</div>
                <div id="discord-activity-line">No activity</div>
            </div>
            
            <div class="player" id="playerElement">
                <button class="ctrl play" id="playBtn" title="Play/Pause">PLAY</button>
                <button class="ctrl next" id="nextBtn" title="Next">NEXT</button>
                <div id="viewCount">0</div>
            </div>
        </div>
    </div>

    <script>
        // 1. ZUERST DIE KONFIGURATION (config.js)
        const config = {
            general: {
                backgroundMusic: { enabled: true, volume: 0.5 }
            },
            viewCounter: {
                enabled: true,
                jsonBlob: { blobId: "DEINE_BLOB_ID_HIER" }
            },
            discord: {
                fallbackData: {
                    username: "User",
                    discriminator: "0",
                    avatar: "https://via.placeholder.com/150"
                }
            },
            spotifyWidget: {
                playlist: { name: "Meine Playlist", creator: "Ich", saves: "100", songs: "50" }
            }
        };

        // 2. MUSIK PLAYER LOGIK (musicPlayer.js)
        let isDragging = false;
        const playBtn = document.getElementById('playBtn');
        if (playBtn) {
            playBtn.addEventListener('click', () => {
                console.log("Musik wird abgespielt/pausiert...");
            });
        }

        // 3. SEITENAUFRUFE (viewCounter.js)
        async function initViewCounter() {
            if (!config.viewCounter || !config.viewCounter.enabled) return;
            const blobId = config.viewCounter.jsonBlob.blobId;
            const apiUrl = "https://api.jsonblob.com/api/jsonBlob/";
            try {
                const counterElement = document.getElementById('viewCount');
                if (counterElement) counterElement.textContent = "123"; // Beispielwert/Live-Fetch-Logik
            } catch (error) {
                console.error("View counter error:", error);
            }
        }

        // 4. NEIGUNGSEFFEKT (tiltEffect.js)
        const c3dElement = document.getElementById('c3d');
        const mainCardElement = document.getElementById('mainCard');
        const playerElement = document.getElementById('playerElement');
        if (c3dElement && mainCardElement && playerElement) {
            c3dElement.addEventListener('mousemove', (e) => {
                let rect = mainCardElement.getBoundingClientRect();
                let x = e.clientX - rect.left - (rect.width/2);
                let y = e.clientY - rect.top - (rect.height/2);
                mainCardElement.style.transform = `rotateY(${x / 20}deg) rotateX(${-y / 20}deg)`;
            });
            c3dElement.addEventListener('mouseleave', () => {
                mainCardElement.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }

        // 5. DISCORD STATUS (discord.js)
        function showFallbackDiscordPresence() {
            const usernameEl = document.getElementById('discord-username');
            if (usernameEl) usernameEl.textContent = config.discord.fallbackData.username;
        }

        // 6. SPOTIFY INTERAKTION (spotify-interaction.js)
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Spotify Integration geladen.");
        });

        // 7. MAIN LOGIK (main.js)
        const overlay = document.getElementById('overlay');
        if (overlay) {
            overlay.addEventListener('click', () => {
                document.body.classList.add('overlay-hidden');
                initViewCounter();
                showFallbackDiscordPresence();
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 800);
            });
        }
    </script>
</body>
</html>
