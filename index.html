<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>High-Speed Webhook Sender</title>
</head>
<body>

    <h3>Discord Webhook Sender (Turbo-Modus)</h3>
    <input type="text" id="webhookUrl" placeholder="Webhook URL" style="width: 300px;"><br>
    <textarea id="messageContent" placeholder="Deine Nachricht..."></textarea><br>
    
    <label>Anzahl:</label>
    <input type="number" id="count" value="10">
    
    <label>Pause (ms):</label>
    <input type="number" id="delay" value="100"> <button onclick="sendWebhook()">Jetzt senden</button>

    <script>
        async function sendWebhook() {
            const url = document.getElementById('webhookUrl').value;
            const content = document.getElementById('messageContent').value;
            const count = parseInt(document.getElementById('count').value);
            const delay = parseInt(document.getElementById('delay').value);

            for (let i = 0; i < count; i++) {
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                }).then(res => {
                    if (res.status === 429) console.warn("Rate Limit erreicht!");
                });
                
                // Warten basierend auf der Eingabe
                await new Promise(r => setTimeout(r, delay));
            }
            alert("Vorgang beendet.");
        }
    </script>
</body>
</html>
