<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiano - Deine KI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
        }
        .chat-container {
            scrollbar-width: thin;
            scrollbar-color: #64748b #334155;
        }
        .message {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .kiano-avatar {
            background: linear-gradient(45deg, #8b5cf6, #ec4899);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-slate-900 border-r border-slate-700 flex flex-col">
            <div class="p-6 border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 kiano-avatar rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg">
                        K
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Kiano</h1>
                        <p class="text-emerald-400 text-sm flex items-center gap-1">
                            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
                            Online
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="p-4">
                <button onclick="newChat()" 
                        class="w-full flex items-center justify-center gap-2 bg-violet-600 hover:bg-violet-700 py-3 px-4 rounded-2xl font-medium transition-all active:scale-95">
                    <i class="fas fa-plus"></i>
                    Neuer Chat
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3 space-y-1 chat-container">
                <div class="px-3 py-2 text-xs uppercase text-slate-400 font-medium">Heutige Chats</div>
                <!-- JS will populate previous chats -->
            </div>
            
            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3 text-sm">
                    <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center">
                        👤
                    </div>
                    <div class="flex-1">
                        <div class="font-medium">Dein Name</div>
                        <div class="text-slate-400 text-xs">Free Plan</div>
                    </div>
                    <button onclick="showSettings()" class="text-slate-400 hover:text-white">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <div class="h-16 border-b border-slate-700 bg-slate-900/80 backdrop-blur-md flex items-center px-6 justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 kiano-avatar rounded-2xl flex items-center justify-center text-white font-bold">K</div>
                    <div>
                        <h2 class="font-semibold">Kiano</h2>
                        <p class="text-xs text-emerald-400">Bereit zu helfen</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 text-slate-400">
                    <button onclick="toggleModel()" class="flex items-center gap-2 hover:text-white transition-colors">
                        <i class="fas fa-brain"></i>
                        <span id="model-name" class="text-sm">Kiano-1.5</span>
                    </button>
                    <button class="hover:text-white transition-colors">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
            
            <!-- Messages -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-8 chat-container bg-slate-950/50">
                <!-- Welcome message will be added by JS -->
            </div>
            
            <!-- Input Area -->
            <div class="p-6 bg-slate-900 border-t border-slate-700">
                <div class="max-w-3xl mx-auto">
                    <div class="relative">
                        <textarea id="user-input" 
                                  rows="1"
                                  class="w-full bg-slate-800 border border-slate-600 rounded-3xl px-6 py-5 pr-24 resize-y focus:outline-none focus:border-violet-500 text-lg"
                                  placeholder="Schreib eine Nachricht an Kiano..."></textarea>
                        
                        <button onclick="sendMessage()" 
                                class="absolute right-3 bottom-3 bg-violet-600 hover:bg-violet-700 w-12 h-12 rounded-2xl flex items-center justify-center transition-all active:scale-95">
                            <i class="fas fa-paper-plane text-white"></i>
                        </button>
                    </div>
                    
                    <p class="text-center text-slate-500 text-xs mt-3">
                        Kiano kann Fehler machen. Überlege kritisch.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-slate-900 rounded-3xl w-full max-w-md mx-4">
            <div class="p-6 border-b border-slate-700 flex items-center justify-between">
                <h3 class="text-xl font-semibold">Einstellungen</h3>
                <button onclick="hideSettings()" class="text-2xl leading-none text-slate-400 hover:text-white">×</button>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">KI-Name</label>
                    <input id="ki-name-input" type="text" value="Kiano" 
                           class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                </div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Persönlichkeit</label>
                    <select id="personality-select" class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <option value="hilfsbereit">Hilfsbereit & Freundlich</option>
                        <option value="witzig">Witzig & Sarkastisch</option>
                        <option value="professionell">Professionell</option>
                        <option value="kreativ" selected>Kreativ & Inspirierend</option>
                    </select>
                </div>
                
                <div class="pt-4 border-t border-slate-700">
                    <button onclick="saveSettings()" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-medium">
                        Einstellungen speichern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let currentPersonality = "kreativ";
        
        function addMessage(role, content) {
            const chat = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message`;
            
            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="max-w-[80%]">
                        <div class="bg-violet-600 text-white px-6 py-4 rounded-3xl rounded-tr-none">
                            ${content}
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex gap-4 max-w-[80%]">
                        <div class="w-8 h-8 kiano-avatar rounded-2xl flex-shrink-0 flex items-center justify-center text-white font-bold">K</div>
                        <div>
                            <div class="text-xs text-slate-400 mb-1">Kiano • gerade eben</div>
                            <div class="bg-slate-800 px-6 py-4 rounded-3xl rounded-tl-none">
                                ${content}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
            messages.push({role, content});
        }
        
        function simulateKianoResponse(userMessage) {
            const responses = {
                default: [
                    "Interessante Frage! Lass mich darüber nachdenken...",
                    "Das ist eine super spannende Idee. Hier ist, was ich dazu denke:",
                    "Gute Frage! Ich würde es so angehen:",
                    "Wow, da hast du mich zum Nachdenken gebracht. Meine Antwort:"
                ]
            };
            
            const randomResponse = responses.default[Math.floor(Math.random() * responses.default.length)];
            
            // Simple "smart" responses
            let reply = randomResponse;
            
            if (userMessage.toLowerCase().includes("hallo") || userMessage.toLowerCase().includes("hey")) {
                reply = "Hey! Schön dich zu sehen. Wie kann ich dir heute helfen? 😊";
            } else if (userMessage.toLowerCase().includes("wie geht")) {
                reply = "Mir geht's fantastisch – schließlich bin ich eine KI! Und dir?";
            } else if (userMessage.toLowerCase().includes("wer bist du")) {
                reply = "Ich bin Kiano, deine persönliche KI. Entwickelt, um dir bei allem zu helfen, was du brauchst.";
            }
            
            setTimeout(() => {
                addMessage('assistant', reply);
            }, 800);
        }
        
        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            
            simulateKianoResponse(text);
        }
        
        function newChat() {
            document.getElementById('chat-messages').innerHTML = '';
            messages = [];
            showWelcome();
        }
        
        function showWelcome() {
            const chat = document.getElementById('chat-messages');
            chat.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center py-20">
                    <div class="w-24 h-24 kiano-avatar rounded-3xl flex items-center justify-center text-white text-7xl mb-8 shadow-2xl">K</div>
                    <h1 class="text-5xl font-bold tracking-tighter mb-3">Hallo, ich bin Kiano</h1>
                    <p class="text-slate-400 max-w-md text-lg">Deine persönliche KI. Frag mich alles – von kreativen Ideen über Programmierhilfe bis hin zu tiefgründigen Gesprächen.</p>
                    
                    <div class="grid grid-cols-2 gap-4 mt-12 w-full max-w-xl">
                        <div onclick="quickPrompt(this)" class="bg-slate-800 hover:bg-slate-700 p-5 rounded-3xl cursor-pointer transition-all">
                            <div class="text-violet-400 mb-1">✨</div>
                            <div class="font-medium">Kreative Geschichte schreiben</div>
                        </div>
                        <div onclick="quickPrompt(this)" class="bg-slate-800 hover:bg-slate-700 p-5 rounded-3xl cursor-pointer transition-all">
                            <div class="text-emerald-400 mb-1">💡</div>
                            <div class="font-medium">Ideen für mein Projekt</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function quickPrompt(el) {
            const text = el.textContent.trim();
            newChat();
            setTimeout(() => {
                addMessage('user', text);
                simulateKianoResponse(text);
            }, 300);
        }
        
        function toggleModel() {
            alert("In einer echten Version könntest du hier zwischen verschiedenen Modellen wechseln.");
        }
        
        function showSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        
        function hideSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }
        
        function saveSettings() {
            const newName = document.getElementById('ki-name-input').value;
            if (newName) {
                // In real version, update header
                alert("Name geändert zu: " + newName + " (Frontend-Demo)");
            }
            hideSettings();
        }
        
        // Keyboard support
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Initialize
        window.onload = function() {
            showWelcome();
            
            // Tailwind script already loaded
        };
    </script>
</body>
</html>
