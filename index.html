<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    body { font-family: 'Inter', system-ui; background: #000; color: white; overflow-x: hidden; }
    .glow { text-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff; animation: pulse 3s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
    .neon { box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.6; }
    .modal { animation: popIn 0.3s ease; }
    @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/754/754-small.mp4" type="video/mp4">
  </video>

  <!-- LANDING -->
  <div id="landing" class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative">
    <h1 onclick="toggleTheme()" class="text-8xl md:text-9xl font-black glow cursor-pointer mb-6"># kiobio . lol</h1>
    <p class="text-4xl mb-8">Everything you want, right here.</p>
    <div class="flex flex-col sm:flex-row gap-6">
      <button onclick="showAuthModal('register')" class="bg-white text-black px-12 py-7 rounded-3xl text-3xl font-bold hover:scale-110 neon">Profil claimen</button>
      <button onclick="showAuthModal('login')" class="border-4 border-white px-12 py-7 rounded-3xl text-3xl font-bold hover:bg-white hover:text-black">Anmelden</button>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md modal">
      <h2 id="modalTitle" class="text-3xl font-bold mb-8 text-center"></h2>
      <div id="authContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen p-8 bg-zinc-950">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-4xl font-bold mb-8">Dashboard — <span id="dashUsername" class="text-pink-500"></span>.kiobio.lol</h1>
      
      <div class="bg-zinc-900 rounded-3xl p-8">
        <!-- Uploads -->
        <div class="grid grid-cols-2 gap-8 mb-8">
          <div>
            <label>Profilbild</label>
            <input type="file" id="avatarInput" accept="image/*" class="block w-full mt-2">
            <button onclick="uploadAvatar()" class="mt-4 bg-pink-600 px-8 py-3 rounded-2xl">Hochladen</button>
          </div>
          <div>
            <label>Hintergrund (Bild/Video)</label>
            <input type="file" id="bgInput" accept="image/*,video/*" class="block w-full mt-2">
            <button onclick="uploadBackground()" class="mt-4 bg-pink-600 px-8 py-3 rounded-2xl">Hochladen</button>
          </div>
        </div>

        <!-- Bio -->
        <textarea id="bioInput" class="w-full h-32 bg-zinc-800 rounded-2xl p-5" placeholder="Deine Bio..."></textarea>

        <!-- Links -->
        <div class="mt-8">
          <h3 class="mb-4 text-xl">Links</h3>
          <div id="linksContainer" class="space-y-4"></div>
          <button onclick="addLinkField()" class="mt-4 text-pink-400">+ Link hinzufügen</button>
        </div>

        <button onclick="saveProfile()" class="mt-10 w-full bg-green-600 py-6 rounded-3xl text-xl font-bold">Speichern</button>
        <button onclick="viewMyProfile()" class="mt-4 w-full bg-zinc-700 py-4 rounded-3xl">Profil ansehen</button>
      </div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="hidden min-h-screen relative bg-cover bg-center"></div>

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers') || '[]');

    function saveUsers() { localStorage.setItem('kiobioUsers', JSON.stringify(users)); }

    function showAuthModal(type) {
      document.getElementById('authModal').classList.remove('hidden');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('authContent');
      title.textContent = type === 'register' ? 'Profil claimen' : 'Anmelden';

      content.innerHTML = type === 'register' ? `
        <input id="regUser" placeholder="Username" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        <input id="regPass" type="password" placeholder="Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        <button onclick="registerUser()" class="w-full mt-6 bg-pink-600 py-6 rounded-3xl">Erstellen</button>
      ` : `
        <input id="loginInput" placeholder="Username oder Email" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <input id="loginPass" type="password" placeholder="Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        <button onclick="loginUser()" class="w-full mt-6 bg-pink-600 py-6 rounded-3xl">Anmelden</button>
      `;
    }

    function registerUser() {
      const username = document.getElementById('regUser').value.toLowerCase().trim();
      if (users.find(u => u.username === username)) return alert("Username vergeben!");
      const newUser = { username, bio: "", avatar: "", background: "", links: [], id: Date.now() };
      users.push(newUser);
      saveUsers();
      loginAs(newUser);
    }

    function loginUser() {
      const input = document.getElementById('loginInput').value.toLowerCase().trim();
      const user = users.find(u => u.username === input);
      if (user) loginAs(user); else alert("Nicht gefunden");
    }

    function loginAs(user) {
      currentUser = user;
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('dashUsername').textContent = user.username;
    }

    function addLinkField() {
      if (!currentUser.links) currentUser.links = [];
      currentUser.links.push({title: "Neuer Link", url: "https://"});
      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksContainer');
      container.innerHTML = currentUser.links.map((link, i) => `
        <div class="flex gap-3">
          <input value="${link.title}" onchange="currentUser.links[${i}].title=this.value" class="flex-1 bg-zinc-800 p-4 rounded-2xl">
          <input value="${link.url}" onchange="currentUser.links[${i}].url=this.value" class="flex-1 bg-zinc-800 p-4 rounded-2xl">
          <button onclick="currentUser.links.splice(${i},1);renderLinks()" class="text-red-500">✕</button>
        </div>
      `).join('');
    }

    function uploadAvatar() {
      const file = document.getElementById('avatarInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => { currentUser.avatar = e.target.result; alert("Profilbild gespeichert!"); };
        reader.readAsDataURL(file);
      }
    }

    function uploadBackground() {
      const file = document.getElementById('bgInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => { currentUser.background = e.target.result; alert("Hintergrund gespeichert!"); };
        reader.readAsDataURL(file);
      }
    }

    function saveProfile() {
      currentUser.bio = document.getElementById('bioInput').value;
      saveUsers();
      alert("✅ Gespeichert!");
    }

    function viewMyProfile() {
      const view = document.getElementById('profileView');
      view.classList.remove('hidden');
      view.innerHTML = `
        <div class="min-h-screen flex items-center justify-center text-center p-6" style="background-image: url('${currentUser.background || ''}'); background-size: cover;">
          <div class="bg-black/70 p-10 rounded-3xl max-w-lg">
            ${currentUser.avatar ? `<img src="${currentUser.avatar}" class="w-32 h-32 rounded-full mx-auto mb-6 border-4 border-pink-500">` : ''}
            <h1 class="text-5xl font-bold">${currentUser.username}</h1>
            <p class="mt-6">${currentUser.bio || 'Keine Bio'}</p>
            <div class="mt-10 space-y-4">
              ${(currentUser.links || []).map(l => `<a href="${l.url}" target="_blank" class="block bg-zinc-900 p-5 rounded-2xl">${l.title}</a>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function toggleTheme() {
      document.body.classList.toggle('!bg-zinc-100');
      document.body.classList.toggle('!text-black');
    }

    console.log("%c kiobio.lol — Vollständiger Clone bereit!", "color:#ff00ff;font-size:18px");
  </script>
</body>
</html>
