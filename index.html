<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiobio.lol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <style>
        body { background: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif; }
        .glass { background: rgba(30, 30, 35, 0.9); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen">

<nav class="fixed top-0 w-full bg-black/80 backdrop-blur-md border-b border-zinc-800 z-50">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🔫</span>
            <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
    </div>
</nav>

<!-- HERO -->
<section id="hero" class="min-h-screen flex items-center justify-center text-center">
    <div class="max-w-xl">
        <h1 class="text-6xl font-bold mb-6">kiobio.lol</h1>
        <p class="text-xl text-zinc-400 mb-10">Dein Profil. Deine Regeln.</p>
        <button onclick="showLoginModal()" class="bg-white text-black px-10 py-4 rounded-2xl text-lg font-semibold">Anmelden</button>
        <button onclick="showRegisterModal()" class="ml-4 border border-zinc-700 px-10 py-4 rounded-2xl text-lg">Registrieren</button>
    </div>
</section>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden min-h-screen pt-24 px-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-5xl font-bold">Willkommen zurück, <span id="welcomeName" class="text-sky-400"></span>!</h1>

        <!-- Owner Panel -->
        <div id="ownerPanel" class="hidden mt-12 bg-zinc-900 border border-sky-500 rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6">👑 Owner Panel</h2>
            <input id="targetUsername" placeholder="Username für Badge" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
            <select id="badgeSelect" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
                <option value="owner">👑 Owner</option>
                <option value="premium">⭐ Premium</option>
                <option value="vip">💎 VIP</option>
                <option value="legend">🔥 Legend</option>
            </select>
            <button onclick="giveBadge()" class="w-full bg-sky-600 py-4 rounded-2xl font-bold">Badge vergeben</button>
        </div>
    </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="glass rounded-3xl p-10 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-8">Anmelden</h2>
        <input id="loginEmail" type="email" value="u3271805041@gmail.com" placeholder="Email" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
        <input id="loginPassword" type="password" value="666666" placeholder="Passwort" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
        <button onclick="doLogin()" class="w-full bg-white text-black py-4 rounded-2xl font-semibold">Anmelden</button>
    </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="glass rounded-3xl p-10 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-8">Registrieren</h2>
        <input id="regEmail" type="email" placeholder="Email" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
        <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
        <input id="regPassword" type="password" placeholder="Passwort (min. 6)" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
        <button onclick="registerUser()" class="w-full bg-white text-black py-4 rounded-2xl font-semibold">Registrieren</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6NPF9FIJsDipQg3dvxSohtAJCGVF4NUc",
      authDomain: "kiobiool.firebaseapp.com",
      databaseURL: "https://kiobiool-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kiobiool",
      storageBucket: "kiobiool.firebasestorage.app",
      appId: "1:1003434485509:web:872f257b0758051c80b96c"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    // ==================== REGISTER ====================
    async function registerUser() {
        const email = document.getElementById('regEmail').value.trim();
        const username = document.getElementById('regUsername').value.trim().toLowerCase();
        const password = document.getElementById('regPassword').value.trim();

        if (!email || !username || password.length < 6) return alert("Alle Felder ausfüllen!");

        try {
            // Username schon vergeben?
            const usernameSnap = await db.ref('usernames/' + username).once('value');
            if (usernameSnap.exists()) return alert("Dieser Benutzername ist bereits vergeben!");

            const res = await auth.createUserWithEmailAndPassword(email, password);

            await db.ref('users/' + res.user.uid).set({
                uid: res.user.uid,
                email: email,
                username: username,
                displayName: username,
                bio: "Neu hier 🔥",
                badges: []
            });

            await db.ref('usernames/' + username).set(res.user.uid);

            alert("✅ Registrierung erfolgreich!");
            hideModals();
            currentUser = res.user;
            showDashboard();
        } catch (e) {
            alert(e.message);
        }
    }

    // ==================== LOGIN ====================
    async function doLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await auth.signInWithEmailAndPassword(email, password);
            currentUser = res.user;
            hideModals();
            showDashboard();
        } catch (e) {
            alert("Login fehlgeschlagen: " + e.message);
        }
    }

    function hideModals() {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('registerModal').classList.add('hidden');
    }

    function showLoginModal() {
        hideModals();
        document.getElementById('loginModal').classList.remove('hidden');
    }

    function showRegisterModal() {
        hideModals();
        document.getElementById('registerModal').classList.remove('hidden');
    }

    function showDashboard() {
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('welcomeName').textContent = currentUser.email.split('@')[0];

        // Owner Check
        if (currentUser.email === "u3271805041@gmail.com") {
            document.getElementById('ownerPanel').classList.remove('hidden');
        }
    }

    async function giveBadge() {
        const target = document.getElementById('targetUsername').value.trim().toLowerCase();
        const badge = document.getElementById('badgeSelect').value;

        if (!target) return alert("Username eingeben!");

        const snap = await db.ref('usernames/' + target).once('value');
        if (!snap.exists()) return alert("User nicht gefunden!");

        const uid = snap.val();
        const badgesRef = db.ref('users/' + uid + '/badges');
        const current = (await badgesRef.once('value')).val() || [];

        if (!current.includes(badge)) {
            current.push(badge);
            await badgesRef.set(current);
            alert(`✅ Badge "${badge}" an @${target} vergeben!`);
        } else {
            alert("User hat diesen Badge bereits.");
        }
    }

    function logout() {
        auth.signOut();
        location.reload();
    }

    window.onload = () => {
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showDashboard();
            }
        });
    };
</script>
</body>
</html>
