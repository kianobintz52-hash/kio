<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deinname.lol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap');

    :root {
      --neon-pink: #ff00ff;
      --neon-cyan: #00ffff;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Hintergrund Video */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.6;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, rgba(10,0,30,0.85), rgba(0,0,0,0.7));
      z-index: -1;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .banner {
      width: 100%;
      height: 180px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      border-radius: 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,0,255,0.6);
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid #000;
      margin: -70px auto 10px;
      box-shadow: 0 0 0 6px var(--neon-pink);
    }

    h1 {
      font-size: 2.8rem;
      margin: 10px 0 8px;
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .username {
      font-family: 'Press Start 2P', cursive;
      color: var(--neon-cyan);
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .bio {
      font-size: 1.05rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    /* Neon Buttons */
    .link {
      display: block;
      background: rgba(0,0,0,0.7);
      border: 2px solid var(--neon-pink);
      color: white;
      padding: 16px 20px;
      margin: 12px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .link:hover {
      background: var(--neon-pink);
      color: black;
      box-shadow: 0 0 25px var(--neon-pink);
      transform: scale(1.03);
    }

    /* Musik Player */
    #music-player {
      background: rgba(0,0,0,0.8);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 15px;
      margin: 25px 0;
    }

    /* Toggle */
    .toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      border: 2px solid var(--neon-pink);
      z-index: 10;
    }

    .glitch {
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
      100% { text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-cyan); }
    }
  </style>
</head>
<body>
  <!-- Hintergrund Video (ändere die URL) -->
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/12345/12345-large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="toggle" onclick="toggleTheme()">🌙 / ☀️</div>

  <div class="container">
    <div class="banner"></div>
    
    <img src="https://i.imgur.com/deinbild.jpg" alt="Avatar" class="avatar">

    <h1 class="glitch">DeinName</h1>
    <div class="username">@deinname.lol</div>
    <p class="bio">Chaos | Gamer | Professional Meme Lord 🔥</p>

    <!-- Musik Player -->
    <div id="music-player">
      <p style="margin-bottom:8px;">♪ Now Playing</p>
      <audio id="audio" controls style="width:100%;">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="links">
      <a href="#" class="link">Discord Server</a>
      <a href="#" class="link">Twitter / X</a>
      <a href="#" class="link">Instagram</a>
      <a href="#" class="link">Twitch</a>
      <a href="#" class="link">YouTube</a>
      <a href="#" class="link">Steam</a>
    </div>

    <p style="margin-top:40px; opacity:0.5; font-size:0.9rem;">
      made with neon &lt;3 • guns.lol style
    </p>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light');
      // Hier kannst du später mehr Light-Mode Styles hinzufügen
      alert("Light Mode kommt bald noch besser 😉 (guns.lol ist meist dark)");
    }

    // Glitch Effekt bei Hover auf Namen
    document.querySelector('h1').addEventListener('mouseover', function() {
      this.classList.add('glitch');
      setTimeout(() => this.classList.remove('glitch'), 800);
    });
  </script>
</body>
</html>
