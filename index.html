<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .card { background-color: #1a1428; border: 1px solid #4c1d95; }
    .sidebar-active { background-color: #6b21a8; color: white; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleTheme()" class="text-2xl" id="themeBtn">🌙</button>
        <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20">
    <div class="max-w-4xl px-6 z-10">
      <h1 class="text-6xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">
          Kostenlos registrieren
        </button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">
          Anmelden
        </button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex h-screen pt-16">
      <!-- SIDEBAR -->
      <div class="w-72 bg-[#0f0a23] border-r border-purple-500/20 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(0)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">👤 Konto</a>
          <a href="#" onclick="switchTab(1)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🔗 Links</a>
          <a href="#" onclick="switchTab(2)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">🎵 Musik</a>
          <a href="#" onclick="switchTab(3)" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-10 overflow-y-auto">
        <div class="max-w-5xl mx-auto" id="mainContent">

          <!-- TAB 0: Konto -->
          <div id="tab0">
            <div class="flex justify-between items-center mb-8">
              <div class="flex items-center gap-6">
                <img id="profilePicBig" src="https://i.pravatar.cc/128" class="w-28 h-28 rounded-3xl object-cover border-4 border-purple-500 cursor-pointer" onclick="document.getElementById('picUpload').click()">
                <input type="file" id="picUpload" accept="image/*" class="hidden" onchange="uploadProfilePic(event)">
                <div>
                  <h1 id="dashNameTop" class="text-4xl font-bold"></h1>
                  <p id="dashUsername" class="text-purple-400"></p>
                </div>
              </div>
              <button onclick="logout()" class="text-red-400 hover:text-red-500">Abmelden</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
              <div class="card p-6 rounded-3xl"><p class="text-zinc-400">UID</p><p id="dashUID" class="text-3xl font-bold text-purple-400">#1</p></div>
              <div class="card p-6 rounded-3xl"><p class="text-zinc-400">Profilaufrufe</p><p id="dashViews" class="text-3xl font-bold text-purple-400">0</p></div>
            </div>

            <div class="card p-8 rounded-3xl mb-8">
              <h3 class="text-xl mb-4">Bio</h3>
              <textarea id="bioText" class="w-full h-32 bg-zinc-800 rounded-2xl p-5"></textarea>
              <button onclick="saveBio()" class="mt-4 bg-purple-600 px-8 py-3 rounded-2xl">Speichern</button>
            </div>

            <div class="card p-8 rounded-3xl">
              <h3 class="text-xl mb-4">Discord verbinden</h3>
              <button onclick="connectDiscord()" id="discordBtn" class="bg-[#5865F2] hover:bg-[#4752C4] w-full py-6 rounded-3xl text-xl font-semibold">Discord verbinden</button>
            </div>
          </div>

          <!-- TAB 1: Links -->
          <div id="tab1" class="hidden">
            <h2 class="text-3xl font-bold mb-6">Link Manager</h2>
            <div class="card p-8 rounded-3xl">
              <input id="newLinkTitle" placeholder="Titel" class="w-full p-4 bg-zinc-800 rounded-2xl mb-3">
              <input id="newLinkUrl" placeholder="https://" class="w-full p-4 bg-zinc-800 rounded-2xl mb-4">
              <button onclick="addLink()" class="bg-purple-600 px-8 py-3 rounded-2xl">Link hinzufügen</button>
              <div id="linksList" class="mt-8 space-y-3"></div>
            </div>
          </div>

          <!-- TAB 2: Musik -->
          <div id="tab2" class="hidden">
            <h2 class="text-3xl font-bold mb-6">Musik Player</h2>
            <div class="card p-8 rounded-3xl">
              <audio id="musicPlayer" class="w-full mb-6" controls></audio>
              <div class="grid grid-cols-1 gap-3">
                <button onclick="playTrack(0)" class="bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl text-left">🎵 Cyberpunk Nights</button>
                <button onclick="playTrack(1)" class="bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl text-left">🌃 Neon Drift</button>
              </div>
            </div>
          </div>

          <!-- TAB 3: Mein Profil -->
          <div id="tab3" class="hidden">
            <div class="max-w-2xl mx-auto text-center">
              <img id="publicProfilePic" class="w-32 h-32 mx-auto rounded-3xl object-cover border-4 border-purple-500">
              <h1 id="publicName" class="text-4xl font-bold mt-4"></h1>
              <p id="publicUsername" class="text-purple-400 text-xl"></p>

              <div class="mt-6 mb-8">
                <p class="text-zinc-400 text-sm mb-2">Dein Profil-Link</p>
                <div class="flex bg-zinc-900 rounded-2xl p-2">
                  <input id="profileLinkInput" readonly class="flex-1 bg-transparent px-4 outline-none text-purple-400 text-sm">
                  <button onclick="copyProfileLink()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-xl">Kopieren</button>
                </div>
              </div>

              <div class="flex justify-center gap-4 mb-10">
                <button onclick="shareProfile('twitter')" class="bg-black px-6 py-3 rounded-2xl hover:bg-zinc-800">🐦 Twitter</button>
                <button onclick="shareProfile('whatsapp')" class="bg-green-600 px-6 py-3 rounded-2xl hover:bg-green-700">💬 WhatsApp</button>
              </div>

              <div class="card p-8 rounded-3xl mb-8 text-left">
                <h3 class="text-xl mb-4">Über mich</h3>
                <p id="publicBio" class="text-zinc-300 leading-relaxed"></p>
              </div>

              <div class="card p-8 rounded-3xl text-left">
                <h3 class="text-xl mb-6">Links</h3>
                <div id="publicLinks" class="space-y-4"></div>
              </div>

              <div class="card p-8 rounded-3xl">
                <p class="text-zinc-400">Besucher (letzte 24h)</p>
                <p id="visitorCount" class="text-6xl font-bold text-purple-400">0</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    emailjs.init("IuyLZ33ctDj1VxqXE");
    let currentUser = null;
    const VERIFICATION_CODE = "666";
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let nextUID = parseInt(localStorage.getItem('nextUID')) || 1;

    function saveUser(email, username, password) {
      users[email] = { 
        username, password, uid: nextUID++, views: 0, bio: "", 
        profilePic: "https://i.pravatar.cc/128?u=" + Date.now(),
        links: [], isPremium: false, discord: null
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      localStorage.setItem('nextUID', nextUID);
    }

    function isTaken(email, username) {
      return Object.values(users).some(u => u.email === email || u.username === username);
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light');
      document.getElementById('themeBtn').textContent = document.documentElement.classList.contains('light') ? '☀️' : '🌙';
    }

    function togglePassword(id) {
      const el = document.getElementById(id);
      el.type = el.type === "password" ? "text" : "password";
    }

    function uploadProfilePic(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentUser.profilePic = ev.target.result;
        users[currentUser.email].profilePic = ev.target.result;
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        document.getElementById('profilePicBig').src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveBio() {
      currentUser.bio = document.getElementById('bioText').value;
      users[currentUser.email].bio = currentUser.bio;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      alert("✅ Bio gespeichert!");
    }

    function connectDiscord() {
      currentUser.discord = "DeinDiscord#1234";
      users[currentUser.email].discord = currentUser.discord;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      document.getElementById('discordBtn').innerHTML = "✅ Discord verbunden";
    }

    function addLink() {
      const title = document.getElementById('newLinkTitle').value.trim();
      const url = document.getElementById('newLinkUrl').value.trim();
      if (!title || !url) return alert("Titel und URL ausfüllen!");
      currentUser.links.push({title, url});
      users[currentUser.email].links = currentUser.links;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksList');
      container.innerHTML = currentUser.links.map((l, i) => `
        <div class="flex justify-between bg-zinc-800 p-5 rounded-2xl">
          <div><strong>${l.title}</strong><br><a href="${l.url}" target="_blank" class="text-purple-400">${l.url}</a></div>
          <button onclick="deleteLink(${i})" class="text-red-400">Löschen</button>
        </div>
      `).join('');
    }

    function deleteLink(i) {
      currentUser.links.splice(i, 1);
      users[currentUser.email].links = currentUser.links;
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      renderLinks();
    }

    function playTrack(i) {
      const urls = ["https://files.catbox.moe/1v2x3k.mp3", "https://files.catbox.moe/4k9p2m.mp3"];
      document.getElementById('musicPlayer').src = urls[i];
      document.getElementById('musicPlayer').play();
    }

    function showPublicProfile() {
      const now = Date.now();
      const key = `lastVisit_${currentUser.username}`;
      if (!localStorage.getItem(key) || (now - parseInt(localStorage.getItem(key)) > 86400000)) {
        currentUser.views++;
        users[currentUser.email].views = currentUser.views;
        localStorage.setItem('kiobioUsers', JSON.stringify(users));
        localStorage.setItem(key, now);
      }

      document.getElementById('publicProfilePic').src = currentUser.profilePic;
      document.getElementById('publicName').textContent = currentUser.username;
      document.getElementById('publicUsername').textContent = currentUser.username;
      document.getElementById('visitorCount').textContent = currentUser.views;
      document.getElementById('publicBio').textContent = currentUser.bio || "Noch keine Bio...";
      document.getElementById('profileLinkInput').value = `https://kiobio.lol/@${currentUser.username}`;

      const linksDiv = document.getElementById('publicLinks');
      linksDiv.innerHTML = currentUser.links.map(l => `
        <a href="${l.url}" target="_blank" class="block bg-zinc-800 p-5 rounded-2xl hover:bg-zinc-700">🔗 ${l.title}</a>
      `).join('');
    }

    function copyProfileLink() {
      const input = document.getElementById('profileLinkInput');
      input.select();
      document.execCommand('copy');
      alert("✅ Link kopiert!");
    }

    function shareProfile(type) {
      const url = document.getElementById('profileLinkInput').value;
      if (type === 'twitter') window.open(`https://twitter.com/intent/tweet?text=Mein kiobio.lol Profil: ${url}`);
      if (type === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent("Schau dir mein Profil an: " + url)}`);
    }

    function switchTab(n) {
      document.querySelectorAll('#mainContent > div').forEach((el, i) => el.classList.toggle('hidden', i !== n));
      if (n === 3) showPublicProfile();
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";

      document.getElementById('dashNameTop').textContent = currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
      document.getElementById('dashUID').textContent = `#${currentUser.uid}`;
      document.getElementById('dashViews').textContent = currentUser.views;
      document.getElementById('profilePicBig').src = currentUser.profilePic;
      document.getElementById('bioText').value = currentUser.bio || "";

      renderLinks();
      switchTab(0);
    }

    function logout() { location.reload(); }

    // Register & Login
    function showRegisterModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Registrieren";
      document.getElementById('modalContent').innerHTML = `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <input id="regUser" placeholder="Username" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
        <div class="relative">
          <input id="regPass" type="password" placeholder="Passwort (mind. 6 Zeichen)" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
          <button onclick="togglePassword('regPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="sendVerificationCode()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Verifizierungscode senden (666)</button>
      `;
    }

    async function sendVerificationCode() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!email || !username || !password) return alert("Bitte alle Felder ausfüllen");
      if (password.length < 6) return alert("Passwort muss mindestens 6 Zeichen lang sein!");
      if (Object.values(users).some(u => u.email === email || u.username === username)) {
        return alert("Diese E-Mail oder Username ist bereits vergeben!");
      }

      try {
        await emailjs.send("service_zni05q6", "template_c2x5n7s", { to_email: email, verification_code: VERIFICATION_CODE, username });
      } catch(e) {}

      alert(`✅ Code 666 wurde an ${email} gesendet!`);
      window.tempUser = {email, username, password};
      showVerificationScreen();
    }

    function showVerificationScreen() {
      document.getElementById('modalTitle').textContent = "Code bestätigen";
      document.getElementById('modalContent').innerHTML = `
        <p class="text-center text-purple-300">Der Code ist: <strong>666</strong></p>
        <input id="codeInput" maxlength="3" placeholder="666" class="w-full p-6 bg-zinc-800 rounded-2xl text-4xl text-center">
        <button onclick="verifyCode()" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-6 rounded-3xl text-xl font-bold">Bestätigen</button>
      `;
    }

    function verifyCode() {
      if (document.getElementById('codeInput').value !== "666") return alert("Falscher Code!");
      const {email, username, password} = window.tempUser;
      saveUser(email, username, password);
      currentUser = users[email];
      document.getElementById('mainModal').classList.add('hidden');
      showDashboard();
    }

    function showLoginModal() {
      document.getElementById('mainModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full p-5 bg-zinc-800 rounded-2xl">
        <div class="relative">
          <input id="loginPass" type="password" placeholder="Passwort" class="w-full p-5 bg-zinc-800 rounded-2xl mt-4">
          <button onclick="togglePassword('loginPass')" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">👁</button>
        </div>
        <button onclick="loginUser()" class="w-full mt-8 bg-purple-600 hover:bg-purple-700 py-6 rounded-3xl text-xl font-bold">Anmelden</button>
      `;
    }

    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = users[email];
      if (user && user.password === pass) {
        currentUser = user;
        document.getElementById('mainModal').classList.add('hidden');
        showDashboard();
      } else {
        alert("Falsche E-Mail oder Passwort!");
      }
    }
  </script>
</body>
</html>
