<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>haunt.gg Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fcfafb; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Views -->
    <div id="app">
        <!-- Landing -->
        <div id="view-home" class="p-10 text-center">
            <h1 class="text-6xl font-extrabold mb-6">Make the internet remember you.</h1>
            <button onclick="showView('view-auth')" class="bg-black text-white px-8 py-3 rounded-xl">Starten</button>
        </div>

        <!-- Auth -->
        <div id="view-auth" class="hidden flex justify-center pt-20">
            <div class="w-96 bg-white p-8 rounded-3xl border shadow-xl">
                <h2 id="auth-title" class="text-2xl font-bold mb-4">Einloggen</h2>
                <input id="auth-email" type="email" placeholder="E-Mail" class="w-full p-3 border rounded-xl mb-2">
                <input id="auth-password" type="password" placeholder="Passwort" class="w-full p-3 border rounded-xl mb-4">
                <button onclick="handleAuth()" class="w-full bg-pink-500 text-white p-3 rounded-xl">Weiter</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="view-dashboard" class="hidden flex">
            <aside class="w-64 h-screen border-r p-5">
                <h2 class="font-bold text-xl mb-10">haunt.gg</h2>
                <button onclick="switchDash('customize')" class="block w-full text-left p-2 mb-2">🪄 Anpassen</button>
                <button onclick="switchDash('assets')" class="block w-full text-left p-2">👤 Assets</button>
            </aside>
            <main class="flex-1 p-10">
                <div id="dash-customize" class="space-y-4">
                    <h2 class="text-2xl font-bold">Anpassen</h2>
                    <input id="dash-display-name" placeholder="Anzeigename" class="w-full p-3 border rounded-xl">
                    <textarea id="dash-bio" placeholder="Bio" class="w-full p-3 border rounded-xl"></textarea>
                    <button onclick="saveProfile()" class="bg-pink-500 text-white px-6 py-2 rounded-xl">Speichern</button>
                </div>
                <div id="dash-assets" class="hidden">
                    <h2 class="text-2xl font-bold mb-4">Assets</h2>
                    <input type="file" id="avatar-upload" onchange="uploadAvatar(event)" class="mb-4">
                    <img id="avatar-preview" class="w-32 h-32 rounded-full border">
                </div>
            </main>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient('DEINE_URL', 'DEIN_KEY');
        let currentUser = null;

        function showView(id) {
            document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function switchDash(id) {
            document.getElementById('dash-customize').classList.add('hidden');
            document.getElementById('dash-assets').classList.add('hidden');
            document.getElementById('dash-' + id).classList.remove('hidden');
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (data.user) { currentUser = data.user; showView('view-dashboard'); }
            else alert(error.message);
        }

        async function uploadAvatar(e) {
            const file = e.target.files[0];
            const { data } = await supabase.storage.from('avatars').upload(`${currentUser.id}.png`, file, { upsert: true });
            const { data: url } = supabase.storage.from('avatars').getPublicUrl(`${currentUser.id}.png`);
            await supabase.from('profiles').upsert({ id: currentUser.id, avatar_url: url.publicUrl });
            document.getElementById('avatar-preview').src = url.publicUrl;
        }

        async function saveProfile() {
            await supabase.from('profiles').upsert({
                id: currentUser.id,
                display_name: document.getElementById('dash-display-name').value,
                bio: document.getElementById('dash-bio').value
            });
            alert("Gespeichert!");
        }

        // Init Check
        supabase.auth.getSession().then(({data}) => {
            if(data.session) { currentUser = data.session.user; showView('view-dashboard'); }
            else showView('view-home');
        });
    </script>
</body>
</html>
