<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol - Anpassen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1f2937; }
    .nav-active { background-color: #6b46c1; color: white; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 bg-black border-r border-zinc-800 flex flex-col">
      <div class="p-5 flex items-center gap-3 border-b border-zinc-800">
        <div class="w-9 h-9 bg-violet-600 rounded-xl flex items-center justify-center text-2xl">🔫</div>
        <span class="font-bold text-3xl">guns.lol</span>
      </div>

      <nav class="flex-1 px-3 pt-6 space-y-1">
        <a onclick="switchTab(0)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-user"></i> Konto
        </a>
        <a onclick="switchTab(1)" class="nav-active flex items-center gap-3 px-5 py-3 rounded-2xl cursor-pointer" id="nav-1">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Anpassen
        </a>
        <a onclick="switchTab(2)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-link"></i> Links
        </a>
        <a onclick="switchTab(3)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-gem"></i> Premium
        </a>
        <a onclick="switchTab(4)" class="flex items-center gap-3 px-5 py-3 hover:bg-zinc-900 rounded-2xl cursor-pointer">
          <i class="fa-solid fa-layer-group"></i> Vorlagen
        </a>
      </nav>
    </div>

    <!-- Hauptbereich -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-black border-b border-zinc-800 p-5">
        <h1 class="text-2xl font-bold" id="page-title">Anpassen</h1>
      </div>

      <div class="flex-1 overflow-auto p-8" id="content">
        <!-- Wird per JS gefüllt -->
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('nav a').forEach((el, i) => {
        el.classList.toggle('nav-active', i === tab);
      });

      const content = document.getElementById('content');
      const title = document.getElementById('page-title');

      if (tab === 1) { // Anpassen
        title.textContent = 'Anpassen';
        content.innerHTML = `
          <h2 class="text-xl font-semibold mb-6">Medien-Upload</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="card p-6 rounded-3xl text-center border border-dashed border-zinc-600 hover:border-violet-500 cursor-pointer">
              <div class="h-32 flex items-center justify-center text-5xl mb-4">🎥</div>
              <p class="font-medium">Hintergrund</p>
              <p class="text-xs text-zinc-500">.MP4</p>
            </div>
            <div class="card p-6 rounded-3xl text-center border border-dashed border-zinc-600 hover:border-violet-500 cursor-pointer">
              <div class="h-32 flex items-center justify-center text-5xl mb-4">🎵</div>
              <p class="font-medium">Audio</p>
            </div>
            <div class="card p-6 rounded-3xl text-center border border-dashed border-zinc-600 hover:border-violet-500 cursor-pointer">
              <div class="h-32 flex items-center justify-center text-5xl mb-4">👤</div>
              <p class="font-medium">Profil-Avatar</p>
            </div>
            <div class="card p-6 rounded-3xl text-center border border-dashed border-zinc-600 hover:border-violet-500 cursor-pointer">
              <div class="h-32 flex items-center justify-center text-5xl mb-4">🖱️</div>
              <p class="font-medium">Benutzerdefinierter Cursor</p>
            </div>
          </div>

          <h2 class="text-xl font-semibold mt-12 mb-6">Allgemeine Anpassung</h2>
          <div class="card p-8 rounded-3xl grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
              <label class="block text-sm mb-2">Beschreibung</label>
              <input type="text" value="das ist meine Beschreibung" class="w-full bg-zinc-800 p-4 rounded-2xl">
            </div>
            <div>
              <label class="block text-sm mb-2">Discord Presence</label>
              <div class="bg-zinc-800 p-4 rounded-2xl flex items-center gap-3">
                <span>Deaktiviert</span>
              </div>
            </div>
            <div>
              <label class="block text-sm mb-2">Profil-Deckkraft <span class="text-zinc-500">20%</span></label>
              <input type="range" min="0" max="100" value="20" class="w-full accent-violet-600">
            </div>
            <div>
              <label class="block text-sm mb-2">Profil-Unschärfe <span class="text-zinc-500">20px</span></label>
              <input type="range" min="0" max="100" value="20" class="w-full accent-violet-600">
            </div>
          </div>

          <h2 class="text-xl font-semibold mt-12 mb-6">Farb-Anpassung</h2>
          <div class="card p-8 rounded-3xl grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
              <label>Akzentfarbe</label>
              <input type="color" value="#8b5cf6" class="w-full h-12 mt-2 rounded-2xl">
            </div>
            <div>
              <label>Textfarbe</label>
              <input type="color" value="#ffffff" class="w-full h-12 mt-2 rounded-2xl">
            </div>
            <div>
              <label>Hintergrundfarbe</label>
              <input type="color" value="#080808" class="w-full h-12 mt-2 rounded-2xl">
            </div>
            <div>
              <label>Iconfarbe</label>
              <input type="color" value="#ffffff" class="w-full h-12 mt-2 rounded-2xl">
            </div>
          </div>

          <h2 class="text-xl font-semibold mt-12 mb-6">Weitere Anpassungen</h2>
          <div class="card p-8 rounded-3xl grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="flex items-center justify-between">
              <span>Monochrome Icons</span>
              <input type="checkbox" checked class="accent-violet-600 w-5 h-5">
            </div>
            <div class="flex items-center justify-between">
              <span>Animierter Titel</span>
              <input type="checkbox" checked class="accent-violet-600 w-5 h-5">
            </div>
            <div class="flex items-center justify-between">
              <span>Box-Farben tauschen</span>
              <input type="checkbox" class="accent-violet-600 w-5 h-5">
            </div>
          </div>
        `;
      } 
      else if (tab === 4) { // Vorlagen - Eigenes Erstellen
        title.textContent = 'Vorlagen';
        content.innerHTML = `
          <h2 class="text-xl font-semibold mb-6">Eigene Vorlage erstellen</h2>
          <div class="card p-8 rounded-3xl max-w-2xl">
            <div class="space-y-6">
              <div>
                <label class="block text-sm mb-2">Vorlagen-Name</label>
                <input type="text" id="tpl-name" placeholder="Meine coole Vorlage" class="w-full bg-zinc-800 p-4 rounded-2xl">
              </div>
              <div>
                <label class="block text-sm mb-2">Beschreibung</label>
                <textarea id="tpl-desc" rows="3" placeholder="Beschreibe deine Vorlage..." class="w-full bg-zinc-800 p-4 rounded-2xl"></textarea>
              </div>
              <div>
                <label class="block text-sm mb-2">Akzentfarbe</label>
                <input type="color" id="tpl-color" value="#8b5cf6" class="w-full h-12 rounded-2xl">
              </div>
              <button onclick="saveTemplate()" 
                      class="w-full bg-violet-600 hover:bg-violet-700 py-4 rounded-2xl font-bold text-lg">
                Vorlage speichern
              </button>
            </div>
          </div>

          <p class="text-center text-zinc-500 mt-8">Deine selbst erstellten Vorlagen erscheinen hier.</p>
        `;
      } 
      else {
        title.textContent = 'guns.lol';
        content.innerHTML = `<p class="text-center py-20 text-zinc-400">Tab wird noch ausgebaut.</p>`;
      }
    }

    function saveTemplate() {
      const name = document.getElementById('tpl-name').value || "Meine Vorlage";
      alert(`✅ Vorlage "${name}" wurde gespeichert!\n\n(Diese Demo speichert nur lokal.)`);
    }

    // Start mit Anpassen-Tab
    window.onload = () => switchTab(1);
  </script>
</body>
</html>
