<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>guns.lol Clone</title>
<style>
  :root{
    --bg:#080808;--bg2:#0f0f10;--panel:#141416;--panel2:#1b1b1f;
    --border:#26262b;--text:#fff;--muted:#9a9aa3;
    --primary:#a855f7;--primary2:#7c3aed;--accent:#1b1b1b;
    --green:#22c55e;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{cursor:pointer;border:none;font-family:inherit;color:inherit}
  input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;width:100%;outline:none}
  input:focus{border-color:var(--primary)}
  .hidden{display:none!important}
  /* AUTH */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,rgba(168,85,247,.15),transparent 60%),var(--bg)}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px}
  .logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;color:var(--primary);margin-bottom:24px;justify-content:center}
  .logo svg{width:32px;height:32px}
  .auth-card h1{font-size:22px;margin-bottom:6px;text-align:center}
  .auth-card p.sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .btn{background:var(--primary);color:#fff;padding:12px;border-radius:10px;width:100%;font-weight:600;font-size:14px;transition:.2s}
  .btn:hover{background:var(--primary2)}
  .btn-ghost{background:var(--panel2);border:1px solid var(--border)}
  .btn-ghost:hover{background:#222}
  .switch-link{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}
  .switch-link a{color:var(--primary);cursor:pointer}
  .err{color:var(--red);font-size:13px;margin-top:8px;text-align:center;min-height:18px}
  /* APP LAYOUT */
  .app{display:flex;min-height:100vh}
  .sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;transition:.15s}
  .nav-item:hover{background:var(--panel)}
  .nav-item.active{background:linear-gradient(90deg,rgba(168,85,247,.2),rgba(168,85,247,.05));color:var(--primary)}
  .nav-item svg{width:18px;height:18px}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .user-chip{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border-radius:12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .user-chip .meta{font-size:13px;min-width:0}
  .user-chip .meta .name{font-weight:600;truncate}
  .user-chip .meta .uid{color:var(--muted);font-size:11px}
  .main{flex:1;padding:32px;overflow-x:hidden}
  .page-title{font-size:24px;font-weight:300;margin-bottom:20px;color:#ddd}
  /* CARDS */
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .stat-card{background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(168,85,247,.03));border:1px solid rgba(168,85,247,.2);padding:20px;border-radius:16px}
  .stat-card.dark{background:var(--panel);border:1px solid var(--border)}
  .stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:10px}
  .stat-val{font-size:24px;font-weight:700;margin-bottom:4px}
  .stat-sub{font-size:12px;color:var(--muted)}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:20px}
  .section h2{font-size:18px;margin-bottom:16px;font-weight:600}
  .progress{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.3s}
  .task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:16px}
  .task{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel2);border-radius:10px;font-size:14px}
  .task.done{color:var(--green)}
  .task .dot{width:18px;height:18px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex-shrink:0}
  .task.done .dot{background:rgba(34,197,94,.2);color:var(--green)}
  /* MANAGE BUTTONS */
  .manage-list{display:flex;flex-direction:column;gap:10px}
  .manage-btn{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:12px 14px;border-radius:10px;font-size:14px;text-align:left;width:100%}
  .manage-btn:hover{background:#222}
  .manage-btn svg{width:16px;height:16px;color:var(--muted)}
  /* BADGES */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .badge-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px}
  .badge-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .badge-info{flex:1;min-width:0}
  .badge-info .t{font-weight:600;font-size:15px}
  .badge-info .d{color:var(--muted);font-size:12px;margin-top:2px}
  .badge-card .own{font-size:11px;color:var(--green);padding:4px 8px;background:rgba(34,197,94,.15);border-radius:99px}
  /* LINKS */
  .social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
  .social-icon{width:60px;height:60px;background:var(--panel2);border-radius:12px;display:grid;place-items:center;font-size:22px;cursor:pointer;transition:.15s}
  .social-icon:hover{transform:translateY(-2px);background:#222}
  .link-item{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:12px;border-radius:10px;margin-top:8px}
  .link-item .icon{width:30px;height:30px;border-radius:6px;background:var(--primary);display:grid;place-items:center;font-size:14px}
  .link-item .info{flex:1;min-width:0}
  .link-item .info .name{font-weight:600;font-size:14px}
  .link-item .info .url{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-item button{background:transparent;color:var(--red);padding:6px}
  /* PROFILE PAGE */
  .profile-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#000}
  .profile-card{background:rgba(20,20,22,.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:20px;padding:36px;max-width:440px;width:100%;text-align:center}
  .profile-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:42px;font-weight:700;overflow:hidden;border:3px solid var(--primary)}
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-name{font-size:28px;font-weight:700;margin-bottom:4px}
  .profile-uid{color:var(--muted);font-size:13px;margin-bottom:12px}
  .profile-badges{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .pb{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--border)}
  .profile-bio{color:#d0d0d8;margin-bottom:20px;font-size:14px}
  .profile-views{color:var(--muted);font-size:12px;margin-top:18px}
  .profile-socials{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px}
  /* ADMIN */
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td .row-btns{display:flex;gap:6px;flex-wrap:wrap}
  td button{padding:6px 10px;background:var(--panel2);border-radius:6px;font-size:12px;color:#ddd}
  td button:hover{background:#222}
  td button.danger{color:var(--red)}
  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
  .modal h3{margin-bottom:16px;font-size:18px}
  .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--border);padding:12px 18px;border-radius:10px;z-index:100;animation:slideIn .3s}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  /* PREMIUM BADGE */
  .premium-tag{display:inline-block;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px;vertical-align:middle}
  @media(max-width:768px){
    .sidebar{width:70px;padding:12px}
    .sidebar .nav-item span,.sidebar .logo-text,.user-chip .meta,.sidebar-bottom .full{display:none}
    .main{padding:18px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================================================
   guns.lol Clone - Single HTML File
   Storage: localStorage
   Admin: k / k@gmail.com / Hallopelo112
============================================================ */
const DB_KEY = 'gunslol_db_v1';
const SESSION_KEY = 'gunslol_session_v1';
const ALL_BADGES = [
  {id:'staff',name:'Staff',desc:'Sei Teil des Staff-Teams.',icon:'🛠️',color:'#3b82f6'},

  {id:'imagehost',name:'Image Host',desc:'Kaufe den Image Host.',icon:'⭐',color:'#22c55e'},
  {id:'domainlegend',name:'Domain Legend',desc:'Custom Domain hinzu.',icon:'🚀',color:'#ec4899'},
  {id:'og',name:'OG',desc:'Sei ein früher Unterstützer.',icon:'⭐',color:'#fbbf24'},
  {id:'booster',name:'Server Booster',desc:'Booste den Discord-Server.',icon:'🔥',color:'#f97316'},
  {id:'bughunter',name:'Bug Hunter',desc:'Melde einen Bug.',icon:'🐛',color:'#22c55e'},
  {id:'owner',name:'Owner',desc:'Eigentümer von guns.lol.',icon:'👑',color:'#fbbf24'},

  {id:'million',name:'The Million',desc:'Feier-Badge für 1 Mio. Nutzer.',icon:'🎉',color:'#06b6d4'},
  {id:'winner',name:'Winner',desc:'Gewinne ein Event.',icon:'🏆',color:'#fbbf24'},
];
const SOCIALS = [
  {id:'youtube',name:'YouTube',icon:'▶',color:'#ff0000'},
  {id:'discord',name:'Discord',icon:'🎮',color:'#5865f2'},
  {id:'spotify',name:'Spotify',icon:'🎵',color:'#1db954'},
  {id:'instagram',name:'Instagram',icon:'📷',color:'#e4405f'},
  {id:'x',name:'X',icon:'𝕏',color:'#000'},
  {id:'tiktok',name:'TikTok',icon:'♪',color:'#000'},
  {id:'twitch',name:'Twitch',icon:'📺',color:'#9146ff'},
  {id:'github',name:'GitHub',icon:'⌨',color:'#333'},
  {id:'steam',name:'Steam',icon:'🎮',color:'#1b2838'},
  {id:'reddit',name:'Reddit',icon:'👽',color:'#ff4500'},
  {id:'snapchat',name:'Snapchat',icon:'👻',color:'#fffc00'},
  {id:'telegram',name:'Telegram',icon:'✈',color:'#0088cc'},

  {id:'website',name:'Website',icon:'🌐',color:'#666'},
];
/* ---------- DB ---------- */
function loadDB(){
  let db = localStorage.getItem(DB_KEY);
  if(!db){
    db = {users:[], nextUid: 1};
    // Seed admin
    db.users.push({
      uid:1, username:'k', email:'k@gmail.com', password:'Hallopelo112',
      displayName:'k', bio:'Owner von guns.lol', avatar:'',
      views:805159, badges:['owner','admin','staff','premium','verified'],
      customBadges:[], socials:[], premium:true, role:'admin',
      aliases:[], usernameChanges:0, createdAt:Date.now()
    });
    db.nextUid = 2;
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    return db;
  }
  return JSON.parse(db);
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function getSession(){ const s = localStorage.getItem(SESSION_KEY); return s? JSON.parse(s):null; }
function setSession(uid){ localStorage.setItem(SESSION_KEY, JSON.stringify({uid})); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function currentUser(){
  const s = getSession(); if(!s) return null;
  const db = loadDB(); return db.users.find(u=>u.uid===s.uid) || null;
}
function updateUser(uid, patch){
  const db = loadDB();
  const u = db.users.find(x=>x.uid===uid);
  if(u){ Object.assign(u, patch); saveDB(db); }
}
/* ---------- UI helpers ---------- */
const $ = id => document.getElementById(id);
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}
function modal(title, html, onOk, okText='Speichern'){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `<div class="modal"><h3>${title}</h3><div id="mc">${html}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mcancel">Abbrechen</button>
      <button class="btn" id="mok">${okText}</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mcancel').onclick = ()=>bg.remove();
  bg.querySelector('#mok').onclick = ()=>{ if(onOk(bg)!==false) bg.remove(); };
  bg.onclick = e=>{ if(e.target===bg) bg.remove(); };
}
/* ---------- ROUTER ---------- */
let currentPage = 'overview';
function render(){
  // Check route: profile page?
  const hash = location.hash.slice(1);
  if(hash.startsWith('/u/')){
    renderProfilePage(hash.slice(3));
    return;
  }
  const user = currentUser();
  if(!user){ renderAuth(); return; }
  renderApp(user);
}
window.addEventListener('hashchange', render);
/* ---------- AUTH ---------- */
let authMode = 'login';
function renderAuth(){
  $('root').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="logo">🔫 guns.lol</div>
        <h1>${authMode==='login'?'Willkommen zurück':'Konto erstellen'}</h1>
        <p class="sub">${authMode==='login'?'Melde dich bei deinem Konto an':'Erstelle dein guns.lol Profil'}</p>
        ${authMode==='register'?`
          <div class="field"><label>Benutzername</label><input id="a-user" placeholder="dein_name"/></div>
        `:''}
        <div class="field"><label>${authMode==='login'?'Email oder Benutzername':'Email'}</label><input id="a-email" placeholder="email@example.com"/></div>
        <div class="field"><label>Passwort</label><input id="a-pw" type="password" placeholder="••••••••"/></div>
        <button class="btn" id="a-submit">${authMode==='login'?'Anmelden':'Registrieren'}</button>
        <div class="err" id="a-err"></div>
        <div class="switch-link">
          ${authMode==='login'?'Noch kein Konto?':'Bereits ein Konto?'}
          <a id="a-switch">${authMode==='login'?'Registrieren':'Anmelden'}</a>
        </div>
      </div>
    </div>`;
  $('a-switch').onclick=()=>{ authMode = authMode==='login'?'register':'login'; renderAuth(); };
  $('a-submit').onclick = doAuth;
  ['a-email','a-pw'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();}));
}
function doAuth(){
  const db = loadDB();
  const err = $('a-err'); err.textContent='';
  if(authMode==='login'){
    const id = $('a-email').value.trim();
    const pw = $('a-pw').value;
    const u = db.users.find(x=>(x.email.toLowerCase()===id.toLowerCase()||x.username.toLowerCase()===id.toLowerCase()) && x.password===pw);
    if(!u){ err.textContent='Falsche Anmeldedaten'; return; }
    setSession(u.uid); render();
  } else {
    const user = $('a-user').value.trim();
    const email = $('a-email').value.trim();
    const pw = $('a-pw').value;
    if(!user||!email||!pw){ err.textContent='Alle Felder ausfüllen'; return; }
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(user)){ err.textContent='Benutzername: 3-20 Zeichen, nur a-z, 0-9, _'; return; }
    if(pw.length<6){ err.textContent='Passwort min. 6 Zeichen'; return; }
    if(db.users.some(x=>x.username.toLowerCase()===user.toLowerCase())){ err.textContent='Benutzername vergeben'; return; }
    if(db.users.some(x=>x.email.toLowerCase()===email.toLowerCase())){ err.textContent='Email schon registriert'; return; }
    const uid = db.nextUid++;
    db.users.push({
      uid, username:user, email, password:pw, displayName:user,
      bio:'', avatar:'', views:0, badges:[], customBadges:[],
      socials:[], premium:false, role:'user', aliases:[],
      usernameChanges:0, createdAt:Date.now()
    });
    saveDB(db); setSession(uid); render();
  }
}
/* ---------- APP SHELL ---------- */
function renderApp(user){
  const isAdmin = user.role==='admin';
  $('root').innerHTML = `
    <div class="app">
      <aside class="sidebar">
        <div class="logo"><span>🔫</span><span class="logo-text">guns.lol</span></div>
        <div class="nav-item ${currentPage==='overview'?'active':''}" data-p="overview">📊 <span>Übersicht</span></div>
        <div class="nav-item ${currentPage==='customize'?'active':''}" data-p="customize">🎨 <span>Anpassen</span></div>
        <div class="nav-item ${currentPage==='links'?'active':''}" data-p="links">🔗 <span>Links</span></div>
        <div class="nav-item ${currentPage==='badges'?'active':''}" data-p="badges">🏅 <span>Badges</span></div>
        <div class="nav-item ${currentPage==='premium'?'active':''}" data-p="premium">💎 <span>Premium</span></div>
        <div class="nav-item ${currentPage==='settings'?'active':''}" data-p="settings">⚙️ <span>Einstellungen</span></div>
        ${isAdmin?`<div class="nav-item ${currentPage==='admin'?'active':''}" data-p="admin" style="color:#ef4444">🛡️ <span>Admin Panel</span></div>`:''}
        <div class="sidebar-bottom">
          <button class="btn btn-ghost full" onclick="window.open('#/u/${user.username}','_blank')">👁 <span>Meine Seite</span></button>
          <div class="user-chip">
            <div class="avatar">${user.avatar?`<img src="${user.avatar}"/>`:user.username[0].toUpperCase()}</div>
            <div class="meta"><div class="name">${user.displayName||user.username}</div><div class="uid">UID ${user.uid}</div></div>
          </div>
          <button class="btn btn-ghost full" id="logout">Abmelden</button>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>`;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick=()=>{ currentPage = el.dataset.p; render(); };
  });
  $('logout').onclick=()=>{ clearSession(); currentPage='overview'; render(); };
  renderPage(user);
}
function renderPage(user){
  const m = $('main');
  switch(currentPage){
    case 'overview': return renderOverview(user, m);
    case 'customize': return renderCustomize(user, m);
    case 'links': return renderLinks(user, m);
    case 'badges': return renderBadges(user, m);
    case 'premium': return renderPremium(user, m);
    case 'settings': return renderSettings(user, m);
    case 'admin': return renderAdmin(user, m);
  }
}
/* ---------- OVERVIEW ---------- */
function renderOverview(user, m){
  const completion = computeCompletion(user);
  m.innerHTML = `
    <h1 class="page-title">Kontoübersicht</h1>
    <div class="grid-4">
      <div class="stat-card"><div class="stat-head">Benutzername ✏️</div><div class="stat-val">${user.username}</div><div class="stat-sub">${user.usernameChanges} Änderungen</div></div>
      <div class="stat-card"><div class="stat-head">Aliase 👤</div><div class="stat-val">${user.aliases.length} Aliase</div><div class="stat-sub">${user.premium?'∞':3-user.aliases.length} Slots übrig</div></div>
      <div class="stat-card"><div class="stat-head">UID #</div><div class="stat-val">${user.uid.toLocaleString()}</div><div class="stat-sub">Mitglied seit ${new Date(user.createdAt).toLocaleDateString()}</div></div>
      <div class="stat-card"><div class="stat-head">Profilaufrufe 👁</div><div class="stat-val">${user.views.toLocaleString()}</div><div class="stat-sub">Insgesamt</div></div>
    </div>
    <div class="grid-2" style="margin-top:20px">
      <div class="section">
        <h2>Profil-Vervollständigung</h2>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px"><span>${completion.percent}% abgeschlossen</span></div>
        <div class="progress"><div style="width:${completion.percent}%"></div></div>
        <div class="task-grid">
          ${completion.tasks.map(t=>`<div class="task ${t.done?'done':''}"><div class="dot">${t.done?'✓':'!'}</div>${t.label}</div>`).join('')}
        </div>
      </div>
      <div class="section">
        <h2>Verwalte dein Konto</h2>
        <div class="manage-list">
          <button class="manage-btn" onclick="changeUsername()">✏️ Benutzernamen ändern</button>
          <button class="manage-btn" onclick="changeDisplayName()">💬 Anzeigenamen ändern</button>
          <button class="manage-btn" onclick="manageAliases()">👤 Aliase verwalten</button>
          <button class="manage-btn" onclick="currentPage='settings';render()">⚙️ Kontoeinstellungen</button>
        </div>
      </div>
    </div>`;
}
function computeCompletion(u){
  const tasks=[
    {label:'Avatar hochladen', done:!!u.avatar},
    {label:'Beschreibung hinzufügen', done:!!u.bio},
    {label:'Socials hinzufügen', done:u.socials.length>0},
    {label:'10 Profilaufrufe erreichen', done:u.views>=10},
    {label:'Premium freischalten', done:u.premium},
  ];
  const done = tasks.filter(t=>t.done).length;
  return {percent: Math.round(done/tasks.length*100), tasks};
}
window.changeUsername = ()=>{
  const u = currentUser();
  modal('Benutzernamen ändern',
    `<div class="field"><label>Neuer Benutzername</label><input id="nu" value="${u.username}"/></div>
     <div class="err" id="nue"></div>`,
    bg=>{
      const v = bg.querySelector('#nu').value.trim();
      const err = bg.querySelector('#nue');
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(v)){err.textContent='Ungültig';return false;}
      const db = loadDB();
      if(db.users.some(x=>x.uid!==u.uid && x.username.toLowerCase()===v.toLowerCase())){err.textContent='Vergeben';return false;}
      updateUser(u.uid,{username:v, usernameChanges:u.usernameChanges+1});
      toast('Benutzername geändert'); render();
    });
};
window.changeDisplayName = ()=>{
  const u = currentUser();
  modal('Anzeigenamen ändern',
    `<div class="field"><label>Anzeigename</label><input id="nd" value="${u.displayName||''}"/></div>`,
    bg=>{ updateUser(u.uid,{displayName:bg.querySelector('#nd').value.trim()}); toast('Geändert'); render(); });
};
window.manageAliases = ()=>{
  const u = currentUser();
  modal('Aliase verwalten',
    `<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Aktuelle Aliase: ${u.aliases.join(', ')||'keine'}</p>
     <div class="field"><label>Neuer Alias</label><input id="al"/></div>`,
    bg=>{
      const v = bg.querySelector('#al').value.trim();
      if(!v) return false;
      const limit = u.premium?999:3;
      if(u.aliases.length>=limit){ toast('Limit erreicht'); return; }
      updateUser(u.uid,{aliases:[...u.aliases, v]});
      toast('Alias hinzugefügt'); render();
    },'Hinzufügen');
};
/* ---------- CUSTOMIZE ---------- */
function renderCustomize(user, m){
  m.innerHTML = `
    <h1 class="page-title">Anpassen</h1>
    <div class="section">
      <h2>Profil-Avatar</h2>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div class="avatar" style="width:90px;height:90px;font-size:36px">${user.avatar?`<img src="${user.avatar}"/>`:user.username[0].toUpperCase()}</div>
        <div style="flex:1;min-width:200px">
          <input type="file" id="av-file" accept="image/*"/>
          <p style="color:var(--muted);font-size:12px;margin-top:8px">Bild hochladen (wird lokal gespeichert)</p>
        </div>
      </div>
    </div>
    <div class="section">
      <h2>Allgemein</h2>
      <div class="field"><label>Beschreibung / Bio</label><textarea id="bio" rows="3">${user.bio||''}</textarea></div>
      <div class="field"><label>Anzeigename</label><input id="dn" value="${user.displayName||''}"/></div>
      <button class="btn" id="save-cust" style="width:auto;padding:10px 24px">Speichern</button>
    </div>`;
  $('av-file').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{ updateUser(user.uid,{avatar:ev.target.result}); toast('Avatar gespeichert'); render(); };
    r.readAsDataURL(f);
  };
  $('save-cust').onclick=()=>{
    updateUser(user.uid,{bio:$('bio').value, displayName:$('dn').value});
    toast('Gespeichert');
  };
}
/* ---------- LINKS ---------- */
function renderLinks(user, m){
  m.innerHTML = `
    <h1 class="page-title">🔗 Verknüpfe deine Social-Media-Profile</h1>
    <p style="color:var(--muted);margin-bottom:20px">Klicke auf ein Netzwerk, um einen Link hinzuzufügen.</p>
    <div class="section">
      <div class="social-grid">
        ${SOCIALS.map(s=>`<div class="social-icon" style="color:${s.color}" data-s="${s.id}" title="${s.name}">${s.icon}</div>`).join('')}
      </div>
    </div>
    <div class="section">
      <h2>Deine Links (${user.socials.length})</h2>
      ${user.socials.length===0?'<p style="color:var(--muted);font-size:14px">Noch keine Links.</p>':
        user.socials.map((l,i)=>{
          const s = SOCIALS.find(x=>x.id===l.type)||{name:l.type,icon:'🔗',color:'#666'};
          return `<div class="link-item"><div class="icon" style="background:${s.color}">${s.icon}</div>
            <div class="info"><div class="name">${s.name}</div><div class="url">${l.url}</div></div>
            <button onclick="deleteLink(${i})">🗑</button></div>`;
        }).join('')}
    </div>`;
  document.querySelectorAll('.social-icon').forEach(el=>{
    el.onclick=()=>addLink(el.dataset.s);
  });
}
window.addLink = type=>{
  const u = currentUser();
  const s = SOCIALS.find(x=>x.id===type);
  modal(`${s.name} hinzufügen`,
    `<div class="field"><label>URL oder Handle</label><input id="lurl" placeholder="https://..."/></div>`,
    bg=>{
      const v = bg.querySelector('#lurl').value.trim();
      if(!v) return false;
      updateUser(u.uid,{socials:[...u.socials, {type, url:v}]});
      toast('Link hinzugefügt'); render();
    }, 'Hinzufügen');
};
window.deleteLink = i=>{
  const u = currentUser();
  const s = [...u.socials]; s.splice(i,1);
  updateUser(u.uid,{socials:s}); render();
};
/* ---------- BADGES ---------- */
function renderBadges(user, m){
  const all = [...ALL_BADGES, ...user.customBadges.map(c=>({...c, custom:true}))];
  m.innerHTML = `
    <h1 class="page-title">Alle Badges</h1>
    <div class="badge-grid">
      ${all.map(b=>{
        const owned = user.badges.includes(b.id);
        return `<div class="badge-card">
          <div class="badge-icon" style="background:${b.color}22;color:${b.color}">${b.icon}</div>
          <div class="badge-info"><div class="t">${b.name}${b.custom?' <span class="premium-tag">CUSTOM</span>':''}</div><div class="d">${b.desc}</div></div>
          ${owned?'<span class="own">Im Besitz</span>':''}
        </div>`;
      }).join('')}
    </div>
    <div class="section" style="margin-top:24px">
      <h2>Custom Badges ✨ ${user.premium?'':'<span class="premium-tag">PREMIUM</span>'}</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:12px">Erstelle eigene Badges mit individuellem Icon und Namen.</p>
      <button class="btn" style="width:auto;padding:10px 24px" onclick="addCustomBadge()" ${user.premium?'':'disabled style="opacity:.5;cursor:not-allowed;width:auto;padding:10px 24px"'}>Custom Badge erstellen</button>
      ${user.customBadges.length>0?`<div style="margin-top:16px" class="badge-grid">
        ${user.customBadges.map((b,i)=>`<div class="badge-card">
          <div class="badge-icon" style="background:${b.color}22;color:${b.color}">${b.icon}</div>
          <div class="badge-info"><div class="t">${b.name}</div><div class="d">${b.desc}</div></div>
          <button onclick="deleteCustomBadge(${i})" style="background:transparent;color:var(--red)">🗑</button>
        </div>`).join('')}
      </div>`:''}
    </div>
    ${!user.premium?`<div class="section" style="background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(168,85,247,.05));border-color:rgba(168,85,247,.4)">
      <h2>💎 Upgrade auf Premium</h2>
      <p style="color:var(--muted);margin-bottom:12px">Mit Premium kannst du Custom Badges erstellen und Badges einfärben.</p>
      <button class="btn" style="width:auto;padding:10px 24px" onclick="currentPage='premium';render()">Jetzt upgraden</button>
    </div>`:''}
  `;
}
window.addCustomBadge = ()=>{
  const u = currentUser();
  if(!u.premium){ toast('Premium erforderlich'); return; }
  modal('Custom Badge erstellen',
    `<div class="field"><label>Name</label><input id="cb-n" placeholder="Mein Badge"/></div>
     <div class="field"><label>Icon (Emoji)</label><input id="cb-i" placeholder="🎯" maxlength="2"/></div>
     <div class="field"><label>Beschreibung</label><input id="cb-d"/></div>
     <div class="field"><label>Farbe</label><input id="cb-c" type="color" value="#a855f7"/></div>`,
    bg=>{
      const b = {
        id:'custom_'+Date.now(),
        name: bg.querySelector('#cb-n').value.trim()||'Badge',
        icon: bg.querySelector('#cb-i').value||'✨',
        desc: bg.querySelector('#cb-d').value.trim()||'Custom',
        color: bg.querySelector('#cb-c').value
      };
      updateUser(u.uid,{customBadges:[...u.customBadges, b], badges:[...u.badges, b.id]});
      toast('Custom Badge erstellt'); render();
    },'Erstellen');
};
window.deleteCustomBadge = i=>{
  const u = currentUser();
  const cb = [...u.customBadges];
  const removed = cb.splice(i,1)[0];
  updateUser(u.uid,{customBadges:cb, badges:u.badges.filter(x=>x!==removed.id)});
  render();
};
/* ---------- PREMIUM ---------- */
function renderPremium(user, m){
  m.innerHTML = `
    <h1 class="page-title">Premium</h1>
    <div style="max-width:520px;margin:0 auto;background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(168,85,247,.05));border:1px solid rgba(168,85,247,.4);border-radius:20px;padding:32px">
      <h2 style="font-size:28px;margin-bottom:8px">💎 Premium</h2>
      <div style="font-size:36px;font-weight:800;margin-bottom:4px">7,99€ <span style="font-size:16px;color:var(--muted);font-weight:400">/Lebenslang</span></div>
      <p style="color:var(--primary);margin-bottom:20px">Einmal zahlen. Für immer behalten.</p>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:24px">
        ${['Exklusives Badge','Custom Badges erstellen','Eigene Schriftarten','Typewriter-Animation','Besondere Profil-Effekte','Erweiterte Anpassungen','Unbegrenzte Aliase','SEO-Anpassung'].map(f=>`<li style="display:flex;gap:10px;align-items:center"><span style="color:var(--primary)">✓</span>${f}</li>`).join('')}
      </ul>
      ${user.premium?'<div style="text-align:center;padding:14px;background:rgba(34,197,94,.15);border-radius:10px;color:var(--green);font-weight:600">✓ Du hast bereits Premium</div>':
      `<button class="btn" onclick="buyPremium()">Kaufen</button>`}
    </div>`;
}
window.buyPremium = ()=>{
  const u = currentUser();
  if(confirm('Premium für 7,99€ kaufen? (Demo - kein echter Kauf)')){
    updateUser(u.uid,{premium:true, badges:[...new Set([...u.badges,'premium'])]});
    toast('Premium aktiviert! 🎉'); render();
  }
};
/* ---------- SETTINGS ---------- */
function renderSettings(user, m){
  m.innerHTML = `
    <h1 class="page-title">Einstellungen</h1>
    <div class="section">
      <h2>Konto</h2>
      <div class="field"><label>Email</label><input id="s-email" value="${user.email}"/></div>
      <div class="field"><label>Neues Passwort (leer lassen für unverändert)</label><input id="s-pw" type="password"/></div>
      <button class="btn" id="s-save" style="width:auto;padding:10px 24px">Speichern</button>
    </div>
    <div class="section">
      <h2 style="color:var(--red)">Gefahrenzone</h2>
      <button class="btn" style="background:var(--red);width:auto;padding:10px 24px" onclick="deleteAccount()">Konto löschen</button>
    </div>`;
  $('s-save').onclick=()=>{
    const patch = {email:$('s-email').value};
    if($('s-pw').value) patch.password = $('s-pw').value;
    updateUser(user.uid, patch); toast('Gespeichert');
  };
}
window.deleteAccount = ()=>{
  if(!confirm('Konto wirklich löschen?')) return;
  const u = currentUser();
  const db = loadDB();
  db.users = db.users.filter(x=>x.uid!==u.uid);
  saveDB(db); clearSession(); render();
};
/* ---------- ADMIN ---------- */
function renderAdmin(user, m){
  if(user.role!=='admin'){ m.innerHTML='<h1 class="page-title">Kein Zugriff</h1>'; return; }
  const db = loadDB();
  m.innerHTML = `
    <h1 class="page-title">🛡️ Admin Panel</h1>
    <div class="section">
      <h2>Benutzer (${db.users.length})</h2>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>UID</th><th>Benutzer</th><th>Email</th><th>Views</th><th>Badges</th><th>Premium</th><th>Aktionen</th></tr></thead>
        <tbody>
          ${db.users.map(u=>`<tr>
            <td>${u.uid}</td>
            <td><strong>${u.username}</strong><br><span style="color:var(--muted);font-size:11px">${u.displayName||''}</span></td>
            <td>${u.email}</td>
            <td>${u.views.toLocaleString()}</td>
            <td>${u.badges.length}</td>
            <td>${u.premium?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--muted)">✗</span>'}</td>
            <td><div class="row-btns">
              <button onclick="adminAddViews(${u.uid})">+Views</button>
              <button onclick="adminManageBadges(${u.uid})">Badges</button>
              <button onclick="adminTogglePremium(${u.uid})">${u.premium?'-':'+'} Premium</button>
              <button onclick="adminSetRole(${u.uid})">Rolle</button>
              ${u.uid!==user.uid?`<button class="danger" onclick="adminDelete(${u.uid})">Löschen</button>`:''}
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}
window.adminAddViews = uid=>{
  const v = prompt('Wie viele Views hinzufügen? (Negativ zum Abziehen)','100');
  if(v===null) return;
  const n = parseInt(v); if(isNaN(n)) return;
  const db = loadDB(); const u = db.users.find(x=>x.uid===uid);
  u.views = Math.max(0, u.views + n); saveDB(db); toast('Views aktualisiert'); render();
};
window.adminTogglePremium = uid=>{
  const db = loadDB(); const u = db.users.find(x=>x.uid===uid);
  u.premium = !u.premium;
  if(u.premium) u.badges = [...new Set([...u.badges,'premium'])];
  else u.badges = u.badges.filter(b=>b!=='premium');
  saveDB(db); toast('Premium '+u.premium); render();
};
window.adminSetRole = uid=>{
  const r = prompt('Rolle: user / admin / staff','user');
  if(!r) return;
  const db = loadDB(); const u = db.users.find(x=>x.uid===uid);
  u.role = r;
  if(r==='admin') u.badges = [...new Set([...u.badges,'admin'])];
  if(r==='staff') u.badges = [...new Set([...u.badges,'staff'])];
  saveDB(db); toast('Rolle gesetzt'); render();
};
window.adminDelete = uid=>{
  if(!confirm('User löschen?')) return;
  const db = loadDB();
  db.users = db.users.filter(x=>x.uid!==uid);
  saveDB(db); render();
};
window.adminManageBadges = uid=>{
  const db = loadDB(); const u = db.users.find(x=>x.uid===uid);
  const html = ALL_BADGES.map(b=>`<label style="display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer">
    <input type="checkbox" data-b="${b.id}" ${u.badges.includes(b.id)?'checked':''} style="width:auto"/>
    <span style="color:${b.color}">${b.icon}</span> ${b.name}
  </label>`).join('');
  modal('Badges für '+u.username, html, bg=>{
    const checked = [...bg.querySelectorAll('input[data-b]')].filter(c=>c.checked).map(c=>c.dataset.b);
    // keep custom badges
    const custom = u.badges.filter(b=>b.startsWith('custom_'));
    updateUser(uid,{badges:[...checked, ...custom]});
    toast('Badges aktualisiert'); render();
  });
};
/* ---------- PUBLIC PROFILE ---------- */
function renderProfilePage(username){
  const db = loadDB();
  const u = db.users.find(x=>x.username.toLowerCase()===username.toLowerCase());
  if(!u){
    $('root').innerHTML = `<div class="profile-page"><div class="profile-card"><h1>404</h1><p style="color:var(--muted)">Profil nicht gefunden.</p><a href="#" onclick="location.hash=''" class="btn" style="display:inline-block;margin-top:16px;text-decoration:none;padding:10px 20px">Zurück</a></div></div>`;
    return;
  }
  // increment views (not for owner)
  const viewer = currentUser();
  if(!viewer || viewer.uid!==u.uid){
    u.views++; saveDB(db);
  }
  const badges = u.badges.map(bid=>{
    const b = ALL_BADGES.find(x=>x.id===bid) || u.customBadges.find(x=>x.id===bid);
    return b?`<span class="pb" style="border-color:${b.color};color:${b.color}">${b.icon} ${b.name}</span>`:'';
  }).join('');
  const socials = u.socials.map(l=>{
    const s = SOCIALS.find(x=>x.id===l.type)||{icon:'🔗',color:'#666',name:l.type};
    return `<a href="${l.url}" target="_blank" class="social-icon" style="color:${s.color};text-decoration:none" title="${s.name}">${s.icon}</a>`;
  }).join('');
  $('root').innerHTML = `
    <div class="profile-page">
      <div class="profile-card">
        <div class="profile-avatar">${u.avatar?`<img src="${u.avatar}"/>`:u.username[0].toUpperCase()}</div>
        <div class="profile-name">${u.displayName||u.username}</div>
        <div class="profile-uid">@${u.username} · UID ${u.uid}</div>
        ${badges?`<div class="profile-badges">${badges}</div>`:''}
        ${u.bio?`<div class="profile-bio">${u.bio.replace(/</g,'&lt;')}</div>`:''}
        ${socials?`<div class="profile-socials">${socials}</div>`:''}
        <div class="profile-views">👁 ${u.views.toLocaleString()} Aufrufe</div>
        <a href="#" onclick="location.hash=''" style="display:block;margin-top:20px;color:var(--muted);font-size:12px">← Zum Dashboard</a>
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
