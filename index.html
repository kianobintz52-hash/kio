<style>

    --bg:#07060d; --bg2:#0d0a1f; --panel:rgba(20,16,40,.6);
    --border:rgba(168,85,247,.25); --text:#ece9ff; --muted:#9b96c4;

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
  body{background:radial-gradient(1200px 800px at 20% -10%,#2a0a4a 0%,transparent 60%),radial-gradient(1000px 700px at 100% 100%,#4a0a3a 0%,transparent 60%),var(--bg)}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;color:inherit}
  /* layout */
  .nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(7,6,13,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}

  .nav-links{display:flex;gap:18px;align-items:center}
  .nav-links a{color:var(--muted);font-size:14px}
  .nav-links a:hover{color:var(--text)}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:rgba(168,85,247,.1);cursor:pointer;font-weight:600;font-size:14px;transition:.2s}
  .btn:hover{background:rgba(168,85,247,.2);box-shadow:var(--glow);transform:translateY(-1px)}
  .btn-primary{background:linear-gradient(90deg,#a855f7,#ec4899);border:none;color:#fff}
  .btn-primary:hover{filter:brightness(1.15);box-shadow:var(--glow)}
  .btn-ghost{background:transparent}
  .container{max-width:1200px;margin:0 auto;padding:120px 24px 60px}
  .view{display:none;animation:fade .4s}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* landing */
  .hero{text-align:center;padding:60px 0 80px}
  .hero h1{font-size:clamp(40px,7vw,82px);margin:0 0 18px;line-height:1.05;font-weight:800;letter-spacing:-2px}
  .hero h1 span{background:linear-gradient(90deg,#a855f7,#ec4899,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:18px;max-width:600px;margin:0 auto 30px}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:60px}
  .feature{padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px)}
  .feature .ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#a855f7,#ec4899);margin-bottom:14px;font-size:20px}
  .feature h3{margin:0 0 6px;font-size:16px}
  .feature p{margin:0;color:var(--muted);font-size:14px}
  /* auth */
  .auth-wrap{max-width:420px;margin:60px auto;padding:34px;border:1px solid var(--border);border-radius:20px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:var(--glow)}
  .auth-wrap h2{margin:0 0 6px;text-align:center;font-size:28px}
  .auth-wrap .sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
  .input{width:100%;padding:12px 14px;background:rgba(10,8,20,.6);border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.2s}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.2)}
  .auth-switch{text-align:center;margin-top:18px;color:var(--muted);font-size:13px}
  .auth-switch a{color:var(--accent);cursor:pointer}
  .err{color:#ff6b8a;font-size:13px;margin-top:8px;text-align:center;min-height:18px}
  /* dashboard */
  .dash{display:grid;grid-template-columns:240px 1fr;gap:24px}
  .sidebar{position:sticky;top:96px;align-self:start;padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--panel)}
  .sidebar .me{display:flex;gap:10px;align-items:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0;background-size:cover;background-position:center}
  .me-info .name{font-weight:600;font-size:14px}
  .me-info .uname{color:var(--muted);font-size:12px}
  .menu{display:flex;flex-direction:column;gap:4px}
  .menu a{padding:10px 12px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:10px}
  .menu a:hover,.menu a.active{background:rgba(168,85,247,.15);color:var(--text)}
  .panel{padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--panel);margin-bottom:18px}
  .panel h3{margin:0 0 16px;font-size:18px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.row{grid-template-columns:1fr}.dash{grid-template-columns:1fr}.sidebar{position:static}}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
  .stat{padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}
  .stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .stat .val{font-size:28px;font-weight:800;margin-top:4px;background:linear-gradient(90deg,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .link-item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:rgba(10,8,20,.4)}
  .link-item .drag{cursor:grab;color:var(--muted)}
  .link-item input{flex:1;background:transparent;border:none;outline:none;font-size:14px}
  .link-item .del{background:transparent;border:none;color:#ff6b8a;cursor:pointer;font-size:18px}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .swatch{width:34px;height:34px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .swatch.active{border-color:#fff}
  .preview-link{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:rgba(168,85,247,.15);color:var(--accent);font-size:13px;margin-top:8px}
  /* public profile */
  .profile{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 20px;position:relative;background-size:cover;background-position:center;background-attachment:fixed}
  .profile::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:0}
  .pcard{position:relative;z-index:2;max-width:440px;width:100%;text-align:center;padding:36px 28px;border:1px solid var(--border);border-radius:24px;background:rgba(15,10,30,.72);backdrop-filter:blur(20px);box-shadow:var(--glow)}
  .pcard .av{width:110px;height:110px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#a855f7,#ec4899);display:grid;place-items:center;font-size:42px;font-weight:800;border:3px solid rgba(255,255,255,.15);background-size:cover;background-position:center}
  .pcard h1{margin:0 0 4px;font-size:26px}
  .pcard .uname{color:var(--muted);font-size:14px;margin-bottom:12px}
  .pcard .bio{color:#dcd9f0;margin-bottom:22px;font-size:15px;line-height:1.5}
  .plink{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--border);background:rgba(20,15,40,.6);margin-bottom:10px;font-weight:600;transition:.2s;cursor:pointer}
  .plink:hover{background:rgba(168,85,247,.25);transform:translateY(-2px);box-shadow:var(--glow)}
  .views{color:var(--muted);font-size:12px;margin-top:14px}
  /* enter screen */
  .enter{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(0,0,0,.92);cursor:pointer;backdrop-filter:blur(10px);animation:fade .3s}
  .enter h2{font-size:32px;background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.5}}
  /* particles */
  #particles{position:fixed;inset:0;pointer-events:none;z-index:1}
  /* audio control */
  .audio-ctrl{position:fixed;bottom:20px;right:20px;z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(15,10,30,.8);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;font-size:18px}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(34,211,238,.15);color:var(--accent3);font-size:11px;font-weight:600;margin-left:6px}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:rgba(15,10,30,.95);border:1px solid var(--accent);z-index:9000;font-size:14px;box-shadow:var(--glow);animation:fade .3s}
  .copy-btn{padding:6px 10px;border-radius:6px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);color:var(--accent3);font-size:12px;cursor:pointer}
  textarea.input{min-height:80px;resize:vertical;font-family:inherit}
:root{
  --bg:#080808; --bg2:#0e0e10; --panel:#131317; --panel2:#1a1a20;
  --border:#23232b; --muted:#8b8b95; --text:#f3f3f5;
  --accent:#a855f7; --accent2:#7c3aed; --accent-soft:rgba(168,85,247,.15);
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;width:100%;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 4px 20px -4px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#3a1f22}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:6px;display:block}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:12px 20px;border-radius:12px;z-index:9999;animation:t .3s}
@keyframes t{from{opacity:0;transform:translate(-50%,10px)}}
/* AUTH */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 50% -10%,rgba(168,85,247,.15),transparent)}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px}
.auth-card h1{margin:0 0 6px;font-size:26px}
.auth-card p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.field{margin-bottom:14px}
/* LANDING */
.landing{min-height:100vh;background:radial-gradient(1000px 600px at 50% -10%,rgba(168,85,247,.2),transparent)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand .dot{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hero{max-width:900px;margin:80px auto;padding:0 24px;text-align:center}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1.05;margin:0 0 20px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;color:transparent}
.hero p{font-size:18px;color:var(--muted);margin:0 0 30px}
.claim{display:flex;max-width:480px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;gap:6px}
.claim .pfx{padding:10px 14px;color:var(--muted)}
.claim input{border:none;background:transparent;padding:10px 0}
.features{max-width:1100px;margin:60px auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
/* DASHBOARD */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
.sidebar .brand{margin-bottom:18px;padding:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:14px;color:var(--muted);font-size:13px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:#d6d6dc;transition:.15s}
.navitem:hover{background:var(--panel)}
.navitem.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.navitem .ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.subnav{display:flex;flex-direction:column;gap:2px;padding-left:42px;margin:2px 0 6px}
.subnav a{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.subnav a:hover,.subnav a.active{color:var(--text);background:var(--panel)}
.sidebar .spacer{flex:1}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--panel)}
.usercard .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.usercard .av img{width:100%;height:100%;object-fit:cover}
.usercard small{color:var(--muted);font-size:11px}
.main{padding:32px 40px;max-width:1400px;width:100%}
.page-title{font-size:26px;font-weight:700;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.stat{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:14px;padding:18px}
.stat .h{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:8px}
.stat .v{font-size:24px;font-weight:700}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:18px;font-weight:700;margin:24px 0 12px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.upload{background:var(--bg2);border:1px dashed var(--border);border-radius:14px;padding:34px 14px;text-align:center;cursor:pointer;transition:.15s}
.upload:hover{border-color:var(--accent);background:var(--panel)}
.upload .ic{font-size:28px;margin-bottom:8px;opacity:.7}
.upload small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.upload.has{border-style:solid;padding:0;overflow:hidden;position:relative}
.upload.has img,.upload.has video{width:100%;height:140px;object-fit:cover;display:block}
.upload.has .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;color:#fff;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}
.toggle{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{display:none}
.toggle .sw{width:44px;height:24px;border-radius:99px;background:#2a2a32;position:relative;transition:.2s}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked + .sw{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.toggle input:checked + .sw::after{transform:translateX(20px)}
.color-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.color-row .sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--border)}
.color-row input[type=color]{width:0;height:0;opacity:0;padding:0;border:0}
.color-row input[type=text]{border:none;background:transparent;padding:0;flex:1}
.slider{width:100%}
.link-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.link-item .gr{cursor:grab;color:var(--muted)}
.link-item .ti{font-weight:600}
.link-item .ur{color:var(--muted);font-size:13px}
.link-item .ac{margin-left:auto;display:flex;gap:6px}
.icon-btn{background:var(--panel);border:1px solid var(--border);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--panel2)}
.icon-btn.danger:hover{color:var(--danger)}
.socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px;margin-bottom:18px}
.soc{aspect-ratio:1;border-radius:12px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;font-size:22px;transition:.15s}
.soc:hover{background:var(--panel2);transform:translateY(-2px);border-color:var(--accent)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.bd{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
.bd .ic{font-size:24px;width:36px;text-align:center}
.bd .ti{font-weight:700;font-size:14px}
.bd .ds{color:var(--muted);font-size:12px}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:1000;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:480px;width:100%;position:relative}
.modal .x{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer}
/* PROFILE PAGE */
.profile-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:var(--bg)}
.profile-card{width:100%;max-width:480px;background:rgba(15,15,20,.7);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:24px;padding:36px;text-align:center;box-shadow:0 0 80px var(--accent-soft)}
.profile-card .av{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:48px;font-weight:800;overflow:hidden;border:3px solid var(--accent)}
.profile-card .av img{width:100%;height:100%;object-fit:cover}
.profile-card h2{margin:0;font-size:30px}
.profile-card .un{color:var(--muted);margin:4px 0 14px}
.profile-card .bio{margin:0 0 24px;font-size:15px;line-height:1.5}
.profile-card .lnk{display:block;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;font-weight:600;transition:.15s}
.profile-card .lnk:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-2px)}
.profile-card .views{margin-top:18px;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.profile-card .socs{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.profile-card .socs a{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px;border:1px solid var(--border);transition:.15s}
.profile-card .socs a:hover{background:var(--accent);transform:translateY(-2px)}
.enter-screen{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:5000;cursor:pointer}
.enter-screen .t{font-size:32px;font-weight:700;text-shadow:0 0 30px rgba(255,255,255,.5);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:.6}50%{opacity:1}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:1}
</style>

 {k:'donor',i:'💵',n:'Donor',d:'Spendet mindestens 10€.'},
 {k:'gifter',i:'🎁',n:'Gifter',d:'Verschenkt ein Produkt.'},
 {k:'og',i:'⭐',n:'OG',d:'Früher Unterstützer.'},
 {k:'booster',i:'🔥',n:'Server Booster',d:'Boostet den Discord-Server.'},
 {k:'bug',i:'🐛',n:'Bug Hunter',d:'Hat einen Bug gemeldet.'},

 {k:'xmas',i:'❄️',n:'Christmas 2025',d:'Wintersale 2025.'},

const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];

const toast=(m)=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{users:{}}}catch{return{users:{}}}}
function saveDB(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
function getSession(){return localStorage.getItem(SESSION_KEY)}
function setSession(u){localStorage.setItem(SESSION_KEY,u)}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function currentUser(){const s=getSession();if(!s)return null;const db=loadDB();return db.users[s]||null}
function updateUser(p){const db=loadDB();const s=getSession();if(!s||!db.users[s])return;Object.assign(db.users[s],p);saveDB(db)}
function newUser(username,password){
 return {
  username,password,
  displayName:username, bio:'', location:'', avatar:'',
  background:'', backgroundType:'', audio:'', audioName:'',
  accent:'#a855f7', bgColor:'#080808', textColor:'#ffffff',
  effect:'none', views:0,
  socials:{}, links:[], badges:['og'],
  createdAt:Date.now(),
 };
}
/* ============= ROUTER ============= */
function route(){
 const h=location.hash.slice(1)||'';
 if(h.startsWith('u/'))return renderProfile(h.slice(2));
 if(h==='login')return renderAuth('login');
 if(h==='register')return renderAuth('register');
 if(h==='dashboard'){if(!currentUser())return location.hash='login';return renderDashboard()}
 return renderLanding();
}
window.addEventListener('hashchange',route);
/* ============= LANDING ============= */
function renderLanding(){
 stopFx();
 $('#root').innerHTML=`
 <div class="landing">
  <div class="nav">
   <div class="brand"><div class="dot"></div>bio.link</div>
   <div class="row">
    ${currentUser()?`<a class="btn" href="#dashboard">Dashboard</a>`:`<a class="btn ghost" href="#login">Anmelden</a><a class="btn primary" href="#register">Registrieren</a>`}

  </div>
  <div class="hero">
   <h1>Ein Link. <span>Dein ganzes Profil.</span></h1>

  </div>

/* ============= AUTH ============= */
function renderAuth(mode){
 stopFx();
 const isReg=mode==='register';
 const pre=sessionStorage.getItem('claim')||'';
 sessionStorage.removeItem('claim');
 $('#root').innerHTML=`
 <div class="auth-wrap">
  <div class="auth-card">
   <a href="#" class="brand" style="margin-bottom:20px;display:inline-flex"><div class="dot"></div>bio.link</a>

   <p class="sub">${isReg?'Sichere dir deinen Bio-Link.':'Melde dich in deinem Konto an.'}</p>
   <form onsubmit="doAuth(event,'${mode}')">
    <div class="field"><label class="label">Benutzername</label><input id="u" required pattern="[a-zA-Z0-9_]{2,20}" value="${pre}" placeholder="dein-name"/></div>
    <div class="field"><label class="label">Passwort</label><input id="p" type="password" required minlength="4"/></div>
    <button class="btn primary" style="width:100%;margin-top:8px" type="submit">${isReg?'Registrieren':'Anmelden'}</button>
   </form>
   <p class="muted" style="text-align:center;margin-top:18px;font-size:13px">
    ${isReg?'Schon ein Konto? <a href="#login" style="color:var(--accent)">Anmelden</a>':'Noch kein Konto? <a href="#register" style="color:var(--accent)">Registrieren</a>'}
   </p>
  </div>
 </div>`;
}
window.doAuth=(e,mode)=>{
 e.preventDefault();
 const u=$('#u').value.trim().toLowerCase(), p=$('#p').value;
 const db=loadDB();
 if(mode==='register'){
  if(db.users[u])return toast('Benutzername vergeben');
  db.users[u]=newUser(u,p);saveDB(db);setSession(u);toast('Willkommen!');location.hash='dashboard';
 }else{
  if(!db.users[u]||db.users[u].password!==p)return toast('Falsche Daten');
  setSession(u);location.hash='dashboard';
 }
};
/* ============= DASHBOARD ============= */
let currentTab='overview';
function renderDashboard(){
 stopFx();
 const u=currentUser();if(!u)return location.hash='login';
 const av=u.avatar?`<img src="${u.avatar}"/>`:u.username[0].toUpperCase();
 $('#root').innerHTML=`
 <div class="app">
  <aside class="sidebar">
   <div class="brand"><div class="dot"></div>bio.link</div>
   <div class="search">🔍 Funktionen suchen…</div>

</div>
<!-- LOGIN -->

                <option value="stars">⭐ Stars</option>

            </div>
            <button class="btn btn-primary" onclick="saveEffect()">Save</button>
          </div>
        </section>
      </main>
    <div class="navitem ${currentTab==='customize'?'active':''}" onclick="go('customize')"><span class="ico">🎨</span>Anpassen</div>

   </div>

 </div>`;
 renderPane();

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return h}
window.go=(t)=>{currentTab=t;renderDashboard()};
window.doLogout=()=>{clearSession();location.hash=''};
window.share=()=>{const u=currentUser();navigator.clipboard?.writeText(location.origin+location.pathname+'#u/'+u.username);toast('Link kopiert!')};
function renderPane(){
 const u=currentUser();const p=$('#pane');
 if(currentTab==='overview')p.innerHTML=paneOverview(u);
 else if(currentTab==='stats')p.innerHTML=paneStats(u);
 else if(currentTab==='badges')p.innerHTML=paneBadges(u);
 else if(currentTab==='settings')p.innerHTML=paneSettings(u);
 else if(currentTab==='customize')p.innerHTML=paneCustomize(u);
 else if(currentTab==='links')p.innerHTML=paneLinks(u);
 bindPane();
}
/* ====== PANES ====== */
function paneOverview(u){
 const completion=Math.round(((u.avatar?1:0)+(u.bio?1:0)+(u.background?1:0)+(u.links.length?1:0)+(Object.keys(u.socials).length?1:0))/5*100);
 return `
 <h1 class="page-title">Kontoübersicht</h1>
 <div class="stats">
  <div class="stat"><div class="h">Benutzername ✏️</div><div class="v">${u.username}</div><div class="s">Jederzeit änderbar</div></div>
  <div class="stat"><div class="h">Anzeigename 👤</div><div class="v" style="font-size:20px">${u.displayName||'—'}</div><div class="s">Wird auf deiner Seite angezeigt</div></div>
  <div class="stat"><div class="h">UID #</div><div class="v">${Math.abs(hash(u.username))}</div><div class="s">Deine eindeutige ID</div></div>
  <div class="stat"><div class="h">Profilaufrufe 👁</div><div class="v">${u.views}</div><div class="s">Gesamt</div></div>
 </div>
 <h2 class="section-title">Profil-Vervollständigung</h2>
 <div class="card">
  <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600"><span>Fortschritt</span><span>${completion}% abgeschlossen</span></div>
  <div style="height:10px;background:var(--bg2);border-radius:99px;overflow:hidden"><div style="height:100%;width:${completion}%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px"></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px">
   ${[
    ['Avatar hochladen',u.avatar,'customize'],
    ['Beschreibung hinzufügen',u.bio,'customize'],
    ['Hintergrund setzen',u.background,'customize'],
    ['Links hinzufügen',u.links.length,'links'],

window.saveSettings=()=>{
 const u=currentUser();
 const nu=$('#set-username').value.trim().toLowerCase();
 if(!/^[a-z0-9_]{2,20}$/.test(nu))return toast('Ungültiger Benutzername');
 const db=loadDB();
 if(nu!==u.username){
  if(db.users[nu])return toast('Benutzername vergeben');
  db.users[nu]=db.users[u.username];db.users[nu].username=nu;delete db.users[u.username];setSession(nu);
 }else db.users[u.username].username=nu;

window.promptEdit=(field,label)=>{

};

<script>
// ===== state =====
const DB_KEY='biolnk_db_v1';
const SESSION_KEY='biolnk_session';
const COLORS=['#a855f7','#ec4899','#22d3ee','#10b981','#f59e0b','#ef4444','#3b82f6','#fff'];
function db(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{users:{}}}catch{return{users:{}}}}
function saveDb(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
function session(){return localStorage.getItem(SESSION_KEY)}
function currentUser(){const u=session();return u?db().users[u]:null}
// ===== router =====
function go(view,arg){
  location.hash = view==='landing'?'':view==='profile'?'/u/'+arg:'/'+view;
}
function render(){
  const h=location.hash.replace(/^#\/?/,'');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  let view='landing';
  if(h.startsWith('u/')){
    const uname=h.slice(2);
    if(renderProfile(uname)) view='profile'; else view='404';
  } else if(['login','register','dashboard'].includes(h)){
    if(h==='dashboard' && !session()){view='login'} else view=h;
  }
  document.getElementById('view-'+view).classList.add('active');
  document.getElementById('nav').style.display = view==='profile'?'none':'flex';
  document.getElementById('particles').style.display = view==='profile'?'block':'block';
  if(view==='dashboard') initDash();
  if(view!=='profile'){stopAudio();stopProfileEffect();initBgParticles()}
  renderNav();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
function renderNav(){
  const el=document.getElementById('navLinks');
  const u=currentUser();
  if(u){
    el.innerHTML=`<a onclick="go('dashboard')">Dashboard</a><a onclick="viewProfile()">My profile</a><button class="btn btn-ghost" onclick="logout()">Logout</button>`;
  } else {
    el.innerHTML=`<a onclick="go('login')">Sign in</a><button class="btn btn-primary" onclick="go('register')">Get started</button>`;
  }
}
// ===== auth =====
function register(e){
  e.preventDefault();
  const u=regUser.value.trim().toLowerCase(), em=regEmail.value.trim(), p=regPass.value;
  const d=db();
  if(d.users[u]){regErr.textContent='Username taken';return}
  if(Object.values(d.users).some(x=>x.email===em)){regErr.textContent='Email already used';return}
  d.users[u]={username:u,email:em,password:p,name:u,bio:'Welcome to my page ✨',avatar:'',bg:'',color:'#a855f7',audio:'',effect:'sparkles',links:[{label:'Twitter',url:'https://twitter.com'},{label:'Instagram',url:'https://instagram.com'}],views:0,clicks:0,created:Date.now()};
  saveDb(d);
  localStorage.setItem(SESSION_KEY,u);
  go('dashboard');
}
function login(e){
  e.preventDefault();
  const id=loginUser.value.trim().toLowerCase(), p=loginPass.value;
  const d=db();
  const user=d.users[id]||Object.values(d.users).find(x=>x.email===id);
  if(!user||user.password!==p){loginErr.textContent='Invalid credentials';return}
  localStorage.setItem(SESSION_KEY,user.username);
  go('dashboard');
}
function logout(){localStorage.removeItem(SESSION_KEY);go('landing')}
// ===== dashboard =====
function tab(name){
  document.querySelectorAll('.menu a[data-tab]').forEach(a=>a.classList.toggle('active',a.dataset.tab===name));
  document.querySelectorAll('[data-pane]').forEach(p=>p.style.display=p.dataset.pane===name?'block':'none');
}
function initDash(){
  const u=currentUser();if(!u){go('login');return}
  meName.textContent=u.name;meUname.textContent='@'+u.username;
  meAv.textContent=u.name[0].toUpperCase();
  if(u.avatar)meAv.style.backgroundImage=`url(${u.avatar})`,meAv.textContent='';
  sViews.textContent=u.views;sClicks.textContent=u.clicks;sLinks.textContent=u.links.length;
  sSince.textContent=new Date(u.created).toLocaleDateString();
  profUrl.textContent=location.origin+location.pathname+'#/u/'+u.username;
  fName.value=u.name;fUname.value=u.username;fAvatar.value=u.avatar;fBio.value=u.bio;
  fBg.value=u.bg;fColor.value=u.color;fAudio.value=u.audio;fEffect.value=u.effect;
  renderSwatches(u.color);renderLinks(u.links);
}
function renderSwatches(active){
  swatches.innerHTML='';
  COLORS.forEach(c=>{
    const s=document.createElement('div');s.className='swatch'+(c===active?' active':'');s.style.background=c;
    s.onclick=()=>{fColor.value=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));s.classList.add('active')};
    swatches.appendChild(s);
   </div>`}).join(''):'<p class="muted" style="margin:0">Noch keine Socials hinzugefügt. Klicke oben ein Icon an.</p>'}
 </div>
 <h2 class="section-title">Custom Links (${u.links.length})</h2>
 <div class="card">
  ${u.links.length?u.links.map((l,i)=>`
   <div class="link-item">
    <span class="gr">⋮⋮</span>
    <div style="flex:1"><div class="ti">${l.title}</div><div class="ur">${l.url}</div></div>
    <div class="ac">
     <button class="icon-btn" onclick="editLink(${i})">✏️</button>
     <button class="icon-btn danger" onclick="removeLink(${i})">🗑</button>
    </div>
   </div>`).join(''):'<p class="muted" style="margin:0">Noch keine Custom-Links.</p>'}
 </div>`;
}
window.addSocial=(k)=>{
 const u=currentUser();const s=SOCIALS.find(x=>x.k===k);
 const cur=u.socials[k]||'';
 const v=prompt(`${s.n} — URL oder Benutzername`,cur);
 if(v===null)return;
 if(!v.trim()){delete u.socials[k];}else{u.socials[k]=v.trim()}
 updateUser({socials:u.socials});renderPane();
};
window.editSocial=(k)=>addSocial(k);
window.removeSocial=(k)=>{const u=currentUser();delete u.socials[k];updateUser({socials:u.socials});renderPane()};
window.addCustomLink=()=>{
 const t=prompt('Titel');if(!t)return;
 const url=prompt('URL (https://…)');if(!url)return;
 const u=currentUser();u.links.push({id:uid(),title:t,url,clicks:0});updateUser({links:u.links});renderPane();
};
window.editLink=(i)=>{
 const u=currentUser();const l=u.links[i];
 const t=prompt('Titel',l.title);if(t===null)return;

window.removeLink=(i)=>{const u=currentUser();u.links.splice(i,1);updateUser({links:u.links});renderPane()};

window.openPremium=()=>{

 m.innerHTML=`<div class="modal">
  <button class="x" onclick="this.closest('.modal-bg').remove()">×</button>
  <h2 style="margin:0 0 4px">💎 Upgrade auf Premium</h2>
  <div style="font-size:36px;font-weight:800;margin:10px 0">7,99€ <span style="font-size:14px;color:var(--muted);font-weight:500">/Lebenslang</span></div>
  <p style="color:var(--accent)">Einmal zahlen. Für immer behalten.</p>
  <ul style="list-style:none;padding:0;margin:18px 0">
   ${['Exklusives Badge','Profil-Layouts','Eigene Schriftarten','Typewriter-Animation','Besondere Profil-Effekte','Erweiterte Anpassungen','SEO-Anpassung'].map(x=>`<li style="padding:8px 0;display:flex;gap:10px;align-items:center"><span style="color:var(--accent)">✓</span>${x}</li>`).join('')}
  </ul>
  <button class="btn primary" style="width:100%" onclick="toast('Demo — nicht echt 🙂');this.closest('.modal-bg').remove()">Kaufen</button>
 </div>`;
 document.body.appendChild(m);
};
/* ============= PROFILE PAGE ============= */
function renderProfile(username){
 const db=loadDB();const u=db.users[username];
 if(!u){$('#root').innerHTML=`<div class="auth-wrap"><div class="auth-card" style="text-align:center"><h1>404</h1><p class="muted">Nutzer "${username}" nicht gefunden</p><a class="btn primary" href="#">Zur Startseite</a></div></div>`;return}
 // bump views (only once per session per user)
 const seen='seen_'+username;if(!sessionStorage.getItem(seen)){u.views=(u.views||0)+1;db.users[username]=u;saveDB(db);sessionStorage.setItem(seen,'1')}
 const showEnter=!!u.audio;
 document.body.style.background=u.bgColor||'#000';
 const av=u.avatar?`<img src="${u.avatar}"/>`:(u.displayName||u.username)[0].toUpperCase();
 const bgStyle=u.background?(u.backgroundType==='video'?`<video autoplay loop muted playsinline src="${u.background}" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1"></video>`:`<div style="position:fixed;inset:0;background:url('${u.background}') center/cover;z-index:-1"></div>`):'';
 const socsHtml=Object.entries(u.socials).map(([k,v])=>{const s=SOCIALS.find(x=>x.k===k)||{i:'🔗',n:k,c:'#fff'};const href=v.startsWith('http')||v.includes('@')?(v.includes('@')?'mailto:'+v:v):'https://'+v;return `<a href="${href}" target="_blank" title="${s.n}" style="color:${s.c}">${s.i}</a>`}).join('');
 const linksHtml=u.links.map(l=>`<a class="lnk" href="${l.url.startsWith('http')?l.url:'https://'+l.url}" target="_blank" onclick="clickLink('${username}','${l.id}')">${l.title}</a>`).join('');
 $('#root').innerHTML=`
  ${bgStyle}
  ${showEnter?`<div class="enter-screen" id="enter" onclick="enterProfile()"><div class="t" style="color:${u.textColor||'#fff'}">[ Klick um einzutreten ]</div></div>`:''}
  <div class="profile-page" style="color:${u.textColor||'#fff'}">
   <div class="profile-card" style="--accent:${u.accent};box-shadow:0 0 80px ${u.accent}33;border-color:${u.accent}44">
    <div class="av" style="background:linear-gradient(135deg,${u.accent},${u.accent}88);border-color:${u.accent}">${av}</div>
    <h2>${u.displayName||u.username}</h2>
    <div class="un">@${u.username}</div>
    ${u.bio?`<p class="bio">${escapeHtml(u.bio)}</p>`:''}
    ${u.location?`<p class="muted" style="margin:-10px 0 16px">📍 ${escapeHtml(u.location)}</p>`:''}
    ${u.badges.length?`<div style="margin-bottom:14px;font-size:20px">${u.badges.map(k=>{const b=BADGES.find(x=>x.k===k);return b?`<span title="${b.n}" style="margin:0 3px">${b.i}</span>`:''}).join('')}</div>`:''}
    ${socsHtml?`<div class="socs">${socsHtml}</div>`:''}
    ${linksHtml}
    <div class="views">👁 ${u.views} Aufrufe</div>
   </div>
  </div>`;
 startFx(u.effect,u.accent);
 if(u.audio){window._audio=new Audio(u.audio);window._audio.loop=true;window._audio.volume=.5}
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.enterProfile=()=>{$('#enter')?.remove();if(window._audio)window._audio.play().catch(()=>{})};
window.clickLink=(un,id)=>{const db=loadDB();const u=db.users[un];if(!u)return;const l=u.links.find(x=>x.id===id);if(l){l.clicks=(l.clicks||0)+1;saveDB(db)}};
/* ============= FX ============= */
let fxRAF, fxParticles=[];
function startFx(kind,color){
 stopFx();if(!kind||kind==='none')return;
 const c=$('#fx');c.style.display='block';
 const ctx=c.getContext('2d');
 const resize=()=>{c.width=innerWidth;c.height=innerHeight};resize();window.onresize=resize;
 fxParticles=Array.from({length:80},()=>mkP(kind));
 const loop=()=>{
  ctx.clearRect(0,0,c.width,c.height);
  fxParticles.forEach(p=>{
   p.y+=p.vy;p.x+=p.vx;p.life--;
   if(p.y>c.height||p.life<0)Object.assign(p,mkP(kind));
   ctx.fillStyle=p.color||color;ctx.globalAlpha=p.alpha||1;
   if(kind==='hearts'){ctx.font=p.size+'px serif';ctx.fillText('❤',p.x,p.y)}
   else if(kind==='stars'){ctx.font=p.size+'px serif';ctx.fillText('★',p.x,p.y)}
   else if(kind==='sparkles'){ctx.font=p.size+'px serif';ctx.fillText('✦',p.x,p.y)}
   else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
  });
}
function renderLinks(links){
  linksList.innerHTML='';
  links.forEach((l,i)=>{
    const el=document.createElement('div');el.className='link-item';
    el.innerHTML=`<span class="drag">⋮⋮</span><input placeholder="Label" value="${escapeHtml(l.label)}" data-k="label"><input placeholder="https://..." value="${escapeHtml(l.url)}" data-k="url"><button class="del" onclick="this.parentElement.remove()">×</button>`;
    linksList.appendChild(el);
  });
}
function addLink(){const u=currentUser();u.links.push({label:'',url:''});renderLinks(u.links)}
function saveProfile(){
  const d=db(),u=d.users[session()];
  u.name=fName.value.trim()||u.username;u.avatar=fAvatar.value.trim();u.bio=fBio.value.trim();
  saveDb(d);toast('Profile saved');initDash();
}
function saveLinks(){
  const d=db(),u=d.users[session()],items=[];
  linksList.querySelectorAll('.link-item').forEach(it=>{
    const l=it.querySelector('[data-k=label]').value.trim(),url=it.querySelector('[data-k=url]').value.trim();
    if(l||url)items.push({label:l,url:url});
  });
  u.links=items;saveDb(d);toast('Links saved');initDash();
}
function saveCustom(){
  const d=db(),u=d.users[session()];u.bg=fBg.value.trim();u.color=fColor.value;saveDb(d);toast('Saved');
}
function saveAudio(){const d=db(),u=d.users[session()];u.audio=fAudio.value.trim();saveDb(d);toast('Saved')}
function saveEffect(){const d=db(),u=d.users[session()];u.effect=fEffect.value;saveDb(d);toast('Saved')}
function viewProfile(){const u=currentUser();if(u)go('profile',u.username)}
function copyLink(){navigator.clipboard.writeText(profUrl.textContent);toast('Copied!')}
// ===== public profile =====
let enterEl=null,audioEl=null,profEffectRAF=null;
function renderProfile(uname){
  const d=db(),u=d.users[uname.toLowerCase()];
  if(!u)return false;
  u.views++;saveDb(d);
  const card=document.getElementById('pcard');
  card.style.borderColor=u.color+'66';card.style.boxShadow=`0 0 30px ${u.color}55, 0 0 70px ${u.color}33`;
  document.getElementById('profileBg').style.background = u.bg?`url(${u.bg}) center/cover fixed`:'';
  pAv.textContent=u.name[0].toUpperCase();pAv.style.background=`linear-gradient(135deg,${u.color},${u.color}88)`;
  if(u.avatar){pAv.style.backgroundImage=`url(${u.avatar})`;pAv.textContent=''}
  pName.textContent=u.name;pUname.textContent='@'+u.username;pBio.textContent=u.bio;
  pLinks.innerHTML='';
  u.links.forEach((l,i)=>{
    const a=document.createElement('a');a.className='plink';a.textContent=l.label||l.url;
    a.style.borderColor=u.color+'55';
    a.onclick=()=>{const dd=db();dd.users[uname].clicks++;saveDb(dd);if(l.url)window.open(l.url,'_blank')};
    pLinks.appendChild(a);
  });
  pViews.textContent=`${u.views} views`;
  // enter screen for audio/effect
  showEnter(u);
  return true;
}
function showEnter(u){
  if(enterEl)enterEl.remove();
  enterEl=document.createElement('div');enterEl.className='enter';
  enterEl.innerHTML=`<div style="text-align:center"><h2>click to enter</h2><p style="color:#888;font-size:14px">${u.audio?'🎵 audio will play':''}</p></div>`;
  enterEl.onclick=()=>{
    enterEl.remove();enterEl=null;
    if(u.audio){try{audioEl=new Audio(u.audio);audioEl.loop=true;audioEl.volume=.5;audioEl.play().catch(()=>{});addAudioCtrl()}catch{}}
    startProfileEffect(u.effect);
  };
  document.body.appendChild(enterEl);
}
function addAudioCtrl(){
  const b=document.createElement('button');b.className='audio-ctrl';b.id='audioCtrl';b.textContent='🔊';
  b.onclick=()=>{if(audioEl.paused){audioEl.play();b.textContent='🔊'}else{audioEl.pause();b.textContent='🔇'}};
  document.body.appendChild(b);
}
function stopAudio(){if(audioEl){audioEl.pause();audioEl=null}const c=document.getElementById('audioCtrl');if(c)c.remove();if(enterEl){enterEl.remove();enterEl=null}}
// ===== particles =====
const cnv=document.getElementById('particles'),ctx=cnv.getContext('2d');
let parts=[],mode='bg';
function resize(){cnv.width=innerWidth;cnv.height=innerHeight}
addEventListener('resize',resize);resize();
function initBgParticles(){mode='bg';parts=[];for(let i=0;i<60;i++)parts.push({x:Math.random()*cnv.width,y:Math.random()*cnv.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5,c:Math.random()<.5?'#a855f7':'#ec4899'})}
function startProfileEffect(eff){
  mode=eff;parts=[];
  if(eff==='none'){initBgParticles();return}
  const n=eff==='rain'?120:eff==='snow'?80:60;
  for(let i=0;i<n;i++)parts.push(mkPart(eff));
}
function mkPart(eff){
  if(eff==='rain')return{x:Math.random()*cnv.width,y:Math.random()*cnv.height,vy:6+Math.random()*4,vx:-1,len:10+Math.random()*10,t:'rain'};
  if(eff==='snow')return{x:Math.random()*cnv.width,y:Math.random()*cnv.height,vy:.5+Math.random(),vx:(Math.random()-.5)*.5,r:1+Math.random()*3,t:'snow'};
  if(eff==='hearts')return{x:Math.random()*cnv.width,y:cnv.height+Math.random()*200,vy:-(.5+Math.random()),vx:(Math.random()-.5)*.4,s:14+Math.random()*14,ch:'💜',t:'em'};
  if(eff==='stars')return{x:Math.random()*cnv.width,y:cnv.height+Math.random()*200,vy:-(.3+Math.random()),vx:(Math.random()-.5)*.3,s:12+Math.random()*12,ch:'⭐',t:'em'};
  return{x:Math.random()*cnv.width,y:Math.random()*cnv.height,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,r:1+Math.random()*2,c:'#fff',a:Math.random(),t:'spark'};
}
function stopProfileEffect(){cancelAnimationFrame(profEffectRAF)}
function loop(){
  ctx.clearRect(0,0,cnv.width,cnv.height);
  parts.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.t==='rain'){ctx.strokeStyle='rgba(150,180,255,.5)';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1,p.y+p.len);ctx.stroke();if(p.y>cnv.height)Object.assign(p,mkPart('rain'),{y:-10})}
    else if(p.t==='snow'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.y>cnv.height)Object.assign(p,mkPart('snow'),{y:-10})}
    else if(p.t==='em'){ctx.font=p.s+'px serif';ctx.fillText(p.ch,p.x,p.y);if(p.y<-30)Object.assign(p,mkPart(mode),{y:cnv.height+10})}
    else if(p.t==='spark'){p.a+=.05;ctx.fillStyle=`rgba(255,255,255,${(Math.sin(p.a)+1)/2*.8})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.x<0||p.x>cnv.width||p.y<0||p.y>cnv.height)Object.assign(p,mkPart(mode))}
    else {ctx.fillStyle=p.c;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;if(p.x<0||p.x>cnv.width)p.vx*=-1;if(p.y<0||p.y>cnv.height)p.vy*=-1}
  });
  profEffectRAF=requestAnimationFrame(loop);
}
loop();
// ===== util =====
function escapeHtml(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
// init
initBgParticles();render();
  ctx.globalAlpha=1;
  fxRAF=requestAnimationFrame(loop);
 };loop();
}
function mkP(kind){
 const base={x:Math.random()*innerWidth,y:-20,vx:0,vy:1+Math.random()*2,size:2+Math.random()*4,life:300,alpha:.7+Math.random()*.3};
 if(kind==='snow')return{...base,color:'#fff',vy:.5+Math.random()*1.5};
 if(kind==='rain')return{...base,color:'#9bf',vy:4+Math.random()*4,size:1};
 if(kind==='night')return{...base,color:'#fff',vy:.2,size:1+Math.random()*2,alpha:.4};
 if(kind==='hearts')return{...base,color:'#ff5577',size:12+Math.random()*10};
 if(kind==='stars')return{...base,color:'#ffd700',size:10+Math.random()*8};
 if(kind==='sparkles')return{...base,color:'#fff',size:10+Math.random()*8};
 return base;
}
function stopFx(){cancelAnimationFrame(fxRAF);fxParticles=[];const c=$('#fx');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);c.style.display='none'}if(window._audio){window._audio.pause();window._audio=null}document.body.style.background=''}
/* boot */
route();
</script>
