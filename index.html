<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiobio.lol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- NAV -->
    <nav class="fixed top-0 w-full bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 z-50">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🔫</span>
                <span class="text-2xl font-bold tracking-tight">kiobio.lol</span>
            </div>
            <button onclick="logout()" id="navBtn" class="hidden px-6 py-2 bg-red-600 hover:bg-red-700 rounded-xl">Abmelden</button>
        </div>
    </nav>

    <!-- HERO -->
    <section id="hero" class="min-h-screen flex items-center justify-center text-center">
        <div class="max-w-2xl px-6">
            <h1 class="text-6xl font-bold mb-6">Dein Link-in-Bio.<br>Dein Style.</h1>
            <p class="text-xl text-zinc-400 mb-10">Modern. Schnell. Voll anpassbar.</p>
            <button onclick="showLoginModal()" class="bg-white text-black px-10 py-4 rounded-2xl font-semibold text-lg hover:bg-zinc-200">Anmelden</button>
            <button onclick="showRegisterModal()" class="ml-4 border border-zinc-700 hover:border-zinc-500 px-10 py-4 rounded-2xl font-semibold text-lg">Kostenlos registrieren</button>
        </div>
    </section>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden min-h-screen pt-24 pb-12">
        <div class="max-w-5xl mx-auto px-6">
            <h1 class="text-4xl font-bold mb-2">Willkommen zurück, <span id="welcomeName" class="text-violet-400"></span></h1>
            <p class="text-zinc-400">Verwalte dein Profil</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
                <!-- Profil Card -->
                <div onclick="goToProfile()" class="glass border border-zinc-700 rounded-3xl p-8 hover:border-violet-500 transition cursor-pointer">
                    <div class="text-5xl mb-6">👤</div>
                    <h3 class="text-2xl font-semibold mb-2">Mein Profil</h3>
                    <p class="text-zinc-400">Öffentliche Seite ansehen</p>
                </div>

                <!-- Editor Card -->
                <div onclick="openProfileEditor()" class="glass border border-zinc-700 rounded-3xl p-8 hover:border-violet-500 transition cursor-pointer">
                    <div class="text-5xl mb-6">✏️</div>
                    <h3 class="text-2xl font-semibold mb-2">Profil bearbeiten</h3>
                    <p class="text-zinc-400">Banner, Musik, Bio, etc.</p>
                </div>

                <!-- Stats -->
                <div class="glass border border-zinc-700 rounded-3xl p-8">
                    <div class="text-5xl mb-6">📊</div>
                    <h3 class="text-2xl font-semibold mb-2">Statistiken</h3>
                    <p class="text-zinc-400">Views • Likes • Besucher</p>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFIL EDITOR -->
    <div id="editorModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-2xl mx-4 p-8">
            <h2 class="text-3xl font-bold mb-8">Profil bearbeiten</h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm mb-2 text-zinc-400">Display Name</label>
                    <input id="editDisplayName" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-violet-500">
                </div>
                <div>
                    <label class="block text-sm mb-2 text-zinc-400">Bio</label>
                    <textarea id="editBio" rows="3" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm mb-2 text-zinc-400">Banner Bild</label>
                        <input type="file" id="bannerInput" accept="image/*" class="w-full bg-zinc-800 rounded-2xl px-5 py-4">
                    </div>
                    <div>
                        <label class="block text-sm mb-2 text-zinc-400">Profilbild</label>
                        <input type="file" id="picInput" accept="image/*" class="w-full bg-zinc-800 rounded-2xl px-5 py-4">
                    </div>
                </div>

                <div>
                    <label class="block text-sm mb-2 text-zinc-400">Hintergrund Musik (MP3)</label>
                    <input type="file" id="musicInput" accept="audio/mp3" class="w-full bg-zinc-800 rounded-2xl px-5 py-4">
                </div>
            </div>

            <div class="flex gap-4 mt-10">
                <button onclick="saveProfile()" class="flex-1 bg-violet-600 hover:bg-violet-700 py-4 rounded-2xl font-semibold">Speichern</button>
                <button onclick="closeEditor()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Login & Register Modals (kurz) -->
    <!-- ... (wie in vorherigen Versionen) ... -->

    <script>
        // Firebase Config hier einfügen
        const firebaseConfig = { /* deine Config */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;

        function showLoginModal() { /* ... */ }
        function showRegisterModal() { /* ... */ }
        async function doLogin() { /* ... */ }
        async function registerUser() { /* ... */ }

        function showDashboard() {
            document.getElementById('hero').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('welcomeName').textContent = currentUser.email.split('@')[0];
        }

        function goToProfile() {
            window.open(`profile.html`, '_blank');
        }

        function openProfileEditor() {
            document.getElementById('editorModal').classList.remove('hidden');
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.add('hidden');
        }

        async function saveProfile() {
            alert("✅ Änderungen gespeichert (Upload-Funktion kann ich noch erweitern)");
            closeEditor();
        }

        function logout() {
            auth.signOut();
            location.reload();
        }

        window.onload = () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    showDashboard();
                }
            });
        };
    </script>
</body>
</html>
