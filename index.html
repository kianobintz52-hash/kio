<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>bio.link — dein Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --panel:rgba(20,16,40,.6); --border:rgba(168,85,247,.25);
  --text:#ece9ff; --muted:#9b96c4; --accent:#a855f7; --accent2:#ec4899; --accent3:#22d3ee;
  --glow:0 0 24px rgba(168,85,247,.45), 0 0 60px rgba(236,72,153,.25);
  --danger:#ef4444; --success:#10b981; --gold:#fbbf24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 800px at 20% -10%,#2a0a4a 0%,transparent 60%),radial-gradient(1000px 700px at 100% 100%,#4a0a3a 0%,transparent 60%),var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(7,6,13,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,#a855f7,#ec4899,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.nav-links{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(168,85,247,.1);cursor:pointer;font-weight:600;font-size:14px;transition:.2s;color:var(--text)}
.btn:hover{background:rgba(168,85,247,.22);box-shadow:var(--glow)}
.btn-primary{background:linear-gradient(90deg,#a855f7,#ec4899);border:none;color:#fff}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fecaca}
.btn-gold{background:linear-gradient(90deg,#f59e0b,#fbbf24);border:none;color:#1a1505}
.container{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
.view{display:none}.view.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;backdrop-filter:blur(10px)}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
h1,h2,h3{margin:0 0 12px}
h1{font-size:34px}h2{font-size:22px}h3{font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.3)}
.tag.gold{background:linear-gradient(90deg,rgba(251,191,36,.2),rgba(245,158,11,.2));color:var(--gold);border-color:rgba(251,191,36,.4)}
.tag.admin{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.4)}
.hero{text-align:center;padding:60px 20px}
.hero h1{font-size:54px;background:linear-gradient(90deg,#fff,#d8b4fe,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:18px;max-width:580px;margin:10px auto 26px}
.link-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.25);margin-bottom:10px}
.link-item .info{flex:1;min-width:0}
.link-item .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-item .info span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub-link{display:block;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);margin-bottom:10px;font-weight:600;text-align:center;transition:.2s}
.pub-link:hover{transform:translateY(-2px);box-shadow:var(--glow);background:rgba(168,85,247,.18)}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;overflow:hidden}
.avatar.lg{width:128px;height:128px;font-size:46px}
.avatar.sm{width:40px;height:40px;font-size:16px;border-width:2px}
.profile-head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 0}
.lock{opacity:.55;position:relative}
.lock::after{content:"🔒 PREMIUM";position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;color:var(--gold);background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.theme-card{padding:18px;border-radius:12px;border:2px solid transparent;cursor:pointer;text-align:center;font-weight:700;transition:.2s;position:relative}
.theme-card.selected{border-color:var(--accent);box-shadow:var(--glow)}
.theme-purple{background:linear-gradient(135deg,#2a0a4a,#4a1a6a)}
.theme-ocean{background:linear-gradient(135deg,#0c4a6e,#0e7490)}
.theme-sunset{background:linear-gradient(135deg,#7c2d12,#f59e0b)}
.theme-neon{background:linear-gradient(135deg,#022c22,#10b981)}
.theme-gold{background:linear-gradient(135deg,#451a03,#fbbf24)}
.stat{padding:18px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--border);text-align:center}
.stat b{font-size:28px;display:block;background:linear-gradient(90deg,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(15,12,30,.95);border:1px solid var(--accent);padding:12px 22px;border-radius:12px;z-index:100;box-shadow:var(--glow);font-weight:600;opacity:0;transition:.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);background:transparent;border:1px solid transparent}
.tab.active{color:var(--text);background:rgba(168,85,247,.15);border-color:var(--border)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.copy-link{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:rgba(0,0,0,.4);border:1px dashed var(--border);font-family:monospace;font-size:13px;cursor:pointer}
.copy-link:hover{background:rgba(168,85,247,.15)}
@media(max-width:640px){.hero h1{font-size:36px}h1{font-size:26px}}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand" onclick="go('#/')">bio.link</div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="view-landing" class="view"></div>
  <div id="view-auth" class="view"></div>
  <div id="view-dashboard" class="view"></div>
  <div id="view-public" class="view"></div>
  <div id="view-admin" class="view"></div>
  <div id="view-404" class="view">
    <div class="card" style="text-align:center;padding:60px">
      <h1>404</h1><p class="muted">Profil oder Seite nicht gefunden.</p>
      <button class="btn btn-primary" onclick="go('#/')">Zurück zur Startseite</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============ "BACKEND" via localStorage ============
const DB_KEY='biolink.v2', SESSION_KEY='biolink.session';
const THEMES={
  purple:{name:'Purple',premium:false,cls:'theme-purple'},
  ocean:{name:'Ocean',premium:false,cls:'theme-ocean'},
  sunset:{name:'Sunset',premium:true,cls:'theme-sunset'},
  neon:{name:'Neon',premium:true,cls:'theme-neon'},
  gold:{name:'Gold',premium:true,cls:'theme-gold'},
};

function loadDB(){
  let db=null;
  try{db=JSON.parse(localStorage.getItem(DB_KEY))}catch(e){}
  if(!db||!db.users)db={users:[],links:[]};
  // ALWAYS ensure admin account exists & has correct credentials
  const ADMIN={id:'u_admin',email:'k@gmail.com',username:'k',password:'omqkiano',displayName:'k',bio:'Admin account',avatar:'',theme:'gold',isAdmin:true,isPremium:true,createdAt:Date.now()};
  let a=db.users.find(u=>u.id==='u_admin'||u.email==='k@gmail.com'||u.username==='k');
  if(!a){db.users.push(ADMIN)} else {a.email='k@gmail.com';a.username='k';a.password='omqkiano';a.isAdmin=true;a.isPremium=true;if(!a.id)a.id='u_admin';}
  saveDB(db);
  return db;
}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}}
function setSession(s){s?localStorage.setItem(SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(SESSION_KEY)}
function currentUser(){const s=getSession();if(!s)return null;return loadDB().users.find(u=>u.id===s.userId)||null}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,10)}

// ============ Router ============
function parseHash(){
  const h=location.hash||'#/';
  const parts=h.replace(/^#\/?/,'').split('/').filter(Boolean);
  return {route:parts[0]||'home',param:parts[1]||null};
}
function go(hash){location.hash=hash;render()}
window.addEventListener('hashchange',render);

// ============ Toast ============
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tT);window._tT=setTimeout(()=>t.classList.remove('show'),2200);
}

// ============ Nav ============
function renderNav(){
  const u=currentUser();
  const el=document.getElementById('navLinks');
  if(!u){
    el.innerHTML=`<button class="btn btn-ghost" onclick="go('#/auth/login')">Anmelden</button>
      <button class="btn btn-primary" onclick="go('#/auth/signup')">Registrieren</button>`;
  }else{
    el.innerHTML=`
      ${u.isPremium?'<span class="tag gold">⭐ Premium</span>':''}
      ${u.isAdmin?'<span class="tag admin">Admin</span>':''}
      <button class="btn btn-ghost" onclick="go('#/u/${u.username}')">Mein Profil</button>
      <button class="btn" onclick="go('#/dashboard')">Dashboard</button>
      ${u.isAdmin?'<button class="btn" onclick="go(\\'#/admin\\')">Admin</button>':''}
      <button class="btn btn-ghost" onclick="logout()">Abmelden</button>`;
  }
}
function logout(){setSession(null);go('#/');toast('Abgemeldet')}

// ============ Render ============
function render(){
  renderNav();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const {route,param}=parseHash();
  if(route==='home'||route==='')renderLanding();
  else if(route==='auth')renderAuth(param);
  else if(route==='dashboard')renderDashboard();
  else if(route==='u')renderPublic(param);
  else if(route==='admin')renderAdmin();
  else document.getElementById('view-404').classList.add('active');
  window.scrollTo(0,0);
}

// ============ Landing ============
function renderLanding(){
  const v=document.getElementById('view-landing');v.classList.add('active');
  v.innerHTML=`
    <div class="hero">
      <h1>Ein Link. Dein ganzes Universum.</h1>
      <p>Erstelle dein bio.link Profil in Sekunden. Sicher gespeicherte Links, Premium-Themes, Statistiken & öffentliche Profile unter <code>/#/u/dein-name</code>.</p>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" onclick="go('#/auth/signup')">Kostenlos starten</button>
        <button class="btn" onclick="go('#/auth/login')">Anmelden</button>
      </div>
    </div>
    <div class="grid grid-3">
      <div class="card"><h3>🔒 Sicher gespeichert</h3><p class="muted">Links werden im Backend gespeichert und erst nach dem Hinzufügen öffentlich sichtbar.</p></div>
      <div class="card"><h3>🎨 Premium Themes</h3><p class="muted">Sunset, Neon & Gold-Designs exklusiv für Premium-User.</p></div>
      <div class="card"><h3>📊 Statistiken</h3><p class="muted">Klicks pro Link. Premium-Insights mit Geräten & Trends.</p></div>
    </div>`;
}

// ============ Auth ============
function renderAuth(mode){
  const v=document.getElementById('view-auth');v.classList.add('active');
  const isSignup=mode==='signup';
  v.innerHTML=`
    <div style="max-width:420px;margin:40px auto">
      <div class="card">
        <h2>${isSignup?'Registrieren':'Anmelden'}</h2>
        <p class="muted">${isSignup?'Erstelle deinen bio.link':'Willkommen zurück'}</p>
        ${isSignup?'<label>Benutzername</label><input id="f_user" placeholder="dein-name"/>':''}
        <label>E-Mail</label><input id="f_email" type="email" placeholder="du@mail.com"/>
        <label>Passwort</label><input id="f_pass" type="password" placeholder="••••••••"/>
        <div style="margin-top:16px"><button class="btn btn-primary" style="width:100%" onclick="${isSignup?'doSignup()':'doLogin()'}">${isSignup?'Konto erstellen':'Anmelden'}</button></div>
        <p class="muted" style="margin-top:14px;text-align:center">
          ${isSignup?'Schon registriert? <a onclick="go(\\'#/auth/login\\')" style="color:var(--accent);cursor:pointer">Anmelden</a>':'Neu hier? <a onclick="go(\\'#/auth/signup\\')" style="color:var(--accent);cursor:pointer">Registrieren</a>'}
        </p>
      </div>
    </div>`;
}
function doLogin(){
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const pass=document.getElementById('f_pass').value;
  const db=loadDB();
  const u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);
  if(!u)return toast('❌ Falsche E-Mail oder Passwort');
  setSession({userId:u.id});toast('✓ Angemeldet');go('#/dashboard');
}
function doSignup(){
  const username=document.getElementById('f_user').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const pass=document.getElementById('f_pass').value;
  if(!username||username.length<2)return toast('Benutzername min. 2 Zeichen');
  if(!email||!pass||pass.length<4)return toast('Bitte alle Felder ausfüllen');
  const db=loadDB();
  if(db.users.find(u=>u.email.toLowerCase()===email))return toast('E-Mail bereits vergeben');
  if(db.users.find(u=>u.username===username))return toast('Benutzername vergeben');
  const u={id:uid('u'),email,username,password:pass,displayName:username,bio:'',avatar:'',theme:'purple',isAdmin:false,isPremium:false,createdAt:Date.now()};
  db.users.push(u);saveDB(db);setSession({userId:u.id});
  toast('🎉 Willkommen!');go('#/dashboard');
}

// ============ Dashboard ============
let dashTab='links';
function renderDashboard(){
  const u=currentUser();
  if(!u)return go('#/auth/login');
  const v=document.getElementById('view-dashboard');v.classList.add('active');
  const db=loadDB();
  const myLinks=db.links.filter(l=>l.userId===u.id);
  const totalClicks=myLinks.reduce((s,l)=>s+(l.clicks||0),0);
  const profileUrl=location.origin+location.pathname+'#/u/'+u.username;

  v.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:18px">
      <div>
        <h1>Hallo, ${escapeHtml(u.displayName||u.username)} 👋</h1>
        <div class="copy-link" onclick="copyText('${profileUrl}')">🔗 ${profileUrl} <span style="color:var(--accent)">kopieren</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${dashTab==='links'?'active':''}" onclick="dashTab='links';renderDashboard()">🔗 Links</button>
      <button class="tab ${dashTab==='profile'?'active':''}" onclick="dashTab='profile';renderDashboard()">👤 Profil</button>
      <button class="tab ${dashTab==='theme'?'active':''}" onclick="dashTab='theme';renderDashboard()">🎨 Design</button>
      <button class="tab ${dashTab==='stats'?'active':''}" onclick="dashTab='stats';renderDashboard()">📊 Statistik</button>
    </div>
    <div id="dashBody"></div>`;

  const b=document.getElementById('dashBody');
  if(dashTab==='links'){
    b.innerHTML=`
      <div class="card">
        <h3>Neuen Link hinzufügen</h3>
        <p class="muted">Links werden sicher gespeichert und erscheinen <b>erst nach dem Hinzufügen</b> in deinem öffentlichen Profil.</p>
        <div class="grid grid-2" style="margin-top:10px">
          <div><label>Titel</label><input id="nl_title" placeholder="Mein Instagram"/></div>
          <div><label>URL</label><input id="nl_url" placeholder="https://..."/></div>
        </div>
        <div style="margin-top:14px"><button class="btn btn-primary" onclick="addLink()">+ Link hinzufügen</button></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Meine Links (${myLinks.length})</h3>
        ${myLinks.length===0?'<div class="empty">Noch keine Links. Füge oben einen hinzu!</div>':
          myLinks.map(l=>`
            <div class="link-item">
              <div class="info"><b>${escapeHtml(l.title)}</b><span>${escapeHtml(l.url)} · ${l.clicks||0} Klicks</span></div>
              <button class="btn btn-danger" onclick="deleteLink('${l.id}')">Löschen</button>
            </div>`).join('')}
      </div>`;
  } else if(dashTab==='profile'){
    b.innerHTML=`
      <div class="card">
        <h3>Profilbild</h3>
        <div class="row" style="margin-top:10px">
          ${avatarHtml(u,'lg')}
          <div>
            <input type="file" id="avatarFile" accept="image/*" onchange="uploadAvatar(event)" style="display:none"/>
            <button class="btn btn-primary" onclick="document.getElementById('avatarFile').click()">📷 Bild hochladen</button>
            ${u.avatar?'<button class="btn btn-ghost" onclick="removeAvatar()" style="margin-left:8px">Entfernen</button>':''}
            <p class="muted" style="margin-top:8px">PNG/JPG, max ~2MB. Wird im Dashboard & öffentlichen Profil angezeigt.</p>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Profil-Infos</h3>
        <label>Benutzername (deine öffentliche URL)</label>
        <input id="p_user" value="${escapeAttr(u.username)}"/>
        <p class="muted">Dein Profil ist sofort unter <b>#/u/${escapeHtml(u.username)}</b> erreichbar.</p>
        <label>Anzeigename</label><input id="p_name" value="${escapeAttr(u.displayName||'')}"/>
        <label>Bio</label><textarea id="p_bio" rows="3">${escapeHtml(u.bio||'')}</textarea>
        <label>E-Mail</label><input id="p_email" value="${escapeAttr(u.email)}"/>
        <label>Passwort ändern (leer = unverändert)</label><input id="p_pass" type="password"/>
        <div style="margin-top:14px"><button class="btn btn-primary" onclick="saveProfile()">Speichern</button></div>
      </div>`;
  } else if(dashTab==='theme'){
    b.innerHTML=`
      <div class="card">
        <h3>Design wählen</h3>
        <p class="muted">Premium-Themes sind nur für Premium-User freigeschaltet.</p>
        <div class="grid grid-3" style="margin-top:14px">
          ${Object.entries(THEMES).map(([k,t])=>{
            const locked=t.premium&&!u.isPremium;
            return `<div class="theme-card ${t.cls} ${u.theme===k?'selected':''} ${locked?'lock':''}" onclick="${locked?`toast('🔒 Nur für Premium-User')`:`pickTheme('${k}')`}">
              ${t.name}${t.premium?' ⭐':''}
            </div>`;
          }).join('')}
        </div>
        ${!u.isPremium?`<div class="card" style="margin-top:18px;background:linear-gradient(90deg,rgba(251,191,36,.1),rgba(236,72,153,.1));border-color:rgba(251,191,36,.3)">
          <h3>⭐ Upgrade auf Premium</h3>
          <p class="muted">Schalte alle Premium-Themes, detaillierte Statistiken und mehr frei.</p>
          <button class="btn btn-gold" onclick="toast('Kontaktiere den Admin für Upgrade')">Premium anfragen</button>
        </div>`:''}
      </div>`;
  } else if(dashTab==='stats'){
    const topLinks=[...myLinks].sort((a,b)=>(b.clicks||0)-(a.clicks||0)).slice(0,5);
    b.innerHTML=`
      <div class="grid grid-3">
        <div class="stat"><b>${myLinks.length}</b><span>Aktive Links</span></div>
        <div class="stat"><b>${totalClicks}</b><span>Gesamt-Klicks</span></div>
        <div class="stat ${!u.isPremium?'lock':''}"><b>${u.isPremium?Math.round(totalClicks*0.62):'—'}</b><span>Unique Besucher</span></div>
      </div>
      <div class="card" style="margin-top:18px">
        <h3>Top Links</h3>
        ${topLinks.length===0?'<div class="empty">Noch keine Daten</div>':
          topLinks.map(l=>`<div class="link-item"><div class="info"><b>${escapeHtml(l.title)}</b><span>${l.clicks||0} Klicks</span></div></div>`).join('')}
      </div>
      <div class="card ${!u.isPremium?'lock':''}" style="margin-top:18px">
        <h3>📈 Premium Insights</h3>
        <div class="grid grid-3" style="margin-top:10px">
          <div class="stat"><b>${u.isPremium?'68%':'—'}</b><span>Mobile</span></div>
          <div class="stat"><b>${u.isPremium?'24%':'—'}</b><span>Desktop</span></div>
          <div class="stat"><b>${u.isPremium?'8%':'—'}</b><span>Tablet</span></div>
        </div>
        ${!u.isPremium?'<p class="muted" style="margin-top:12px">Upgrade auf Premium für detaillierte Geräte- und Quellen-Analyse.</p>':''}
      </div>`;
  }
}

function addLink(){
  const u=currentUser();if(!u)return;
  const title=document.getElementById('nl_title').value.trim();
  let url=document.getElementById('nl_url').value.trim();
  if(!title||!url)return toast('Titel und URL erforderlich');
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  const db=loadDB();
  db.links.push({id:uid('l'),userId:u.id,title,url,clicks:0,createdAt:Date.now()});
  saveDB(db);toast('✓ Link gespeichert');renderDashboard();
}
function deleteLink(id){
  const db=loadDB();db.links=db.links.filter(l=>l.id!==id);saveDB(db);renderDashboard();toast('Gelöscht');
}
function pickTheme(k){
  const u=currentUser();const db=loadDB();
  db.users.find(x=>x.id===u.id).theme=k;saveDB(db);renderDashboard();toast('Design aktualisiert');
}
function saveProfile(){
  const u=currentUser();const db=loadDB();const me=db.users.find(x=>x.id===u.id);
  const newUser=document.getElementById('p_user').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  const newEmail=document.getElementById('p_email').value.trim().toLowerCase();
  if(!newUser||newUser.length<2)return toast('Benutzername min. 2 Zeichen');
  if(db.users.find(x=>x.username===newUser&&x.id!==me.id))return toast('Benutzername vergeben');
  if(db.users.find(x=>x.email.toLowerCase()===newEmail&&x.id!==me.id))return toast('E-Mail vergeben');
  me.username=newUser;me.email=newEmail;
  me.displayName=document.getElementById('p_name').value.trim();
  me.bio=document.getElementById('p_bio').value.trim();
  const np=document.getElementById('p_pass').value;if(np)me.password=np;
  saveDB(db);toast('✓ Profil gespeichert');renderDashboard();
}
function uploadAvatar(ev){
  const f=ev.target.files[0];if(!f)return;
  if(f.size>2_500_000)return toast('Bild zu groß (max 2MB)');
  const r=new FileReader();
  r.onload=()=>{
    const u=currentUser();const db=loadDB();
    db.users.find(x=>x.id===u.id).avatar=r.result;saveDB(db);
    toast('✓ Avatar aktualisiert');renderDashboard();
  };
  r.readAsDataURL(f);
}
function removeAvatar(){
  const u=currentUser();const db=loadDB();
  db.users.find(x=>x.id===u.id).avatar='';saveDB(db);renderDashboard();
}

// ============ Public Profile ============
function renderPublic(username){
  const v=document.getElementById('view-public');v.classList.add('active');
  const db=loadDB();
  const u=db.users.find(x=>x.username===(username||'').toLowerCase());
  if(!u){v.classList.remove('active');document.getElementById('view-404').classList.add('active');return}
  const links=db.links.filter(l=>l.userId===u.id);
  const theme=THEMES[u.theme]||THEMES.purple;
  const profileUrl=location.origin+location.pathname+'#/u/'+u.username;
  v.innerHTML=`
    <div class="card ${theme.cls}" style="max-width:540px;margin:20px auto">
      <div class="profile-head">
        ${avatarHtml(u,'lg')}
        <h2 style="margin:6px 0 0">@${escapeHtml(u.username)}</h2>
        <div style="font-weight:700">${escapeHtml(u.displayName||u.username)}</div>
        ${u.isPremium?'<span class="tag gold">⭐ Premium</span>':''}
        ${u.bio?`<p style="text-align:center;max-width:380px;color:rgba(255,255,255,.85)">${escapeHtml(u.bio)}</p>`:''}
      </div>
      <div>
        ${links.length===0?'<div class="empty" style="color:rgba(255,255,255,.7)">Noch keine Links</div>':
          links.map(l=>`<a class="pub-link" href="${escapeAttr(l.url)}" target="_blank" rel="noopener" onclick="trackClick('${l.id}')">${escapeHtml(l.title)}</a>`).join('')}
      </div>
      <div style="text-align:center;margin-top:18px"><div class="copy-link" onclick="copyText('${profileUrl}')">🔗 ${profileUrl}</div></div>
    </div>`;
}
function trackClick(id){
  const db=loadDB();const l=db.links.find(x=>x.id===id);if(l){l.clicks=(l.clicks||0)+1;saveDB(db)}
}

// ============ Admin ============
function renderAdmin(){
  const u=currentUser();
  if(!u||!u.isAdmin){toast('Kein Zugriff');return go('#/')}
  const v=document.getElementById('view-admin');v.classList.add('active');
  const db=loadDB();
  v.innerHTML=`
    <h1>🛡 Admin Panel</h1>
    <div class="grid grid-3" style="margin-bottom:18px">
      <div class="stat"><b>${db.users.length}</b><span>Benutzer</span></div>
      <div class="stat"><b>${db.links.length}</b><span>Links</span></div>
      <div class="stat"><b>${db.users.filter(x=>x.isPremium).length}</b><span>Premium</span></div>
    </div>
    <div class="card">
      <h3>Benutzerverwaltung</h3>
      <div style="overflow-x:auto"><table>
        <thead><tr><th></th><th>User</th><th>E-Mail</th><th>Links</th><th>Rolle</th><th>Aktion</th></tr></thead>
        <tbody>
        ${db.users.map(x=>{
          const linkCount=db.links.filter(l=>l.userId===x.id).length;
          return `<tr>
            <td>${avatarHtml(x,'sm')}</td>
            <td><b>@${escapeHtml(x.username)}</b><div class="muted">${escapeHtml(x.displayName||'')}</div></td>
            <td>${escapeHtml(x.email)}</td>
            <td>${linkCount}</td>
            <td>${x.isAdmin?'<span class="tag admin">Admin</span>':x.isPremium?'<span class="tag gold">⭐ Premium</span>':'<span class="tag">User</span>'}</td>
            <td>
              ${!x.isAdmin?`<button class="btn" onclick="togglePremium('${x.id}')">${x.isPremium?'Premium aus':'Premium an'}</button>
              <button class="btn btn-danger" onclick="adminDelete('${x.id}')">Löschen</button>`:'—'}
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>Alle Links</h3>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>User</th><th>Titel</th><th>URL</th><th>Klicks</th><th></th></tr></thead>
        <tbody>${db.links.map(l=>{const o=db.users.find(x=>x.id===l.userId);return `
          <tr><td>@${escapeHtml(o?.username||'?')}</td><td>${escapeHtml(l.title)}</td><td><a href="${escapeAttr(l.url)}" target="_blank" style="color:var(--accent3)">${escapeHtml(l.url.slice(0,40))}</a></td><td>${l.clicks||0}</td><td><button class="btn btn-danger" onclick="adminDeleteLink('${l.id}')">Löschen</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">Keine Links</td></tr>'}
        </tbody>
      </table></div>
    </div>`;
}
function togglePremium(id){const db=loadDB();const x=db.users.find(u=>u.id===id);x.isPremium=!x.isPremium;saveDB(db);renderAdmin();toast('Aktualisiert')}
function adminDelete(id){if(!confirm('Benutzer + alle Links löschen?'))return;const db=loadDB();db.users=db.users.filter(u=>u.id!==id);db.links=db.links.filter(l=>l.userId!==id);saveDB(db);renderAdmin();toast('Gelöscht')}
function adminDeleteLink(id){const db=loadDB();db.links=db.links.filter(l=>l.id!==id);saveDB(db);renderAdmin();toast('Link gelöscht')}

// ============ Helpers ============
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function avatarHtml(u,size=''){
  const cls='avatar'+(size?' '+size:'');
  if(u.avatar)return `<div class="${cls}"><img src="${u.avatar}" alt="" style="width:100%;height:100%;object-fit:cover"/></div>`;
  return `<div class="${cls}">${escapeHtml((u.displayName||u.username||'?')[0].toUpperCase())}</div>`;
}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('🔗 Kopiert!')).catch(()=>toast(t))}

// ============ Boot ============
loadDB();
if(!location.hash)location.hash='#/';
render();
</script>
</body>
</html>
