<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .sidebar-active { background-color: #6b21a8; color: white; }
    .accent { color: var(--accent-color, #c026d3); }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleTheme()" class="text-2xl" id="themeBtn">🌙</button>
        <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navLoginBtn">Anmelden</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 md:p-10 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD + PUBLIC PROFILE (wie zuvor) -->
  <!-- ... (der Rest bleibt gleich wie in der letzten Version) ... -->

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('kiobioUsers')) || {};
    let nextUID = parseInt(localStorage.getItem('nextUID')) || 1;
    let tempRegisterData = {}; // Für den Registrierungs-Flow

    const VERIFICATION_CODE = "666";

    // ==================== MODALS ====================
    function showModal(title, contentHTML) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').innerHTML = contentHTML;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    // ==================== REGISTRIERUNG ====================
    function showRegisterModal() {
      showModal("Registrieren", `
        <input id="regEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regUsername" type="text" placeholder="Benutzername" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="regPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="sendVerificationCode()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl font-semibold">Weiter →</button>
        <p onclick="showLoginModal()" class="text-center text-purple-400 hover:underline cursor-pointer mt-4">Bereits registriert? Anmelden</p>
      `);
    }

    function sendVerificationCode() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !username || !password) {
        alert("Bitte alle Felder ausfüllen!");
        return;
      }
      if (Object.values(users).some(u => u.username === username || u.email === email)) {
        alert("E-Mail oder Benutzername ist bereits vergeben!");
        return;
      }

      tempRegisterData = { email, username, password };

      showModal("Verifizierung", `
        <p class="text-center text-zinc-300">Wir haben einen Code an <strong>${email}</strong> gesendet.</p>
        <p class="text-center text-sm text-zinc-400 mt-2">Demo-Code: <strong>666</strong></p>
        <input id="verifyCode" type="text" placeholder="Code eingeben" maxlength="3" class="w-full bg-zinc-800 p-4 rounded-2xl text-center text-2xl tracking-widest">
        <button onclick="verifyCode()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl font-semibold mt-4">Code bestätigen</button>
      `);
    }

    function verifyCode() {
      const inputCode = document.getElementById('verifyCode').value.trim();
      if (inputCode === VERIFICATION_CODE) {
        saveUser(tempRegisterData.email, tempRegisterData.username, tempRegisterData.password);
        alert("✅ Registrierung erfolgreich!");
        closeModal();
        loginAfterRegister(tempRegisterData.email);
      } else {
        alert("❌ Falscher Code!");
      }
    }

    function saveUser(email, username, password) {
      users[email] = {
        email,
        username,
        displayName: username,
        password,
        uid: nextUID++,
        views: 0,
        bio: "",
        accentColor: "#c026d3",
        profilePic: "https://i.pravatar.cc/128?u=" + Date.now(),
        banner: "https://picsum.photos/id/1015/1200/400",
        bannerType: "image",
        links: [],
        badges: ["🔥 Founder", "🌟 Beta Tester"],
        music: "https://files.catbox.moe/0v4u8k.mp3",
        template: "purple-neon"
      };
      localStorage.setItem('kiobioUsers', JSON.stringify(users));
      localStorage.setItem('nextUID', nextUID);
    }

    // ==================== LOGIN ====================
    function showLoginModal() {
      showModal("Anmelden", `
        <input id="loginEmail" type="email" placeholder="E-Mail" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="loginPassword" type="password" placeholder="Passwort" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="loginUser()" class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-2xl font-semibold">Anmelden</button>
        <p onclick="showRegisterModal()" class="text-center text-purple-400 hover:underline cursor-pointer mt-4">Noch kein Account? Registrieren</p>
      `);
    }

    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      const user = users[email];
      if (user && user.password === password) {
        currentUser = user;
        closeModal();
        showDashboard();
      } else {
        alert("❌ Falsche E-Mail oder Passwort!");
      }
    }

    function loginAfterRegister(email) {
      currentUser = users[email];
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navLoginBtn').textContent = "Abmelden";
      document.getElementById('navLoginBtn').onclick = logout;

      document.getElementById('dashNameTop').textContent = currentUser.displayName || currentUser.username;
      document.getElementById('dashUsername').textContent = currentUser.username;
      document.getElementById('profilePicBig').src = currentUser.profilePic;
      switchTab(0);
    }

    function logout() {
      currentUser = null;
      location.reload();
    }

    // ==================== Restliche Funktionen (switchTab, Public Profile, etc.) ====================
    // ... (füge hier den Code aus der vorherigen Version ein – Statistiken, Templates, Public Profile, etc.)

    window.onload = () => {
      handleRoute();
    };
  </script>
</body>
</html>
