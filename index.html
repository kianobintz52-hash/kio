<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiobio.lol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: white; overflow-x: hidden; }
    video#bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.85; }
    .glow-purple { text-shadow: 0 0 40px #c026d3, 0 0 80px #7e22ce; }
    .sidebar-active { background-color: #6b21a8; color: white; }
  </style>
</head>
<body class="dark">
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/41vjqo.mp4" type="video/mp4">
  </video>

  <!-- NAV -->
  <nav class="fixed top-0 w-full z-50 bg-[#0f0a23]/95 backdrop-blur-md border-b border-purple-500/30">
    <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🔫</span>
        <span class="text-3xl font-bold tracking-tighter">kiobio.lol</span>
      </div>
      <button onclick="showLoginModal()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold" id="navBtn">Anmelden</button>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="min-h-screen flex items-center justify-center text-center pt-20 px-4">
    <div class="max-w-4xl z-10">
      <h1 class="text-5xl md:text-7xl font-bold glow-purple mb-8">Alles, was du willst,<br>genau hier.</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="showRegisterModal()" class="bg-purple-600 hover:bg-purple-700 px-12 py-6 rounded-3xl text-2xl font-semibold">Kostenlos registrieren</button>
        <button onclick="showLoginModal()" class="border-2 border-purple-500 hover:bg-purple-500/10 px-12 py-6 rounded-3xl text-2xl font-semibold">Anmelden</button>
      </div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="mainModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 p-8 rounded-3xl w-full max-w-md border border-purple-500/30">
      <h2 id="modalTitle" class="text-3xl font-bold text-center mb-8"></h2>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen bg-zinc-950">
    <div class="flex flex-col md:flex-row h-screen pt-16">
      <div class="w-full md:w-72 bg-[#0f0a23] border-b md:border-r border-purple-500/20 p-6">
        <div class="flex items-center gap-3 mb-10">
          <span class="text-3xl">🔫</span>
          <span class="text-2xl font-bold">kiobio.lol</span>
        </div>
        <div class="space-y-1">
          <a href="#" onclick="switchTab(1)" class="sidebar-active flex items-center gap-3 px-4 py-3 rounded-2xl">✏️ Profil bearbeiten</a>
          <a href="#" onclick="showMyPublicProfile()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/10">👀 Mein Profil</a>
        </div>
      </div>

      <div class="flex-1 p-8 overflow-y-auto">
        <div id="mainContent">
          <div id="tab1">
            <h2 class="text-3xl font-bold mb-8">Profil bearbeiten</h2>
            <div class="max-w-2xl space-y-8">
              <div>
                <label class="block text-sm mb-2">Anzeigename</label>
                <input id="editName" class="w-full bg-zinc-800 p-4 rounded-2xl">
              </div>
              <div>
                <label class="block text-sm mb-2">Bio</label>
                <textarea id="editBio" rows="4" class="w-full bg-zinc-800 p-4 rounded-2xl"></textarea>
              </div>
              <div>
                <label class="block text-sm mb-2">Profilbild</label>
                <input type="file" id="picUpload" accept="image/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadProfilePic(event)">
              </div>
              <div>
                <label class="block text-sm mb-2">Banner (Bild/Video)</label>
                <input type="file" id="bannerUpload" accept="image/*,video/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadBanner(event)">
              </div>
              <div>
                <label class="block text-sm mb-2">Musik (MP3)</label>
                <input type="file" id="musicUpload" accept="audio/*" class="w-full bg-zinc-800 p-4 rounded-2xl" onchange="uploadMusic(event)">
              </div>
              <button onclick="saveProfileChanges()" class="w-full bg-purple-600 hover:bg-purple-700 py-5 rounded-3xl font-semibold">Speichern</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PUBLIC PROFILE -->
  <div id="publicProfilePage" class="hidden min-h-screen bg-zinc-950 py-10">
    <div class="max-w-4xl mx-auto bg-zinc-900 rounded-3xl overflow-hidden">
      <div class="relative h-64" id="publicBannerContainer"></div>
      <div class="flex justify-center -mt-20 relative z-10">
        <img id="publicProfilePic" class="w-44 h-44 rounded-3xl object-cover border-4 border-zinc-900">
      </div>
      <div class="text-center px-8 pt-6 pb-12">
        <h1 id="publicName" class="text-5xl font-bold"></h1>
        <p id="publicUsername" class="text-purple-400 text-2xl"></p>
        <p id="publicBio" class="mt-8 text-zinc-300"></p>
        <audio id="publicMusic" controls class="mt-12 w-full max-w-md mx-auto"></audio>
      </div>
    </div>
  </div>

  <script>
    // ==================== DEINE FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyD6NPF9FIJsDipQg3dvxSohtAJCGVF4NUc",
      authDomain: "kiobiool.firebaseapp.com",
      databaseURL: "https://kiobiool-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kiobiool",
      storageBucket: "kiobiool.firebasestorage.app",
      messagingSenderId: "1003434485509",
      appId: "1:1003434485509:web:872f257b0758051c80b96c",
      measurementId: "G-DRW31WCCN5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    let currentUser = null;

    function showLoginModal() {
      document.getElementById('modalTitle').textContent = "Anmelden";
      document.getElementById('modalContent').innerHTML = `
        <input id="loginEmail" type="email" value="u3271805041@gmail.com" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <input id="loginPassword" type="password" value="666666" class="w-full bg-zinc-800 p-4 rounded-2xl">
        <button onclick="doLogin()" class="w-full bg-purple-600 py-4 rounded-2xl font-semibold mt-4">Anmelden</button>
      `;
      document.getElementById('mainModal').classList.remove('hidden');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        closeModal();
        showDashboard();
      } catch (e) {
        alert("Login fehlgeschlagen: " + e.message);
      }
    }

    function closeModal() {
      document.getElementById('mainModal').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navBtn').textContent = "Abmelden";
      document.getElementById('navBtn').onclick = () => auth.signOut();
    }

    function showMyPublicProfile() {
      if (currentUser) window.location.href = `/@k`;
    }

    function showPublicProfileFor(userData) {
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('publicProfilePage').classList.remove('hidden');

      document.getElementById('publicName').textContent = userData.displayName || userData.username;
      document.getElementById('publicUsername').textContent = '@' + userData.username;
      document.getElementById('publicBio').textContent = userData.bio || "Keine Bio...";
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          showDashboard();
        }
      });
    };
  </script>
</body>
</html>
