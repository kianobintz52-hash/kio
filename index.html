<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>haunt.gg Clone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="text-neutral-900 antialiased selection:bg-pink-100 bg-white">

    <!-- ================= 1. DIE STARTSEITE ================= -->
    <div id="home-view" class="block">
        <header class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
            <div class="flex items-center gap-2 font-extrabold text-2xl tracking-tight">
                <span class="text-pink-300 text-3xl">🦇</span>
                <span>haunt<span class="text-neutral-400">.gg</span></span>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-6 pt-24 pb-12 text-center flex flex-col items-center justify-center min-h-[70vh]">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-neutral-50 text-xs font-medium text-neutral-500 border border-neutral-100 mb-8">
                <span class="text-pink-400">🛒 Market</span>
                <span class="text-neutral-300">|</span>
                <span>Rare 1-char names & badges</span>
            </div>

            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-black max-w-2xl leading-[1.1] mb-6">
                Make the internet <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-200 to-purple-200 filter saturate-150">remember</span> you.
            </h1>

            <p class="text-neutral-400 text-base md:text-lg max-w-xl mb-12">
                One link for everything you do. Claim your name in seconds.
            </p>

            <div class="w-full max-w-md flex flex-col sm:flex-row items-center gap-3 bg-neutral-50 p-2 rounded-2xl border border-neutral-100 shadow-sm">
                <div class="flex items-center w-full px-3 py-2">
                    <span class="text-pink-400 font-medium text-base">haunt.gg/</span>
                    <input id="username-input" type="text" placeholder="yourname" class="bg-transparent border-none outline-none w-full ml-1 text-base text-neutral-800 placeholder-neutral-300 font-medium">
                </div>
                <button onclick="checkAndClaimName()" class="w-full sm:w-auto bg-neutral-950 text-white text-sm font-semibold px-6 py-3 rounded-xl hover:bg-neutral-800 transition-colors">
                    Claim →
                </button>
            </div>
            <p id="status-message" class="mt-4 text-sm font-medium"></p>
        </main>
    </div>

    <!-- ================= 2. DER EDITOR / DASHBOARD ================= -->
    <div id="editor-view" class="hidden min-h-screen bg-neutral-50 flex flex-col items-center pt-12 px-4">
        <div class="w-full max-w-md bg-white border border-neutral-200 rounded-3xl p-6 shadow-sm">
            <h2 class="text-2xl font-bold mb-1">Profil bearbeiten</h2>
            <p class="text-sm text-neutral-400 mb-6">Gestalte deine persönliche Seite für <span id="editor-current-user" class="text-pink-500 font-semibold"></span></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-neutral-400 mb-1">Anzeigename</label>
                    <input id="edit-display-name" type="text" placeholder="z.B. Max Mustermann" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl p-3 outline-none focus:border-neutral-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-neutral-400 mb-1">Bio / Beschreibung</label>
                    <textarea id="edit-bio" placeholder="Erzähle etwas über dich..." class="w-full bg-neutral-50 border border-neutral-200 rounded-xl p-3 outline-none focus:border-neutral-400 text-sm h-24 resize-none"></textarea>
                </div>
                
                <hr class="border-neutral-100 my-4">
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-neutral-400 mb-2">Deine Links</label>
                    <div id="editor-links-container" class="space-y-2 mb-3">
                        <!-- Hier erscheinen dynamisch die Link-Inputs -->
                    </div>
                    <button onclick="addLinkInputRow()" class="w-full border border-dashed border-neutral-300 text-neutral-500 text-xs py-2 rounded-xl hover:bg-neutral-50 transition-colors font-medium">
                        + Link hinzufügen
                    </button>
                </div>

                <button onclick="saveProfileData()" class="w-full bg-pink-500 text-white font-semibold py-3 rounded-xl hover:bg-pink-600 transition-colors text-sm shadow-sm mt-6">
                    Profil speichern & veröffentlichen
                </button>
                <p id="editor-status" class="text-center text-xs font-medium mt-2"></p>
            </div>
        </div>
    </div>

    <!-- ================= 3. DIE ÖFFENTLICHE PROFILSEITE ================= -->
    <div id="profile-view" class="hidden min-h-screen bg-neutral-950 text-white flex flex-col items-center pt-24 px-4">
        <div class="w-24 h-24 bg-gradient-to-tr from-pink-300 to-purple-400 rounded-full mb-6 shadow-lg shadow-pink-500/10"></div>
        <h1 id="profile-name" class="text-3xl font-extrabold tracking-tight mb-1">Lädt...</h1>
        <p id="profile-username" class="text-pink-400 font-medium mb-4">@username</p>
        <p id="profile-bio" class="text-neutral-400 max-w-sm text-center mb-8"></p>
        
        <div id="profile-links" class="w-full max-w-md flex flex-col gap-4"></div>
        
        <a href="index.html" class="mt-12 text-xs text-neutral-600 hover:text-neutral-400 transition-colors">Erstelle dein eigenes Profil bei haunt.gg Clone</a>
    </div>

    <!-- ================= LOGIK & DATENBANK-STEUERUNG ================= -->
    <script>
        // ⚠️ HIER DEINE DATEN EINTRAGEN:
        const SUPABASE_URL = "https://sllwrzqmbftfbezrfjpj.supabase.co";
        const SUPABASE_ANON_KEY = "HIER_DEINEN_LANGEN_ANON_KEY_EINSETZEN";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user');
        let activeEditingUsername = ""; 

        // Routing beim Laden der Seite
        if (userParam) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
            loadUserProfile(userParam);
        }

        // FUNKTION: Namen prüfen oder direkt in den Editor schicken
        async function checkAndClaimName() {
            const input = document.getElementById('username-input').value.trim().toLowerCase();
            const statusEl = document.getElementById('status-message');

            if (!input || input.length < 2) {
                statusEl.textContent = "⚠️ Der Name muss mindestens 2 Zeichen lang sein.";
                statusEl.className = "mt-4 text-sm font-medium text-amber-500";
                return;
            }

            statusEl.textContent = "Prüfe Verfügbarkeit...";
            statusEl.className = "mt-4 text-sm font-medium text-neutral-400";

            const { data, error } = await supabase
                .from('profiles')
                .select('username')
                .eq('username', input)
                .maybeSingle();

            if (data) {
                statusEl.textContent = `❌ "${input}" ist besetzt. Wenn es deins ist, kannst du es gleich im Editor überschreiben.`;
                statusEl.className = "mt-4 text-sm font-medium text-red-500";
            }
            
            // Name ist frei (oder wir überschreiben ihn testweise einfach): Öffne Editor
            activeEditingUsername = input;
            setTimeout(() => {
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('editor-view').classList.remove('hidden');
                document.getElementById('editor-current-user').textContent = `haunt.gg/${input}`;
                addLinkInputRow(); // Ersten leeren Link-Slot anzeigen
            }, 1000);
        }

        // FUNKTIONEN FÜR DEN EDITOR
        function addLinkInputRow(title = "", url = "") {
            const container = document.getElementById('editor-links-container');
            const row = document.createElement('div');
            row.className = "flex gap-2 link-input-row bg-neutral-100 p-2 rounded-xl";
            row.innerHTML = `
                <input type="text" placeholder="Titel (z.B. Instagram)" value="${title}" class="link-title w-1/3 bg-white p-2 rounded-lg text-xs outline-none border border-neutral-200">
                <input type="text" placeholder="URL (https://...)" value="${url}" class="link-url w-2/3 bg-white p-2 rounded-lg text-xs outline-none border border-neutral-200">
                <button onclick="this.parentElement.remove()" class="text-neutral-400 hover:text-red-500 px-1">✕</button>
            `;
            container.appendChild(row);
        }

        async function saveProfileData() {
            const statusEl = document.getElementById('editor-status');
            const displayName = document.getElementById('edit-display-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            
            statusEl.textContent = "Speichere Profil...";
            statusEl.className = "text-center text-xs font-medium mt-2 text-neutral-500";

            // Alle Links aus den Input-Feldern auslesen und als Array sammeln
            const linkRows = document.querySelectorAll('.link-input-row');
            const linksArray = [];
            linkRows.forEach(row => {
                const title = row.querySelector('.link-title').value.trim();
                const url = row.querySelector('.link-url').value.trim();
                if (title && url) {
                    linksArray.push({ title, url });
                }
            });

            // In Supabase speichern (mittels upsert: updated falls vorhanden, sonst neu einfügen)
            const { error } = await supabase
                .from('profiles')
                .upsert({
                    username: activeEditingUsername,
                    display_name: displayName || activeEditingUsername,
                    bio: bio,
                    links: linksArray
                }, { onConflict: 'username' });

            if (error) {
                statusEl.textContent = "Fehler beim Speichern: " + error.message;
                statusEl.className = "text-center text-xs font-medium mt-2 text-red-500";
            } else {
                statusEl.textContent = "🎉 Erfolgreich gespeichert! Leite weiter...";
                statusEl.className = "text-center text-xs font-medium mt-2 text-green-500";
                
                setTimeout(() => {
                    window.location.search = `?user=${activeEditingUsername}`;
                }, 1500);
            }
        }

        // FUNKTION: Profildaten öffentlich anzeigen
        async function loadUserProfile(username) {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('username', username.toLowerCase())
                .maybeSingle();

            if (!data) {
                document.getElementById('profile-name').textContent = "404";
                document.getElementById('profile-username').textContent = `@${username}`;
                document.getElementById('profile-bio').textContent = "Dieses Profil existiert noch nicht.";
                return;
            }

            document.title = `${data.display_name} (@${data.username})`;
            document.getElementById('profile-name').textContent = data.display_name;
            document.getElementById('profile-username').textContent = `@${data.username}`;
            document.getElementById('profile-bio').textContent = data.bio || "Keine Beschreibung hinterlegt.";

            const linksContainer = document.getElementById('profile-links');
            linksContainer.innerHTML = ''; 

            if (data.links && Array.isArray(data.links)) {
                data.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url.startsWith('http') ? link.url : `https://${link.url}`;
                    a.target = "_blank";
                    a.className = "w-full bg-neutral-900 border border-neutral-800 p-4 rounded-2xl text-center font-medium hover:bg-neutral-850 hover:scale-[1.01] transition-all block text-neutral-200 shadow-sm";
                    a.textContent = link.title;
                    linksContainer.appendChild(a);
                });
            }
        }
    </script>
</body>
</html>
